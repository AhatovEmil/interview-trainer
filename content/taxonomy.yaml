# Таксономия: профессии, специализации, разделы и темы.
#
# Это данные, а не код. Источник истины для БД: сид приводит базу в соответствие
# с этим файлом (python -m app.seed.taxonomy).
#
# weights — вес раздела для каждого грейда, 0.0–1.0. Смысл: насколько тема важна
# на собеседовании именно этого уровня. По весам считается общий грейд по
# специализации (взвешенное среднее по темам) и приоритет тем в плане подготовки.

