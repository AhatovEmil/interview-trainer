  - slug: java_primitives_vs_objects
    specializations: [backend_java]
    topic: language
    subtopic: immutability
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Чем примитивный тип отличается от ссылочного и что такое автоупаковка?"
    answer_short: >-
      Примитив хранит само значение и не может быть null. Ссылочный тип хранит
      ссылку на объект в куче. Автоупаковка — автоматическое превращение int в
      Integer и обратно; именно на ней возникают неожиданный null и медленный код.
    answer_detailed: |
      ```java
      int a = 5;              // значение
      Integer b = 5;          // объект, автоупаковка
      Integer c = null;
      int d = c;              // NullPointerException при распаковке
      ```

      Восемь примитивов — `byte`, `short`, `int`, `long`, `float`, `double`,
      `char`, `boolean` — у каждого есть класс-обёртка. Обёртки нужны там, где
      требуется объект: в коллекциях, дженериках, при возможном отсутствии
      значения.

      Две ловушки, которые спрашивают почти всегда:

      - распаковка null даёт NPE, причём в строке, где `null` не написан;
      - сравнение обёрток через `==` сравнивает ссылки. Для значений от −128 до
        127 работает кеш, и `==` неожиданно возвращает true; за пределами
        диапазона — false. Обёртки сравнивают через `equals`.

      Отсюда правило: примитив там, где значение обязательно есть; обёртка —
      когда «значения может не быть» и это осмысленно.
    common_mistakes:
      - Сравнивать Integer через == и полагаться на кеш малых значений.
      - Хранить в поле Integer там, где значение всегда есть.
      - Не учитывать, что распаковка null даёт NPE.
    follow_ups:
      - Почему Integer со значением 127 сравнивается через == как равный, а 128 — нет?
      - Когда обёртка предпочтительнее примитива?

  - slug: java_string_equals_vs_double_equals
    specializations: [backend_java]
    topic: language
    subtopic: equals_hashcode
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: single_choice
    title: "Как правильно сравнить две строки в Java?"
    options:
      - code: a
        text: "Через ==, это самый быстрый способ"
      - code: b
        text: "Через equals: == сравнивает ссылки, а не содержимое"
        is_correct: true
      - code: c
        text: "Через compareTo, equals для строк не определён"
      - code: d
        text: "Через оператор ===, как в других языках"
    answer_short: >-
      Через `equals`. `==` сравнивает ссылки: для литералов из пула он случайно
      сработает, а для строки, собранной во время выполнения, вернёт false при
      одинаковом содержимом.
    answer_detailed: |
      ```java
      String a = "hello";
      String b = "hello";
      a == b;                       // true — обе ссылки из пула литералов

      String c = new String("hello");
      a == c;                       // false — другой объект
      a.equals(c);                  // true — содержимое совпадает
      ```

      Именно поэтому ошибку почти невозможно поймать на тестах с литералами:
      она проявляется на строках, пришедших из запроса, файла или базы.

      Ещё две вещи, которые спрашивают следом:

      - сравнение без учёта регистра — `equalsIgnoreCase`;
      - если слева может быть null, порядок меняют: `"admin".equals(role)` не
        упадёт, а `role.equals("admin")` даст NPE. Либо `Objects.equals(a, b)`,
        который безопасен с обеих сторон.

      Строки неизменяемы: любая операция вроде `concat` или `replace` создаёт
      новую строку, а исходная остаётся прежней.
    common_mistakes:
      - Сравнивать строки через == и ловить ошибку только на боевых данных.
      - Вызывать equals на возможном null вместо Objects.equals.
      - Считать, что replace изменит исходную строку.
    follow_ups:
      - Почему == иногда срабатывает для строк?
      - Как сравнить строки, если любая из них может быть null?

  - slug: java_exceptions_try_catch_basics
    specializations: [backend_java]
    topic: language
    subtopic: exceptions
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как устроен try-catch-finally и что такое try-with-resources?"
    answer_short: >-
      `try` содержит код, который может бросить исключение, `catch` перехватывает
      конкретный тип, `finally` выполняется всегда. Для ресурсов вместо `finally`
      используют try-with-resources: он закроет их сам в любом случае.
    answer_detailed: |
      ```java
      try (var connection = dataSource.getConnection()) {
          return read(connection);
      } catch (SQLException e) {
          throw new StorageException("не смог прочитать заказ " + id, e);
      }
      ```

      Что здесь важно:

      - ловят конкретный тип, а не `Exception`. Широкий перехват вместе с
        ошибкой в базе проглотит и опечатку в коде;
      - исходное исключение передают вторым аргументом. Без этого стек-трейс
        обрывается, и причина теряется навсегда;
      - пустой `catch` — почти всегда дефект: ошибка была, следов нет.

      try-with-resources закрывает всё, что реализует `AutoCloseable`, в
      обратном порядке объявления, и делает это даже при исключении. Вручную в
      `finally` это пишется на семь строк и регулярно пишется неправильно.

      `finally` выполняется и при `return` из `try`. Возвращать значение из
      `finally` не стоит: оно молча заменит собой и результат, и исключение.
    common_mistakes:
      - Ловить Exception вместо конкретного типа.
      - Терять причину, не передавая исходное исключение.
      - Закрывать ресурсы в finally вместо try-with-resources.
    follow_ups:
      - Что произойдёт, если сделать return внутри finally?
      - В каком порядке закрываются ресурсы в try-with-resources?

  - slug: java_null_and_npe_basics
    specializations: [backend_java]
    topic: language
    subtopic: optional_null
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что такое NullPointerException и как с ним борются?"
    answer_short: >-
      Обращение к полю или методу по нулевой ссылке. Борются не проверками
      повсюду, а тем, что null не пускают в код: обязательные поля проверяют на
      границе, а «значения может не быть» выражают через Optional.
    answer_detailed: |
      ```java
      Optional<User> found = repository.findByEmail(email);
      String name = found.map(User::name).orElse("гость");
      ```

      Практический порядок действий:

      - на границе приложения — проверка входных данных. Дальше внутрь null уже
        не проходит;
      - `Optional` возвращают из методов поиска, где отсутствие результата
        нормально. В полях и параметрах Optional не используют — это не его
        задача;
      - `Objects.requireNonNull` в конструкторе фиксирует инвариант: объект
        нельзя собрать с пустой обязательной зависимостью.

      Про сам Optional: `get()` без проверки — тот же NPE, только другими
      словами. Пользу дают `map`, `filter`, `orElse`, `orElseThrow` с внятным
      сообщением.

      Начиная с Java 14 сообщение об NPE называет конкретное выражение, которое
      оказалось нулевым, — читать стек-трейс стало гораздо проще.
    common_mistakes:
      - Обвешивать код проверками на null вместо контроля на границе.
      - Вызывать Optional.get() без проверки.
      - Класть Optional в поля и параметры методов.
    follow_ups:
      - Почему Optional не используют в полях класса?
      - Где именно проверяют входные данные?

  - slug: java_list_set_map_choice
    specializations: [backend_java]
    topic: collections
    subtopic: list_set
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Чем List, Set и Map отличаются и как выбрать между ними?"
    answer_short: >-
      List — упорядоченный список с возможными повторами и доступом по индексу.
      Set — набор без повторов, порядок обычно не гарантирован. Map — пары
      «ключ-значение» с быстрым поиском по ключу.
    answer_detailed: |
      ```java
      List<String> emails = new ArrayList<>();     // порядок важен, дубли возможны
      Set<String> unique  = new HashSet<>();       // нужна уникальность
      Map<String, User> byId = new HashMap<>();    // поиск по ключу
      ```

      Как выбирают на практике: если нужно «есть ли элемент», это `Set`, а не
      `List`. Проверка `contains` у списка проходит по всем элементам, у
      множества — почти мгновенная. Это самая частая ошибка в коде новичка:
      список на десять тысяч элементов внутри цикла.

      Разновидности, которые спрашивают:

      - `LinkedHashSet` и `LinkedHashMap` сохраняют порядок добавления;
      - `TreeSet` и `TreeMap` держат элементы отсортированными;
      - `HashSet` и `HashMap` быстрее всех, но порядок не обещают.

      Для `HashSet` и ключей `HashMap` обязателен корректный `equals` и
      `hashCode`. Объект без них попадёт в набор дважды.
    common_mistakes:
      - Искать элемент через contains у списка внутри цикла.
      - Класть в HashSet объект без equals и hashCode.
      - Полагаться на порядок обхода HashMap.
    follow_ups:
      - Почему contains у списка медленнее, чем у множества?
      - Что нужно объекту, чтобы корректно жить в HashSet?

  - slug: java_arraylist_vs_linkedlist
    specializations: [backend_java]
    topic: collections
    subtopic: list_set
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: single_choice
    title: "Что выбрать по умолчанию — ArrayList или LinkedList?"
    options:
      - code: a
        text: "LinkedList: вставка в середину быстрее"
      - code: b
        text: "ArrayList почти всегда: доступ по индексу за константу и данные лежат подряд в памяти"
        is_correct: true
      - code: c
        text: "Разницы нет, это одно и то же с разными именами"
      - code: d
        text: "LinkedList, потому что не нужно задавать размер заранее"
    answer_short: >-
      ArrayList. Он даёт доступ по индексу за константное время и хранит
      элементы подряд, что дружелюбно к кешу процессора. LinkedList выигрывает
      в теории на вставках в середину, но на практике проигрывает почти всегда.
    answer_detailed: |
      Разница по сложности:

      - `ArrayList`: доступ по индексу — константа, вставка в конец — константа
        в среднем, вставка в середину — сдвиг элементов;
      - `LinkedList`: вставка в известное место — константа, но чтобы туда
        попасть, список надо пройти. Доступ по индексу — линейный.

      Почему LinkedList проигрывает на практике: каждый элемент — отдельный
      объект со ссылками, разбросанный по памяти. Процессор читает память
      блоками, и последовательный проход по массиву оказывается в разы быстрее
      даже там, где по формулам должно быть наоборот.

      Заранее известный размер задают в конструкторе: `new ArrayList<>(1000)`
      избавляет от нескольких перевыделений массива.

      Когда LinkedList всё же уместен — когда он нужен как `Deque`: очередь с
      добавлением и удалением с обоих концов. Хотя и здесь обычно берут
      `ArrayDeque`.
    common_mistakes:
      - Брать LinkedList «для быстрых вставок», не измеряя.
      - Обращаться к LinkedList по индексу в цикле.
    follow_ups:
      - Почему проход по массиву быстрее прохода по связному списку?
      - Что взять для очереди с двух концов?

  - slug: java_iterating_collections
    specializations: [backend_java]
    topic: collections
    subtopic: streams_api
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Как перебрать коллекцию и что произойдёт при удалении элемента во время обхода?"
    answer_short: >-
      Обычно `for-each` или стрим. Удаление из коллекции прямо во время обхода
      даёт `ConcurrentModificationException`: итератор замечает, что коллекцию
      изменили мимо него. Удаляют через `iterator.remove` или `removeIf`.
    answer_detailed: |
      ```java
      for (Order order : orders) {
          if (order.isExpired()) {
              orders.remove(order);        // ConcurrentModificationException
          }
      }

      orders.removeIf(Order::isExpired);   // так правильно
      ```

      Название исключения путает: оно возникает и в одном потоке. Смысл — «пока
      ты обходил, коллекцию изменили».

      Стримы решают другую задачу — описать преобразование, а не цикл:

      ```java
      List<String> emails = users.stream()
              .filter(User::isActive)
              .map(User::email)
              .toList();
      ```

      Когда что: стрим хорош там, где идёт цепочка фильтрации и преобразования.
      Обычный цикл понятнее, когда внутри сложная логика с несколькими
      условиями и ранними выходами. Стрим ради стрима читается хуже цикла.
    common_mistakes:
      - Удалять элементы прямо в for-each.
      - Переписывать любой цикл на стрим ради стиля.
      - Использовать стрим ради побочного эффекта вместо цикла.
    follow_ups:
      - Почему ConcurrentModificationException возникает в одном потоке?
      - Когда обычный цикл читается лучше стрима?

  - slug: java_jvm_jdk_jre
    specializations: [backend_java]
    topic: jvm
    subtopic: class_loading
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 4
    type: open_answer
    title: "Чем JDK отличается от JRE и что происходит с кодом от исходника до выполнения?"
    answer_short: >-
      JDK — комплект разработчика с компилятором и инструментами, JRE — среда
      выполнения. Исходник компилируется в байт-код класса, JVM его загружает и
      исполняет, а горячие места дополнительно компилирует в машинный код.
    answer_detailed: |
      Путь кода:

      1. `javac` превращает `.java` в `.class` с байт-кодом — это не машинный
         код, а инструкции для JVM;
      2. загрузчик классов подтягивает `.class` в память по мере обращения;
      3. интерпретатор исполняет байт-код;
      4. JIT замечает часто выполняемые участки и компилирует их в машинный код.

      Отсюда известное свойство: Java-приложение «разогревается». Первые запросы
      после старта медленнее последующих, и это надо учитывать при замерах
      производительности и при настройке проверок готовности сервиса.

      Байт-код одинаков для всех платформ, а JVM своя под каждую — на этом
      держится переносимость.

      На практике сегодня почти всегда ставят JDK: современные дистрибутивы
      отдельного JRE обычно не поставляют.
    common_mistakes:
      - Считать байт-код машинным кодом.
      - Замерять производительность на непрогретой JVM.
    follow_ups:
      - Почему первые запросы после старта медленнее?
      - Что делает JIT-компилятор?

  - slug: java_stack_vs_heap_basics
    specializations: [backend_java]
    topic: jvm
    subtopic: memory_areas
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Где хранятся объекты и локальные переменные и что делает сборщик мусора?"
    answer_short: >-
      Объекты живут в куче, локальные переменные и ссылки — в стеке потока, у
      каждого потока свой. Сборщик мусора освобождает объекты, до которых больше
      нельзя добраться по ссылкам из живых корней.
    answer_detailed: |
      ```java
      void handle() {
          User user = new User();   // ссылка в стеке, объект в куче
      }                             // ссылка исчезла, объект стал недостижим
      ```

      Ключевое слово — «достижимость», а не «счётчик ссылок». Два объекта,
      ссылающиеся друг на друга, но недостижимые извне, всё равно будут
      собраны.

      Что из этого следует на практике:

      - утечка в Java — это не «забыли освободить», а «случайно держим ссылку».
        Классика — статическая коллекция, куда складывают и не убирают;
      - `StackOverflowError` — это переполнение стека, обычно бесконечная
        рекурсия. `OutOfMemoryError` — кончилась куча;
      - явно вызывать `System.gc()` не нужно: это лишь просьба, и почти всегда
        признак попытки лечить симптом.

      Размер кучи задают при запуске (`-Xmx`), и в контейнере его согласуют с
      лимитом памяти, иначе процесс убивает система, а не JVM.
    common_mistakes:
      - Пытаться управлять памятью вызовом System.gc().
      - Складывать данные в статическую коллекцию и не убирать.
      - Не согласовывать размер кучи с лимитом памяти контейнера.
    follow_ups:
      - Чем StackOverflowError отличается от OutOfMemoryError?
      - Почему циклические ссылки не мешают сборщику?

  - slug: java_thread_basics
    specializations: [backend_java]
    topic: concurrency
    subtopic: synchronization
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое поток и почему в приложении не создают потоки вручную?"
    answer_short: >-
      Поток — независимая последовательность выполнения внутри процесса.
      Вручную их не создают: создание потока дорого, а их число надо
      ограничивать. Вместо этого берут пул через `ExecutorService`.
    answer_detailed: |
      ```java
      ExecutorService pool = Executors.newFixedThreadPool(8);
      Future<Report> future = pool.submit(() -> build(id));
      ```

      Почему не `new Thread(...)` на каждую задачу: платформенный поток — это
      ресурс операционной системы со своим стеком. Тысяча задач превратится в
      тысячу потоков, и время уйдёт на переключение между ними, а не на работу.

      Пул решает две задачи сразу: переиспользует потоки и задаёт верхнюю
      границу параллелизма. Размер выбирают по характеру нагрузки: для расчётов
      — примерно по числу ядер, для ожидания ввода-вывода — больше.

      Что ещё спрашивают на этом уровне: в веб-приложении на Spring поток на
      запрос выделяет сервер, и код контроллера с самого начала выполняется в
      многопоточной среде. Поэтому поля сервиса, хранящие состояние запроса, —
      источник трудноуловимых ошибок.

      Пул обязательно останавливают при завершении приложения, иначе процесс не
      завершится.
    common_mistakes:
      - Создавать поток на каждую задачу.
      - Хранить состояние запроса в поле разделяемого сервиса.
      - Не останавливать пул при завершении.
    follow_ups:
      - Как выбирают размер пула?
      - Почему поля сервиса в Spring не должны хранить состояние запроса?

  - slug: java_race_condition_basics
    specializations: [backend_java]
    topic: concurrency
    subtopic: synchronization
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что такое гонка данных и почему `counter++` не атомарен?"
    answer_short: >-
      Гонка — когда два потока обращаются к общим данным без синхронизации и
      результат зависит от того, кто успел первым. `counter++` — это три
      операции: прочитать, прибавить, записать. Между ними влезает другой поток.
    answer_detailed: |
      ```java
      private int counter = 0;

      void increment() {
          counter++;            // read, add, write — не атомарно
      }
      ```

      Два потока могут прочитать одно и то же значение, каждый прибавить единицу
      и записать — итог вырастет на один вместо двух. Ошибка не воспроизводится
      стабильно: на слабой нагрузке её не видно, в бою она проявляется как
      «цифры немного не сходятся».

      Способы починить, от простого к точному:

      - `synchronized` на методе или блоке — просто и понятно, но блокирует;
      - `AtomicInteger` — атомарные операции без блокировки, для счётчиков
        подходит лучше;
      - лучший вариант — вовсе не иметь общего изменяемого состояния. Неизменяемый
        объект безопасен без всякой синхронизации.

      Отдельно про видимость: без синхронизации один поток может вообще не
      увидеть изменения, сделанные другим, — значение остаётся в кеше ядра. Это
      уже про `volatile` и модель памяти.
    common_mistakes:
      - Считать инкремент атомарной операцией.
      - Синхронизировать запись, но не чтение.
      - Делать поля изменяемыми там, где хватило бы неизменяемого объекта.
    follow_ups:
      - Чем AtomicInteger лучше synchronized для счётчика?
      - Почему без синхронизации поток может не увидеть чужое изменение?
  - slug: java_spring_what_is_di
    specializations: [backend_java]
    topic: spring
    subtopic: di_context
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что такое внедрение зависимостей и что делает контейнер Spring?"
    answer_short: >-
      Класс не создаёт свои зависимости сам, а получает их снаружи. Контейнер
      Spring находит компоненты, создаёт их в правильном порядке и раздаёт тем,
      кому они нужны. Класс перестаёт зависеть от способа создания зависимости.
    answer_detailed: |
      ```java
      @Service
      public class OrderService {
          private final OrderRepository repository;

          public OrderService(OrderRepository repository) {   // внедрение через конструктор
              this.repository = repository;
          }
      }
      ```

      Что даёт: в тесте на место репозитория подставляется заглушка без всякого
      Spring — достаточно вызвать конструктор. Если бы сервис делал
      `new OrderRepository()` внутри, подменить его было бы нечем.

      Как контейнер находит компоненты: классы, помеченные `@Component`,
      `@Service`, `@Repository`, `@Controller`, попадают в контекст при
      сканировании пакетов. Точка входа приложения задаёт корень сканирования,
      поэтому классы вне её пакета контейнер просто не увидит — типичная причина
      «бин не найден».

      Внедрение через конструктор предпочитают внедрению в поле: поле нельзя
      сделать final, зависимости невидимы снаружи, а объект можно собрать в
      недособранном состоянии.
    common_mistakes:
      - Внедрять зависимости в поля через аннотацию вместо конструктора.
      - Создавать зависимости через new внутри сервиса.
      - Класть классы вне пакета, который сканируется.
    follow_ups:
      - Почему внедрение через конструктор лучше внедрения в поле?
      - Почему Spring может не найти ваш компонент?

  - slug: java_spring_boot_starter_basics
    specializations: [backend_java]
    topic: spring
    subtopic: boot_config
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое Spring Boot стартер и откуда приложение берёт настройки?"
    answer_short: >-
      Стартер — набор зависимостей с готовой автонастройкой под задачу: веб,
      база, тесты. Настройки берутся из `application.yml` и переопределяются
      переменными окружения и аргументами запуска, у которых приоритет выше.
    answer_detailed: |
      ```yaml
      spring:
        datasource:
          url: ${DATABASE_URL}
      server:
        port: 8080
      ```

      Автонастройка работает по принципу «есть библиотека в classpath — настрою
      сама». Подключили стартер веба — поднялся встроенный сервер, подключили
      стартер данных — настроился пул соединений. Свой бин того же типа отменяет
      автонастройку.

      Порядок приоритета источников настроек важен на собеседовании: аргументы
      командной строки перекрывают переменные окружения, те — профильный файл, а
      он — основной `application.yml`. Благодаря этому один и тот же артефакт
      запускается в любой среде без пересборки.

      Профили (`application-prod.yml`) выбирают набор настроек, а не набор кода.
      Разводить бизнес-логику по профилям — плохая идея: боевая ветка окажется
      непроверенной.

      Секреты в файле не хранят: пароль подставляют из переменной окружения.
    common_mistakes:
      - Хранить пароли прямо в application.yml.
      - Разводить бизнес-логику по профилям.
      - Не знать порядок переопределения настроек.
    follow_ups:
      - Как переопределить настройку без пересборки артефакта?
      - Что отменяет автонастройку?

  - slug: java_sql_basics_select
    specializations: [backend_java]
    topic: db
    subtopic: indexes
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Из чего состоит SQL-запрос на выборку и зачем нужен индекс?"
    answer_short: >-
      `SELECT` перечисляет колонки, `FROM` — таблицу, `WHERE` отбирает строки,
      `JOIN` соединяет таблицы, `ORDER BY` сортирует. Индекс — отдельная
      структура, позволяющая найти строки по условию, не читая всю таблицу.
    answer_detailed: |
      ```sql
      SELECT o.id, u.email
      FROM orders o
      JOIN users u ON u.id = o.user_id
      WHERE o.status = 'paid'
      ORDER BY o.created_at DESC
      LIMIT 20;
      ```

      Без индекса база читает таблицу целиком. На тысяче строк это незаметно, на
      миллионе — секунды на каждый запрос. Индекс по `status` и `created_at`
      превращает такой запрос в чтение небольшого куска данных.

      Плата за индекс: он занимает место и замедляет вставку и обновление —
      каждый индекс нужно поддерживать. Поэтому их ставят по реальным запросам,
      а не «на всякий случай на каждую колонку».

      Что стоит знать сразу:

      - `LEFT JOIN` оставляет строки левой таблицы даже без пары справа,
        обычный `JOIN` — нет;
      - `COUNT(*)` считает строки, `GROUP BY` собирает их в группы;
      - `SELECT *` в коде приложения не пишут: добавили колонку — запрос стал
        тянуть лишнее.
    common_mistakes:
      - Ставить индексы на все колонки подряд.
      - Писать SELECT * в коде приложения.
      - Путать JOIN и LEFT JOIN при отсутствующих связях.
    follow_ups:
      - Почему индексы замедляют запись?
      - Чем LEFT JOIN отличается от обычного?

  - slug: java_jdbc_and_orm_basics
    specializations: [backend_java]
    topic: db
    subtopic: jpa_lifecycle
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое JDBC и JPA и зачем нужна ORM, если есть SQL?"
    answer_short: >-
      JDBC — низкоуровневый доступ к базе: запрос, параметры, разбор результата
      вручную. JPA — стандарт отображения объектов на таблицы, Hibernate — его
      реализация. ORM убирает рутину, но не отменяет понимания генерируемого SQL.
    answer_detailed: |
      ```java
      @Entity
      public class Order {
          @Id @GeneratedValue
          private Long id;

          @ManyToOne(fetch = FetchType.LAZY)
          private User user;
      }
      ```

      Что ORM берёт на себя: подстановку параметров без риска инъекции,
      отображение типов, отслеживание изменённых объектов, связи между
      сущностями.

      Чего она не отменяет: контроля над тем, какой SQL получился. Классическая
      беда — цикл по заказам с обращением к `order.getUser()` внутри: вместо
      одного запроса выполняется сто один. Лечится загрузкой связи заранее
      (`JOIN FETCH` или граф сущностей).

      Параметры запроса всегда передают отдельно, а не склеивают строку: строка,
      собранная конкатенацией, — прямой путь к SQL-инъекции. Это верно и для
      JDBC, и для нативных запросов в JPA.

      Когда ORM мешает — пишут запрос руками. Это нормально: сложная аналитика
      через объектную модель читается хуже, чем прямой SQL.
    common_mistakes:
      - Считать, что ORM избавляет от знания SQL.
      - Обращаться к ленивой связи в цикле.
      - Склеивать SQL конкатенацией строк.
    follow_ups:
      - Что такое проблема N+1 и как её заметить?
      - Как загрузить связанную сущность одним запросом?

  - slug: java_rest_controller_basics
    specializations: [backend_java]
    topic: web
    subtopic: rest_design
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как выглядит REST-контроллер в Spring и почему сущность не отдают наружу?"
    answer_short: >-
      Контроллер принимает запрос, вызывает сервис и возвращает ответ.
      Сущность базы наружу не отдают: она тянет за собой связи и ленивую
      загрузку, а любое изменение схемы становится изменением публичного API.
    answer_detailed: |
      ```java
      @RestController
      @RequestMapping("/api/v1/orders")
      public class OrderController {

          @GetMapping("/{id}")
          public OrderResponse get(@PathVariable long id) {
              return OrderResponse.from(service.find(id));
          }
      }
      ```

      Три причины не возвращать сущность напрямую:

      - при сериализации Hibernate начнёт подгружать ленивые связи, и один
        запрос превратится в десяток;
      - наружу утекут поля, которых там быть не должно, — хеш пароля,
        внутренние флаги;
      - переименование колонки сломает клиентов.

      Отдельный класс ответа решает всё это и заодно документирует контракт.

      Бизнес-логике в контроллере не место: его работа — разобрать запрос,
      позвать сервис, собрать ответ. Как только внутри появляются условия про
      предметную область, тестировать это можно только через HTTP.

      Входные данные проверяют аннотациями валидации на объекте запроса, а не
      руками в теле метода.
    common_mistakes:
      - Возвращать сущность JPA прямо из контроллера.
      - Держать бизнес-логику в контроллере.
      - Проверять входные данные вручную вместо валидации.
    follow_ups:
      - Что произойдёт при сериализации сущности с ленивой связью?
      - Где проверяют входные данные запроса?

  - slug: java_http_status_and_validation
    specializations: [backend_java]
    topic: web
    subtopic: validation
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: single_choice
    title: "Клиент прислал запрос без обязательного поля. Какой код ответа вернуть?"
    options:
      - code: a
        text: "200 с сообщением об ошибке в теле"
      - code: b
        text: "400 — запрос не прошёл проверку, это ошибка клиента"
        is_correct: true
      - code: c
        text: "500 — сервер не смог обработать запрос"
      - code: d
        text: "404 — раз данных нет, значит нечего возвращать"
    answer_short: >-
      400: ошибка на стороне клиента, запрос не прошёл проверку. Код 500
      означал бы поломку на нашей стороне и сбивал бы дежурных с толку, а 200
      с ошибкой в теле клиенты и прокси сочтут успехом.
    answer_detailed: |
      ```java
      public record CreateOrderRequest(
              @NotBlank String customerEmail,
              @Positive int quantity) {}

      @PostMapping
      public OrderResponse create(@Valid @RequestBody CreateOrderRequest request) { ... }
      ```

      `@Valid` включает проверку, и при нарушении Spring сам возвращает 400.
      Остаётся оформить тело ответа так, чтобы клиент понял, какое поле не
      прошло: единый обработчик ошибок собирает список нарушений в общий формат.

      Что различают внутри 4xx: 400 — запрос не разобрали, 401 — не понятно, кто
      вы, 403 — понятно, но нельзя, 404 — ресурса нет, 409 — конфликт с текущим
      состоянием.

      Почему это важнее, чем кажется: по кодам работает вся автоматика —
      повторы запросов, оповещения, графики. Сервис, отвечающий 200 на ошибки,
      выглядит здоровым ровно до разбора жалоб пользователей.
    common_mistakes:
      - Возвращать 200 с признаком ошибки в теле.
      - Отдавать 500 на неверные входные данные.
      - Отдавать текст исключения наружу вместо внятного сообщения.
    follow_ups:
      - Чем 400 отличается от 422?
      - Где собирают единый формат ответа об ошибке?

  - slug: java_layered_architecture_basics
    specializations: [backend_java]
    topic: architecture
    subtopic: layered_architecture
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Зачем приложение делят на контроллер, сервис и репозиторий?"
    answer_short: >-
      Чтобы разделить ответственность: контроллер отвечает за протокол, сервис
      — за бизнес-правила, репозиторий — за доступ к данным. Зависимости идут
      сверху вниз, и бизнес-логику можно тестировать без HTTP и без базы.
    answer_detailed: |
      ```
      Controller  → Service  → Repository → БД
      ```

      Что даёт разделение на практике: сервис проверяется обычным юнит-тестом с
      подставленным репозиторием — без поднятия контекста и базы. Такие тесты
      выполняются за миллисекунды, поэтому их пишут и запускают постоянно.

      Правила, за которые обычно и спрашивают:

      - контроллер не ходит в репозиторий напрямую;
      - репозиторий не знает про HTTP и не бросает веб-исключений;
      - сущность базы не путешествует в контроллер — там отдельный объект
        ответа.

      Слои — не догма, а инструмент. Для операции «отдать список справочника»
      сервис-прослойка без единого правила иногда действительно лишняя, и это
      честно признают. Но как только появляется бизнес-правило, ему нужно место,
      где его найдут.
    common_mistakes:
      - Обращаться к репозиторию прямо из контроллера.
      - Складывать бизнес-правила в сущность или в контроллер.
      - Создавать пустой сервис-прослойку ради формального соблюдения слоёв.
    follow_ups:
      - Почему юнит-тест сервиса быстрее теста контроллера?
      - Куда попадёт бизнес-правило, если сервиса нет?

  - slug: java_solid_srp_basics
    specializations: [backend_java]
    topic: architecture
    subtopic: solid
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое принцип единственной ответственности и как понять, что он нарушен?"
    answer_short: >-
      У класса должна быть одна причина для изменения. Признак нарушения
      простой: описание класса требует союза «и» — «считает скидку и шлёт
      письмо», — и правки по разным причинам приходят в один и тот же файл.
    answer_detailed: |
      ```java
      // одна причина меняться — правила скидок
      class DiscountCalculator { ... }

      // другая — формат письма
      class OrderNotifier { ... }
      ```

      Практические признаки, что класс делает слишком много:

      - имя содержит `Manager`, `Helper`, `Util` — потому что честное имя
        придумать не удалось;
      - в тесте приходится подставлять пять зависимостей, чтобы проверить одно
        правило;
      - каждая задача спринта задевает этот файл, и правки конфликтуют.

      Обратная крайность тоже реальна: класс на один метод, дёргаемый из
      единственного места, добавляет уровень косвенности и ничего не упрощает.
      Принцип — про причины изменения, а не про число строк.

      Тот же критерий применим к методу: если внутри есть блоки «сначала одно,
      потом совсем другое», их обычно стоит разделить.
    common_mistakes:
      - Понимать принцип как «класс должен быть маленьким».
      - Плодить классы на один метод ради формального соблюдения.
      - Заводить Utils и складывать туда всё подряд.
    follow_ups:
      - Почему имя Manager — признак проблемы?
      - Чем плохо дробление на классы по одному методу?

  - slug: java_junit_basics
    specializations: [backend_java]
    topic: testing
    subtopic: junit_mockito
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как выглядит юнит-тест на JUnit и что в нём проверяют?"
    answer_short: >-
      Метод с аннотацией `@Test`, внутри — подготовка данных, вызов и проверка
      результата. Проверяют поведение, а не реализацию: расчёты, границы,
      обработку ошибок, а не то, какие методы внутри вызвались.
    answer_detailed: |
      ```java
      @Test
      void appliesDiscountToTotal() {
          var order = new Order(List.of(100, 200));

          var total = order.totalWithDiscount(10);

          assertThat(total).isEqualTo(270);
      }
      ```

      Структура «подготовили — выполнили — проверили» видна по пустым строкам, и
      этого достаточно: комментарии здесь только мешают.

      Имя теста описывает поведение, а не метод: `appliesDiscountToTotal`
      понятнее, чем `testTotal1`. По списку упавших тестов сразу видно, что
      сломалось.

      Что стоит проверять в первую очередь — не то, что легко, а то, что легко
      сломать: расчёты, граничные значения, поведение при пустых данных и
      ошибках. Тест на геттер не даёт ничего.

      Отдельная привычка: получив ошибку от пользователя, сначала пишут тест,
      который её воспроизводит, и только потом чинят. Иначе через полгода она
      вернётся, и никто не поймёт, что это уже было.
    common_mistakes:
      - Называть тесты test1, test2 и разбираться в них по номеру.
      - Проверять геттеры вместо расчётов и границ.
      - Чинить ошибку, не написав воспроизводящий её тест.
    follow_ups:
      - Почему тест на ошибку пишут до исправления?
      - Как выбрать, что проверять в первую очередь?

  - slug: java_what_is_cache_basics
    specializations: [backend_java]
    topic: system_design
    subtopic: caching
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое кеш и какую проблему он создаёт вместе с той, что решает?"
    answer_short: >-
      Хранилище готового результата, чтобы не считать его заново. Решает
      проблему скорости и нагрузки, создаёт проблему устаревших данных: где-то
      лежит копия, и она может не совпадать с источником.
    answer_detailed: |
      ```java
      @Cacheable("users")
      public User findById(long id) { ... }
      ```

      Кеш уместен, когда данные читают часто, а меняют редко, и когда небольшое
      отставание допустимо: справочники, профили, настройки. Он не подходит там,
      где нужна точность прямо сейчас, — остаток на счёте, число мест.

      Главный вопрос при добавлении кеша — не «как положить», а «когда убрать».
      Два подхода: время жизни (проще, данные устаревают предсказуемо) и
      инвалидация при изменении (точнее, но нужно не забыть все места записи).

      Ещё две вещи, о которых спрашивают следом: кеш в памяти процесса
      неприменим, когда экземпляров несколько, — у каждого будет своя версия
      данных. И кеш не лечит плохой запрос: сначала чинят запрос, потом думают
      про кеш.
    common_mistakes:
      - Кешировать данные, требующие точности прямо сейчас.
      - Класть в кеш и не продумывать инвалидацию.
      - Лечить кешем медленный запрос вместо исправления запроса.
    follow_ups:
      - Что не так с кешем в памяти при нескольких экземплярах сервиса?
      - Чем время жизни отличается от инвалидации по событию?

  - slug: java_soft_asking_for_help
    specializations: [backend_java]
    topic: soft
    subtopic: teamwork
    min_grade: intern
    peak_grade: junior
    max_grade: middle
    frequency: 4
    type: open_answer
    title: "Вы застряли на задаче. Через сколько времени и как правильно просить помощи?"
    answer_short: >-
      Обычная договорённость — от получаса до часа самостоятельных попыток,
      дальше спрашивать. Просьба должна содержать задачу, что уже пробовали и
      что получилось, а не «у меня не работает».
    answer_detailed: |
      ### Junior
      Молчать полдня хуже, чем спросить через час: команда теряет день, а не вы
      сохраняете лицо.

      Форма вопроса решает многое:

      > Поднимаю контекст в тесте, падает на создании бина репозитория с
      > BeanCreationException. Проверил, что класс в сканируемом пакете; пробовал
      > отдельный профиль — та же ошибка. Вот конфигурация и стек. Куда смотреть?

      Это отвечается за минуту. «Помогите, не работает» требует пяти уточняющих
      вопросов, и каждый — отдельное переключение для того, кто помогает.

      ### Middle
      Ждут, что вы сами оцениваете цену молчания: задача на день и задача на
      спринт допускают разное время самостоятельных попыток. Полезная привычка —
      записывать, что уже проверено: половина проблем решается по дороге, пока
      формулируешь.

      ### Senior
      Ждут обратной стороны: умения принимать такие вопросы и не отбивать охоту
      их задавать. Ответ «сам разберись» экономит десять минут и стоит команде
      дня.

      Сильная версия включает системный вывод: если люди регулярно застревают в
      одном месте, дело не в людях, а в отсутствии документации или в запутанном
      коде.
    common_mistakes:
      - Молчать полдня, боясь показаться некомпетентным.
      - Спрашивать без описания того, что уже пробовали.
      - Отвечать новичкам так, что спрашивать перестают.
    follow_ups:
      - Что должно быть в хорошо сформулированном вопросе?
      - Что делать, если люди регулярно застревают на одном месте?
  # Вопросы, которые задают и джуну, и сеньору — разница в глубине ответа.
  # Они же закрывают разделы, где на junior и middle не было ничего.

  - slug: java_rest_error_contract
    specializations: [backend_java]
    topic: web
    subtopic: error_handling
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как устроена обработка ошибок в REST-сервисе и что попадает в ответ клиенту?"
    answer_short: >-
      Единый обработчик превращает исключения в один формат ответа: код
      состояния, машиночитаемый код ошибки, сообщение и идентификатор запроса.
      Стек-трейс и текст исключения наружу не отдают — они идут в журнал.
    answer_detailed: |
      ### Junior
      В Spring это `@RestControllerAdvice` с методами `@ExceptionHandler`.
      Каждое исключение предметной области отображается в свой код состояния:
      «не найдено» — 404, «нарушено правило» — 409 или 422, всё непредвиденное —
      500.

      Формат ответа один на весь сервис:

      ```json
      {"code": "order_already_paid", "message": "Заказ уже оплачен", "request_id": "..."}
      ```

      Почему не отдавать текст исключения: он раскрывает внутреннее устройство —
      имена таблиц, классов, иногда пути на диске. И читать его пользователю
      бесполезно.

      ### Middle
      Ждут разделения ошибок на ожидаемые и непредвиденные. Ожидаемые —
      часть контракта, они описаны и стабильны. Непредвиденные — 500, и в ответ
      уходит только идентификатор запроса, по которому в журнале находят всё
      остальное.

      Здесь же — про машиночитаемый код. Клиент не должен разбирать текст
      сообщения: текст меняется и переводится, код — нет.

      Ошибки валидации отдают списком по полям, а не одной строкой: форме нужно
      подсветить конкретное поле.

      ### Senior
      Ждут разговора про контракт как обязательство. Добавить новый код ошибки
      можно, изменить смысл существующего — нельзя: на нём уже построена логика
      клиентов, включая повторные попытки.

      Сюда же — согласованность между сервисами. Если каждый сервис отдаёт
      ошибки по-своему, общий формат приходится собирать в шлюзе, и это работает
      хуже, чем договорённость на входе.

      Сильный ответ упоминает, что коды ошибок влияют на автоматику: по 5xx
      срабатывают оповещения и повторы, и «удобное» превращение ожидаемой
      ошибки в 500 поднимает дежурных ночью на ровном месте.
    common_mistakes:
      - Отдавать наружу стек-трейс и текст исключения.
      - Заставлять клиента разбирать текст сообщения вместо кода.
      - Отвечать 500 на нарушение бизнес-правила.
    follow_ups:
      - Зачем в ответе идентификатор запроса?
      - Что можно менять в контракте ошибок, а что нельзя?

  - slug: java_api_auth_basics
    specializations: [backend_java]
    topic: web
    subtopic: auth
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Чем аутентификация отличается от авторизации и как защищают REST API?"
    answer_short: >-
      Аутентификация отвечает «кто вы», авторизация — «что вам можно». В API
      обычно токен в заголовке: сервер проверяет подпись и срок, затем сверяет
      права на конкретное действие.
    answer_detailed: |
      ### Junior
      Различать эти два слова — первое, что проверяют. Логин с паролем и выдача
      токена — аутентификация. Проверка «этот пользователь может удалить чужой
      заказ?» — авторизация.

      Практика минимума: пароли хранят только в виде хеша с солью, подобранным
      для этого алгоритмом. HTTPS обязателен: токен в открытом канале
      равнозначен паролю.

      ### Middle
      Ждут понимания компромисса между сессией и токеном. Сессия хранится на
      сервере — её можно отозвать мгновенно, но нужно общее хранилище. Токен
      самодостаточен и не требует похода в базу, зато отозвать его до истечения
      срока нечем.

      Отсюда типовая схема: короткоживущий access-токен и долгоживущий
      refresh-токен, который хранится на сервере и отзывается.

      Проверка прав живёт в сервисном слое, а не только в контроллере: правило
      «редактировать может владелец» относится к предметной области.

      ### Senior
      Ждут разговора о том, что ломается на масштабе. Отзыв токенов при
      компрометации, ротация ключей подписи без разлогина всех пользователей,
      единый вход через внешнего поставщика, доверие между сервисами внутри
      периметра.

      Сильный ответ включает, что права проверяются на владельца ресурса, а не
      только на роль: проверка «роль = user» без проверки «этот заказ мой»
      открывает доступ к чужим данным по прямой ссылке.
    common_mistakes:
      - Проверять роль и не проверять владельца ресурса.
      - Класть в токен данные, которые меняются, и удивляться расхождению.
      - Считать, что токен можно отозвать так же легко, как сессию.
    follow_ups:
      - Зачем нужен refresh-токен, если есть access?
      - Как отозвать доступ пользователю, у которого на руках живой токен?

  - slug: java_interface_vs_abstract_class
    specializations: [backend_java]
    topic: architecture
    subtopic: patterns
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Когда брать интерфейс, а когда абстрактный класс?"
    answer_short: >-
      Интерфейс описывает контракт и допускает несколько реализаций у класса.
      Абстрактный класс задаёт общую основу с состоянием и готовым поведением,
      но наследоваться можно только от одного.
    answer_detailed: |
      ### Junior
      Формальная разница: интерфейсов можно реализовать сколько угодно, класс
      наследуется один. У интерфейса нет состояния, у абстрактного класса есть
      поля и конструктор.

      Практическое правило по умолчанию — интерфейс. Он не связывает руки и не
      навязывает иерархию.

      ### Middle
      Ждут понимания, что абстрактный класс создаёт жёсткую связь. Наследник
      зависит от внутреннего устройства предка, и изменение предка ломает всех
      потомков — это и есть хрупкое наследование.

      Здесь же уместно вспомнить, что композиция обычно предпочтительнее
      наследования: вместо «наследуемся, чтобы переиспользовать код» —
      «внедряем зависимость и вызываем».

      Методы по умолчанию в интерфейсе появились не для того, чтобы заменить
      абстрактные классы, а чтобы расширять существующие интерфейсы, не ломая
      реализации.

      ### Senior
      Ждут взгляда на эволюцию контракта. Добавление метода в интерфейс ломает
      всех, кто его реализует, — если только это не метод по умолчанию.
      Публичный интерфейс библиотеки — обязательство на годы.

      Сильный ответ упоминает, что интерфейс объявляют под нужды потребителя, а
      не «на всякий случай» для каждой реализации. Интерфейс с одной реализацией
      и именем `ServiceImpl` не даёт ничего, кроме лишнего файла.
    common_mistakes:
      - Заводить интерфейс с единственной реализацией ради формы.
      - Наследоваться, чтобы переиспользовать код.
      - Считать методы по умолчанию заменой абстрактному классу.
    follow_ups:
      - Что сломается при добавлении метода в опубликованный интерфейс?
      - Почему наследование называют хрупким?

  - slug: java_patterns_in_practice
    specializations: [backend_java]
    topic: architecture
    subtopic: patterns
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Какие паттерны вы реально применяли и зачем?"
    answer_short: >-
      Ценится не список из книги, а два-три примера из своего кода с объяснением
      задачи. Стратегия вместо ветвления по типу, фабрика для сложной сборки,
      декоратор для повторов и журналирования, шаблонный метод для общего
      каркаса.
    answer_detailed: |
      ### Junior
      Достаточно назвать несколько и объяснить своими словами. Синглтон в
      Spring — это область видимости бина, а не написанный руками класс с
      приватным конструктором.

      Слабый ответ — перечисление всех паттернов подряд без единого примера.

      ### Middle
      Ждут связки «задача — решение». Например: было ветвление по типу платежа
      на восемь веток, каждое новое средство оплаты требовало правки этого
      метода; заменили на интерфейс с реализацией под каждый способ и выбор по
      ключу — новый способ добавляется отдельным классом.

      Здесь же честное признание, что многие паттерны в Java уже растворены во
      фреймворке: внедрение зависимостей, прокси вокруг транзакций, шаблонные
      методы в клиентах.

      ### Senior
      Ждут понимания цены. Паттерн — это дополнительная косвенность: имя,
      которого не было, файл, которого не было, прыжок при чтении кода. Он
      окупается, когда изменения действительно приходят с той стороны, с
      которой вы ожидали.

      Сильный ответ включает обратный пример: где паттерн ввели рано и он
      только мешал — фабрика фабрик ради одного типа объектов, стратегия с
      единственной стратегией.

      Уместно и про язык: часть классических паттернов в современной Java
      выражается лямбдой или записью, и отдельный класс им уже не нужен.
    common_mistakes:
      - Перечислять паттерны без примеров из своей работы.
      - Считать синглтон в Spring написанным вручную классом.
      - Вводить паттерн до того, как появилась изменчивость, ради которой он нужен.
    follow_ups:
      - Где вы применили паттерн и потом пожалели?
      - Какие паттерны в Java уже встроены во фреймворк?

  - slug: java_open_closed_practice
    specializations: [backend_java]
    topic: architecture
    subtopic: solid
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Что означает «открыт для расширения, закрыт для изменения» на практике?"
    answer_short: >-
      Новое поведение добавляется новым кодом, а не правкой существующего.
      Признак нарушения — растущий switch по типу: каждый новый случай требует
      трогать метод, который уже работает и уже протестирован.
    answer_detailed: |
      ### Junior
      Простая иллюстрация: расчёт доставки со switch по типу перевозчика. Каждый
      новый перевозчик — правка одного и того же метода и риск задеть остальные
      случаи.

      Замена — интерфейс `DeliveryCalculator` и по реализации на перевозчика.
      Новый перевозчик добавляется новым классом, старые не трогают.

      ### Middle
      Ждут понимания границы. Принцип не требует делать расширяемым всё подряд:
      абстракция, введённая до того, как появилась вторая реализация, обычно
      оказывается неверной, и её всё равно переделывают.

      Разумный порядок — «правило трёх»: второй случай ещё терпит копию, на
      третьем становится видно, что именно меняется, и абстракция получается
      по факту, а не по догадке.

      В Spring это обычно выглядит как набор бинов одного интерфейса, из
      которого выбирают нужный по ключу.

      ### Senior
      Ждут разговора про точки расширения как решение проектировщика. Каждая
      такая точка — обязательство поддерживать её дальше, поэтому их размещают
      там, где изменения действительно приходят: способы оплаты, интеграции,
      правила тарификации.

      Сильный ответ включает цену: излишняя расширяемость превращает код в
      конструктор, где поведение собирается из конфигурации и не читается ни в
      одном файле целиком.
    common_mistakes:
      - Вводить абстракцию до появления второй реализации.
      - Считать любой switch нарушением принципа.
      - Делать расширяемым всё подряд «на будущее».
    follow_ups:
      - Почему абстракция по одной реализации обычно неверна?
      - Где размещают точки расширения?

  - slug: java_queue_when_needed
    specializations: [backend_java]
    topic: system_design
    subtopic: queues
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Зачем нужна очередь сообщений и что она усложняет?"
    answer_short: >-
      Очередь разрывает синхронную связь: отправитель не ждёт получателя.
      Это даёт устойчивость к всплескам и к недоступности получателя, но взамен
      приносит асинхронность, повторную доставку и потерю строгого порядка.
    answer_detailed: |
      ### Junior
      Типичный пример: при оформлении заказа не нужно ждать отправки письма.
      Заказ сохраняется, событие уходит в очередь, письмо отправляется отдельно.
      Пользователь получает ответ быстрее, а падение почтового сервиса не роняет
      оформление.

      ### Middle
      Ждут понимания, что доставка «ровно один раз» на практике недостижима, и
      обработчик проектируют идемпотентным: повторная обработка того же
      сообщения не должна создавать второй заказ или второе списание.

      Здесь же — про обработку ошибок: сообщение, которое не удаётся обработать,
      уходит в отдельную очередь, иначе оно блокирует остальные или крутится
      бесконечно.

      И про то, что асинхронность видна пользователю: результат появляется не
      сразу, и интерфейс должен это отражать, а не притворяться синхронным.

      ### Senior
      Ждут разговора о согласованности. Запись в базу и отправка сообщения — две
      операции без общей транзакции: упало между ними — данные разошлись.
      Решение — исходящий журнал, из которого сообщения досылаются отдельным
      процессом.

      Сильный ответ включает, чего очередь не решает: она не ускоряет саму
      работу, а переносит её во времени. Если получатель стабильно медленнее
      отправителя, очередь просто растёт, и вместо отказа получается растущая
      задержка — иногда это хуже честного отказа.
    common_mistakes:
      - Считать доставку «ровно один раз» гарантированной.
      - Не предусматривать очередь для необработанных сообщений.
      - Ставить очередь там, где получатель стабильно медленнее отправителя.
    follow_ups:
      - Как согласовать запись в базу с отправкой сообщения?
      - Что произойдёт, если получатель стабильно не успевает?

  - slug: java_stateless_and_scaling
    specializations: [backend_java]
    topic: system_design
    subtopic: scaling
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что значит «сервис без состояния» и почему это условие масштабирования?"
    answer_short: >-
      Экземпляр не хранит между запросами ничего, что нужно следующему запросу.
      Тогда запросы можно раздавать любому экземпляру, а сами экземпляры
      добавлять и убирать. Состояние выносится в базу или общий кеш.
    answer_detailed: |
      ### Junior
      Что ломается при состоянии в памяти: сессия в поле сервиса, счётчик в
      статической переменной, файл, записанный на локальный диск. Запустили
      второй экземпляр — половина запросов не находит своих данных.

      Отсюда простое правило: между запросами в памяти экземпляра ничего не
      хранят.

      ### Middle
      Ждут разделения на вертикальное и горизонтальное масштабирование.
      Вертикальное — увеличить машину, просто и упирается в потолок.
      Горизонтальное — добавить экземпляры, требует отсутствия состояния и даёт
      заодно устойчивость: падение одного не роняет сервис.

      Здесь же о том, что общее состояние никуда не девается — оно
      перемещается в базу, и она становится узким местом. Значит нужны пул
      соединений, реплики на чтение и кеш.

      ### Senior
      Ждут понимания, что «без состояния» — свойство приложения, а не всей
      системы. Состояние есть всегда, вопрос — где оно и кто за него отвечает.

      Сильный ответ упоминает фоновые задачи и запланированные запуски: код,
      который в одном экземпляре работал правильно, в трёх начинает выполняться
      трижды. Нужна блокировка или выделенный исполнитель.

      И про порядок действий: прежде чем добавлять экземпляры, смотрят, где
      время действительно уходит. Три копии медленного запроса дают три
      медленных запроса.
    common_mistakes:
      - Хранить сессию или счётчик в памяти экземпляра.
      - Писать файлы на локальный диск экземпляра.
      - Запускать фоновые задачи на всех экземплярах без блокировки.
    follow_ups:
      - Что произойдёт с запланированной задачей при трёх экземплярах?
      - Куда переезжает узкое место после горизонтального масштабирования?

  - slug: java_logging_and_observability
    specializations: [backend_java]
    topic: system_design
    subtopic: observability
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что и как логировать, чтобы разбор инцидента занимал минуты, а не часы?"
    answer_short: >-
      Структурированные записи с идентификатором запроса, уровнями и контекстом
      операции. В журнал не пишут пароли, токены и персональные данные. Логи
      отвечают «что произошло с этим запросом», метрики — «как себя чувствует
      сервис в целом».
    answer_detailed: |
      ### Junior
      Базовое: уровни различают по адресату. `ERROR` — то, на что надо
      реагировать; `WARN` — подозрительно, но сервис работает; `INFO` —
      значимые события; `DEBUG` — подробности для разбора.

      Сообщение содержит идентификаторы: какой заказ, какой пользователь. Запись
      «ошибка сохранения» без номера заказа бесполезна.

      Чего в журнале быть не должно: паролей, токенов, номеров карт,
      персональных данных. Журналы хранятся дольше и доступны шире, чем база.

      ### Middle
      Ждут структурированных записей вместо склеенных строк: поля вместо текста,
      и по ним можно искать и группировать. Плюс сквозной идентификатор запроса,
      который проходит через все вызовы и позволяет собрать всю историю.

      Здесь же о трёх видах данных: логи — про конкретный случай, метрики — про
      агрегаты и графики, трассировки — про то, где ушло время в цепочке
      вызовов.

      И про стоимость: журнал на каждый шаг цикла — это деньги за хранение и
      потерянный сигнал среди шума.

      ### Senior
      Ждут разговора о том, что наблюдаемость проектируют, а не добавляют после
      первого инцидента. Начинают с вопроса «как мы узнаем, что пользователям
      плохо» — и от него идут к метрикам, а не наоборот.

      Сильный ответ включает оповещения по симптомам, а не по причинам:
      будить дежурного на рост доли ошибок и времени ответа, а не на каждый
      всплеск загрузки процессора.

      Уместно и про то, что запись в журнал — часть контракта эксплуатации:
      формат меняют осторожно, на нём построены поиски и панели.
    common_mistakes:
      - Писать в журнал токены и персональные данные.
      - Логировать текстом без структуры и идентификатора запроса.
      - Настраивать оповещения на причины вместо симптомов.
    follow_ups:
      - Чем метрики отличаются от логов по задаче?
      - Почему оповещения строят по симптомам?
  - slug: java_when_to_mock
    specializations: [backend_java]
    topic: testing
    subtopic: junit_mockito
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что стоит подменять заглушкой в тесте, а что нет?"
    answer_short: >-
      Подменяют то, что выходит за границу вашего кода и мешает тесту: сеть,
      внешние сервисы, время, случайность. Не подменяют собственную логику и
      простые объекты значений — тест начинает проверять реализацию, а не
      поведение.
    answer_detailed: |
      ### Junior
      Заглушка нужна там, где настоящая зависимость делает тест медленным или
      неустойчивым: поход в чужой сервис, отправка письма, чтение времени.

      ```java
      when(rates.forDate(any())).thenReturn(new Rate("USD", 90));
      ```

      Простые объекты не подменяют: собрать настоящий `Order` дешевле, чем
      описывать поведение его заглушки.

      ### Middle
      Ждут понимания, чем плох переподменённый тест. Если внутри проверяется
      порядок вызовов и их количество, тест ломается при любом изменении
      реализации, хотя поведение осталось прежним. Такие тесты не защищают, а
      мешают — их правят вместе с кодом, механически.

      Отсюда правило: проверять результат, а не то, какие методы вызвались.
      Проверка вызова уместна, когда сам вызов и есть результат — письмо
      отправлено, сообщение опубликовано.

      ### Senior
      Ждут разговора о границах. Заглушка ставится на границе системы, и
      правильная граница — интерфейс, который вы объявили под свои нужды, а не
      чужой класс из библиотеки.

      Сильный ответ включает компромисс: заглушка описывает ваше представление о
      том, как ведёт себя внешний сервис. Если представление неверно, тест
      зелёный, а в бою всё сломано. Поэтому вокруг важных интеграций держат
      небольшой набор тестов с настоящим окружением.

      Уместно и про Testcontainers: базу почти никогда не подменяют заглушкой —
      с ней тестируют по-настоящему, слишком много логики живёт в самом SQL.
    common_mistakes:
      - Проверять порядок и число вызовов вместо результата.
      - Подменять заглушкой собственную бизнес-логику.
      - Заменять базу заглушкой вместо настоящей в контейнере.
    follow_ups:
      - Когда проверка вызова уместна?
      - Почему тест на заглушках может быть зелёным при сломанной интеграции?

  - slug: java_integration_vs_unit
    specializations: [backend_java]
    topic: testing
    subtopic: testcontainers
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как вы распределяете тесты между юнит- и интеграционными?"
    answer_short: >-
      Основная масса — быстрые юнит-тесты бизнес-правил без контекста и базы.
      Поверх — интеграционные на стыки: репозитории с настоящей базой, контракт
      HTTP, конфигурация. Их меньше, они медленнее и проверяют то, что юнит не
      увидит.
    answer_detailed: |
      ### Junior
      Юнит-тест проверяет один класс с подставленными зависимостями и
      выполняется за миллисекунды. Интеграционный поднимает контекст или базу и
      проверяет, что части работают вместе.

      Практический признак: если тест требует поднятия Spring, он уже не юнит.

      ### Middle
      Ждут понимания, что именно нельзя проверить юнит-тестом: генерируемый ORM
      запрос, работу транзакций, миграции схемы, сериализацию JSON, настройки.
      Все известные случаи «на моей машине работает» живут именно здесь.

      Отсюда Testcontainers: база в контейнере той же версии, что и в бою,
      вместо встроенной в памяти. Встроенная база ведёт себя иначе, и часть
      ошибок она пропускает, а часть выдумывает.

      Пропорция диктуется скоростью: набор тестов, который выполняется десять
      минут, перестают запускать локально.

      ### Senior
      Ждут разговора о том, что распределение — следствие архитектуры. Если
      бизнес-правила перемешаны с обращениями к базе, юнит-тестировать нечего, и
      команда обречена на медленный набор.

      Сильный ответ включает вопрос доверия к набору: тест, который иногда
      падает без причины, хуже отсутствующего — на него перестают смотреть, и
      вместе с ним перестают смотреть на настоящие падения.

      Уместно и про конвейер: быстрые тесты на каждый коммит, медленные — на
      слияние, чтобы обратная связь приходила за минуты.
    common_mistakes:
      - Проверять всё через поднятие контекста и получать набор на десять минут.
      - Брать встроенную базу вместо настоящей в контейнере.
      - Терпеть нестабильные тесты, падающие через раз.
    follow_ups:
      - Что нельзя проверить юнит-тестом в приложении на Spring?
      - Почему нестабильный тест хуже отсутствующего?

  - slug: java_transaction_basics
    specializations: [backend_java]
    topic: db
    subtopic: transactions_isolation
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Что такое транзакция и где проходит её граница в приложении?"
    answer_short: >-
      Транзакция — набор операций, который либо выполняется целиком, либо не
      выполняется вовсе. Граница проходит по бизнес-операции: обычно это метод
      сервиса, а не отдельный запрос в репозитории.
    answer_detailed: |
      ### Junior
      Классический пример — перевод денег: списание и зачисление должны
      случиться вместе. В Spring транзакцию открывает `@Transactional` на методе
      сервиса, и при исключении она откатывается.

      Важная деталь: по умолчанию откат происходит на непроверяемых
      исключениях. Проверяемое исключение транзакцию не откатит, если это не
      указано явно, — и данные останутся наполовину записанными.

      ### Middle
      Ждут понимания, почему граница именно на сервисе. Репозиторий не знает,
      частью какой операции он является; знание об этом есть только там, где
      описана бизнес-операция.

      Здесь же — про длину транзакции. Обращение к внешнему сервису внутри
      открытой транзакции держит соединение с базой всё время ожидания: пул
      заканчивается, и сервис встаёт целиком.

      И про уровни изоляции: чем строже, тем меньше аномалий и больше
      блокировок. По умолчанию обычно read committed, и приложение должно
      понимать, какие аномалии на этом уровне возможны.

      ### Senior
      Ждут разговора о том, что транзакция базы не покрывает распределённую
      операцию. Запись в свою базу и вызов чужого сервиса откатить вместе
      нельзя, и это решается на уровне сценария — исходящим журналом,
      компенсацией, идемпотентным повтором.

      Сильный ответ упоминает практические ловушки Spring: вызов
      транзакционного метода изнутри того же класса идёт мимо прокси, и
      транзакции не будет вовсе. И что откат в приложении не откатывает то, что
      уже ушло наружу — отправленное письмо не вернуть.
    common_mistakes:
      - Держать транзакцию открытой во время обращения к внешнему сервису.
      - Рассчитывать на откат при проверяемом исключении.
      - Вызывать транзакционный метод изнутри того же класса.
    follow_ups:
      - Почему вызов внутри класса не открывает транзакцию?
      - Как согласовать запись в базу с вызовом внешнего сервиса?

  - slug: java_what_to_synchronize
    specializations: [backend_java]
    topic: concurrency
    subtopic: synchronization
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что именно нужно синхронизировать и почему synchronized на всём методе — грубое решение?"
    answer_short: >-
      Синхронизируют доступ к общему изменяемому состоянию — и запись, и
      чтение. `synchronized` на методе блокирует весь объект на всё время
      выполнения, включая части, которым блокировка не нужна.
    answer_detailed: |
      ### Junior
      Первое, что проверяют: понимает ли человек, что защищать нужно и чтение
      тоже. Синхронизированная запись при несинхронизированном чтении не
      спасает — читатель может увидеть устаревшее или частично изменённое
      состояние.

      Второе: блокировка работает, только если все обращаются к одному и тому же
      объекту-монитору.

      ### Middle
      Ждут понимания цены. `synchronized` на методе держит монитор всё время
      выполнения, в том числе на обращениях к сети и базе. Блок вокруг
      минимального участка сокращает время удержания и заметно повышает
      пропускную способность.

      Здесь же — про альтернативы: атомарные типы для счётчиков, потокобезопасные
      коллекции вместо ручной синхронизации, неизменяемые объекты, которым
      синхронизация не нужна вовсе.

      И про взаимную блокировку: два потока берут два замка в разном порядке и
      встают навсегда. Лечится единым порядком захвата.

      ### Senior
      Ждут смены точки зрения: вопрос не «как синхронизировать», а «как обойтись
      без общего изменяемого состояния». Неизменяемые данные, передача владения
      через очередь, состояние в базе с оптимистичной блокировкой.

      Сильный ответ включает, что видимость и атомарность — разные вещи:
      `volatile` решает первую и не решает вторую. И что в веб-приложении
      разделяемое состояние чаще всего появляется случайно — полем в бине,
      живущем в единственном экземпляре.
    common_mistakes:
      - Синхронизировать запись и не синхронизировать чтение.
      - Держать монитор во время обращения к сети или базе.
      - Считать, что volatile обеспечивает атомарность.
    follow_ups:
      - Чем видимость отличается от атомарности?
      - Как возникает взаимная блокировка и как её избежать?

  - slug: java_soft_code_review_conflict
    specializations: [backend_java]
    topic: soft
    subtopic: conflict
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "На ревью коллега настаивает на решении, которое вы считаете неверным. Ваши действия?"
    answer_short: >-
      Разделить факты и предпочтения. Если разница во вкусе — согласиться и не
      тратить время команды. Если есть измеримое последствие — привести его и
      предложить проверку. Если договориться не выходит, эскалировать быстро, а
      не спорить третий круг.
    answer_detailed: |
      ### Junior
      Главное — не превращать обсуждение кода в обсуждение людей. Вопрос «почему
      здесь так?» работает лучше утверждения «так неправильно»: половина споров
      заканчивается на объяснении контекста, которого вы не знали.

      Про своё решение стоит уметь сказать, чем оно лучше в конкретных
      величинах — числом запросов, временем ответа, простотой изменения.

      ### Middle
      Ждут умения отделять существенное от вкусового. Формат, имена и порядок
      методов — не повод для спора, для этого есть форматтер и линтер.
      Существенно то, что дорого менять потом: контракт API, схема данных,
      границы модулей.

      Полезный приём — записать вариант коллеги и свой рядом с последствиями и
      попросить третьего взглянуть. Спор о вкусах при этом обычно исчезает сам.

      ### Senior
      Ждут ответственности за исход, а не за свою правоту. Иногда правильное
      решение — принять худший вариант, потому что цена спора выше разницы
      между вариантами.

      Сильный ответ включает системный взгляд: регулярные споры об одном и том
      же означают, что нет договорённости. Её и стоит зафиксировать — коротким
      соглашением команды, а не повторным обсуждением в каждом ревью.

      Уместно и про то, что ревью — не экзамен: тон замечаний определяет,
      будут ли люди присылать изменения маленькими кусками или копить их до
      огромных.
    common_mistakes:
      - Спорить о форматировании вместо настройки инструментов.
      - Переходить с обсуждения кода на обсуждение автора.
      - Тянуть спор кругами вместо привлечения третьего.
    follow_ups:
      - Что стоит зафиксировать соглашением команды?
      - Как тон замечаний влияет на размер присылаемых изменений?

  - slug: java_soft_missed_estimate
    specializations: [backend_java]
    topic: soft
    subtopic: failure_story
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Расскажите про случай, когда вы сильно ошиблись в оценке срока."
    answer_short: >-
      Ждут не оправданий, а разбора: что именно оказалось непредвиденным, когда
      это стало заметно, как быстро вы об этом сказали и что изменили в
      следующий раз. Ответ «я никогда не ошибаюсь в оценках» слышится как
      отсутствие опыта.
    answer_detailed: |
      ### Junior
      Достаточно честного примера с выводом. Типичная причина — оценивали только
      написание кода, забыв про ревью, тесты, выкладку и переключения на другие
      задачи.

      Важнее самой ошибки то, когда вы сообщили. Сказать на второй день, что
      срок под угрозой, — рабочая ситуация. Сообщить в день сдачи — проблема
      для всех, кто на вас рассчитывал.

      ### Middle
      Ждут понимания природы оценки: это прогноз при неполных знаниях, а не
      обещание. Отсюда практики — разбивать крупную задачу до кусков в один-два
      дня, отдельно называть неизвестное, пересматривать прогноз при появлении
      новых фактов.

      Хороший ответ показывает, что вы отделяете «недооценил объём» от
      «наткнулся на неизвестное»: это разные проблемы с разными решениями.

      ### Senior
      Ждут разговора о том, что делать с системой, а не только с собой.
      Регулярный промах на задачах определённого типа — это сигнал: не хватает
      документации, слишком связанный код, слишком много скрытой работы вокруг
      каждой задачи.

      Сильный ответ включает управление ожиданиями: что вы сделали, чтобы
      команда узнала о риске вовремя, какие варианты предложили — сократить
      объём, отложить часть, привлечь помощь.

      И признание, что иногда правильный ответ — «мы не знаем срок, пока не
      исследуем»: короткое исследование с оговорённым временем честнее, чем
      названная наугад цифра.
    common_mistakes:
      - Утверждать, что никогда не ошибались в оценках.
      - Сообщать о срыве срока в день сдачи.
      - Оценивать только написание кода без ревью, тестов и выкладки.
    follow_ups:
      - Как вы поступаете, когда объём задачи неизвестен?
      - Что делать, если промахи повторяются на одном типе задач?

  - slug: java_lead_platform_migration
    specializations: [backend_java]
    topic: architecture
    subtopic: microservices
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как вы проводили крупную миграцию — версии Java, фреймворка или выделение сервиса из монолита?"
    answer_short: >-
      Ждут плана, а не результата: как разбили на шаги с работающей системой на
      каждом, как измеряли прогресс, как обеспечили откат и как договорились с
      бизнесом о времени, которое уходит не на новые возможности.
    answer_detailed: |
      Что отличает сильный ответ на этом уровне.

      **Обоснование в величинах, а не в предпочтениях.** «Версия снята с
      поддержки, уязвимости не закрываются», «время сборки выросло до сорока
      минут и съедает день команды в неделю» — это разговор с бизнесом.
      «Хочется на свежую версию» — не разговор.

      **Шаги с работающей системой на каждом.** Миграция, которая полгода живёт
      в отдельной ветке, не доезжает: она конфликтует со всем, что пишут
      остальные. Работает обратное — совместимость на время перехода, флаги,
      постепенный перевод по кускам.

      **Измеримый прогресс.** Доля переведённых модулей, число оставшихся
      вызовов старого API — что-то, что видно на панели и не зависит от
      ощущений.

      **Откат.** Для выделения сервиса — возможность вернуть трафик обратно
      переключателем, а не выкладкой. Для версии платформы — параллельная сборка
      на старой и новой, пока новая не станет основной.

      **Честность про цену.** Такая работа не даёт новых возможностей
      пользователям, и притворяться, что даёт, вредно. Обычно её ведут долей от
      мощности команды, а не отдельным «проектом миграции», который первым
      попадает под сокращение.

      Отдельно про выделение сервиса из монолита: сначала выделяют границу
      внутри кода и убеждаются, что она держится, и только потом делят по сети.
      Обратный порядок превращает распределённую систему в распределённый ком
      грязи, где к прежней связанности добавились сетевые отказы.
    common_mistakes:
      - Вести миграцию в долгоживущей ветке.
      - Обосновывать миграцию вкусом, а не издержками.
      - Делить по сети раньше, чем граница проверена внутри кода.
    follow_ups:
      - Как вы обеспечивали возможность отката?
      - Как измеряли прогресс миграции?

  - slug: java_lead_reliability_targets
    specializations: [backend_java]
    topic: system_design
    subtopic: observability
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как вы задаёте цели по надёжности сервиса и что делаете, когда они не выполняются?"
    answer_short: >-
      Через измеримые показатели того, что чувствует пользователь: доля
      успешных запросов и время ответа по верхним процентилям. Цель — не сто
      процентов, а согласованный уровень, из которого следует запас на риск и
      правила остановки изменений при его исчерпании.
    answer_detailed: |
      Что должно прозвучать.

      **Показатели со стороны пользователя.** Загрузка процессора и объём
      памяти — не показатели надёжности. Считают долю успешных ответов и время
      ответа в верхних процентилях: среднее скрывает именно тех, кому плохо.

      **Цель, а не идеал.** Обещание «сто процентов» бессмысленно: оно
      недостижимо и не даёт принимать решения. Согласованный уровень даёт запас
      на риск — допустимое время недоступности за период, — и этот запас
      становится общим языком с бизнесом.

      **Что следует из исчерпания запаса.** Договорённость заранее: приостановить
      выкладку новых возможностей и направить силы в надёжность. Без этого
      правила показатели превращаются в украшение панели.

      **Оповещения по симптомам.** Будят на рост доли ошибок и времени ответа, а
      не на каждый всплеск нагрузки. Оповещение, на которое дежурный не
      предпринимает действий, отключают — иначе оно приучает игнорировать все
      остальные.

      **Разбор без поиска виноватого.** Инцидент разбирают как отказ системы: у
      человека, нажавшего кнопку, была та информация, которую ему дала система.
      Меняют систему, а не людей. Разбор с наказанием даёт ровно один результат
      — про инциденты перестают сообщать.

      И про честность цифр: показатель, который считает сам сервис, не увидит
      собственную недоступность. Поэтому измеряют снаружи.
    common_mistakes:
      - Считать надёжность по загрузке процессора, а не по опыту пользователя.
      - Обещать сто процентов и лишать себя основы для решений.
      - Разбирать инциденты с поиском виноватого.
    follow_ups:
      - Почему среднее время ответа плохо описывает надёжность?
      - Что делают, когда запас на риск исчерпан?

  - slug: java_lead_growing_engineers
    specializations: [backend_java]
    topic: soft
    subtopic: teamwork
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как вы развиваете инженеров в команде и как понимаете, что это работает?"
    answer_short: >-
      Через задачи чуть выше текущего уровня с поддержкой, а не через советы.
      Признак работы — человек начинает принимать решения, которые раньше
      приносил вам, и его код перестаёт требовать вашего ревью для уверенности.
    answer_detailed: |
      Что ждут услышать.

      **Рост через работу, а не через разговоры.** Развитие даёт задача, где
      человеку не хватает нынешних навыков, но провал не фатален. Задачи по
      силам не развивают, задачи не по силам ломают уверенность.

      **Передача решений, а не инструкций.** «Сделай так» экономит день и не
      даёт ничего. «Какие видишь варианты и чем они отличаются?» стоит дороже
      сейчас и снимает вас с критического пути потом.

      **Обратная связь конкретная и своевременная.** Про поведение и следствие, а
      не про свойства человека: «ревью на пятьсот строк идёт три дня, потому что
      его тяжело читать», а не «ты невнимателен».

      **Измеримость.** Признаки, что работает: человек берёт задачи, о которых
      раньше спрашивал; его правки перестают возвращаться на второй круг; он сам
      начинает объяснять другим. Признак, что не работает, — вы по-прежнему
      единственный, кто может сделать определённый класс задач.

      **Устойчивость команды.** Отдельный показатель — сколько людей могут
      подхватить каждую область. Если критичный кусок держит один человек, это
      риск для продукта и потолок для него самого.

      Про ревью честно: оно инструмент обучения, но только когда замечания
      объясняют причину. Замечание без объяснения учит угадывать вкус
      проверяющего, а не принимать решения.
    common_mistakes:
      - Давать инструкции вместо разбора вариантов.
      - Формулировать обратную связь как оценку личных качеств.
      - Оставлять критичную область на одном человеке.
    follow_ups:
      - Как вы поймёте, что человек готов к следующему уровню задач?
      - Что делать, если критичную область держит один человек?
