# Банк вопросов для data_ml (ML-инженер).
#
# Это данные, а не код. Все вопросы загружаются сидом с is_verified=false:
# проверенным вопрос становится только после ревью человеком (CLAUDE.md §8.1).
#
# Акцент банка — инженерный, а не исследовательский: на собеседовании
# ML-инженера проверяют способность довести модель до продакшена и удержать её
# там, а не знание архитектур из свежих статей.

version: 1

questions:
  # --- Основы -----------------------------------------------------------------

  - slug: ml_bias_variance
    specializations: [data_ml]
    topic: ml_basics
    subtopic: bias_variance
    min_grade: junior
    peak_grade: junior_plus
    max_grade: middle
    frequency: 5
    type: open_answer
    title: "Модель показывает 0.99 на обучении и 0.62 на отложенной выборке. Что происходит и что делать?"
    answer_short: >-
      Переобучение: модель запомнила обучающую выборку вместо закономерности.
      Лечится упрощением модели, регуляризацией, увеличением данных и ранней
      остановкой. Сначала стоит убедиться, что разрыв не вызван утечкой или
      неправильным разбиением.
    answer_detailed: |
      ### Junior
      Большой разрыв между обучением и проверкой — переобучение. Обратная
      картина, когда обе метрики низкие, — недообучение: модель слишком проста
      или признаков не хватает.

      Что пробовать при переобучении: уменьшить сложность, добавить
      регуляризацию, собрать больше данных, остановить обучение раньше.

      ### Middle
      Прежде чем лечить, проверяют разбиение. Частая причина такого разрыва —
      не переобучение, а неверная схема проверки: случайное разбиение временного
      ряда, объекты одного пользователя в обеих частях, признак, вычисленный по
      всей выборке до разбиения.

      Диагностика — кривые обучения: если качество на проверке растёт с
      объёмом данных, помогут данные; если вышло на плато, помогут признаки или
      другая модель.

      ### Senior
      Ждут понимания, что классический компромисс между смещением и разбросом —
      полезная модель мышления, но не универсальный закон: сильно
      переобучающиеся модели с огромным числом параметров при достаточных
      данных ведут себя иначе, чем предсказывает классическая картина.

      Практически важнее другое: с чем сравнивать. Разрыв в метриках сам по
      себе ничего не говорит, пока нет базовой линии и понимания, какое качество
      достаточно для задачи. 0.62 может быть отличным результатом.
    common_mistakes:
      - Лечить переобучение, не проверив схему разбиения.
      - Оценивать модель без базовой линии.
      - Считать любой разрыв метрик переобучением.
    follow_ups:
      - Как отличить переобучение от утечки данных?
      - Что показывают кривые обучения?

  - slug: ml_regularization
    specializations: [data_ml]
    topic: ml_basics
    subtopic: regularization
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: single_choice
    title: "Чем L1-регуляризация отличается от L2 по последствиям для модели?"
    options:
      - code: a
        text: "Разницы нет, обе просто уменьшают веса"
      - code: b
        text: "L1 обнуляет часть весов и отбирает признаки, L2 равномерно уменьшает все веса, не обнуляя"
        is_correct: true
      - code: c
        text: "L1 применяется только к нейросетям, L2 — только к линейным моделям"
      - code: d
        text: "L2 обнуляет веса, L1 их только сжимает"
    answer_short: >-
      L1 добавляет штраф по модулю весов, и оптимум часто оказывается ровно в
      нуле — получается отбор признаков. L2 штрафует квадрат, уменьшая веса
      плавно и оставляя их ненулевыми.
    answer_detailed: |
      ### Junior
      Практическое следствие: с L1 получается разреженная модель, где часть
      признаков выключена. Это удобно, когда признаков тысячи и нужно понять,
      какие работают.

      L2 обычно даёт более устойчивое качество, особенно когда признаки
      коррелируют между собой.

      ### Middle
      При сильной корреляции признаков L1 выбирает из группы один, почти
      произвольный, — при небольшом изменении данных выбор меняется. Это делает
      её ненадёжным инструментом интерпретации.

      Комбинация обоих штрафов снимает проблему: сохраняет разреженность, но
      выбирает группы коррелирующих признаков целиком.

      ### Senior
      Ждут понимания, что регуляризация — не единственный и не всегда лучший
      ответ на переобучение: больше данных, меньше признаков, проще модель
      часто работают лучше и обходятся без подбора коэффициента.

      Полезно отметить, что признаки перед регуляризацией нужно приводить к
      сопоставимому масштабу: иначе штраф бьёт по признакам с большими
      значениями сильнее, и результат зависит от единиц измерения.
    common_mistakes:
      - Применять регуляризацию к признакам разного масштаба без нормализации.
      - Интерпретировать отбор признаков L1 как надёжный при коррелирующих признаках.
      - Считать регуляризацию единственным средством от переобучения.
    follow_ups:
      - Почему признаки нужно масштабировать перед регуляризацией?
      - Что происходит с L1 при коррелирующих признаках?

  - slug: ml_trees_vs_linear
    specializations: [data_ml]
    topic: ml_basics
    subtopic: trees_ensembles
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Задача классификации на табличных данных. Почему в первую очередь берут градиентный бустинг, а не нейросеть?"
    answer_short: >-
      На табличных данных бустинг обычно даёт качество не хуже нейросети при
      меньших затратах: не нужна нормализация, он сам справляется с
      категориальными признаками и нелинейностями, обучается быстрее и требует
      меньше настройки.
    answer_detailed: |
      ### Junior
      Бустинг строит деревья последовательно, каждое исправляет ошибки
      предыдущих. Деревья нечувствительны к монотонным преобразованиям
      признаков, поэтому нормализация не нужна.

      ### Middle
      Практические причины предпочтения:

      - меньше подготовки данных: масштаб, пропуски и категории обрабатываются
        внутри;
      - меньше настроек, и качество слабо чувствительно к их точному подбору;
      - быстрое обучение на процессоре, без ускорителей;
      - понятная важность признаков как отправная точка для анализа.

      Нейросети выигрывают там, где данные не табличные: текст, изображения,
      звук, последовательности.

      ### Senior
      Ждут трезвости: бустинг плохо экстраполирует за пределы диапазона
      обучающих данных — предсказание остаётся константой. Для задач, где
      важна экстраполяция, это дисквалифицирует его.

      Второе — важность признаков в деревьях смещена в сторону признаков с
      большим числом уникальных значений и не показывает направление влияния.
      Для объяснения решений берут отдельные методы, а не встроенную важность.
    common_mistakes:
      - Начинать с нейросети на табличных данных.
      - Использовать встроенную важность признаков как объяснение решений.
      - Не учитывать неспособность деревьев экстраполировать.
    follow_ups:
      - Почему бустинг не экстраполирует?
      - Чем встроенная важность признаков плоха как объяснение?

  - slug: ml_linear_interpretation
    specializations: [data_ml]
    topic: ml_basics
    subtopic: linear_models
    min_grade: junior
    peak_grade: junior_plus
    max_grade: middle
    frequency: 3
    type: open_answer
    title: "Логистическая регрессия предсказывает вероятность. Что на самом деле означает её выход?"
    answer_short: >-
      Число от нуля до единицы, которое можно трактовать как вероятность
      только если модель откалибрована. Обучение оптимизирует разделение
      классов, а не точность вероятностей, — их совпадение нужно проверять
      отдельно.
    answer_detailed: |
      ### Junior
      Выход — результат применения логистической функции к линейной комбинации
      признаков. Порог 0.5 — соглашение, а не свойство модели: его выбирают
      исходя из цены ошибок.

      ### Middle
      Калибровка означает, что среди объектов с предсказанием 0.7 примерно
      70 процентов действительно относятся к положительному классу. Проверяется
      графиком: предсказанная вероятность против фактической доли.

      Логистическая регрессия обычно откалибрована неплохо, а вот бустинг и
      случайный лес — нет: они склонны прижимать предсказания к краям или к
      центру. Если вероятность используется в расчётах — например, для
      ожидаемой прибыли, — калибровка обязательна.

      ### Senior
      Ждут понимания последствий переноса модели в другое распределение:
      при обучении на выборке с искусственно выровненными классами
      предсказанные вероятности систематически завышены и требуют поправки.

      Полезно отметить, что порог — тоже параметр, который подбирают на
      отдельной выборке, а не на той, где мерили качество: иначе оценка
      оптимистична.
    common_mistakes:
      - Использовать выход модели как вероятность без проверки калибровки.
      - Оставлять порог 0.5 по умолчанию.
      - Подбирать порог на той же выборке, где измеряют качество.
    follow_ups:
      - Как проверить калибровку модели?
      - Что происходит с вероятностями при выравнивании классов?

  - slug: ml_clustering
    specializations: [data_ml]
    topic: ml_basics
    subtopic: unsupervised
    min_grade: middle
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Просят сегментировать клиентов. Как подойти и как понять, что сегменты получились осмысленными?"
    answer_short: >-
      Начать с вопроса, зачем нужны сегменты: от этого зависят признаки и
      число групп. Проверять не только внутренние метрики кластеризации, но и
      интерпретируемость и полезность — различаются ли сегменты по поведению,
      которое важно бизнесу.
    answer_detailed: |
      ### Junior
      Классический подход — метод k средних по нормализованным признакам.
      Число кластеров подбирают по внутренним метрикам качества разбиения.

      Нормализация обязательна: без неё признак с большими значениями
      определяет разбиение целиком.

      ### Middle
      Внутренние метрики говорят только о геометрии: насколько плотны группы.
      Они не отвечают на вопрос, полезны ли сегменты.

      Что проверяют дополнительно:

      - интерпретируемость: можно ли описать сегмент одной фразой;
      - устойчивость: сохраняется ли разбиение на другой выборке и в другом
        периоде;
      - различие по целевым показателям, которых не было среди признаков.

      ### Senior
      Ждут сомнения в постановке задачи. Часто «сегментация» на деле означает
      конкретное решение — кому какое предложение показать, — и тогда прямая
      задача предсказания решает её лучше и измеримее, чем кластеризация.

      Полезно отметить организационную сторону: сегменты используются людьми, и
      разбиение на пятнадцать групп, которое никто не может удержать в голове,
      не будет применяться. Четыре-пять понятных сегментов дают больше эффекта.
    common_mistakes:
      - Кластеризовать без нормализации признаков.
      - Оценивать сегменты только внутренними метриками.
      - Решать кластеризацией задачу, которая на деле является предсказанием.
    follow_ups:
      - Когда сегментация уместнее прямого предсказания?
      - Как проверить устойчивость разбиения?

  # --- Валидация --------------------------------------------------------------

  - slug: ml_data_leakage
    specializations: [data_ml]
    topic: validation
    subtopic: data_leakage
    min_grade: middle
    peak_grade: middle_plus
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Модель показывает 0.97 на проверке, а в продакшене 0.6. Какую причину проверять первой?"
    answer_short: >-
      Утечку данных: в признаки попала информация, недоступная на момент
      предсказания. Самые частые источники — признак, косвенно содержащий
      целевую переменную, и вычисление статистик по всей выборке до разбиения.
    answer_detailed: |
      ### Junior
      Утечка — использование при обучении того, чего не будет в момент
      применения. Например, признак «сумма возврата» при предсказании
      возврата: он заполняется после события.

      Признак неправдоподобно высокого качества — сам по себе повод искать
      утечку, а не радоваться.

      ### Middle
      Типичные источники:

      - **временна́я**: случайное разбиение вместо разбиения по времени —
        модель учится на будущем и предсказывает прошлое;
      - **на уровне группы**: записи одного пользователя в обеих частях
        выборки — модель запоминает пользователя;
      - **при подготовке**: нормализация, заполнение пропусков, отбор
        признаков, выполненные до разбиения;
      - **признак-следствие**: поле, заполняемое только после наступления
        целевого события.

      Отсюда правило: вся подготовка встраивается в конвейер и обучается только
      на обучающей части.

      ### Senior
      Ждут понимания, что утечка не всегда очевидна: идентификатор записи может
      коррелировать с целью, если данные упорядочены по времени; агрегат по
      клиенту, посчитанный по всей истории, содержит будущее.

      Практическая защита — проверять схему валидации на воспроизведение
      боевых условий: какие данные реально доступны в момент предсказания и с
      какой задержкой они появляются. Задержка часто и оказывается тем, что
      забыли учесть.
    common_mistakes:
      - Готовить данные до разбиения на выборки.
      - Разбивать временные данные случайно.
      - Радоваться неправдоподобно высокому качеству вместо проверки.
    follow_ups:
      - Как правильно разбивать временные данные?
      - Почему подготовку встраивают в конвейер?

  - slug: ml_metrics_choice
    specializations: [data_ml]
    topic: validation
    subtopic: metrics_choice
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Задача — поиск мошеннических транзакций, их 0.2 процента. Какую метрику брать и почему не долю верных ответов?"
    answer_short: >-
      Доля верных ответов бессмысленна: модель, всегда предсказывающая
      «не мошенничество», даст 99.8 процента. Смотрят на точность и полноту в
      нужном рабочем режиме, а выбор между ними определяется ценой ошибок.
    answer_detailed: |
      ### Junior
      При сильном перекосе классов доля верных ответов измеряет только размер
      большего класса.

      Точность отвечает на вопрос «сколько из помеченных действительно
      мошеннические», полнота — «сколько из мошеннических мы нашли».

      ### Middle
      Выбор определяется ценой ошибок. Пропущенное мошенничество стоит суммы
      транзакции; ложная блокировка стоит недовольного клиента и работы службы
      поддержки. Их сравнивают в деньгах, а не в абстрактных единицах.

      Дополнительно: у службы разбора ограниченная пропускная способность.
      Если она проверяет сто транзакций в день, метрикой становится точность
      среди ста наиболее подозрительных, а не качество на всём потоке.

      ### Senior
      Ждут разговора о связи метрики с решением. Модель не «находит
      мошенничество», а меняет действие: блокировка, дополнительная проверка,
      запрос подтверждения. У каждого действия своя цена и свой порог.

      Полезно отметить обратную связь: заблокированные транзакции не дают
      узнать, были ли они мошенническими на самом деле. Обучающая выборка
      постепенно искажается решениями самой модели, и без доли случайно
      пропущенных случаев качество оценки деградирует.
    common_mistakes:
      - Использовать долю верных ответов при перекосе классов.
      - Сравнивать цену ошибок в абстрактных единицах вместо денег.
      - Не учитывать искажение выборки решениями самой модели.
    follow_ups:
      - Как ограниченная пропускная способность меняет метрику?
      - Почему решения модели искажают обучающую выборку?

  - slug: ml_cross_validation_time
    specializations: [data_ml]
    topic: validation
    subtopic: cross_validation
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: single_choice
    title: "Данные — история заказов за два года. Как разбивать выборку для проверки?"
    options:
      - code: a
        text: "Случайно на 80 и 20 процентов"
      - code: b
        text: "По времени: обучение на раннем периоде, проверка на позднем, с несколькими последовательными сдвигами окна"
        is_correct: true
      - code: c
        text: "Случайной кросс-валидацией на пять частей"
      - code: d
        text: "Разбиением по клиентам пополам"
    answer_short: >-
      По времени: в продакшене модель предсказывает будущее по прошлому, и
      проверка должна воспроизводить это. Случайное разбиение даёт модели
      будущее в обучении и завышает оценку.
    answer_detailed: |
      ### Junior
      Случайное разбиение временных данных — самая частая ошибка. Оценка
      получается оптимистичной, и расхождение обнаруживается уже в продакшене.

      ### Middle
      Схема с расширяющимся окном: обучаемся на первых трёх месяцах, проверяем
      на четвёртом; затем на первых четырёх, проверяем на пятом, и так далее.
      Несколько сдвигов вместо одного показывают устойчивость качества во
      времени, а не результат одного удачного периода.

      Между обучением и проверкой иногда оставляют зазор — если признаки
      считаются с задержкой, без зазора часть будущего просачивается.

      ### Senior
      Ждут внимания к сезонности: проверка на одном месяце может попасть на
      нетипичный период — праздники, распродажу, сбой. Разброс качества по
      сдвигам важнее среднего.

      Полезно отметить, что окончательная модель обучается на всех данных,
      включая проверочные, — проверка нужна для выбора конфигурации, а
      выбрасывать свежие данные при финальном обучении нерационально.
    common_mistakes:
      - Разбивать временные данные случайно.
      - Проверять на одном периоде вместо нескольких сдвигов.
      - Не учитывать задержку появления признаков.
    follow_ups:
      - Зачем зазор между обучением и проверкой?
      - Почему разброс качества по сдвигам важнее среднего?

  - slug: ml_imbalance
    specializations: [data_ml]
    topic: validation
    subtopic: imbalance
    min_grade: middle
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Положительных примеров 1 процент. Нужно ли выравнивать классы и как?"
    answer_short: >-
      Обычно не нужно: современные модели работают с перекосом, если метрика
      выбрана правильно. Выравнивание помогает при крайнем перекосе, но
      искажает предсказанные вероятности и требует поправки перед
      использованием.
    answer_detailed: |
      ### Junior
      Способы: убрать часть большего класса, размножить меньший, задать вес
      классам в функции потерь. Последнее обычно предпочтительнее — данные не
      теряются и не дублируются.

      ### Middle
      Что важно: выравнивание применяется только к обучающей части. Проверочная
      выборка должна сохранять реальное соотношение, иначе оценка не имеет
      отношения к продакшену.

      Синтетическое размножение меньшего класса на табличных данных работает
      непредсказуемо: интерполяция между редкими примерами создаёт объекты,
      которых в реальности не бывает. При этом оценка на выборке с
      синтетическими примерами становится бессмысленной.

      ### Senior
      Ждут понимания, что проблема обычно не в перекосе как таковом, а в
      нехватке положительных примеров в абсолютном выражении. Сто примеров
      мошенничества — мало независимо от того, миллион или десять тысяч
      отрицательных.

      Отсюда более продуктивные направления: собрать больше положительных
      случаев, использовать смежные задачи для предобучения, добавить
      признаки, разделяющие редкий класс. Выравнивание — самый простой, но
      далеко не самый действенный ход.
    common_mistakes:
      - Выравнивать классы в проверочной выборке.
      - Применять синтетическое размножение без проверки правдоподобия примеров.
      - Использовать вероятности после выравнивания без поправки.
    follow_ups:
      - Почему проверочную выборку нельзя выравнивать?
      - Что делать, если положительных примеров мало в абсолютном выражении?

  - slug: ml_offline_online_gap
    specializations: [data_ml]
    topic: validation
    subtopic: offline_online
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Офлайн-метрика выросла на 5 процентов, а в A/B-тесте эффекта нет. Почему так бывает?"
    answer_short: >-
      Офлайн-метрика измеряет предсказание, а бизнес-метрика — результат
      действия. Между ними стоят пороги, бизнес-правила, интерфейс и поведение
      пользователей. Рост качества предсказания не обязан превращаться в рост
      результата.
    answer_detailed: |
      ### Junior
      Модель — часть системы. Даже точные предсказания не помогут, если
      действие на их основе не меняется или пользователь его не замечает.

      ### Middle
      Типичные причины расхождения:

      - улучшение пришлось на область, где решение и так не менялось;
      - выигрыш меньше, чем разброс бизнес-метрики, — тест недостаточно мощный;
      - офлайн-оценка сделана на данных, собранных старой моделью, и не
        учитывает изменение поведения;
      - метрика улучшилась в среднем, но ухудшилась в важном сегменте.

      ### Senior
      Ждут понимания смещения из-за собственных решений системы: рекомендации
      обучаются на кликах, которые сами и породили. Офлайн-оценка на таких
      данных систематически предпочитает модели, похожие на текущую, — новая
      модель показывает худший результат просто потому, что предлагает другое.

      Практический вывод: A/B-тест остаётся единственным надёжным
      подтверждением, а офлайн-метрика служит фильтром для отсева заведомо
      плохих вариантов. Полезно также резервировать долю случайного трафика —
      он даёт несмещённые данные для будущих оценок.
    common_mistakes:
      - Считать рост офлайн-метрики достаточным основанием для выката.
      - Не проверять метрику по сегментам.
      - Не резервировать случайный трафик для несмещённых данных.
    follow_ups:
      - Почему офлайн-оценка предпочитает модели, похожие на текущую?
      - Зачем нужен случайный трафик?

  # --- Признаки ---------------------------------------------------------------

  - slug: ml_feature_engineering
    specializations: [data_ml]
    topic: features
    subtopic: feature_engineering
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Качество модели не растёт при подборе настроек. Куда двигаться дальше?"
    answer_short: >-
      К данным и признакам: они дают больший прирост, чем настройка модели.
      Новые источники, агрегаты по истории, признаки из предметной области
      обычно двигают качество заметнее, чем перебор конфигураций.
    answer_detailed: |
      ### Junior
      Порядок отдачи обычно такой: больше и чище данные, затем признаки, затем
      выбор модели, и только потом подбор настроек.

      Перебор конфигураций — последнее, что стоит делать, и обычно даёт
      проценты, а не разы.

      ### Middle
      Что искать в признаках:

      - агрегаты по времени: активность за неделю, за месяц, динамика;
      - относительные величины вместо абсолютных: доля, отклонение от
        собственного среднего;
      - взаимодействия, известные из предметной области;
      - внешние источники, которые ещё не подключены.

      Разговор с человеком, который принимает решения вручную, часто даёт
      больше идей, чем перебор автоматических преобразований: он опирается на
      признаки, которых в данных пока нет.

      ### Senior
      Ждут внимания к цене признака в продакшене. Признак, требующий агрегата
      по всей истории клиента, может быть недоступен в момент предсказания или
      стоить недопустимой задержки.

      Полезно упомянуть проверку на утечку для каждого нового признака и
      контроль его стабильности во времени: признак, распределение которого
      уезжает, ломает модель тише, чем отсутствующий.
    common_mistakes:
      - Начинать улучшение с подбора настроек модели.
      - Добавлять признаки, недоступные в момент предсказания.
      - Не проверять стабильность распределения признака во времени.
    follow_ups:
      - Как оценить цену признака в продакшене?
      - Почему разговор с экспертом даёт идеи для признаков?

  - slug: ml_categorical_encoding
    specializations: [data_ml]
    topic: features
    subtopic: categorical
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Категориальный признак с десятью тысячами значений. Как его закодировать?"
    answer_short: >-
      Прямое кодирование по значению даст десять тысяч столбцов и не сработает.
      Варианты: кодирование средним по целевой переменной с защитой от утечки,
      группировка редких значений, встраивания, либо модель, работающая с
      категориями напрямую.
    answer_detailed: |
      ### Junior
      Прямое кодирование годится для десятка значений. При тысячах оно даёт
      разреженную матрицу, в которой большинство столбцов встречается по паре
      раз.

      Кодирование порядковым номером для номинальных признаков вводит
      несуществующий порядок и подходит только деревьям, да и им не всегда.

      ### Middle
      Кодирование средним по целевой переменной — мощный, но опасный приём:
      если считать среднее по всей обучающей выборке, значение признака для
      объекта включает его собственную цель, и это прямая утечка.

      Защита — считать среднее по остальным объектам: по частям кросс-валидации
      или по предшествующим записям во времени. Для редких значений среднее
      сглаживают в сторону общего.

      Отдельно: значения, отсутствовавшие в обучении, обязательно появятся в
      продакшене. Обработка неизвестной категории должна быть предусмотрена
      явно.

      ### Senior
      Ждут понимания, что часть высококардинальных признаков лучше заменить
      агрегатами: вместо идентификатора товара — его цена, категория, средний
      рейтинг, число продаж. Это одновременно решает проблему новых значений.

      Встраивания уместны там, где категорий много и есть достаточно данных
      для их обучения, — обычно в нейросетевых моделях. На табличных задачах
      среднего размера они редко окупаются.
    common_mistakes:
      - Считать кодирование средним по всей обучающей выборке.
      - Не предусматривать обработку новых категорий.
      - Кодировать номинальные признаки порядковым номером.
    follow_ups:
      - Как защититься от утечки при кодировании средним?
      - Чем заменить идентификатор товара как признак?

  - slug: ml_missing_values
    specializations: [data_ml]
    topic: features
    subtopic: missing_values
    min_grade: junior
    peak_grade: junior_plus
    max_grade: middle
    frequency: 4
    type: open_answer
    title: "В признаке 30 процентов пропусков. Что с ним делать?"
    answer_short: >-
      Сначала выяснить, почему они возникают: пропуск часто сам по себе
      информативен. Затем выбрать стратегию — отдельная категория, заполнение
      с флагом пропуска, или модель, работающая с пропусками напрямую.
    answer_detailed: |
      ### Junior
      Заполнение средним — стандартный первый ход, но он теряет информацию о
      самом факте пропуска. Добавление отдельного флага сохраняет её.

      ### Middle
      Причина пропуска важнее способа заполнения:

      - поле не заполняется определённой категорией пользователей — пропуск
        информативен и его нужно сохранить;
      - данные не собирались до определённой даты — пропуск связан со временем
        и станет утечкой, если не учесть;
      - сбой в конвейере — пропуск случаен, и его можно заполнять.

      Заполнение считается только по обучающей части: среднее по всей выборке
      — утечка.

      ### Senior
      Ждут внимания к согласованности с продакшеном: если в обучении пропуски
      заполнены средним, ровно та же логика с ровно тем же значением должна
      применяться при предсказании. Расхождение здесь — регулярный источник
      незаметной деградации.

      Полезно отметить, что рост доли пропусков в продакшене — сигнал о
      проблеме в источнике данных, и его стоит отслеживать наравне с метриками
      модели.
    common_mistakes:
      - Заполнять пропуски, не разобравшись в их причине.
      - Считать статистику заполнения по всей выборке.
      - Не следить за долей пропусков в продакшене.
    follow_ups:
      - Когда пропуск сам по себе является признаком?
      - Почему логика заполнения должна совпадать с продакшеном?

  - slug: ml_feature_store
    specializations: [data_ml]
    topic: features
    subtopic: feature_store
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Зачем нужно хранилище признаков и какую проблему оно решает?"
    answer_short: >-
      Расхождение между обучением и применением: признаки считаются дважды —
      пакетно для обучения и на лету для предсказания, — и две реализации
      расходятся. Хранилище даёт одно определение признака для обоих режимов.
    answer_detailed: |
      ### Junior
      Признак «число заказов за последние 30 дней» пишется один раз в
      SQL-запросе для обучения и второй раз в коде сервиса. Формулы расходятся,
      модель получает не то, на чём училась.

      ### Middle
      Что даёт хранилище:

      - одно определение признака, используемое обоими путями;
      - корректный доступ к значениям на конкретный момент времени — без него
        в обучающую выборку попадает будущее;
      - повторное использование признаков между командами и моделями;
      - мониторинг распределений в одном месте.

      Второй пункт — главный: правильно реализовать выборку значений «какими
      они были в момент события» непросто, и ошибка здесь даёт утечку.

      ### Senior
      Ждут трезвости по поводу цены. Полноценное хранилище — отдельная система
      с оперативным и пакетным слоями, синхронизацией и своим сопровождением.
      Для одной-двух моделей оно не окупается.

      Разумный порядок: сначала вынести определения признаков в общий код,
      используемый обоими путями, и добавить тест на совпадение результатов.
      Это снимает основную боль почти без затрат, а отдельная система
      становится оправданной, когда моделей и команд становится много.
    common_mistakes:
      - Держать две независимые реализации одного признака.
      - Внедрять хранилище признаков ради одной модели.
      - Не проверять доступ к значениям на момент события.
    follow_ups:
      - Почему выборка значений на момент события — сложная часть?
      - Чем заменить хранилище признаков в небольшом проекте?

  # --- Глубокое обучение ------------------------------------------------------

  - slug: ml_training_diverges
    specializations: [data_ml]
    topic: deep_learning
    subtopic: training_loop
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Функция потерь при обучении сети не убывает или уходит в бесконечность. Как разбираться?"
    answer_short: >-
      По порядку: проверить, что модель способна переобучиться на десятке
      примеров, снизить скорость обучения, проверить нормализацию входов и
      корректность разметки. Расходимость почти всегда означает слишком большой
      шаг или ошибку в данных.
    answer_detailed: |
      ### Junior
      Первый диагностический приём: взять десять примеров и обучить до почти
      нулевой ошибки. Если не получается — ошибка в коде, а не в модели или
      данных.

      ### Middle
      Дальше по списку:

      - слишком большая скорость обучения — самая частая причина расхождения;
      - ненормализованные входы: значения в тысячах дают огромные градиенты;
      - неверное сочетание функции потерь и выхода сети — например, двойное
        применение нормирующей функции;
      - перепутанные метки или сдвиг между признаками и целью;
      - деление на ноль или логарифм нуля внутри функции потерь.

      Прогрев скорости обучения и ограничение нормы градиента стабилизируют
      обучение там, где оно на грани.

      ### Senior
      Ждут системного подхода вместо перебора: смотреть на нормы градиентов по
      слоям, на распределения активаций, на долю мёртвых нейронов. Это
      показывает, где именно ломается, вместо угадывания.

      Полезно отметить, что воспроизводимость здесь критична: без фиксации
      начального состояния генератора случайных чисел разница между двумя
      запусками может быть больше, чем эффект от изменения, и отладка
      превращается в гадание.
    common_mistakes:
      - Подбирать настройки, не проверив обучение на десятке примеров.
      - Забывать нормализацию входов.
      - Отлаживать без фиксации случайного состояния.
    follow_ups:
      - Что показывают нормы градиентов по слоям?
      - Зачем нужен прогрев скорости обучения?

  - slug: ml_transfer_learning
    specializations: [data_ml]
    topic: deep_learning
    subtopic: transfer_learning
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: single_choice
    title: "Есть две тысячи размеченных изображений. Как строить классификатор?"
    options:
      - code: a
        text: "Обучить свёрточную сеть с нуля"
      - code: b
        text: "Взять предобученную модель и дообучить её на своих данных"
        is_correct: true
      - code: c
        text: "Разметить ещё сто тысяч изображений, иначе задача не решается"
      - code: d
        text: "Использовать только классические методы без нейросетей"
    answer_short: >-
      Дообучением предобученной модели: низкоуровневые признаки универсальны и
      уже выучены на большом наборе. Обучение с нуля на двух тысячах примеров
      почти наверняка проиграет.
    answer_detailed: |
      ### Junior
      Предобученная модель уже умеет выделять края, текстуры, формы. Остаётся
      научить её различать именно ваши классы.

      Простейший вариант — заморозить всё, кроме последнего слоя. Он работает
      быстро и требует мало данных.

      ### Middle
      Если предметная область далека от той, на которой училась модель —
      например, медицинские снимки вместо бытовых фотографий, — размораживают
      больше слоёв и обучают с малой скоростью.

      Расширение обучающих данных преобразованиями исходных изображений даёт
      заметный эффект при малой выборке. Важно, чтобы преобразования сохраняли
      смысл класса: отражение цифры меняет её.

      ### Senior
      Ждут вопроса о разметке до вопроса о модели. Две тысячи примеров могут
      быть размечены противоречиво, и тогда потолок качества определяется
      согласованностью разметки, а не архитектурой.

      Полезно упомянуть активное обучение: разметить в первую очередь те
      примеры, на которых модель менее всего уверена, — это даёт больший
      прирост на единицу затрат, чем случайная доразметка.
    common_mistakes:
      - Обучать сеть с нуля на маленькой выборке.
      - Применять преобразования, меняющие класс объекта.
      - Улучшать модель, не проверив согласованность разметки.
    follow_ups:
      - Когда размораживать больше слоёв?
      - Что такое активное обучение и когда оно окупается?

  - slug: ml_llm_in_production
    specializations: [data_ml]
    topic: deep_learning
    subtopic: transformers
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Продукту нужен ответ на вопросы по внутренней базе знаний. Дообучать модель или строить поиск с подстановкой контекста?"
    answer_short: >-
      Почти всегда начинают с поиска релевантных фрагментов и подстановки их в
      запрос: знания обновляются без переобучения, источник ответа
      прослеживается. Дообучение меняет стиль и формат ответа, но плохо
      подходит для передачи фактов, которые меняются.
    answer_detailed: |
      ### Junior
      Схема с поиском: по вопросу находим релевантные фрагменты документов,
      кладём их в запрос, модель отвечает по ним. Обновление базы знаний —
      это обновление документов, а не переобучение.

      ### Middle
      Что определяет качество такой системы:

      - **качество поиска**: если нужный фрагмент не найден, ответа не будет
        независимо от модели;
      - **разбиение документов**: слишком мелкие фрагменты теряют контекст,
        слишком крупные размывают релевантность;
      - **проверяемость**: ответ со ссылками на источники позволяет
        пользователю убедиться, а не поверить.

      Основная работа здесь — поисковая, а не модельная. Это регулярно
      недооценивают.

      ### Senior
      Ждут понимания, когда дообучение всё же уместно: устойчивый формат
      ответа, специфическая терминология, сокращение длины запроса. То есть
      форма, а не факты.

      Отдельный сюжет — оценка качества. Для генеративных ответов нет одной
      метрики: собирают набор типовых вопросов с эталонами, проверяют
      автоматически и выборочно людьми, отслеживают долю ответов без опоры на
      источники. Без такого набора любое изменение системы становится
      непроверяемым.
    common_mistakes:
      - Начинать с дообучения там, где нужны меняющиеся факты.
      - Недооценивать роль качества поиска.
      - Менять систему без набора вопросов для оценки.
    follow_ups:
      - Когда дообучение уместнее подстановки контекста?
      - Как оценивать качество генеративных ответов?

