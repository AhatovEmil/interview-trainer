  - slug: analyst_dq_numbers_dont_match
    specializations: [data_analyst]
    topic: data_quality
    subtopic: validation
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Ваш отчёт показывает выручку на 7% меньше, чем бухгалтерия. Как разбираться?"
    answer_short: >-
      Свести определения и границы: период, часовой пояс, валюта, что считается
      выручкой, учитываются ли возвраты, налоги и отменённые заказы. Затем
      сверять по уровням — от итога к дням, от дней к отдельным заказам, — пока
      расхождение не локализуется.
    answer_detailed: |
      ### Junior
      Первым делом — не искать ошибку в коде, а сравнить определения. Чаще всего
      расхождение объясняется тем, что считают разные вещи: с налогом или без,
      с возвратами или без, по дате заказа или по дате оплаты.

      ### Middle
      Метод локализации — сужение:

      1. Совпадает ли итог за один день?
      2. Если нет — за один час?
      3. Совпадает ли список идентификаторов заказов?
      4. Найти заказы, которые есть в одном источнике и нет в другом.

      Обычно на третьем шаге обнаруживается класс записей, теряемых из-за
      фильтра: тестовые заказы, заказы без привязки к клиенту, записи в другом
      часовом поясе, поздние события.

      ### Senior
      Ждут понимания, что часовой пояс — самая частая техническая причина.
      Сутки в UTC и сутки по местному времени сдвинуты, и на границе периода
      разница ровно такого порядка.

      Хороший ответ включает следствие: после разбора расхождение нужно не
      просто устранить, а закрепить проверкой — регулярной сверкой с
      контрольным источником и оповещением при отклонении сверх порога.
      Иначе через месяц всё повторится.
    common_mistakes:
      - Искать ошибку в коде, не сверив определения.
      - Не проверять часовой пояс при расхождениях на границе периода.
      - Устранить расхождение разово, не поставив регулярную сверку.
    follow_ups:
      - Почему часовой пояс — частая причина расхождений?
      - Как автоматизировать сверку с контрольным источником?

  - slug: analyst_dq_missing_data
    specializations: [data_analyst]
    topic: data_quality
    subtopic: missing_data
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "В 30% строк отсутствует возраст пользователя. Как поступить?"
    answer_short: >-
      Сначала понять механизм пропуска: случайный он или связан с самим
      значением. Удаление строк допустимо только при случайных пропусках;
      заполнение средним искажает разброс. Часто честнее выделить «не указано»
      в отдельную категорию и посмотреть, отличается ли она по поведению.
    answer_detailed: |
      ### Junior
      Три варианта действий: удалить строки, заполнить значением, оставить
      как отдельную категорию. Выбор зависит от причины пропуска, а не от
      удобства.

      ### Middle
      Механизмы пропуска:

      - **Полностью случайный** — техническая потеря; удаление безопасно.
      - **Случайный при известных признаках** — например, поле реже заполняют
        мобильные пользователи; можно восстановить с учётом этих признаков.
      - **Неслучайный** — не указывают именно те, кому есть что скрывать.
        Здесь любое заполнение вносит смещение.

      Заполнение средним особенно коварно: оно сохраняет среднее, но занижает
      дисперсию и портит корреляции — то есть ломает ровно то, ради чего
      обычно и считают.

      ### Senior
      Ждут практического приёма: сравнить поведение групп с заполненным и
      незаполненным полем. Если они различаются по ключевым метрикам, пропуск
      неслучаен, и это само по себе находка — часто более ценная, чем исходная
      задача.

      Второй сюжет — как подавать. В отчёте указывают долю пропусков и принятое
      решение. Молчаливое удаление трети данных — способ получить красивый
      график и неверный вывод, а вопрос «а сколько строк вы выбросили?» на
      защите результата задают всегда.
    common_mistakes:
      - Заполнять пропуски средним по умолчанию.
      - Удалять строки, не проверив механизм пропуска.
      - Не указывать долю пропусков в отчёте.
    follow_ups:
      - Почему заполнение средним портит корреляции?
      - Как проверить, что пропуск неслучаен?

  - slug: analyst_dq_tracking_design
    specializations: [data_analyst]
    topic: data_quality
    subtopic: tracking
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Продукт готовит новую фичу. Что аналитик должен сделать до релиза?"
    answer_short: >-
      Договориться о событиях заранее: какие действия логируются, с какими
      полями, как называются, что считается успехом. Данные, не собранные при
      релизе, восстановить невозможно — а вопрос «сработало ли» зададут через
      неделю.
    answer_detailed: |
      ### Junior
      Типичная ошибка — подключить аналитика после запуска. Тогда за первые две
      недели данных просто нет, и оценить эффект нечем.

      ### Middle
      Что фиксируют до разработки:

      - список событий и момент их отправки;
      - обязательные поля: идентификатор пользователя, сессия, платформа,
        версия, источник;
      - метрику успеха и контрольные метрики;
      - как отличать действия ботов и сотрудников.

      Имена событий должны следовать единому соглашению — иначе через год в
      системе будет пять способов назвать одно и то же действие.

      ### Senior
      Ждут понимания устойчивости к изменениям. События версионируют: добавление
      поля безопасно, изменение смысла существующего — нет. Переименование
      ломает исторические отчёты, поэтому его либо не делают, либо
      сопровождают пересчётом.

      Полезно упомянуть проверку внедрения до релиза: сравнить реально
      приходящие события с ожидаемыми на тестовом стенде. Половина проблем со
      сбором данных обнаруживается именно так — событие отправляется не в тот
      момент или теряет поле на части платформ.
    common_mistakes:
      - Подключать аналитика после релиза.
      - Не фиксировать соглашение об именовании событий.
      - Менять смысл существующего события вместо добавления нового.
    follow_ups:
      - Как проверить сбор событий до релиза?
      - Почему нельзя менять смысл существующего события?

  # --- Визуализация -----------------------------------------------------------

  - slug: analyst_viz_misleading_axis
    specializations: [data_analyst]
    topic: visualization
    subtopic: misleading
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: multi_choice
    title: "Какие приёмы делают график вводящим в заблуждение?"
    options:
      - code: a
        text: "Обрезанная ось значений у столбчатой диаграммы"
        is_correct: true
      - code: b
        text: "Две разные метрики на двух осях в одних координатах"
        is_correct: true
      - code: c
        text: "Выбор периода, на котором виден нужный тренд"
        is_correct: true
      - code: d
        text: "Подпись значений прямо у столбцов"
    answer_short: >-
      Обрезанная ось преувеличивает различия у столбцов, две оси позволяют
      подогнать видимую корреляцию масштабом, выбор удобного периода прячет
      обратный тренд. Подписи у данных, наоборот, повышают честность графика.
    answer_detailed: |
      ### Junior
      У столбчатой диаграммы длина столбца кодирует величину, поэтому ось
      обязана начинаться с нуля. У линейного графика это не требуется: там
      читают форму изменения, и нулевая ось часто только сплющивает картину.

      ### Middle
      Двойная ось — самый спорный приём. Две метрики с разными шкалами в одних
      координатах создают видимость связи, которой нет: сдвиньте масштаб, и
      «корреляция» исчезнет. Честные альтернативы — два графика рядом или
      приведение обеих величин к общей базе.

      Выбор периода: график с начала удачного квартала показывает рост, а с
      начала года — падение. Поэтому период выбирают по смыслу задачи и
      оговаривают явно.

      ### Senior
      Ждут понимания, что большинство таких графиков делают не со злым умыслом,
      а по неаккуратности: инструмент сам обрезал ось, период выбрали по
      умолчанию. Роль аналитика — заметить и поправить, потому что читатель
      верит картинке сильнее, чем цифрам.

      Полезно упомянуть общий принцип: чем меньше визуальных элементов
      кодируют одно значение, тем труднее ошибиться. Трёхмерные столбцы,
      объёмные круговые диаграммы и градиенты не добавляют информации, но
      искажают восприятие пропорций.
    common_mistakes:
      - Обрезать ось у столбчатой диаграммы.
      - Совмещать две метрики на двух осях.
      - Оставлять период по умолчанию, не проверив, что он показывает.
    follow_ups:
      - Почему у линейного графика ось может не начинаться с нуля?
      - Чем заменить график с двумя осями?

  - slug: analyst_viz_chart_choice
    specializations: [data_analyst]
    topic: visualization
    subtopic: chart_choice
    min_grade: junior
    peak_grade: junior_plus
    max_grade: middle
    frequency: 4
    type: open_answer
    title: "Как выбрать тип графика под задачу?"
    answer_short: >-
      От вопроса, на который график отвечает: сравнение величин — столбцы,
      изменение во времени — линия, связь двух величин — точечная диаграмма,
      распределение — гистограмма или ящик. Одно число не нуждается в графике
      вовсе — его показывают числом.
    answer_detailed: |
      ### Junior
      Соответствие задачи и формы:

      - **Сравнить категории** — горизонтальные столбцы, отсортированные по
        величине.
      - **Показать динамику** — линия, время по горизонтали.
      - **Связь двух переменных** — точечная диаграмма.
      - **Распределение** — гистограмма.
      - **Одно ключевое значение** — крупное число, а не диаграмма.

      ### Middle
      Круговая диаграмма плоха тем, что человек плохо сравнивает углы: при
      четырёх и более долях столбцы читаются точнее. Она допустима для двух-трёх
      частей, где важна именно доля целого.

      Категории с длинными названиями располагают горизонтально — вертикальные
      подписи под наклоном нечитаемы. Сортировка по величине почти всегда
      полезнее алфавитной: глаз сразу находит главное.

      ### Senior
      Ждут понимания, что график — это ответ, а не украшение. Прежде чем
      выбирать форму, формулируют вопрос: «какая категория лидирует», «растёт
      ли показатель», «есть ли выбросы». Разные вопросы по одним данным требуют
      разных графиков.

      Хороший ответ упоминает подписи прямо у данных вместо легенды сбоку —
      читателю не приходится переводить взгляд и сопоставлять цвета, что
      особенно важно при печати и для людей с нарушением цветовосприятия.
    common_mistakes:
      - Строить круговую диаграмму на много категорий.
      - Сортировать категории по алфавиту вместо величины.
      - Рисовать график там, где достаточно одного числа.
    follow_ups:
      - Почему круговая диаграмма хуже столбцов при многих категориях?
      - Чем прямые подписи лучше легенды?

