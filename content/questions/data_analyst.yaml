# Банк вопросов для data_analyst.
#
# Это данные, а не код. Все вопросы загружаются сидом с is_verified=false:
# проверенным вопрос становится только после ревью человеком (CLAUDE.md §8.1).
#
# Специфика раздела: у аналитика проверяют не столько знание синтаксиса,
# сколько способность не соврать цифрой. Поэтому большая часть вопросов
# построена вокруг ловушек интерпретации — там, где формально верный расчёт
# приводит к неверному выводу.

version: 1

questions:
  # --- SQL --------------------------------------------------------------------

  - slug: analyst_sql_left_join_where_trap
    specializations: [data_analyst]
    topic: sql
    subtopic: joins
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: single_choice
    title: "К LEFT JOIN добавили условие `WHERE b.status = 'paid'`. Что произойдёт с результатом?"
    options:
      - code: a
        text: "Ничего: LEFT JOIN всё равно сохранит все строки левой таблицы"
      - code: b
        text: "Соединение фактически станет внутренним: строки без совпадения дают NULL, а NULL не проходит условие"
        is_correct: true
      - code: c
        text: "Запрос вернёт ошибку"
      - code: d
        text: "Строки без совпадения останутся, но статус будет пустым"
    answer_short: >-
      Условие в WHERE применяется после соединения. У несовпавших строк все поля
      правой таблицы равны NULL, а сравнение NULL с чем угодно не истинно —
      такие строки отсеиваются. Чтобы сохранить их, условие переносят в ON.
    answer_detailed: |
      ### Junior
      ```sql
      -- фактически INNER JOIN
      SELECT * FROM users u
      LEFT JOIN orders o ON o.user_id = u.id
      WHERE o.status = 'paid';

      -- сохраняет пользователей без оплаченных заказов
      SELECT * FROM users u
      LEFT JOIN orders o ON o.user_id = u.id AND o.status = 'paid';
      ```

      ### Middle
      Разница в порядке: `ON` управляет тем, какие строки считаются
      совпавшими при соединении, `WHERE` фильтрует уже готовый результат.

      Отсюда практическое правило: условия по правой таблице в LEFT JOIN идут в
      `ON`, условия по левой — в `WHERE`. Исключение — намеренный поиск
      отсутствующих: `WHERE o.id IS NULL` находит пользователей вообще без
      заказов, и это единственный случай, когда условие по правой таблице в
      WHERE осмысленно.

      ### Senior
      Ждут понимания, чем это опасно на практике: отчёт «пользователи и их
      оплаты» тихо теряет всех, кто ничего не купил, и конверсия получается
      завышенной. Ошибка не видна в самом запросе — только в числах, которые
      никто не перепроверяет.

      Полезно упомянуть, что при агрегации по такому соединению `COUNT(*)`
      посчитает строки соединения, а не пользователей, — считать нужно
      `COUNT(DISTINCT u.id)` либо `COUNT(o.id)` в зависимости от вопроса.
    common_mistakes:
      - Ставить условие по правой таблице в WHERE при LEFT JOIN.
      - Считать COUNT(*) после соединения и получать раздутые числа.
      - Не проверять, не изменилось ли число строк после добавления соединения.
    follow_ups:
      - Как найти пользователей вообще без заказов?
      - Чем COUNT(*) отличается от COUNT(колонка) после LEFT JOIN?

  - slug: analyst_sql_null_not_in
    specializations: [data_analyst]
    topic: sql
    subtopic: nulls
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: single_choice
    title: "Запрос `WHERE id NOT IN (SELECT user_id FROM blocked)` вернул ноль строк, хотя данные есть. Почему?"
    options:
      - code: a
        text: "Подзапрос выполняется до основного и кеширует пустой результат"
      - code: b
        text: "В подзапросе есть NULL: сравнение с ним даёт неопределённость, и условие не истинно ни для одной строки"
        is_correct: true
      - code: c
        text: "NOT IN не работает с подзапросами"
      - code: d
        text: "Нужен индекс на колонке user_id"
    answer_short: >-
      `NOT IN` разворачивается в цепочку сравнений через AND. Если в списке есть
      NULL, одно из сравнений даёт UNKNOWN, и всё выражение перестаёт быть
      истинным. Результат — пустая выборка. Надёжнее использовать `NOT EXISTS`.
    answer_detailed: |
      ### Junior
      ```sql
      -- ломается при NULL в blocked.user_id
      WHERE id NOT IN (SELECT user_id FROM blocked)

      -- работает всегда
      WHERE NOT EXISTS (
        SELECT 1 FROM blocked b WHERE b.user_id = users.id
      )
      ```

      ### Middle
      Механика: `x NOT IN (1, 2, NULL)` это `x <> 1 AND x <> 2 AND x <> NULL`.
      Последнее сравнение даёт UNKNOWN, а `истина AND неизвестно` — тоже
      неизвестно. Строка не проходит фильтр.

      Заметьте асимметрию: `IN` с NULL ведёт себя менее коварно — если
      совпадение найдено, результат истинен независимо от NULL.

      ### Senior
      Ждут более общего понимания трёхзначной логики: в SQL есть истина, ложь и
      неизвестность, и NULL не равен даже самому себе. Отсюда `IS NULL` вместо
      `= NULL`, и отсюда же поведение агрегатов — они игнорируют NULL, поэтому
      `AVG` считает среднее по заполненным значениям, а не по всем строкам.

      Практический вывод для отчётов: `AVG(discount)` при NULL вместо нуля даёт
      завышенное среднее. Если пропуск означает ноль, его нужно привести явно
      через `COALESCE`, и это осознанное решение, а не техническая деталь.
    common_mistakes:
      - Использовать NOT IN с подзапросом без гарантии отсутствия NULL.
      - Сравнивать с NULL через равенство.
      - Считать AVG по колонке с пропусками, не решив, что означает пропуск.
    follow_ups:
      - Почему AVG игнорирует NULL и когда это искажает результат?
      - Чем NOT EXISTS надёжнее NOT IN?

  - slug: analyst_sql_window_vs_groupby
    specializations: [data_analyst]
    topic: sql
    subtopic: window_functions
    min_grade: junior_plus
    peak_grade: middle_plus
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Нужно вывести каждую покупку и рядом долю этой покупки в сумме по клиенту. Как это сделать?"
    answer_short: >-
      Оконной функцией: `amount / SUM(amount) OVER (PARTITION BY client_id)`.
      В отличие от GROUP BY, окно не схлопывает строки — каждая покупка
      остаётся на месте, а агрегат считается по её группе.
    answer_detailed: |
      ### Junior
      ```sql
      SELECT
        purchase_id,
        client_id,
        amount,
        amount / SUM(amount) OVER (PARTITION BY client_id) AS share
      FROM purchases;
      ```

      `GROUP BY` дал бы одну строку на клиента — детализация потерялась бы.

      ### Middle
      Что ещё дают окна:

      - `ROW_NUMBER()` — нумерация внутри группы: первый заказ клиента, последняя
        транзакция;
      - `LAG` и `LEAD` — обращение к соседней строке: расчёт интервала между
        покупками;
      - накопительные суммы через `ORDER BY` внутри окна.

      Важная деталь: наличие `ORDER BY` в окне меняет рамку по умолчанию — без
      него агрегат считается по всей группе, с ним — накопительно от начала до
      текущей строки. Это источник неожиданных результатов.

      ### Senior
      Ждут понимания порядка выполнения: оконные функции считаются **после**
      `WHERE` и `GROUP BY`, но **до** `ORDER BY` и `LIMIT`. Поэтому окно нельзя
      использовать в `WHERE` напрямую — нужен подзапрос или CTE.

      Практический сюжет: дедупликация через `ROW_NUMBER() OVER (PARTITION BY
      key ORDER BY updated_at DESC)` с фильтром по номеру во внешнем запросе —
      стандартный приём, когда в выгрузке несколько версий одной записи.
    common_mistakes:
      - Использовать GROUP BY там, где нужна детализация.
      - Не учитывать, что ORDER BY в окне меняет рамку.
      - Пытаться отфильтровать по оконной функции в WHERE.
    follow_ups:
      - Как оставить только последнюю версию записи по ключу?
      - Почему нельзя использовать оконную функцию в WHERE?

  - slug: analyst_sql_having_vs_where
    specializations: [data_analyst]
    topic: sql
    subtopic: aggregation
    min_grade: junior
    peak_grade: junior_plus
    max_grade: middle
    frequency: 4
    type: single_choice
    title: "Нужно оставить клиентов, у которых больше трёх заказов. Где ставить условие?"
    options:
      - code: a
        text: "В WHERE: `WHERE COUNT(*) > 3`"
      - code: b
        text: "В HAVING: условие применяется к результату агрегации, а WHERE отрабатывает до неё"
        is_correct: true
      - code: c
        text: "В ORDER BY"
      - code: d
        text: "Любой вариант работает одинаково"
    answer_short: >-
      `WHERE` фильтрует строки до группировки и не видит агрегатов, `HAVING` —
      готовые группы. Условие по количеству заказов возможно только после
      подсчёта, значит в HAVING.
    answer_detailed: |
      ### Junior
      ```sql
      SELECT client_id, COUNT(*) AS orders
      FROM orders
      GROUP BY client_id
      HAVING COUNT(*) > 3;
      ```

      ### Middle
      Порядок логической обработки: FROM → WHERE → GROUP BY → HAVING → SELECT →
      ORDER BY → LIMIT. Из него следует всё остальное: почему в WHERE нельзя
      использовать псевдоним из SELECT, почему агрегат недоступен в WHERE и
      почему в ORDER BY псевдоним уже работает.

      Практическое следствие для скорости: условия, которые можно применить до
      группировки, ставят в WHERE — тогда группировать придётся меньше строк.
      Фильтр по дате в HAVING вместо WHERE замедляет запрос без всякой пользы.

      ### Senior
      Ждут понимания разницы между логическим порядком и фактическим планом:
      оптимизатор вправе переставить операции, если результат не меняется.
      Поэтому «HAVING медленнее» — упрощение, и правильный ответ звучит как
      «условие по исходным строкам ставим в WHERE, потому что так яснее
      намерение и обычно эффективнее, а проверять всё равно нужно планом».
    common_mistakes:
      - Пытаться использовать агрегат в WHERE.
      - Ставить фильтр по исходным строкам в HAVING.
      - Ожидать доступности псевдонима из SELECT в WHERE.
    follow_ups:
      - Почему псевдоним из SELECT недоступен в WHERE, но доступен в ORDER BY?
      - Как проверить, что фильтр действительно ускорил запрос?

  - slug: analyst_sql_cte_readability
    specializations: [data_analyst]
    topic: sql
    subtopic: subqueries_cte
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Когда стоит выносить логику в CTE, а когда это вредит?"
    answer_short: >-
      CTE полезен для читаемости: длинный запрос разбивается на именованные
      шаги, каждый из которых понятен отдельно. Вредит, когда одно и то же
      выражение используется многократно и пересчитывается, а также когда
      материализация мешает оптимизатору протолкнуть фильтр внутрь.
    answer_detailed: |
      ### Junior
      ```sql
      WITH active_clients AS (
        SELECT id FROM clients WHERE status = 'active'
      ),
      recent_orders AS (
        SELECT * FROM orders WHERE created_at >= now() - interval '30 days'
      )
      SELECT ...
      ```

      Читается сверху вниз как последовательность шагов, а не как вложенные
      скобки в пять уровней.

      ### Middle
      Практические ограничения:

      - CTE вычисляется один раз, но если он большой, а внешний запрос берёт из
        него малую часть, работа делается впустую.
      - Рекурсивные CTE решают задачи по иерархиям — дерево категорий,
        цепочка руководителей.
      - В некоторых СУБД CTE исторически был барьером оптимизации: фильтр из
        внешнего запроса не проталкивался внутрь. В PostgreSQL это изменилось в
        версии 12 — теперь CTE по умолчанию встраивается, а прежнее поведение
        включается словом `MATERIALIZED`.

      ### Senior
      Ждут умения выбирать осознанно: `MATERIALIZED` полезен, когда CTE
      действительно используется несколько раз и его дешевле посчитать один раз;
      `NOT MATERIALIZED` — когда важно, чтобы фильтр прошёл внутрь.

      Хороший ответ отмечает, что читаемость аналитического запроса — не
      второстепенная вещь: такие запросы живут годами и переиспользуются, а
      ошибка в них дороже, чем лишние секунды выполнения.
    common_mistakes:
      - Считать CTE всегда бесплатным по производительности.
      - Строить вложенные подзапросы вместо именованных шагов.
      - Не знать про изменение поведения CTE в новых версиях СУБД.
    follow_ups:
      - Когда нужен MATERIALIZED?
      - Как решить задачу по дереву категорий через рекурсивный CTE?

  - slug: analyst_sql_slow_query
    specializations: [data_analyst]
    topic: sql
    subtopic: performance
    min_grade: middle
    peak_grade: middle_plus
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Отчётный запрос выполняется двадцать минут. Как искать причину?"
    answer_short: >-
      Смотреть план выполнения, а не гадать. Типичные находки: последовательное
      чтение большой таблицы вместо индекса, функция на колонке в условии,
      соединение, размножающее строки, и агрегация после соединения вместо
      предварительной.
    answer_detailed: |
      ### Junior
      Первое действие — `EXPLAIN ANALYZE`. Он показывает фактическое время по
      узлам плана и число строк — сразу видно, где уходит время.

      ### Middle
      Что чаще всего находится:

      - **Функция на колонке**: `WHERE date(created_at) = '2026-01-01'` не даёт
        использовать индекс. Переписывают в диапазон: `created_at >= ... AND
        created_at < ...`.
      - **Расхождение оценки и факта**: планировщик ожидал сто строк, получил
        миллион — устарела статистика или условие слишком сложное для оценки.
      - **Размножение строк соединением**: одно соединение «один ко многим»
        превращает миллион строк в двадцать, и всё последующее считается на них.
      - **Агрегация после соединения**: часто дешевле сначала свернуть таблицу,
        а потом соединять.

      ### Senior
      Ждут разговора о том, что не всякий медленный отчёт нужно ускорять
      запросом. Если он строится ежедневно по одним и тем же данным, правильный
      ответ — предагрегация: витрина, обновляемая по расписанию. Оптимизировать
      запрос, который выполняется раз в сутки ночью, обычно не стоит вовсе.

      Полезно упомянуть, что в аналитических нагрузках колоночные хранилища
      меняют правила: там индексы работают иначе, а решающим становится
      партиционирование и порядок сортировки данных.
    common_mistakes:
      - Оптимизировать запрос без плана выполнения.
      - Оборачивать колонку функцией в условии фильтра.
      - Ускорять запрос вместо построения витрины.
    follow_ups:
      - Почему функция на колонке мешает индексу?
      - Когда витрина лучше оптимизации запроса?

  - slug: analyst_sql_count_distinct_pitfall
    specializations: [data_analyst]
    topic: sql
    subtopic: aggregation
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "В отчёте «число клиентов и сумма покупок» после добавления таблицы товаров сумма выросла втрое. Что случилось?"
    answer_short: >-
      Соединение с таблицей «один ко многим» размножило строки: у заказа с тремя
      товарами сумма заказа посчиталась трижды. Считать нужно либо по заранее
      свёрнутой таблице, либо через агрегаты по уникальным идентификаторам.
    answer_detailed: |
      ### Junior
      Классическая ошибка «раздувания» при соединении. Заказ на 1000 рублей с
      тремя позициями после соединения даёт три строки по 1000 — сумма 3000.

      ### Middle
      Решения:

      1. Сначала свернуть детализацию, потом соединять:

      ```sql
      WITH order_totals AS (
        SELECT order_id, SUM(price * qty) AS total
        FROM order_items GROUP BY order_id
      )
      SELECT c.id, SUM(t.total)
      FROM clients c
      JOIN orders o ON o.client_id = c.id
      JOIN order_totals t ON t.order_id = o.id
      GROUP BY c.id;
      ```

      2. Считать разные метрики отдельными запросами и соединять результаты.

      `COUNT(DISTINCT client_id)` спасает счётчик клиентов, но с суммой так не
      выйдет: `SUM(DISTINCT amount)` схлопнет одинаковые суммы разных заказов и
      даст новую ошибку.

      ### Senior
      Ждут привычки проверять: после добавления соединения смотреть, не
      изменилось ли число строк. Простой контроль — сравнить `COUNT(*)` до и
      после; если выросло, соединение размножающее, и все агрегаты нужно
      пересмотреть.

      Хороший ответ упоминает, что такие ошибки почти не ловятся ревью — цифра
      выглядит правдоподобно. Ловит их только сверка с независимым источником:
      контрольная сумма из другой системы, выборочная проверка по одному
      клиенту руками.
    common_mistakes:
      - Соединять детализацию и считать агрегаты без предварительной свёртки.
      - Пытаться чинить сумму через SUM(DISTINCT).
      - Не сверять число строк после добавления соединения.
    follow_ups:
      - Почему SUM(DISTINCT) — плохое решение?
      - Как проверить отчёт на раздувание строк?

  # --- Статистика -------------------------------------------------------------

  - slug: analyst_stats_p_value_meaning
    specializations: [data_analyst]
    topic: statistics
    subtopic: hypothesis_testing
    min_grade: junior_plus
    peak_grade: middle_plus
    max_grade: lead
    frequency: 5
    type: single_choice
    title: "Что означает p-value = 0.03?"
    options:
      - code: a
        text: "Вероятность того, что нулевая гипотеза верна, равна 3%"
      - code: b
        text: "Вероятность получить такой или более выраженный результат, если нулевая гипотеза верна, равна 3%"
        is_correct: true
      - code: c
        text: "Вероятность того, что эффект реален, равна 97%"
      - code: d
        text: "Размер эффекта составляет 3%"
    answer_short: >-
      p-value — вероятность увидеть наблюдаемые данные или более экстремальные
      при условии, что нулевая гипотеза верна. Это не вероятность гипотезы и не
      размер эффекта. Маленькое p говорит лишь о том, что данные плохо
      согласуются с отсутствием эффекта.
    answer_detailed: |
      ### Junior
      Формально: p — вероятность данных при верной нулевой гипотезе, а не
      вероятность гипотезы при данных. Перестановка этих условий — самая частая
      ошибка в интерпретации статистики.

      ### Middle
      Что из этого следует практически:

      - p не говорит о размере эффекта. На большой выборке статистически
        значимым станет прирост в 0.01%, бесполезный для бизнеса.
      - p > 0.05 не означает «эффекта нет» — возможно, не хватило мощности.
        Отсутствие доказательства не есть доказательство отсутствия.
      - Порог 0.05 — соглашение, а не закон природы.

      Поэтому рядом с p всегда показывают доверительный интервал: он отвечает на
      вопрос «насколько велик эффект», а не только «отличается ли он от нуля».

      ### Senior
      Ждут разговора о множественных сравнениях: проверив двадцать метрик при
      пороге 0.05, в среднем одну «значимость» получают случайно. Отсюда
      поправки (Бонферрони, контроль доли ложных открытий) либо заранее
      объявленная главная метрика.

      Второй сюжет — p-hacking: перебор срезов, доопределение метрик после
      просмотра данных, остановка теста в удобный момент. Всё это превращает
      p-value в бессмыслицу, и защита от него процедурная — фиксировать план
      анализа до сбора данных.
    common_mistakes:
      - Читать p как вероятность истинности гипотезы.
      - Принимать p > 0.05 за доказательство отсутствия эффекта.
      - Проверять много метрик без поправки на множественность.
    follow_ups:
      - Почему доверительный интервал информативнее p-value?
      - Что такое проблема множественных сравнений?

  - slug: analyst_stats_mean_vs_median
    specializations: [data_analyst]
    topic: statistics
    subtopic: descriptive
    min_grade: junior
    peak_grade: junior_plus
    max_grade: middle
    frequency: 5
    type: open_answer
    title: "Средний чек вырос, а медианный упал. Как такое возможно и что показывать бизнесу?"
    answer_short: >-
      Среднее чувствительно к хвосту: несколько очень крупных покупок тянут его
      вверх, тогда как типичный клиент стал платить меньше. Показывать нужно
      обе величины, а лучше — распределение по перцентилям, потому что одна
      цифра здесь скрывает суть.
    answer_detailed: |
      ### Junior
      Среднее — сумма делить на количество, медиана — значение посередине
      упорядоченного ряда. На перекошенных распределениях они расходятся, а
      выручка, чеки и время на сайте перекошены почти всегда.

      ### Middle
      Как проверить, что произошло: посмотреть перцентили (p25, p50, p75, p90,
      p99) и долю крупных покупок. Обычно обнаруживается либо приход нескольких
      крупных клиентов, либо отток мелких, либо изменение состава аудитории.

      Отсюда практическое правило: для денег и длительностей медиана и
      перцентили информативнее среднего. Среднее уместно, когда важна сумма:
      суммарная выручка равна среднему на число клиентов, а через медиану её не
      получить.

      ### Senior
      Ждут связи с решением. Если цель — понять «сколько платит типичный
      клиент», нужна медиана. Если — спланировать выручку, нужно среднее и
      понимание вклада хвоста. Это разные вопросы, и подмена одного другим
      приводит к неверным решениям.

      Хороший ответ включает предупреждение: агрегат по всей аудитории может
      скрывать разнонаправленные движения сегментов. Средний чек не изменился,
      а внутри выросли новые клиенты и упали старые — это парадокс Симпсона в
      бытовом виде, и лечится он разбивкой на сегменты.
    common_mistakes:
      - Отчитываться одним средним по перекошенному распределению.
      - Не смотреть перцентили при расхождении среднего и медианы.
      - Игнорировать изменение состава аудитории.
    follow_ups:
      - Когда среднее уместнее медианы?
      - Что такое парадокс Симпсона на практике?

  - slug: analyst_stats_correlation_causation
    specializations: [data_analyst]
    topic: statistics
    subtopic: correlation_causation
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Обнаружено: пользователи, включившие уведомления, покупают вдвое чаще. Можно ли делать вывод, что уведомления повышают продажи?"
    answer_short: >-
      Нет. Это наблюдаемая связь, а не эффект: уведомления включают более
      заинтересованные пользователи, которые и так покупали бы чаще. Проверить
      причинность можно только экспериментом или квазиэкспериментальным методом,
      снимающим отбор.
    answer_detailed: |
      ### Junior
      Связь между двумя величинами может объясняться тремя способами: A влияет
      на B, B влияет на A, либо есть третий фактор, влияющий на оба. Здесь
      третий фактор — заинтересованность пользователя.

      ### Middle
      Это самосмещение отбора: группа сформировалась не случайно, а по решению
      самих пользователей. Сравнивать её с остальными некорректно, потому что
      группы различались ещё до включения уведомлений.

      Правильная проверка — A/B-тест: случайно разделить пользователей и одной
      части предложить включить уведомления. Случайное распределение уравнивает
      группы по всем факторам, включая неизвестные.

      ### Senior
      Ждут понимания, что делать, когда эксперимент невозможен. Инструменты:
      разность разностей при поэтапном раскате, регрессионный разрыв при
      пороговом правиле, подбор сопоставимых пар по наблюдаемым признакам.
      У всех есть допущения, и их нужно называть честно.

      Второй сюжет — как отвечать заказчику. Правильный ответ не «эти данные
      бесполезны», а «связь есть, но её величина не равна эффекту; чтобы
      измерить эффект, нужен эксперимент — вот его дизайн и сроки». Аналитик,
      который умеет предложить проверку вместо отказа, ценится заметно выше.
    common_mistakes:
      - Выдавать наблюдаемую разницу групп за эффект воздействия.
      - Игнорировать самоотбор при сравнении групп.
      - Отказывать заказчику вместо предложения корректной проверки.
    follow_ups:
      - Как измерить эффект, если эксперимент невозможен?
      - Почему случайное распределение решает проблему неизвестных факторов?

  - slug: analyst_stats_sampling_bias
    specializations: [data_analyst]
    topic: statistics
    subtopic: sampling
    min_grade: junior_plus
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Опрос показал 90% довольных клиентов. Какие вопросы вы зададите, прежде чем показывать это руководству?"
    answer_short: >-
      Кто попал в выборку и кто ответил. Опросы отвечают самые лояльные и самые
      разозлённые, а ушедшие клиенты не отвечают вовсе. При отклике в несколько
      процентов цифра описывает не клиентов, а тех, кто согласился ответить.
    answer_detailed: |
      ### Junior
      Ключевые вопросы: сколько человек получили опрос, сколько ответили, как
      их выбирали, в какой момент показывали форму.

      ### Middle
      Механизмы смещения:

      - **Смещение выжившего**: отток не опрашивают, потому что его уже нет.
      - **Смещение отклика**: отвечают те, у кого есть эмоция.
      - **Момент опроса**: форма после успешной покупки соберёт совсем другие
        оценки, чем форма после обращения в поддержку.
      - **Формулировка**: наводящий вопрос смещает ответ.

      Проверить можно сравнением известных характеристик респондентов и всей
      базы: если среди ответивших вдвое больше давних клиентов, выборка
      непредставительна.

      ### Senior
      Ждут понимания, что делать дальше. Варианты: взвесить ответы по
      известным характеристикам, опрашивать случайную подвыборку с
      напоминаниями (чтобы повысить отклик), дополнить опрос поведенческими
      данными — повторные покупки говорят о довольстве надёжнее, чем оценка.

      Сильный ответ формулирует ограничение прямо в отчёте: не «90% клиентов
      довольны», а «90% из 4% ответивших, среди которых доля активных клиентов
      вдвое выше средней». Такая формулировка защищает и от неверного решения,
      и от репутационных потерь аналитика, когда цифра не подтвердится.
    common_mistakes:
      - Не смотреть долю отклика при интерпретации опроса.
      - Опрашивать только текущих клиентов и забывать про ушедших.
      - Подавать результат опроса как характеристику всей базы.
    follow_ups:
      - Как проверить представительность выборки?
      - Чем поведенческие метрики лучше опросов?

  - slug: analyst_stats_normal_assumption
    specializations: [data_analyst]
    topic: statistics
    subtopic: distributions
    min_grade: middle
    peak_grade: middle_plus
    max_grade: lead
    frequency: 3
    type: single_choice
    title: "Выручка на пользователя сильно перекошена. Можно ли сравнивать средние двух групп обычным t-тестом?"
    options:
      - code: a
        text: "Нет: t-тест требует нормального распределения самих данных"
      - code: b
        text: "Обычно да: на больших выборках распределение среднего приближается к нормальному, но тяжёлый хвост требует осторожности"
        is_correct: true
      - code: c
        text: "Да, распределение данных не имеет значения ни при каких условиях"
      - code: d
        text: "Нет, для денег статистические тесты неприменимы"
    answer_short: >-
      Тест предъявляет требование не к данным, а к распределению выборочного
      среднего, которое по центральной предельной теореме приближается к
      нормальному. На больших выборках это работает, но при очень тяжёлом хвосте
      сходимость медленная, и надёжнее бутстрап или тест на усечённых данных.
    answer_detailed: |
      ### Junior
      Распространённое заблуждение — «нужны нормальные данные». Требование
      относится к распределению оценки, а не наблюдений.

      ### Middle
      Практическая граница: при выручке, где один процент пользователей даёт
      половину суммы, даже десятки тысяч наблюдений не гарантируют устойчивую
      оценку. Признак проблемы — результат сильно меняется при удалении
      нескольких крупнейших значений.

      Что делают:

      - бутстрап доверительного интервала — не требует предположений о форме;
      - усечение или винзоризация верхнего процента с заранее объявленным
        правилом;
      - анализ на уровне другой метрики: доля покупателей вместо суммы, где
        распределение бинарное и ведёт себя устойчиво.

      ### Senior
      Ждут понимания, что правило усечения нужно фиксировать **до** просмотра
      результата. Иначе выбор порога превращается в подгонку: удалить выбросы
      так, чтобы получился нужный вывод, слишком легко.

      Полезно упомянуть, что при перекосе часто разумнее разложить метрику:
      выручка равна доле покупателей на средний чек. Обе части измеряются
      устойчивее и объясняют, откуда взялось изменение, — это ответ на вопрос
      «почему», а не только «изменилось ли».
    common_mistakes:
      - Считать, что t-тест требует нормальности исходных данных.
      - Подбирать правило усечения после просмотра результата.
      - Сравнивать перекошенные суммы, не разложив метрику на части.
    follow_ups:
      - Что даёт бутстрап и когда он предпочтителен?
      - Зачем раскладывать выручку на долю покупателей и средний чек?

  # --- A/B-тесты --------------------------------------------------------------

  - slug: analyst_ab_peeking
    specializations: [data_analyst]
    topic: ab_testing
    subtopic: pitfalls
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Продакт смотрит результаты теста каждый день и хочет остановить его, как только p-value опустится ниже 0.05. Что не так?"
    answer_short: >-
      Это подглядывание: при многократной проверке вероятность хотя бы раз
      случайно получить значимость сильно превышает объявленные 5%. Правильно —
      зафиксировать срок и размер выборки заранее либо использовать методы,
      допускающие промежуточные проверки.
    answer_detailed: |
      ### Junior
      Каждая проверка — это новая попытка. Проверяя двадцать раз при пороге
      0.05, значимость случайно поймают почти наверняка, даже если эффекта нет
      вовсе.

      ### Middle
      Классический подход требует объявить размер выборки заранее и посмотреть
      результат один раз, когда он набран. Порог 0.05 корректен только для
      единственной проверки.

      Если смотреть всё же нужно (а бизнесу обычно нужно), есть корректные
      способы:

      - **последовательное тестирование** с поправками на промежуточные взгляды;
      - **всегда валидные доверительные интервалы**, которые остаются
        корректными при любом числе проверок ценой более широких границ.

      Второе особенно удобно для дашбордов, где результат смотрят постоянно.

      ### Senior
      Ждут понимания природы явления: p-value при отсутствии эффекта случайно
      блуждает и рано или поздно опустится ниже порога. Остановка «когда стало
      хорошо» систематически завышает и вероятность ложного вывода, и оценку
      размера эффекта — победа выглядит крупнее, чем есть.

      Полезно упомянуть отдельный случай: остановка теста при плохих результатах
      — тоже подглядывание, но там оно обычно оправдано этикой, потому что вред
      пользователю важнее чистоты статистики. Это разговор про приоритеты, а не
      про математику.
    common_mistakes:
      - Останавливать тест в момент достижения значимости.
      - Использовать обычный порог при ежедневных проверках.
      - Считать полученный размер эффекта точным после ранней остановки.
    follow_ups:
      - Что такое всегда валидные доверительные интервалы?
      - Почему ранняя остановка завышает оценку эффекта?

  - slug: analyst_ab_sample_size
    specializations: [data_analyst]
    topic: ab_testing
    subtopic: sample_size
    min_grade: middle
    peak_grade: middle_plus
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "От чего зависит необходимый размер выборки для A/B-теста?"
    answer_short: >-
      От минимального эффекта, который важно уловить, разброса метрики,
      базового уровня и выбранных уровней ошибок первого и второго рода.
      Чем меньше эффект, который нужно различить, тем больше выборка — примерно
      обратно квадрату размера эффекта.
    answer_detailed: |
      ### Junior
      Четыре входа в расчёт: базовое значение метрики, минимально значимый
      эффект, допустимая вероятность ложного срабатывания (обычно 5%) и
      мощность (обычно 80%).

      ### Middle
      Практический смысл квадратичной зависимости: чтобы уловить эффект вдвое
      меньше, нужно вчетверо больше пользователей. Отсюда типичный разговор с
      продактом: «прирост в 0.5% мы сможем измерить за полгода, прирост в 3% —
      за неделю; какой минимальный эффект вам вообще интересен?»

      Мощность 80% означает, что при реально существующем эффекте нужного
      размера мы обнаружим его в 80% случаев. Тест с мощностью 30% почти
      бесполезен: отрицательный результат в нём ничего не говорит.

      ### Senior
      Ждут разговора о недооценённых факторах. Разброс метрики влияет напрямую,
      поэтому уменьшение дисперсии (стратификация, поправка на предпериодные
      данные — CUPED) сокращает нужную выборку в разы без потери корректности.

      Второй сюжет — единица рандомизации. Если эффект передаётся между
      пользователями (соцсети, маркетплейсы), рандомизировать по пользователям
      нельзя: группы влияют друг на друга. Тогда рандомизируют по регионам или
      временным окнам, и расчёт выборки строится на числе кластеров, а не
      пользователей, — обычно это резко увеличивает требуемый объём.
    common_mistakes:
      - Запускать тест без расчёта необходимого объёма.
      - Делать выводы из теста с низкой мощностью.
      - Рандомизировать по пользователям там, где есть взаимное влияние.
    follow_ups:
      - Что такое CUPED и почему он сокращает выборку?
      - Когда нельзя рандомизировать по пользователям?

  - slug: analyst_ab_srm
    specializations: [data_analyst]
    topic: ab_testing
    subtopic: design
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: single_choice
    title: "Тест делили 50 на 50, но в группе A оказалось 52 000 пользователей, а в B — 48 000. Что делать?"
    options:
      - code: a
        text: "Ничего: небольшое отклонение — это нормальная случайность"
      - code: b
        text: "Остановиться и разобраться: расхождение долей указывает на дефект сплитования, результаты доверия не заслуживают"
        is_correct: true
      - code: c
        text: "Домножить метрики группы B на поправочный коэффициент"
      - code: d
        text: "Удалить лишних пользователей из группы A случайным образом"
    answer_short: >-
      Это несоответствие долей выборки. При ста тысячах наблюдений отклонение в
      четыре процента случайным быть не может — почти всегда виновата техника:
      часть пользователей не попала в лог, редирект отсекал медленные
      устройства, фильтр ботов работал по-разному в группах. Результаты теста
      при этом недействительны.
    answer_detailed: |
      ### Junior
      Проверка простая: сравнить фактические доли с ожидаемыми критерием
      согласия. При таком объёме отклонение в 2 000 человек даёт исчезающе малую
      вероятность случайности.

      ### Middle
      Типичные причины:

      - часть событий одной группы теряется при сборе;
      - вариант B грузится дольше, и пользователи уходят до регистрации показа;
      - фильтрация ботов или дедупликация работает несимметрично;
      - пользователи меняют группу при повторном заходе из-за нестабильного
        назначения.

      Важно, что перекос почти никогда не бывает нейтральным: обычно теряются
      именно определённые пользователи — с медленным интернетом, со старыми
      устройствами. Значит, оставшиеся группы несравнимы.

      ### Senior
      Ждут понимания, почему нельзя «поправить коэффициентом»: проблема не в
      числах, а в том, что состав групп различается по неизвестным признакам.
      Домножение маскирует смещение, а не устраняет его.

      Хороший ответ включает процедуру: проверка долей должна выполняться
      автоматически на каждом тесте до того, как кто-то посмотрит на метрики.
      Иначе соблазн объяснить перекос задним числом слишком велик, особенно
      когда результат нравится.
    common_mistakes:
      - Игнорировать небольшое на вид расхождение долей.
      - Пытаться исправить перекос нормировкой.
      - Проверять доли только после просмотра результата.
    follow_ups:
      - Почему потерянные пользователи обычно не случайны?
      - Как автоматизировать проверку сплитования?

  - slug: analyst_ab_novelty_effect
    specializations: [data_analyst]
    topic: ab_testing
    subtopic: interpretation
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Новая кнопка дала +15% кликов в первую неделю. Что проверить перед раскатом?"
    answer_short: >-
      Держится ли эффект во времени. Заметное изменение интерфейса часто даёт
      всплеск из-за новизны, который затухает за пару недель. Отдельно смотрят
      на новых и вернувшихся пользователей и проверяют, не выросли ли клики за
      счёт метрики ниже по воронке.
    answer_detailed: |
      ### Junior
      Эффект новизны: пользователи замечают изменение и кликают из
      любопытства. Через неделю-другую поведение возвращается к прежнему.
      Обратное явление — неприятие изменений: привычные пользователи сначала
      теряются, а потом привыкают.

      ### Middle
      Как отличить:

      - разбить эффект по дням от начала теста и посмотреть динамику;
      - сравнить новых пользователей (для них ничего не менялось) и старых —
        у новых эффекта новизны быть не может;
      - продлить тест, если тренд не стабилизировался.

      Второй вопрос важнее первого: рост кликов — не цель. Если кликов больше, а
      покупок столько же, кнопка просто собирает случайные нажатия. Смотреть
      нужно на метрику ниже по воронке.

      ### Senior
      Ждут разговора о контрольных метриках: рост целевой метрики может быть
      оплачен ухудшением другой — скоростью загрузки, числом обращений в
      поддержку, отписками. Их фиксируют заранее и проверяют вместе с главной.

      Полезно упомянуть долгосрочный эффект: часть изменений выгодна на неделе и
      вредна на квартале — агрессивные уведомления повышают возвраты и повышают
      отток. Для таких случаев держат резервную группу, не получающую изменений
      длительное время.
    common_mistakes:
      - Раскатывать изменение по недельному всплеску.
      - Смотреть только на верхнюю метрику воронки.
      - Не проверять динамику эффекта по дням.
    follow_ups:
      - Как отличить эффект новизны от настоящего улучшения?
      - Зачем нужна долгосрочная резервная группа?

  - slug: analyst_ab_no_significance
    specializations: [data_analyst]
    topic: ab_testing
    subtopic: interpretation
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Тест завершён, значимого различия нет. Продакт просит «посмотреть по сегментам». Как поступить?"
    answer_short: >-
      Объяснить риск: перебор сегментов почти гарантированно найдёт случайную
      значимость. Разведочный анализ допустим, но его результат — гипотеза для
      следующего теста, а не основание для раската. Заранее объявленные сегменты
      — другое дело, их можно смотреть.
    answer_detailed: |
      ### Junior
      Проверив десять сегментов при пороге 0.05, в среднем находят одно ложное
      срабатывание. Найденный таким образом «эффект на пользователях Android из
      Москвы» обычно не воспроизводится.

      ### Middle
      Разграничение простое:

      - **Заранее объявленные срезы** (например, платформа, если гипотеза
        касалась мобильного интерфейса) — законны, с поправкой на число
        сравнений.
      - **Поиск после просмотра результата** — разведка. Её результат
        оформляется как гипотеза, и проверяется отдельным тестом.

      Отрицательный результат сам по себе ценен: он экономит разработку и
      закрывает направление. Признать «не сработало» — нормальный исход теста, а
      не провал аналитика.

      ### Senior
      Ждут разговора о том, что делать вместо. Полезнее посмотреть на
      доверительный интервал: если он узкий и включает ноль, эффекта
      действительно нет; если широкий — тесту не хватило мощности, и вывод
      «не работает» преждевременен. Это принципиально разные ситуации, а p-value
      их не различает.

      Сильный ответ включает разговор с продактом: предложить проверить, была ли
      гипотеза вообще реализована как задумано, не сломалось ли что-то в
      реализации, и какой минимальный эффект был бы интересен — возможно, тест
      изначально не мог его уловить.
    common_mistakes:
      - Искать значимость по сегментам после отрицательного результата.
      - Считать отсутствие значимости доказательством отсутствия эффекта.
      - Не различать узкий и широкий доверительный интервал вокруг нуля.
    follow_ups:
      - Чем узкий интервал вокруг нуля отличается от широкого?
      - Как оформить находку из разведочного анализа?

  # --- Метрики продукта -------------------------------------------------------

  - slug: analyst_metrics_definition
    specializations: [data_analyst]
    topic: metrics
    subtopic: definition
    min_grade: junior_plus
    peak_grade: middle_plus
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Руководитель просит показать «активных пользователей». Ваши действия?"
    answer_short: >-
      Уточнить определение: что считается активностью, за какой период, кто
      попадает в знаменатель, как учитывать несколько устройств и ботов. Без
      этого цифру нельзя ни повторить, ни сравнить со следующим месяцем.
    answer_detailed: |
      ### Junior
      Вопросы, которые нужно задать: заход в приложение считается активностью
      или нужно целевое действие? Окно — сутки, неделя, месяц? Считаем
      пользователей или устройства? Включаем ли сотрудников и тестовые аккаунты?

      ### Middle
      Разные определения дают числа, отличающиеся в разы. «Открыл приложение» и
      «совершил целевое действие» — это две разные метрики, и обе законны, но
      называть обе «активными пользователями» нельзя.

      Практика — записать определение в словаре метрик: формула, источник
      данных, исключения, дата введения. Тогда через полгода никто не будет
      спорить, почему цифры в двух отчётах разные.

      ### Senior
      Ждут понимания, зачем это нужно на самом деле. Метрика без чёткого
      определения не может быть целью: её невозможно ни улучшать осознанно, ни
      проверять на манипуляцию.

      Второй сюжет — сопоставимость во времени. Меняя определение, нужно
      пересчитать историю, иначе на графике возникнет разрыв, который примут за
      реальное изменение. Если пересчёт невозможен, разрыв помечают прямо на
      графике.

      Сильный ответ добавляет встречный вопрос: «а какое решение вы примете по
      этой цифре?» Часто выясняется, что нужна не активность, а удержание или
      частота — и это меняет всю задачу.
    common_mistakes:
      - Отдавать цифру без зафиксированного определения.
      - Менять определение метрики без пересчёта истории.
      - Не спрашивать, какое решение будет принято по цифре.
    follow_ups:
      - Что должно быть в словаре метрик?
      - Как показывать изменение методики на графике?

  - slug: analyst_metrics_cohorts
    specializations: [data_analyst]
    topic: metrics
    subtopic: cohorts
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Общее число пользователей растёт, а выручка стоит на месте. Как разобраться?"
    answer_short: >-
      Разложить по когортам привлечения. Общий график смешивает старых и новых
      пользователей: приток новых может маскировать ухудшение удержания или
      падение качества трафика. Когортный анализ показывает, что происходит с
      каждым набором отдельно.
    answer_detailed: |
      ### Junior
      Когорта — группа пользователей, объединённая моментом прихода. Смотрят,
      как ведёт себя каждая когорта на первой, второй, третьей неделе жизни.

      ### Middle
      Что обычно обнаруживается:

      - удержание новых когорт хуже старых — качество трафика упало;
      - удержание одинаковое, но выручка на пользователя ниже — привлекают
        менее платёжеспособную аудиторию;
      - старые когорты деградируют — продукт ухудшился для действующих
        пользователей.

      Это три разные проблемы с разными решениями, и общий график их не
      различает.

      ### Senior
      Ждут понимания, что рост числа пользователей при неизменной выручке —
      частый признак того, что рост оплачен маркетингом, а экономика не
      сходится. Проверяется сопоставлением стоимости привлечения и накопленной
      выручки когорты: если когорта не окупается за приемлемый срок, рост
      убыточен.

      Полезно упомянуть, что когорты строят не только по дате прихода, но и по
      каналу, устройству, первому действию — часто именно разрез по каналу
      показывает, что один источник трафика портит всю картину.
    common_mistakes:
      - Анализировать общий график вместо когорт.
      - Смотреть только удержание, не проверяя выручку когорты.
      - Не разделять когорты по каналам привлечения.
    follow_ups:
      - Как понять, окупается ли когорта?
      - По каким признакам ещё строят когорты?

  - slug: analyst_metrics_vanity
    specializations: [data_analyst]
    topic: metrics
    subtopic: guardrails
    min_grade: middle
    peak_grade: middle_plus
    max_grade: lead
    frequency: 4
    type: single_choice
    title: "Команду премируют за рост числа регистраций. Какой риск это создаёт?"
    options:
      - code: a
        text: "Никакого: регистрации — понятная и измеримая цель"
      - code: b
        text: "Метрику начнут улучшать способами, вредными для продукта: навязчивые формы, регистрация до показа ценности, накрутка"
        is_correct: true
      - code: c
        text: "Регистрации невозможно измерить точно"
      - code: d
        text: "Риск только в том, что метрика запаздывает"
    answer_short: >-
      Любая метрика, ставшая целью, перестаёт быть хорошей мерой. Регистрации
      легко нарастить за счёт качества: заставить регистрироваться до показа
      ценности, усложнить выход, привлечь нецелевой трафик. Защита —
      контрольные метрики и цель ниже по воронке.
    answer_detailed: |
      ### Junior
      Это закон Гудхарта в чистом виде. Метрика была полезным индикатором,
      пока за неё не начали премировать.

      ### Middle
      Что делают на практике:

      - выбирают целью метрику ближе к ценности: не регистрации, а активные
        пользователи через неделю после регистрации;
      - фиксируют контрольные метрики, которые не должны ухудшаться:
        удержание, конверсия в покупку, доля жалоб;
      - смотрят пару метрик вместе — количество и качество.

      Контрольные метрики особенно важны в экспериментах: изменение считается
      успешным только если целевая выросла, а контрольные не просели.

      ### Senior
      Ждут понимания роли аналитика: указать на риск метрики до того, как её
      сделают целью, — часть работы. Аналитик, который молча считает то, что
      просят, не выполняет свою функцию.

      Хороший ответ включает и обратную сторону: метрика, которую невозможно
      «накрутить», обычно слишком далека от действий команды, и тогда она не
      помогает принимать решения. Практический компромисс — промежуточная
      метрика как рабочая цель плюс контрольные метрики как ограничение.
    common_mistakes:
      - Ставить целью метрику верха воронки без контрольных.
      - Не предупреждать о рисках выбранной метрики.
      - Выбирать метрику, на которую команда не может повлиять.
    follow_ups:
      - Что такое контрольные метрики и как их выбирать?
      - Почему слишком «честная» метрика бывает бесполезной?

  - slug: analyst_metrics_unit_economics
    specializations: [data_analyst]
    topic: metrics
    subtopic: unit_economics
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как понять, что привлечение пользователей окупается?"
    answer_short: >-
      Сравнить накопленную маржинальную прибыль от когорты со стоимостью её
      привлечения и посмотреть срок окупаемости. Сравнение выручки с затратами
      без учёта себестоимости и без горизонта времени вводит в заблуждение.
    answer_detailed: |
      ### Junior
      Базовое сопоставление: сколько стоило привлечь пользователя и сколько он
      принёс. Важно брать не выручку, а маржу — из выручки вычитают
      себестоимость, комиссии, поддержку.

      ### Middle
      Ключевой вопрос — горизонт. Пользователь может окупиться за три месяца
      или за два года; при быстром росте второе означает кассовый разрыв, даже
      если в итоге всё сходится.

      Поэтому смотрят на срок окупаемости и на накопленную кривую по когорте, а
      не на одно итоговое число.

      Отдельная тонкость — оценка пожизненной ценности. Экстраполяция по первым
      неделям почти всегда завышает: кривая удержания выполаживается, но и
      затухает, а простая формула этого не учитывает.

      ### Senior
      Ждут честности насчёт неопределённости. Пожизненная ценность — это
      прогноз, а не факт, и подавать его как точное число некорректно.
      Разумная подача: диапазон при разных сценариях удержания и явное
      указание, на каких данных построена экстраполяция.

      Второй сюжет — предельные затраты вместо средних. Если канал масштабируют,
      стоимость привлечения растёт: дешёвая аудитория заканчивается. Решение о
      наращивании принимается по предельной стоимости, а не по средней за
      прошлый период.
    common_mistakes:
      - Сравнивать выручку с затратами без учёта себестоимости.
      - Экстраполировать пожизненную ценность по первым неделям.
      - Планировать масштабирование по средней стоимости привлечения.
    follow_ups:
      - Почему срок окупаемости важнее итогового отношения?
      - Чем предельная стоимость привлечения отличается от средней?

