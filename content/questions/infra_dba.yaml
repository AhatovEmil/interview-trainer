# Банк вопросов для infra_dba (администратор баз данных).
#
# Это данные, а не код. Все вопросы загружаются сидом с is_verified=false:
# проверенным вопрос становится только после ревью человеком (CLAUDE.md §8.1).
#
# Опорная СУБД — PostgreSQL: на неё приходится большинство вакансий, и её
# механика (многоверсионность, журнал предзаписи, очистка) задаёт словарь
# собеседования. Там, где поведение принципиально отличается в MySQL или
# Oracle, это отмечено в разборе.

version: 1

questions:
  # --- Устройство СУБД --------------------------------------------------------

  - slug: dba_mvcc
    specializations: [infra_dba]
    topic: architecture
    subtopic: mvcc
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Как многоверсионность позволяет читать без блокировок и чем за это платит база?"
    answer_short: >-
      Изменение не переписывает строку, а создаёт новую версию: читающие видят
      прежнюю и никого не ждут. Плата — старые версии остаются в файлах и
      требуют регулярной очистки, иначе таблица раздувается.
    answer_detailed: |
      ### Junior
      Читатели не блокируют писателей, писатели не блокируют читателей. Каждая
      транзакция видит снимок данных на момент своего начала.

      Обратная сторона: строка после обновления существует в двух экземплярах,
      и старый нужно кому-то убрать.

      ### Middle
      Уборкой занимается очистка: она помечает пространство, занятое версиями,
      которые уже никому не видны, как свободное для повторного использования.
      Место при этом обычно не возвращается операционной системе.

      Ключевое условие: версия считается ненужной, только если её не видит ни
      одна активная транзакция. Одна забытая открытая транзакция удерживает
      старые версии по всей базе — не только в таблицах, которые она читала.

      ### Senior
      Ждут понимания раздувания как основной эксплуатационной проблемы: таблица,
      которую часто обновляют, растёт быстрее, чем данные в ней, индексы растут
      вместе с ней, а планы запросов ухудшаются, потому что читать приходится
      больше страниц.

      Полезно назвать и вторую сторону — счётчик возраста транзакций.
      Он ограничен, и если очистка систематически не успевает, база в какой-то
      момент откажется принимать записи, чтобы не потерять данные. Это
      контролируемый останов, но останов.

      В MySQL с InnoDB механика похожа, но старые версии хранятся отдельно,
      и раздувание проявляется иначе — через рост сегмента отката.
    common_mistakes:
      - Считать, что очистка возвращает место операционной системе.
      - Не отслеживать долгие открытые транзакции.
      - Путать раздувание таблицы с ростом объёма данных.
    follow_ups:
      - Почему одна долгая транзакция мешает очистке всей базы?
      - Что произойдёт, если очистка систематически не успевает?

  - slug: dba_wal
    specializations: [infra_dba]
    topic: architecture
    subtopic: wal
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Зачем нужен журнал предзаписи и что происходит при внезапном отключении питания?"
    answer_short: >-
      Изменение сначала попадает в журнал и только потом — в файлы данных.
      После сбоя база проигрывает журнал и восстанавливает согласованное
      состояние: подтверждённые транзакции доводятся до конца, незавершённые
      отменяются.
    answer_detailed: |
      ### Junior
      Запись в журнал последовательна и потому быстра. Страницы данных
      записываются позже, пачками, в удобный момент.

      Транзакция считается зафиксированной, когда её запись в журнале дошла до
      диска, а не когда обновились файлы данных.

      ### Middle
      Отсюда два следствия:

      - производительность фиксации определяется скоростью записи журнала;
      - объём журнала между контрольными точками определяет время
        восстановления после сбоя.

      Настройка контрольных точек — компромисс: частые дают быстрое
      восстановление и равномерную нагрузку на диск, редкие — меньше
      повторных записей одних и тех же страниц.

      ### Senior
      Ждут знания, что журнал — основа не только восстановления, но и
      репликации и восстановления на момент времени: реплика проигрывает тот
      же поток записей.

      Отдельный сюжет — честность оборудования. Если диск или контроллер
      подтверждает запись, фактически держа её в своём кеше без защиты
      питанием, гарантия долговечности нарушается: база считает транзакцию
      зафиксированной, а после сбоя её нет. Это классическая причина потери
      данных на дешёвом железе.

      Полезно упомянуть режим асинхронной фиксации: он резко ускоряет запись
      ценой потери последних транзакций при сбое. Осознанный выбор для
      некритичных данных, катастрофа — для финансовых.
    common_mistakes:
      - Считать транзакцию зафиксированной после записи страниц данных.
      - Не проверять, честно ли оборудование подтверждает запись.
      - Включать асинхронную фиксацию без оценки допустимых потерь.
    follow_ups:
      - Как настройка контрольных точек влияет на восстановление?
      - Чем опасен кеш записи на контроллере без защиты питанием?

  - slug: dba_vacuum
    specializations: [infra_dba]
    topic: architecture
    subtopic: vacuum
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Таблица занимает 200 гигабайт, а данных в ней на 30. Как это вышло и что делать?"
    answer_short: >-
      Раздувание: место занято старыми версиями строк, которые не были
      переиспользованы. Обычная очистка освобождает место внутри файлов, но не
      сжимает их; вернуть место операционной системе можно перестроением
      таблицы — желательно без длительной блокировки.
    answer_detailed: |
      ### Junior
      Обычная очистка помечает пространство свободным для новых строк, но
      файлы не уменьшает. Если данные не растут, свободное место так и остаётся
      неиспользованным.

      ### Middle
      Причины, по которым очистка не справилась:

      - долгие открытые транзакции удерживали старые версии;
      - настройки автоматической очистки слишком щадящие для интенсивно
        обновляемой таблицы;
      - массовое удаление или обновление всей таблицы разом.

      Полная перестройка возвращает место, но блокирует таблицу на всё время
      работы и требует свободного места под копию. На боевой базе так делать
      нельзя.

      Практичный путь — перестроение без исключительной блокировки: оно
      занимает больше времени, но не останавливает работу.

      ### Senior
      Ждут внимания к предотвращению, а не только к лечению: настройка порогов
      автоматической очистки для конкретных больших таблиц, ограничение
      длительности транзакций, разбиение массовых обновлений на пачки.

      Полезно отметить, что индексы раздуваются вместе с таблицей и часто
      сильнее: их перестроение без блокировки — отдельная процедура, о которой
      забывают, вычистив таблицу.

      И трезвое замечание: умеренное раздувание — норма и даже полезно,
      свободное место переиспользуется под новые версии. Гнаться за нулём не
      нужно.
    common_mistakes:
      - Делать полную перестройку таблицы на работающей базе.
      - Чистить таблицу, забыв про раздувание индексов.
      - Массово обновлять всю таблицу одной командой.
    follow_ups:
      - Как перестроить таблицу без исключительной блокировки?
      - Какое раздувание считать нормальным?

  - slug: dba_memory_settings
    specializations: [infra_dba]
    topic: architecture
    subtopic: memory
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "На сервере 64 гигабайта памяти. Как распределить её между настройками базы?"
    answer_short: >-
      Разделяемый буфер — порядка четверти памяти, остальное оставляют
      файловому кешу операционной системы. Память на сортировку выделяется на
      операцию, а не на сервер, поэтому её задают скромно и умножают в уме на
      число одновременных запросов.
    answer_detailed: |
      ### Junior
      Основные потребители: разделяемый буфер страниц, память под сортировки и
      соединения, память под обслуживающие операции.

      Отдать всё под буфер нельзя: файловый кеш операционной системы тоже
      кеширует страницы базы и работает эффективно.

      ### Middle
      Главная ловушка — память на сортировку. Она выделяется на каждую
      сортировку в каждом запросе: сто одновременных запросов с двумя
      сортировками каждый при настройке в 256 мегабайт запросят до пятидесяти
      гигабайт. Отсюда практика задавать её умеренно глобально и повышать
      точечно для конкретных тяжёлых задач.

      Отдельно задают память под обслуживание — построение индексов и очистку:
      она используется немногими процессами и может быть больше.

      ### Senior
      Ждут понимания, что подсказка планировщику об объёме доступного кеша не
      выделяет память, а влияет на выбор плана: чем больше значение, тем охотнее
      планировщик выбирает индексный доступ.

      Полезно упомянуть большие страницы памяти: на серверах с крупным буфером
      они заметно снижают накладные расходы на работу с таблицей страниц.

      И самое практичное: настройки — это отправная точка. Проверяют по
      попаданиям в кеш, по объёму временных файлов и по времени ответа под
      реальной нагрузкой, а не по формулам из статей.
    common_mistakes:
      - Отдавать почти всю память разделяемому буферу.
      - Задавать большую память на сортировку глобально.
      - Настраивать по формулам без проверки под реальной нагрузкой.
    follow_ups:
      - Почему память на сортировку опасно задавать большой?
      - На что влияет подсказка об объёме доступного кеша?

  # --- Запросы и планы --------------------------------------------------------

  - slug: dba_explain_analyze
    specializations: [infra_dba]
    topic: queries
    subtopic: query_plans
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "На что смотреть в плане выполнения в первую очередь?"
    answer_short: >-
      На расхождение оценки и факта по числу строк: если планировщик ошибся в
      разы, весь план построен на неверных предпосылках. Затем — на самые
      дорогие узлы и на способы соединения таблиц.
    answer_detailed: |
      ### Junior
      План с фактическими данными показывает и предполагаемое, и реальное число
      строк на каждом узле, а также затраченное время.

      Разница между ними в десятки раз — главный сигнал: дальше искать причину
      неверной оценки, а не переписывать запрос наугад.

      ### Middle
      Частые причины неверных оценок:

      - устаревшая статистика — лечится её обновлением;
      - коррелирующие условия: планировщик перемножает избирательности,
        считая условия независимыми, и сильно занижает результат;
      - функции в условии, для которых оценки нет;
      - недостаточная детальность статистики для неравномерных данных.

      Способ соединения — следствие оценок: при верной оценке в несколько строк
      вложенный цикл оптимален, при ошибке в тысячу раз он превращается в
      катастрофу.

      ### Senior
      Ждут внимания к буферам: сколько страниц прочитано из кеша, сколько с
      диска. Запрос может выглядеть быстрым на прогретом кеше и быть тяжёлым в
      реальности.

      Полезно упомянуть расширенную статистику для коррелирующих колонок —
      прямое лечение самой частой причины плохих планов, — и то, что план
      снимают на данных, сопоставимых с боевыми: на тестовой базе с тысячей
      строк планировщик выберет другое.
    common_mistakes:
      - Смотреть на итоговое время, игнорируя расхождение оценок.
      - Переписывать запрос, не обновив статистику.
      - Снимать план на тестовой базе с малым объёмом данных.
    follow_ups:
      - Как лечить занижение оценки при коррелирующих условиях?
      - Почему нужно смотреть на количество прочитанных страниц?

  - slug: dba_index_types
    specializations: [infra_dba]
    topic: queries
    subtopic: indexes
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Когда обычного индекса недостаточно и какие бывают альтернативы?"
    answer_short: >-
      Сбалансированное дерево покрывает сравнения и диапазоны, но не помогает
      при поиске по тексту, по содержимому массивов и документов, по
      пересечению интервалов. Для этого есть инвертированные индексы, индексы
      по выражению, частичные и покрывающие.
    answer_detailed: |
      ### Junior
      Обычный индекс работает для равенства, диапазонов и сортировки, а также
      для поиска по началу строки.

      Условие с функцией на колонке индекс не использует — если только не
      создан индекс по тому же выражению.

      ### Middle
      Что стоит знать:

      - **частичный индекс**: строится только по части строк — например, по
        активным заказам. Меньше по размеру и дешевле в поддержке;
      - **индекс по выражению**: под конкретное условие вроде поиска по
        приведённой к нижнему регистру строке;
      - **покрывающий**: содержит все нужные запросу колонки, обращение к
        таблице не требуется;
      - **инвертированный**: для полнотекстового поиска, массивов и документов;
      - **хеш-индекс**: только равенство, узкая ниша.

      Составной индекс ускоряет запросы, где фильтруются первые колонки; порядок
      определяет применимость.

      ### Senior
      Ждут понимания цены: каждый индекс замедляет вставку и обновление,
      занимает место, раздувается и требует обслуживания. Неиспользуемые
      индексы — чистый убыток, и их стоит регулярно выявлять по счётчикам
      обращений.

      Полезно упомянуть, что в PostgreSQL обновление строки обычно обновляет
      все индексы таблицы, поэтому десять индексов делают запись заметно
      дороже. Оптимизация под чтение всегда оплачивается записью.
    common_mistakes:
      - Создавать индексы без проверки их фактического использования.
      - Не учитывать порядок колонок в составном индексе.
      - Оптимизировать чтение, не оценив просадку записи.
    follow_ups:
      - Когда уместен частичный индекс?
      - Как найти неиспользуемые индексы?

  - slug: dba_slow_query_hunt
    specializations: [infra_dba]
    topic: queries
    subtopic: slow_queries
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: single_choice
    title: "База стала медленной, конкретных жалоб нет. С чего начать поиск?"
    options:
      - code: a
        text: "Перезапустить сервер и посмотреть, поможет ли"
      - code: b
        text: "Со статистики по запросам: найти те, что дают наибольшее суммарное время, а не самые долгие поодиночке"
        is_correct: true
      - code: c
        text: "Добавить индексы на все колонки в условиях"
      - code: d
        text: "Увеличить память под буферы"
    answer_short: >-
      По накопленной статистике: сортировка по суммарному времени показывает
      реальных потребителей ресурсов. Запрос на 10 миллисекунд, выполняемый
      миллион раз в час, вредит больше, чем разовый пятисекундный отчёт.
    answer_detailed: |
      ### Junior
      Расширение сбора статистики по запросам — первое, что включают на боевой
      базе. Оно агрегирует запросы по форме, независимо от значений параметров.

      ### Middle
      Порядок разбора:

      1. Суммарное время по запросам — кто съедает базу.
      2. Среднее время и число вызовов — это один тяжёлый запрос или много
         частых.
      3. Число прочитанных страниц — запрос может быть быстрым, но вымывать
         кеш.
      4. План для подозрительных запросов.

      Частый вызов лёгкого запроса обычно означает проблему на стороне
      приложения — запрос в цикле, отсутствие кеша, — а не отсутствие индекса.

      ### Senior
      Ждут разделения причин: медленно стало из-за роста данных, из-за
      изменения планов после обновления статистики, из-за роста нагрузки, из-за
      блокировок или из-за упора в диск. Это разные диагнозы и разные лечения.

      Полезно упомянуть анализ ожиданий: он показывает, чего процессы ждут —
      блокировок, ввода-вывода, журнала. Часто это отвечает на вопрос быстрее,
      чем разбор отдельных запросов.
    common_mistakes:
      - Искать самый долгий запрос вместо самого затратного суммарно.
      - Добавлять индексы до анализа статистики.
      - Не различать медленный запрос и ожидание блокировки.
    follow_ups:
      - Что показывает анализ ожиданий?
      - Почему частый лёгкий запрос — проблема приложения?

  - slug: dba_statistics
    specializations: [infra_dba]
    topic: queries
    subtopic: statistics
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "После массовой загрузки данных запросы стали выполняться в сто раз дольше. Почему?"
    answer_short: >-
      Статистика не успела обновиться, и планировщик строит планы по прежним
      представлениям об объёме и распределении данных. Обновление статистики по
      затронутым таблицам обычно возвращает нормальные планы сразу.
    answer_detailed: |
      ### Junior
      Планировщик выбирает план не по фактическим данным, а по оценкам,
      основанным на собранной статистике. Загрузили миллион строк в таблицу,
      где было сто, — оценки устарели.

      Обновление статистики после массовой загрузки — обязательный шаг.

      ### Middle
      Автоматический сбор запускается по накоплению изменений, и для большой
      таблицы порог по умолчанию достигается нескоро. Для крупных таблиц пороги
      настраивают отдельно.

      Дополнительно: у новой таблицы статистики нет вовсе, и до первого сбора
      планировщик работает вслепую.

      ### Senior
      Ждут понимания, что детальность статистики настраивается: для колонок с
      сильно неравномерным распределением стандартной точности не хватает, и
      оценки для редких значений оказываются грубыми.

      Полезно назвать и обратный случай: планы ухудшились после обновления
      статистики — так бывает, когда прежняя оценка была неверной, но случайно
      приводила к удачному плану. Тогда разбираются с причиной, а не
      возвращают устаревшую статистику.
    common_mistakes:
      - Не обновлять статистику после массовой загрузки.
      - Полагаться на пороги автоматического сбора для больших таблиц.
      - Оставлять стандартную детальность для неравномерных данных.
    follow_ups:
      - Как повысить детальность статистики для отдельной колонки?
      - Что делать, если планы ухудшились после обновления статистики?

  # --- Транзакции и блокировки ------------------------------------------------

  - slug: dba_isolation_levels
    specializations: [infra_dba]
    topic: transactions
    subtopic: isolation
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Какие уровни изоляции есть и какие аномалии каждый допускает?"
    answer_short: >-
      Чтение зафиксированного не даёт грязного чтения, но допускает
      неповторяющееся чтение и фантомы. Повторяемое чтение фиксирует снимок на
      всю транзакцию. Сериализуемый исключает все аномалии ценой откатов при
      конфликтах.
    answer_detailed: |
      ### Junior
      Аномалии по возрастанию: грязное чтение (видны незафиксированные
      изменения), неповторяющееся чтение (повторный запрос даёт другое
      значение), фантомы (появляются новые строки, подходящие под условие).

      Уровень по умолчанию в PostgreSQL — чтение зафиксированного. Каждый
      оператор внутри транзакции видит свой снимок.

      ### Middle
      Важная деталь реализации: в PostgreSQL повторяемое чтение не допускает
      фантомов, хотя стандарт это разрешает, — благодаря снимку на всю
      транзакцию. В MySQL поведение отличается.

      Практическое следствие повторяемого чтения: при конфликте обновлений
      транзакция получает ошибку сериализации и должна быть повторена. Приложение
      обязано это уметь.

      ### Senior
      Ждут понимания аномалии перекоса записи: две транзакции читают
      непересекающиеся данные, проверяют условие и обе записывают, нарушая
      инвариант, который по отдельности каждая соблюдала. Классический пример —
      правило «хотя бы один дежурный»: двое одновременно снимаются с дежурства.

      На уровне чтения зафиксированного и повторяемого чтения это возможно.
      Лечится сериализуемым уровнем либо явной блокировкой строк при чтении.

      Полезно отметить цену: сериализуемый уровень требует готовности повторять
      транзакции и заметно проигрывает под высокой конкуренцией.
    common_mistakes:
      - Не обрабатывать ошибки сериализации в приложении.
      - Считать поведение уровней одинаковым в разных СУБД.
      - Не замечать перекос записи как отдельный класс проблем.
    follow_ups:
      - Что такое перекос записи и как от него защититься?
      - Почему повторяемое чтение требует повторных попыток?

  - slug: dba_deadlocks
    specializations: [infra_dba]
    topic: transactions
    subtopic: deadlocks
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "В логах регулярно появляются взаимные блокировки. Как их устранять?"
    answer_short: >-
      Найти в логе пару конфликтующих запросов и привести их к единому порядку
      захвата ресурсов — большинство взаимных блокировок возникает из-за
      разного порядка обновления одних и тех же строк. Приложение при этом
      обязано уметь повторять транзакцию.
    answer_detailed: |
      ### Junior
      Взаимная блокировка — две транзакции ждут друг друга. База обнаруживает
      цикл и снимает одну из них с ошибкой.

      Лог содержит обе стороны конфликта — с него и начинают.

      ### Middle
      Основные причины и лечение:

      - разный порядок обновления строк — упорядочить, например по
        идентификатору;
      - обновление множества строк одним запросом без определённого порядка —
        добавить сортировку;
      - долгие транзакции, удерживающие блокировки, — сократить;
      - лишние блокирующие операции — часть проверок можно делать без
        удержания.

      Полностью исключить взаимные блокировки нельзя, поэтому повтор транзакции
      с небольшой задержкой — не костыль, а нормальная часть работы приложения.

      ### Senior
      Ждут различения взаимной блокировки и простого ожидания: последнее чаще и
      вреднее, а в логи не попадает без настройки порога. Очередь из ста
      транзакций к одной строке — не взаимная блокировка, но результат тот же.

      Полезно упомянуть счётчик-строку как классический источник: все обновляют
      одну запись, и она становится точкой сериализации. Лечится разбиением
      счётчика на части с периодическим сведением.
    common_mistakes:
      - Повторять транзакцию, не устранив причину конфликта.
      - Не логировать долгие ожидания блокировок.
      - Держать общий счётчик одной строкой при высокой нагрузке.
    follow_ups:
      - Чем ожидание блокировки хуже взаимной блокировки?
      - Как убрать точку сериализации на счётчике?

  - slug: dba_long_transactions
    specializations: [infra_dba]
    topic: transactions
    subtopic: long_transactions
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: single_choice
    title: "Приложение открывает транзакцию и держит её открытой часами в состоянии простоя. Чем это опасно?"
    options:
      - code: a
        text: "Ничем, простаивающая транзакция не потребляет ресурсов"
      - code: b
        text: "Она удерживает снимок и блокировки: очистка не может убрать старые версии, база раздувается по всем таблицам"
        is_correct: true
      - code: c
        text: "Только тем, что занимает одно соединение"
      - code: d
        text: "Замедляет только те таблицы, к которым обращалась"
    answer_short: >-
      Открытая транзакция фиксирует границу видимости для всей базы: версии
      строк, которые она теоретически может увидеть, удалять нельзя. Одна
      забытая транзакция раздувает таблицы, которых даже не касалась.
    answer_detailed: |
      ### Junior
      Транзакция в состоянии простоя внутри транзакции — типичный дефект
      приложения: соединение взято, транзакция открыта, а работа идёт где-то
      ещё.

      ### Middle
      Последствия по нарастающей:

      - очистка не убирает старые версии, таблицы и индексы раздуваются;
      - планы ухудшаются, потому что читать приходится больше страниц;
      - удерживаемые блокировки могут выстроить очередь;
      - при очень долгом удержании база приближается к пределу счётчика
        транзакций.

      Практическая защита — ограничение времени простоя внутри транзакции на
      уровне сервера. Оно обрывает такие соединения автоматически.

      ### Senior
      Ждут разговора о причине на стороне приложения: транзакция, открытая на
      время внешнего вызова, отчёт, читающий данные часами, пулер соединений в
      режиме сессии с длинными паузами.

      Полезно отметить, что мониторинг возраста самой старой транзакции —
      обязательная метрика. Она предупреждает о проблеме за часы до того, как
      раздувание станет заметным.
    common_mistakes:
      - Не ограничивать время простоя внутри транзакции.
      - Держать транзакцию открытой на время внешнего вызова.
      - Не отслеживать возраст самой старой транзакции.
    follow_ups:
      - Почему страдают таблицы, к которым транзакция не обращалась?
      - Какие ограничения по времени стоит выставить на сервере?

  # --- Резервное копирование --------------------------------------------------

  - slug: dba_backup_strategy
    specializations: [infra_dba]
    topic: backup
    subtopic: strategies
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Как построить схему резервного копирования и почему логической выгрузки недостаточно?"
    answer_short: >-
      Основа — физическая копия плюс непрерывный архив журналов: это даёт
      восстановление на любой момент. Логическая выгрузка удобна для переноса
      отдельных таблиц, но для большой базы восстанавливается часами и теряет
      всё после момента снятия.
    answer_detailed: |
      ### Junior
      Логическая выгрузка — набор команд, воссоздающих данные. Проста и
      переносима между версиями, но для терабайтной базы восстановление
      занимает недопустимо долго.

      Физическая копия — снимок файлов базы. Восстанавливается быстро, но
      привязана к версии и платформе.

      ### Middle
      Рабочая схема: периодическая полная физическая копия плюс непрерывная
      архивация журналов. Тогда можно восстановиться на любой момент между
      копиями, а не только на время последней.

      Что учесть:

      - копии хранятся отдельно от базы, желательно в другом месте;
      - глубина хранения задаётся требованиями, а не свободным местом;
      - копия снимается с реплики, чтобы не нагружать основной сервер;
      - логическая выгрузка сохраняется дополнительно — она спасает при
        повреждении, которое физическая копия воспроизведёт как есть.

      ### Senior
      Ждут разговора о допустимых потерях и времени восстановления. Это
      требования бизнеса, из которых следует схема, а не наоборот: допустимая
      потеря в пять минут означает архивацию журналов не реже чем раз в пять
      минут.

      Полезно отметить сценарий, который физические копии не покрывают:
      ошибочное удаление данных, обнаруженное через неделю. Здесь нужна либо
      глубина хранения, покрывающая срок обнаружения, либо отдельные логические
      выгрузки.
    common_mistakes:
      - Полагаться только на логическую выгрузку для большой базы.
      - Определять глубину хранения по свободному месту.
      - Хранить копии рядом с базой.
    follow_ups:
      - Как допустимая потеря данных определяет частоту архивации?
      - Какие сценарии не покрывает физическая копия?

  - slug: dba_restore_drill
    specializations: [infra_dba]
    topic: backup
    subtopic: restore_drills
    min_grade: middle
    peak_grade: middle_plus
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Копии снимаются каждую ночь и завершаются без ошибок. Достаточно ли этого?"
    answer_short: >-
      Нет. Копия, из которой ни разу не восстанавливались, не является копией.
      Проверка должна быть регулярной, автоматической и включать полное
      восстановление с замером времени и контролем целостности данных.
    answer_detailed: |
      ### Junior
      Успешное завершение процедуры копирования не гарантирует, что из файла
      можно восстановиться: файл может быть повреждён, неполон, зашифрован
      утраченным ключом.

      ### Middle
      Что должна проверять регулярная процедура:

      - копия разворачивается на отдельном сервере до конца;
      - база запускается и принимает запросы;
      - данные на месте: контрольные запросы по ключевым таблицам;
      - засечено время восстановления — оно должно укладываться в
        согласованный норматив;
      - архив журналов применяется, восстановление на произвольный момент
        работает.

      Автоматизация обязательна: ручная проверка «когда будет время» не
      выполняется никогда.

      ### Senior
      Ждут разговора об учениях целиком, а не только о технической проверке:
      кто получает оповещение, у кого есть доступ, где записана процедура, что
      делать, если недоступен человек, обычно этим занимающийся.

      Полезно отметить восстановленную копию как побочную ценность: на ней
      удобно проверять миграции, тяжёлые запросы и обновления версии — то есть
      проверка окупается не только страховкой.

      И честное замечание: инцидент с потерей данных почти всегда обнаруживает
      что-то, чего не было в процедуре. Регулярные учения сокращают этот
      список, но не обнуляют.
    common_mistakes:
      - Считать успешное создание копии подтверждением её пригодности.
      - Проверять восстановление вручную и нерегулярно.
      - Не замерять фактическое время восстановления.
    follow_ups:
      - Что кроме техники должно быть отрепетировано?
      - Зачем замерять время восстановления регулярно?

  - slug: dba_pitr
    specializations: [infra_dba]
    topic: backup
    subtopic: pitr
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Разработчик по ошибке удалил данные из таблицы полчаса назад. Как их вернуть?"
    answer_short: >-
      Восстановлением на момент времени: развернуть последнюю физическую копию
      на отдельном сервере и проиграть журналы до момента перед удалением.
      Затем перенести нужные строки — не переключая на восстановленную базу
      всё приложение.
    answer_detailed: |
      ### Junior
      Восстанавливать поверх работающей базы нельзя: за полчаса накопились
      другие изменения, и откат уничтожит их.

      Поэтому копию разворачивают отдельно и забирают только потерянное.

      ### Middle
      Порядок действий:

      1. Зафиксировать точное время ошибочной операции — по логам или по
         идентификатору транзакции.
      2. Развернуть последнюю копию на отдельном сервере.
      3. Проиграть архив журналов до момента перед операцией.
      4. Выгрузить нужные данные и перенести в боевую базу.
      5. Проверить согласованность со связанными таблицами.

      Пятый шаг обычно самый сложный: за полчаса связанные данные могли
      измениться, и простая вставка старых строк нарушит целостность.

      ### Senior
      Ждут внимания к первому действию — остановить дальнейший ущерб и не
      затереть архив журналов. Именно в спешке инцидента их иногда очищают,
      освобождая место.

      Полезно назвать профилактику: разделение прав, запрет прямого доступа к
      боевой базе, обязательная транзакция с проверкой числа затронутых строк
      перед фиксацией. Восстановление — последняя линия, а не первая.

      И оценка времени: восстановление терабайтной базы занимает часы. Об этом
      нужно сообщить сразу, чтобы бизнес принял решение с реальными сроками.
    common_mistakes:
      - Восстанавливать поверх работающей базы.
      - Очищать архив журналов во время инцидента.
      - Переносить старые строки без проверки связанных данных.
    follow_ups:
      - Почему перенос данных сложнее самого восстановления?
      - Что сделать в первые минуты после обнаружения ошибки?

  - slug: dba_rpo_rto
    specializations: [infra_dba]
    topic: backup
    subtopic: rpo_rto
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Бизнес говорит: потерь данных быть не должно, простой недопустим. Как вести такой разговор?"
    answer_short: >-
      Перевести требования в числа и в деньги: нулевые потери и нулевой простой
      технически достижимы, но стоят кратно дороже. Обычно после оценки
      стоимости требования смягчаются до реалистичных.
    answer_detailed: |
      ### Junior
      Два разных параметра: сколько данных допустимо потерять и сколько времени
      система может быть недоступна. Их путают, а лечатся они по-разному.

      ### Middle
      Что определяет каждый:

      - допустимая потеря — частотой архивации журналов и режимом репликации;
      - допустимый простой — наличием горячего резерва и автоматикой
        переключения.

      Нулевая потеря требует синхронной репликации: фиксация ждёт подтверждения
      от реплики, что замедляет запись. Это прямая плата, которую нужно
      назвать.

      Нулевой простой требует автоматического переключения, а оно приносит свой
      риск — ложное срабатывание и расщепление кластера.

      ### Senior
      Ждут умения строить разговор от стоимости простоя: час недоступности
      стоит столько-то, схема с автоматическим переключением стоит столько-то в
      год. Дальше решение принимает бизнес, а не администратор.

      Полезно развести классы данных: платежи требуют нулевой потери,
      аналитические витрины переживут потерю суток. Единое требование для всей
      базы обычно означает, что его не обсуждали предметно.

      И назвать честно: гарантия нулевой потери при отказе целого дата-центра
      требует синхронной репликации между площадками, а это задержка на каждой
      фиксации. Физику отменить нельзя.
    common_mistakes:
      - Не разделять допустимую потерю и допустимый простой.
      - Обещать нулевые значения без оценки стоимости.
      - Применять единые требования ко всем данным.
    follow_ups:
      - Чем платят за синхронную репликацию?
      - Какие риски приносит автоматическое переключение?

  # --- Репликация -------------------------------------------------------------

  - slug: dba_replication_modes
    specializations: [infra_dba]
    topic: replication
    subtopic: sync_async
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Чем синхронная репликация отличается от асинхронной и что выбрать?"
    answer_short: >-
      Асинхронная не задерживает фиксацию, но при отказе основного сервера
      теряются последние транзакции. Синхронная гарантирует их сохранность,
      добавляя к каждой фиксации сетевую задержку и делая запись зависимой от
      доступности реплики.
    answer_detailed: |
      ### Junior
      Асинхронная: основной сервер фиксирует транзакцию и отправляет изменения
      реплике, не дожидаясь ответа. Быстро, но реплика отстаёт.

      Синхронная: фиксация завершается только после подтверждения от реплики.
      Потерь нет, но каждая запись ждёт сети.

      ### Middle
      Практические следствия синхронного режима:

      - задержка каждой фиксации растёт на время передачи туда и обратно;
      - при недоступности реплики запись останавливается — если не настроено
        иное поведение;
      - нужны минимум две реплики, чтобы отказ одной не блокировал базу.

      Компромисс — синхронная репликация для критичных операций и асинхронная
      для остальных: режим настраивается на уровне транзакции.

      ### Senior
      Ждут понимания степеней подтверждения: реплика может подтвердить получение
      записи, её запись на диск или её применение. Это разные гарантии с разной
      ценой, и первая не защищает от одновременного отказа.

      Полезно отметить отставание реплики как отдельную метрику: асинхронная
      реплика под нагрузкой может отстать на минуты, и переключение на неё
      означает потерю этих минут. Отставание измеряют в байтах и в секундах —
      второе понятнее для разговора с бизнесом.
    common_mistakes:
      - Настраивать синхронную репликацию на одну реплику.
      - Не отслеживать отставание реплики.
      - Считать подтверждение получения гарантией сохранности.
    follow_ups:
      - Что произойдёт с записью при отказе синхронной реплики?
      - Чем различаются степени подтверждения от реплики?

  - slug: dba_read_replicas
    specializations: [infra_dba]
    topic: replication
    subtopic: read_replicas
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Чтение вынесли на реплику, и пользователи стали жаловаться, что не видят только что сохранённые данные. Что произошло?"
    answer_short: >-
      Реплика отстаёт: запись ушла на основной сервер, а следом идущее чтение
      попало на реплику, где изменения ещё нет. Лечится чтением с основного
      сервера сразу после записи либо ожиданием нужной позиции журнала.
    answer_detailed: |
      ### Junior
      Асинхронная реплика всегда немного позади. Обычно отставание миллисекунды,
      но под нагрузкой оно растёт.

      ### Middle
      Варианты решения:

      - **чтение с основного после записи**: в течение короткого окна запросы
        того же пользователя идут на основной сервер;
      - **ожидание позиции**: приложение запоминает позицию журнала после
        записи и ждёт, пока реплика её достигнет;
      - **синхронная репликация**: убирает проблему ценой задержки записи.

      Первый вариант проще всего и покрывает подавляющее большинство случаев.

      ### Senior
      Ждут понимания, что не всякое чтение требует свежих данных: отчёты,
      списки, аналитика прекрасно живут с отставанием в секунды. Разделять
      стоит по требованию к актуальности, а не по типу запроса.

      Полезно отметить конфликт на реплике: долгий запрос на реплике может
      конфликтовать с применением изменений с основного сервера. Либо запрос
      прерывается, либо применение задерживается — и второе увеличивает
      отставание. Это настраивается, и выбор нужно делать осознанно.
    common_mistakes:
      - Отправлять на реплику чтение сразу после записи.
      - Считать отставание реплики постоянным.
      - Не учитывать конфликт долгих запросов с применением изменений.
    follow_ups:
      - Какие запросы можно спокойно отдавать реплике?
      - Почему долгий запрос на реплике увеличивает отставание?

  - slug: dba_failover
    specializations: [infra_dba]
    topic: replication
    subtopic: failover
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Основной сервер базы недоступен. Что должно произойти и какие здесь риски?"
    answer_short: >-
      Одна из реплик становится основной, приложение перенаправляется на неё.
      Главные риски — расщепление кластера, когда старый сервер возвращается и
      продолжает принимать запись, и потеря транзакций, не дошедших до реплики.
    answer_detailed: |
      ### Junior
      Ручное переключение надёжнее, но занимает время и требует дежурного.
      Автоматическое быстрее, но принимает решение без человека.

      ### Middle
      Что должно быть в схеме:

      - независимый наблюдатель, а не сама реплика, решающий, что основной
        сервер мёртв: реплика может просто потерять сеть;
      - гарантия, что старый сервер не примет запись после переключения;
      - перенаправление приложения — через виртуальный адрес, пулер или
        обнаружение служб, а не правкой конфигурации вручную;
      - выбор наиболее свежей реплики, если их несколько.

      Расщепление кластера — худший сценарий: две базы принимают запись
      независимо, и слить их потом невозможно автоматически.

      ### Senior
      Ждут понимания кворума: решение о переключении принимается большинством
      узлов, поэтому их должно быть нечётное число и не меньше трёх. Два узла
      не позволяют отличить отказ соседа от собственной изоляции.

      Полезно отметить, что после переключения старый сервер обычно нельзя
      просто запустить обратно как реплику: его журнал разошёлся. Нужна
      процедура пересинхронизации.

      И практическое: автоматическое переключение стоит включать, только если
      его отрепетировали. Не отрепетированная автоматика чаще создаёт
      инциденты, чем предотвращает.
    common_mistakes:
      - Разрешать реплике самой решать, что основной сервер мёртв.
      - Строить кластер из двух узлов.
      - Возвращать старый сервер в строй без пересинхронизации.
    follow_ups:
      - Почему нужен нечётный состав узлов?
      - Что делать со старым сервером после переключения?

  # --- Эксплуатация -----------------------------------------------------------

  - slug: dba_connections_pooler
    specializations: [infra_dba]
    topic: operations
    subtopic: connections
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Приложение открывает 2000 соединений к PostgreSQL, база задыхается. Что делать?"
    answer_short: >-
      Поставить пулер соединений: PostgreSQL создаёт процесс на соединение, и
      тысячи процессов съедают память и время планировщика ОС. Пулер сводит их к
      десяткам реальных соединений.
    answer_detailed: |
      ### Junior
      Каждое соединение — отдельный процесс со своей памятью. Две тысячи
      процессов конкурируют за процессор, даже когда почти все простаивают.

      Разумное число одновременных активных соединений обычно измеряется
      десятками, а не тысячами.

      ### Middle
      Режимы пулера:

      - **сессия**: соединение закрепляется за клиентом до отключения — почти
        не даёт выигрыша при постоянных подключениях;
      - **транзакция**: соединение возвращается в пул после каждой транзакции —
        основной рабочий режим;
      - **оператор**: возвращается после каждого запроса — ломает транзакции.

      Режим транзакции несовместим с частью возможностей: подготовленные
      запросы на уровне сессии, временные таблицы, уведомления, настройки
      уровня сессии. Это регулярная причина загадочных ошибок после внедрения
      пулера.

      ### Senior
      Ждут понимания, что пулер не решает проблему, а ограничивает её:
      если приложению действительно нужно двести параллельных запросов, они
      выстроятся в очередь на пулере. Разница в том, что очередь дешевле
      конкуренции внутри базы.

      Полезно упомянуть, что размер пула подбирают экспериментально: слишком
      маленький создаёт очередь, слишком большой возвращает исходную проблему.
      Отправная точка обычно связана с числом ядер и характером нагрузки.
    common_mistakes:
      - Использовать режим сессии, ожидая эффекта от пулера.
      - Не проверять совместимость приложения с режимом транзакции.
      - Задавать размер пула наугад.
    follow_ups:
      - Что ломается в режиме транзакции?
      - Как подобрать размер пула?

  - slug: dba_monitoring_metrics
    specializations: [infra_dba]
    topic: operations
    subtopic: monitoring
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Какие метрики базы данных нужно отслеживать в первую очередь?"
    answer_short: >-
      Те, что предупреждают заранее: отставание реплики, возраст самой старой
      транзакции, отношение попаданий в кеш, число ожиданий блокировок, рост
      раздувания, свободное место. Загрузка процессора и объём базы сами по
      себе почти ничего не говорят.
    answer_detailed: |
      ### Junior
      Базовый набор: доступность, свободное место на диске, число соединений,
      время ответа.

      Свободное место — банально, но переполнение диска остаётся одной из самых
      частых причин остановки базы.

      ### Middle
      Что действительно предупреждает о проблемах:

      - отставание реплики — растёт до того, как что-то сломается;
      - возраст самой старой транзакции — предвестник раздувания;
      - доля попаданий в кеш — падение означает, что данные перестали
        помещаться в память;
      - ожидания блокировок — раньше, чем пользователи заметят;
      - объём временных файлов — признак нехватки памяти на сортировки;
      - раздувание крупных таблиц.

      ### Senior
      Ждут разделения на метрики для оповещений и метрики для разбора.
      Оповещать стоит по симптомам, которые видит пользователь — время ответа,
      доступность, — а остальное держать для диагностики. Оповещение по каждой
      технической метрике превращается в шум.

      Полезно упомянуть накопление истории: без базовой линии за месяцы
      невозможно отличить сезонный рост от аномалии. И сохранение планов
      медленных запросов — во время инцидента снимать их поздно.
    common_mistakes:
      - Оповещать по каждой технической метрике.
      - Не отслеживать возраст самой старой транзакции.
      - Не хранить историю для сравнения с базовой линией.
    follow_ups:
      - По каким метрикам стоит оповещать, а по каким нет?
      - Что означает падение доли попаданий в кеш?

  - slug: dba_major_upgrade
    specializations: [infra_dba]
    topic: operations
    subtopic: upgrades
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Нужно обновить PostgreSQL на новую основную версию с минимальным простоем. Как?"
    answer_short: >-
      Через логическую репликацию: поднять новую версию, настроить перенос
      изменений, дождаться синхронизации и переключить приложение. Простой
      сводится к минутам вместо часов, которых потребовала бы выгрузка и
      загрузка.
    answer_detailed: |
      ### Junior
      Простой путь — выгрузка и загрузка: надёжно, но для большой базы занимает
      часы простоя.

      Быстрее — утилита обновления на месте: она переносит файлы, но всё равно
      требует остановки.

      ### Middle
      Схема с логической репликацией:

      1. Поднять сервер новой версии.
      2. Перенести схему.
      3. Настроить логическую репликацию с текущей базы.
      4. Дождаться, пока отставание станет нулевым.
      5. Остановить запись, дождаться применения остатка, переключить
         приложение.

      Ограничения, которые нужно проверить заранее: не все объекты
      реплицируются логически, последовательности требуют отдельного переноса,
      таблицы без первичного ключа обрабатываются особым образом.

      ### Senior
      Ждут внимания к подготовке: проверка совместимости приложения с новой
      версией на копии, прогон нагрузочного теста, сравнение планов запросов —
      новая версия может изменить их не в лучшую сторону.

      Обязателен план отката: возможность вернуться на старую версию, если
      после переключения обнаружится проблема. Обратная логическая репликация,
      настроенная заранее, делает откат реальным, а не теоретическим.

      Полезно отметить, что статистику после переключения нужно собрать заново —
      она не переносится, и первые минуты после обновления база работает с
      плохими планами.
    common_mistakes:
      - Обновляться без проверки планов запросов на новой версии.
      - Не иметь плана отката после переключения.
      - Забыть собрать статистику после обновления.
    follow_ups:
      - Что не переносится логической репликацией?
      - Как обеспечить возможность отката?

  # --- Схема и миграции -------------------------------------------------------

  - slug: dba_online_migration
    specializations: [infra_dba]
    topic: schema
    subtopic: online_migrations
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Нужно добавить колонку с ограничением и индекс в таблицу на 500 миллионов строк без простоя. Как?"
    answer_short: >-
      По частям: добавить колонку без обязательности, заполнить пачками, затем
      добавить ограничение как непроверенное и проверить отдельно. Индекс
      строить в режиме без исключительной блокировки.
    answer_detailed: |
      ### Junior
      Опасные операции: добавление колонки с вычисляемым значением по умолчанию,
      изменение типа, добавление обязательности, построение индекса обычным
      способом. Все берут блокировку, при которой таблица недоступна.

      ### Middle
      Безопасный порядок:

      1. Добавить колонку без обязательности — операция мгновенная.
      2. Научить приложение писать в неё.
      3. Заполнить существующие строки пачками по несколько тысяч, с паузами.
      4. Добавить ограничение в непроверенном виде — быстро, без сканирования.
      5. Проверить его отдельной командой, которая не блокирует запись.
      6. Построить индекс в режиме без исключительной блокировки.

      Отдельная ловушка: даже быстрая операция изменения схемы ждёт
      исключительную блокировку, и пока она ждёт, за ней выстраивается очередь
      из всех запросов к таблице. Поэтому задают короткий таймаут ожидания
      блокировки и повторяют попытку.

      ### Senior
      Ждут понимания совместимости версий: во время выката работают старая и
      новая версии приложения одновременно. Схема должна быть совместима с
      обеими — отсюда правило раскладывать изменение на несколько выкатов:
      сначала добавить, потом начать использовать, потом убрать старое.

      Полезно отметить, что построение индекса без блокировки медленнее, может
      завершиться неудачей и оставить нерабочий индекс, который нужно удалить и
      построить заново. Это нормальный сценарий, к нему готовятся.
    common_mistakes:
      - Запускать изменение схемы без ограничения времени ожидания блокировки.
      - Заполнять колонку одним запросом по всей таблице.
      - Менять схему без учёта одновременной работы двух версий приложения.
    follow_ups:
      - Почему короткая операция может остановить всю таблицу?
      - Как раскладывать изменение схемы на несколько выкатов?

  - slug: dba_partitioning
    specializations: [infra_dba]
    topic: schema
    subtopic: partitioning
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Когда стоит секционировать таблицу и какую выгоду это даёт?"
    answer_short: >-
      Когда таблица велика и запросы естественно ограничены диапазоном — чаще
      всего по дате. Главная выгода обычно не в скорости чтения, а в дешёвом
      удалении старых данных и в обслуживании по частям.
    answer_detailed: |
      ### Junior
      Секционирование делит таблицу на части по правилу — по диапазону дат, по
      списку значений, по хешу. Для приложения это по-прежнему одна таблица.

      ### Middle
      Что реально даёт:

      - удаление старых данных превращается в отсоединение секции — мгновенно,
        вместо часов удаления и последующей очистки;
      - очистка и построение индексов идут по секциям, а не по всей таблице;
      - запросы с условием по ключу секционирования читают только нужные части.

      Последний пункт работает, только если условие позволяет определить
      секцию. Запрос без такого условия читает все секции и становится
      медленнее, чем был.

      ### Senior
      Ждут разговора о цене: уникальность обеспечивается только в пределах
      секции, если ключ секционирования не входит в ограничение; внешние ключи
      на секционированную таблицу ограничены; число секций влияет на время
      планирования.

      Полезно отметить, что секционирование редко нужно ради скорости выборки —
      обычно с этим справляется индекс. Настоящий мотив — управление
      жизненным циклом данных, и если старые данные не удаляются, выгода
      сильно меньше.

      И практическое: создание будущих секций нужно автоматизировать. Забытая
      секция означает отказ вставки в первый день нового периода.
    common_mistakes:
      - Секционировать ради скорости выборки, где хватает индекса.
      - Выбирать ключ секционирования, отсутствующий в условиях запросов.
      - Не автоматизировать создание будущих секций.
    follow_ups:
      - Почему секционирование может замедлить запросы?
      - Какие ограничения появляются на уникальность и внешние ключи?

  - slug: dba_data_types
    specializations: [infra_dba]
    topic: schema
    subtopic: data_types
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как выбор типов данных влияет на производительность и что чаще всего выбирают неудачно?"
    answer_short: >-
      Тип определяет размер строки, а значит число страниц и объём чтения.
      Частые ошибки: дробный тип для денег, строка для дат и чисел, время без
      часового пояса, избыточно широкие целые.
    answer_detailed: |
      ### Junior
      Деньги хранят точным десятичным типом: двоичная дробь не представляет
      0.1 точно, и суммы расходятся на копейки.

      Даты хранят датой, а не строкой: иначе не работают сравнение диапазонов,
      арифметика и корректная сортировка.

      ### Middle
      Размер имеет значение на больших таблицах: разница между четырёх- и
      восьмибайтным целым на миллиард строк — гигабайты, которые придётся
      читать и держать в кеше.

      Отдельно про время: тип с часовым поясом хранит момент времени
      однозначно, без пояса — «настенное время», которое означает разное в
      разных местах. Для событий почти всегда нужен первый.

      Ограничение длины строки само по себе производительности не даёт, но
      служит проверкой корректности данных.

      ### Senior
      Ждут внимания к выравниванию: порядок колонок в таблице влияет на её
      размер из-за выравнивания полей. На миллиардных таблицах перестановка
      колонок по убыванию размера экономит заметный процент.

      Полезно отметить документные типы: они удобны для действительно
      разнородных данных, но соблазняют сложить в один столбец то, что должно
      быть колонками. Признак ошибки — постоянные запросы по одному и тому же
      полю внутри документа.
    common_mistakes:
      - Хранить деньги в дробном двоичном типе.
      - Использовать время без часового пояса для событий.
      - Складывать в документный тип то, что должно быть колонками.
    follow_ups:
      - Почему порядок колонок влияет на размер таблицы?
      - Когда документный тип оправдан?

  # --- Безопасность -----------------------------------------------------------

  - slug: dba_privileges
    specializations: [infra_dba]
    topic: security
    subtopic: privileges
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как раздать права так, чтобы приложение работало, а ущерб от компрометации был ограничен?"
    answer_short: >-
      Отдельная роль на приложение с правами только на нужные таблицы и только
      на нужные операции, отдельные роли для миграций и для аналитики.
      Владелец схемы не должен совпадать с рабочей ролью приложения.
    answer_detailed: |
      ### Junior
      Приложение не должно ходить под суперпользователем. Это единственное
      правило, которое нарушается чаще всех остальных вместе взятых.

      ### Middle
      Разумное разделение:

      - роль приложения: чтение и запись в свои таблицы, без права менять
        схему;
      - роль миграций: право менять схему, используется только при выкате;
      - роль аналитики: только чтение, желательно на реплике;
      - владелец объектов: отдельная роль, под которой никто не работает
        постоянно.

      Права выдают ролям, а не пользователям: смена состава команды не должна
      требовать переназначения прав на таблицы.

      ### Senior
      Ждут упоминания прав по умолчанию для будущих объектов: без них каждая
      новая таблица требует ручной выдачи прав, и рано или поздно про неё
      забудут.

      Полезно назвать разграничение на уровне строк — когда одна таблица
      обслуживает нескольких арендаторов и разделение должно обеспечиваться
      базой, а не только приложением.

      И практическое замечание: аудит прав нужно проводить регулярно. Права
      накапливаются, выданные временно остаются навсегда, и через год реальная
      картина не совпадает с задуманной.
    common_mistakes:
      - Использовать суперпользователя для приложения.
      - Выдавать права пользователям вместо ролей.
      - Не настраивать права по умолчанию для новых объектов.
    follow_ups:
      - Зачем разделять роль приложения и роль миграций?
      - Когда нужно разграничение на уровне строк?

  - slug: dba_encryption
    specializations: [infra_dba]
    topic: security
    subtopic: encryption
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 3
    type: single_choice
    title: "От чего защищает шифрование данных на диске?"
    options:
      - code: a
        text: "От SQL-инъекции и утечки через приложение"
      - code: b
        text: "От доступа к физическим носителям и копиям: украденный диск или файл копии бесполезен без ключа"
        is_correct: true
      - code: c
        text: "От превышения полномочий администратором базы"
      - code: d
        text: "От всех перечисленных угроз одновременно"
    answer_short: >-
      Только от доступа к носителю: диску, снимку, файлу резервной копии. Для
      подключённого клиента с правами данные расшифрованы, поэтому от инъекции и
      от избыточных прав это не защищает вовсе.
    answer_detailed: |
      ### Junior
      Три разных уровня: шифрование канала между клиентом и базой, шифрование
      данных на диске, шифрование отдельных полей в приложении.

      Первое защищает от прослушивания сети, второе — от кражи носителя.

      ### Middle
      Шифрование на диске часто требуется регуляторами, и это его основная
      функция. Реальную защиту от компрометации приложения оно не даёт: база
      отдаёт расшифрованные данные любому, кто прошёл аутентификацию.

      Шифрование резервных копий важнее: они чаще покидают периметр и хранятся
      дольше.

      ### Senior
      Ждут понимания шифрования на стороне приложения: если поле зашифровано
      ключом, которого нет у базы, администратор его не прочитает. Цена — по
      такому полю нельзя искать и строить индексы, и потеря ключа означает
      потерю данных.

      Отсюда практика применять его точечно: паспортные данные, медицинские
      сведения, ключи доступа — а не вся таблица целиком.

      Полезно назвать управление ключами как основную сложность: хранение,
      ротация, доступ при восстановлении. Шифрование, ключ от которого лежит
      рядом с данными, создаёт иллюзию защиты.
    common_mistakes:
      - Считать шифрование на диске защитой от компрометации приложения.
      - Хранить ключ рядом с зашифрованными данными.
      - Шифровать на стороне приложения поля, по которым нужен поиск.
    follow_ups:
      - Что даёт шифрование на стороне приложения и чего оно стоит?
      - Почему шифрование резервных копий важнее шифрования диска?

  # --- Системный дизайн -------------------------------------------------------

  - slug: dba_sharding
    specializations: [infra_dba]
    topic: system_design
    subtopic: sharding
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "База не помещается на один сервер. Что делать до шардирования и как выбирать ключ, если оно неизбежно?"
    answer_short: >-
      Сначала исчерпать простое: индексы, архивирование старых данных,
      секционирование, вынос чтения на реплики, вертикальное разделение по
      доменам. Ключ шардирования выбирают так, чтобы запросы попадали в один
      шард, а данные распределялись равномерно.
    answer_detailed: |
      ### Junior
      Шардирование — распределение данных по нескольким независимым базам.
      Это самый дорогой ход, потому что усложняет всё остальное.

      ### Middle
      Что пробуют до него:

      - убрать очевидное: неиспользуемые индексы, лишние данные, раздувание;
      - архивировать историю в холодное хранилище;
      - секционировать и вынести старые секции;
      - вынести чтение на реплики;
      - разделить базу по доменам — часто отдельные сервисы имеют свои таблицы
        и разъезжаются без шардирования.

      Ключ шардирования: чаще всего идентификатор клиента или арендатора.
      Критерии — равномерность распределения и попадание типичного запроса в
      один шард.

      ### Senior
      Ждут понимания, что теряется: запросы между шардами, соединения таблиц из
      разных шардов, транзакции, охватывающие несколько шардов, уникальность
      по всей базе. Всё это придётся решать на уровне приложения.

      Отдельно — перебалансировка. Она обязательно понадобится, и схема должна
      её предусматривать с самого начала: обычно через логические участки,
      которых заметно больше, чем физических серверов, и перенос участков
      целиком.

      Полезно назвать проблему горячего шарда: один крупный клиент может
      перевесить остальные, и равномерность по числу записей не означает
      равномерности по нагрузке.
    common_mistakes:
      - Шардировать до исчерпания простых мер.
      - Выбирать ключ без проверки равномерности нагрузки.
      - Не закладывать механизм перебалансировки заранее.
    follow_ups:
      - Что перестаёт работать после шардирования?
      - Как заранее заложить возможность перебалансировки?

  - slug: dba_engine_choice
    specializations: [infra_dba]
    topic: system_design
    subtopic: engine_choice
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Команда хочет вынести аналитику в отдельное хранилище. Как выбирать и когда этого не делать?"
    answer_short: >-
      По характеру нагрузки: аналитика читает мало колонок из многих строк, и
      колоночное хранилище выигрывает на порядки. Но пока объёмы умеренные,
      реплика обычной базы решает задачу без нового компонента в эксплуатации.
    answer_detailed: |
      ### Junior
      Обычная база хранит строки целиком: чтение одной колонки из миллиарда
      строк заставляет читать все колонки. Колоночное хранилище читает только
      нужное и хорошо сжимает однородные данные.

      ### Middle
      Порядок решения:

      1. Вынести аналитические запросы на реплику — часто этого достаточно.
      2. Построить витрины: заранее посчитанные агрегаты вместо запросов по
         сырым данным.
      3. И только затем — отдельное аналитическое хранилище.

      Каждый шаг дешевле следующего и не добавляет системы, которую нужно
      сопровождать, копировать и обновлять.

      ### Senior
      Ждут внимания к цене владения: новое хранилище означает конвейер загрузки,
      расхождение данных с источником, отдельный мониторинг, отдельное
      резервное копирование и вопрос «почему цифры не сходятся» на регулярной
      основе.

      Полезно назвать критерии, при которых переход оправдан: объём, при
      котором агрегаты считаются часами; число аналитиков, мешающих друг другу;
      потребность в данных из нескольких источников.

      И трезвое замечание: колоночные хранилища плохо работают с точечными
      обновлениями и малыми выборками по ключу. Это дополнение к основной базе,
      а не замена.
    common_mistakes:
      - Заводить аналитическое хранилище до исчерпания реплик и витрин.
      - Не закладывать расхождение данных как отдельную задачу.
      - Пытаться заменить основную базу колоночным хранилищем.
    follow_ups:
      - Почему колоночное хранилище выигрывает на аналитике?
      - Какие критерии оправдывают отдельное хранилище?

