  - slug: decorator_and_functools_wraps
    specializations: [backend_python]
    topic: language
    subtopic: decorators
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: short_answer
    title: "Что такое декоратор и зачем внутри него `functools.wraps`?"
    answer_short: >-
      Декоратор — функция, которая принимает объект и возвращает его обёртку, подменяя
      имя в пространстве имён. `functools.wraps` копирует в обёртку метаданные оригинала
      (`__name__`, `__doc__`, `__wrapped__`, аннотации), иначе интроспекция ломается.
    answer_detailed: |
      Декоратор — это синтаксический сахар: `@log` над `def handler()` эквивалентно
      `handler = log(handler)`. Обёртка заменяет оригинал в модуле, поэтому без
      дополнительных мер теряются метаданные исходной функции.

      ```python
      import functools

      def log(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              return func(*args, **kwargs)
          return wrapper
      ```

      Без `wraps` у `handler.__name__` будет значение `"wrapper"`, пропадёт docstring
      и аннотации. Это ломает вполне практичные вещи: генерацию OpenAPI-схемы
      во FastAPI, логи с именем функции, `inspect.signature`, а также кеширование
      и тесты, опирающиеся на имя. `wraps` дополнительно проставляет `__wrapped__`,
      чтобы `inspect` мог добраться до оригинала.
    common_mistakes:
      - "Забыть `functools.wraps` и получить сломанную интроспекцию и документацию."
      - "Путать декоратор и декорируемую функцию при работе с аргументами декоратора."
      - "Ставить декоратор с состоянием на метод и получить общее состояние на все экземпляры."
    follow_ups:
      - "Как написать декоратор, принимающий аргументы?"
      - "Чем отличается декоратор класса от декоратора функции?"
      - "Как задекорировать корутину?"
    company_tags: []

