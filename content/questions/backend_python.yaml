      ожидания ответов внешних API. Что даст наибольший прирост пропускной способности?
    options:
      - code: a
        text: "Переписать обработку на asyncio и оставить один процесс"
      - code: b
        text: "Запустить 4 процесса с asyncio-обработкой внутри каждого"
        is_correct: true
      - code: c
        text: "Запустить 4 процесса с синхронной обработкой и одним потоком в каждом"
      - code: d
        text: "Заменить алгоритмы на более эффективные по времени выполнения"
    answer_short: >-
      Нагрузка I/O-bound, поэтому нужна конкурентность внутри процесса (asyncio), а чтобы
      задействовать все ядра — несколько воркеров. Комбинация даёт и то, и другое.
    answer_detailed: |
      Ключ к ответу — характер нагрузки. 90% времени запроса — ожидание, значит
      узкое место не процессор, а количество одновременно висящих операций.

      Один asyncio-процесс (вариант a) снимает ограничение по одновременности,
      но использует одно ядро — оставшиеся 10% работы упрутся в него.
      Четыре синхронных процесса (вариант c) задействуют ядра, но каждый обрабатывает
      один запрос за раз, поэтому одновременных запросов будет всего четыре.
      Оптимизация алгоритмов (вариант d) улучшает те самые 10%.

      Стандартная схема для веб-бэкенда: `uvicorn --workers N` (обычно N по числу ядер)
      с асинхронными обработчиками внутри каждого воркера.
    common_mistakes:
      - "Считать, что asyncio сам по себе задействует все ядра."
      - "Масштабировать процессами, оставляя внутри блокирующий код."
    follow_ups:
      - "Сколько воркеров ставить и почему?"
      - "Что изменится, если нагрузка станет CPU-bound?"
    company_tags: []

