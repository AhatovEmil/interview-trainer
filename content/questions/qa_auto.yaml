# Банк вопросов для qa_auto.
#
# Это данные, а не код. Все вопросы загружаются сидом с is_verified=false:
# проверенным вопрос становится только после ревью человеком (CLAUDE.md §8.1).
#
# Инструменты намеренно упоминаются как примеры, а не как предмет вопроса:
# на собеседовании проверяют инженерное мышление — устойчивость тестов,
# архитектуру фреймворка, место прогона в конвейере, — а не знание синтаксиса
# конкретной библиотеки, который гуглится за минуту.

version: 1

questions:
  # --- Основы -----------------------------------------------------------------

  - slug: qa_auto_test_pyramid
    specializations: [qa_auto]
    topic: fundamentals
    subtopic: pyramid
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Что такое пирамида тестов и почему автоматизация «всё через интерфейс» плохо заканчивается?"
    answer_short: >-
      Пирамида распределяет проверки по уровням: много быстрых модульных,
      меньше интеграционных и API, совсем немного интерфейсных. Перевёрнутая
      пирамида даёт медленный прогон, нестабильные падения и неточную
      локализацию: тест краснеет, но непонятно, что именно сломалось.
    answer_detailed: |
      ### Junior
      Интерфейсный тест поднимает браузер, ждёт загрузки, кликает — секунды на
      проверку. Тест API — десятки миллисекунд. Разница в сто раз определяет,
      можно ли гонять набор на каждый коммит.

      ### Middle
      Три проблемы верхнего уровня:

      - **Скорость**: набор на тысячу интерфейсных тестов идёт часами, и
        обратная связь приходит слишком поздно.
      - **Стабильность**: чем длиннее цепочка (браузер, сеть, стенд, данные),
        тем больше причин для случайного падения.
      - **Локализация**: упавший сквозной тест указывает на «что-то сломалось»,
        а модульный — на конкретную функцию.

      Правило выбора уровня: проверять на самом низком, где проверка возможна.
      Логику расчёта скидки — модульным тестом, контракт — на уровне API, а
      через интерфейс — только то, что действительно про интерфейс.

      ### Senior
      Ждут понимания, что форма пирамиды зависит от системы. У приложения с
      тонким клиентом и толстым бэкендом основная масса тестов уходит на API.
      У приложения со сложным интерфейсом растёт средний слой — компонентные
      тесты, которые проверяют интерфейс без реального браузера.

      Полезно упомянуть «трофей» как альтернативную модель, где основной вес у
      интеграционных тестов: спор не о догме, а о том, где для конкретной
      системы лучшее соотношение уверенности и стоимости.
    common_mistakes:
      - Автоматизировать всё через интерфейс.
      - Дублировать одну проверку на трёх уровнях.
      - Спорить о форме пирамиды в отрыве от конкретной системы.
    follow_ups:
      - Как решить, на каком уровне проверять конкретное правило?
      - Что такое компонентные тесты интерфейса?

  - slug: qa_auto_what_to_automate
    specializations: [qa_auto]
    topic: fundamentals
    subtopic: what_to_automate
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как выбрать, какие тесты автоматизировать в первую очередь?"
    answer_short: >-
      Те, что выполняются часто, стабильны в требованиях и дороги при пропуске:
      дымовой набор, критичный путь пользователя, регрессия по найденным
      дефектам. Не автоматизируют разовые проверки, нестабильную
      функциональность и то, что требует человеческой оценки.
    answer_detailed: |
      ### Junior
      Автоматизация окупается повторяемостью. Тест, который прогоняется раз в
      полгода, дешевле выполнить руками.

      ### Middle
      Критерии в пользу автоматизации: высокая частота выполнения, устойчивость
      требований, высокая цена пропуска, детерминированный результат,
      трудоёмкая ручная подготовка данных.

      Против: функциональность в активной переработке (тест придётся переписать
      трижды), проверки внешнего вида и удобства, разовые миграции, сценарии с
      зависимостью от внешних систем без тестовых стендов.

      ### Senior
      Ждут разговора о стоимости владения. Тест пишется один раз, а
      поддерживается годами: падения нужно разбирать, локаторы обновлять,
      данные готовить. Набор, который никто не чинит, быстро становится шумом,
      и команда перестаёт смотреть на красный прогон.

      Отсюда критерий, о котором забывают: автоматизировать стоит то, что
      команда готова поддерживать. Двести тестов, за которыми следят, полезнее
      двух тысяч заброшенных.

      Полезно упомянуть, что первым делом обычно автоматизируют дымовой набор:
      он даёт максимальную отдачу на единицу усилий, отсекая заведомо
      непригодные сборки.
    common_mistakes:
      - Гнаться за процентом автоматизации как за самоцелью.
      - Автоматизировать функциональность в активной переработке.
      - Не учитывать стоимость поддержки при планировании.
    follow_ups:
      - Почему процент автоматизации — плохая метрика?
      - Что автоматизировать самым первым на новом проекте?

  # --- Программирование -------------------------------------------------------

  - slug: qa_auto_explicit_waits
    specializations: [qa_auto]
    topic: ui_automation
    subtopic: waits
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: single_choice
    title: "Тест иногда падает, потому что элемент не успевает появиться. Что делать?"
    options:
      - code: a
        text: "Добавить sleep на пять секунд перед действием"
      - code: b
        text: "Использовать явное ожидание условия: ждать до появления элемента, но не дольше таймаута"
        is_correct: true
      - code: c
        text: "Повторять тест до успеха"
      - code: d
        text: "Увеличить таймаут всего прогона"
    answer_short: >-
      Фиксированная пауза либо замедляет прогон, либо всё равно не спасает на
      медленном стенде. Явное ожидание проверяет условие в цикле и продолжает,
      как только оно выполнено, — быстро в обычном случае и устойчиво в
      медленном.
    answer_detailed: |
      ### Junior
      ```
      // плохо: всегда ждём 5 секунд
      sleep(5000);
      click(button);

      // хорошо: ждём условие, обычно миллисекунды
      waitUntil(() => button.isVisible(), timeout: 10s);
      click(button);
      ```

      ### Middle
      Ждать нужно правильное условие. «Элемент есть в DOM» не означает, что по
      нему можно кликнуть: он может быть перекрыт, отключён или в процессе
      анимации. Правильные условия — видимость, кликабельность, а лучше
      прикладное состояние: «спиннер исчез», «список загружен».

      Неявное ожидание, задаваемое глобально, плохо сочетается с явным: время
      ожидания начинает складываться непредсказуемо. Обычно выбирают что-то
      одно.

      Современные инструменты (Playwright, Cypress) ждут автоматически перед
      каждым действием, и ручные ожидания там нужны реже — но условие
      «данные загрузились» всё равно приходится описывать самому.

      ### Senior
      Ждут понимания, что ожидание маскирует, а не решает проблему медленного
      приложения. Если элемент появляется через восемь секунд, это находка для
      разработки, а не повод поставить таймаут в пятнадцать.

      Полезно упомянуть ожидание сетевого ответа вместо ожидания элемента:
      подписка на завершение конкретного запроса точнее и быстрее, чем опрос
      DOM.
    common_mistakes:
      - Ставить фиксированные паузы.
      - Ждать наличия в DOM вместо кликабельности.
      - Смешивать неявные и явные ожидания.
    follow_ups:
      - Какое условие ожидания самое надёжное?
      - Чем ожидание сетевого ответа лучше ожидания элемента?

  - slug: qa_auto_locators_strategy
    specializations: [qa_auto]
    topic: ui_automation
    subtopic: locators
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Какие локаторы выбирать и почему XPath по полному пути — плохая идея?"
    answer_short: >-
      Приоритет: специальный атрибут для тестов, затем роль и доступное имя,
      затем текст. Полный XPath ломается от любого изменения вёрстки — вставка
      одного div меняет путь, хотя элемент тот же. CSS-классы тоже ненадёжны:
      они меняются при правке стилей.
    answer_detailed: |
      ### Junior
      Плохо: `/html/body/div[2]/div[1]/section/div[3]/button`.
      Хорошо: `[data-testid="submit-order"]` или поиск по роли и названию.

      ### Middle
      Порядок предпочтения:

      1. **data-testid** — атрибут, существующий специально для тестов;
         меняется осознанно.
      2. **Роль и доступное имя** — устойчиво к вёрстке и заодно проверяет
         доступность.
      3. **Текст** — понятно читается, но ломается при переводе интерфейса.
      4. **CSS-класс** — только если он смысловой, а не оформительский.
      5. **XPath по пути** — последнее средство.

      Спор про `data-testid` («не хочу мусорить разметку») решается тем, что
      атрибут вырезается при сборке продакшена, а стоимость поддержки тестов
      снижается на порядок.

      ### Senior
      Ждут понимания связи с доступностью: поиск по роли работает, только если
      разметка семантична. Если кнопка сделана из `div`, локатор по роли не
      найдёт её — и это одновременно сигнал о проблеме доступности.

      Второй сюжет — локаторы как часть контракта между разработкой и
      тестированием. Их изменение должно быть таким же осознанным, как
      изменение API: молча переименованный `data-testid` роняет прогон.
    common_mistakes:
      - Использовать сгенерированные CSS-классы как локаторы.
      - Строить XPath по полному пути в дереве.
      - Менять data-testid без предупреждения.
    follow_ups:
      - Почему поиск по роли одновременно проверяет доступность?
      - Как убедить команду добавить атрибуты для тестов?

  - slug: qa_auto_flaky_tests
    specializations: [qa_auto]
    topic: ui_automation
    subtopic: flakiness
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Десять процентов тестов падают через раз. Что с этим делать?"
    answer_short: >-
      Нестабильные тесты опаснее отсутствующих: команда перестаёт верить
      прогону и пропускает настоящие поломки. Их не «перезапускают», а
      разбирают по причинам: ожидания, зависимость от данных, зависимость от
      порядка, общее окружение, реальные плавающие дефекты.
    answer_detailed: |
      ### Junior
      Автоматический повтор до успеха скрывает проблему. Красный тест, который
      зеленеет со второго раза, не даёт никакой информации.

      ### Middle
      Типовые причины по частоте:

      - **Ожидания**: фиксированные паузы или ожидание не того условия.
      - **Данные**: тест зависит от записей, которые изменил соседний тест.
      - **Порядок**: тесты неявно зависят друг от друга; при параллельном
        запуске порядок меняется.
      - **Общее состояние**: одна учётная запись на все тесты.
      - **Окружение**: медленный стенд, соседние процессы.
      - **Настоящий дефект**: гонка в приложении — самый ценный случай.

      Разбор начинают с самых частых: чинить нужно причину, а не симптом.

      ### Senior
      Ждут процесса, а не разовой чистки. Практика: собирать статистику
      падений по тестам, нестабильные помечать и уводить в отдельный прогон,
      чтобы основной оставался достоверным, и заводить на них задачи с
      дедлайном.

      Важная мысль: повтор допустим как временная мера с обязательным
      логированием факта повтора. Если тест «зелёный со второй попытки»
      незаметен в отчёте, он никогда не будет починен.

      И самое ценное: часть нестабильности — это реальные гонки в приложении.
      Тест, падающий раз в двадцать прогонов, может указывать на дефект,
      который у пользователей проявляется раз в тысячу операций.
    common_mistakes:
      - Лечить нестабильность автоматическими повторами.
      - Не собирать статистику падений по тестам.
      - Списывать все плавающие падения на «тесты кривые».
    follow_ups:
      - Когда повтор теста допустим?
      - Как отличить нестабильный тест от реального дефекта?

  - slug: qa_auto_page_object
    specializations: [qa_auto]
    topic: ui_automation
    subtopic: page_object
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что такое Page Object и какие ошибки в нём встречаются чаще всего?"
    answer_short: >-
      Шаблон, где взаимодействие со страницей вынесено в отдельный класс:
      локаторы и действия внутри, тест работает с понятными методами. Частые
      ошибки — проверки внутри объекта страницы, методы на каждый клик вместо
      действий предметной области, дублирование вместо наследования компонентов.
    answer_detailed: |
      ### Junior
      Смысл — изоляция изменений: при переработке интерфейса меняется один
      класс, а не тридцать тестов.

      ```
      class LoginPage {
        login(user, password) { ... }
      }

      // тест
      loginPage.login('user@example.com', 'secret');
      ```

      ### Middle
      Ошибки:

      - **Проверки внутри страницы**: `assertTitleIsCorrect()` делает объект
        страницы одновременно и тестом; проверки должны остаться в тесте, чтобы
        было видно, что именно проверяется.
      - **Методы-обёртки над кликом**: `clickSubmitButton()` не даёт ничего
        поверх самого клика. Полезны методы уровня задачи: `submitOrder()`.
      - **Возврат внутренних элементов наружу**: тест снова начинает знать про
        разметку.
      - **Дублирование общих частей**: шапка и меню выносятся в отдельные
        компоненты, а не копируются в каждую страницу.

      ### Senior
      Ждут понимания, что Page Object — не догма. В современных инструментах
      часто используют более лёгкие подходы: функции-действия и фикстуры вместо
      иерархии классов. Критерий один: изменение интерфейса должно править код
      в одном месте.

      Полезно упомянуть слой сценариев поверх страниц: тест читается как
      описание бизнес-действия, а не как последовательность кликов. Тогда он
      переживает даже переделку интерфейса, если сценарий сохранился.
    common_mistakes:
      - Помещать проверки внутрь объекта страницы.
      - Делать метод на каждый клик вместо действия предметной области.
      - Копировать общие элементы вместо выделения компонентов.
    follow_ups:
      - Почему проверки должны оставаться в тесте?
      - Чем метод submitOrder лучше clickSubmitButton?

  # --- Автоматизация API ------------------------------------------------------

  - slug: qa_auto_api_layer_tests
    specializations: [qa_auto]
    topic: api_automation
    subtopic: request_testing
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Что проверять в автотестах API и как не превратить их в дублирование интерфейсных?"
    answer_short: >-
      Проверять контракт (код, схема, типы), бизнес-правила, обработку ошибок и
      права доступа. Дублирования не будет, если разделить: логика проверяется
      на API, а через интерфейс — только отображение и сценарии, где важен сам
      интерфейс.
    answer_detailed: |
      ### Junior
      Базовый набор для эндпоинта: успешный случай, невалидные данные,
      отсутствие авторизации, обращение к чужому объекту, несуществующий
      идентификатор.

      ### Middle
      Схему ответа проверяют целиком, а не по отдельным полям: изменение типа
      или исчезновение поля ломает клиентов. Для этого удобно валидировать
      ответ по описанию схемы, а не писать десяток проверок вручную.

      Разделение уровней на примере: правило «скидка не больше 30%» проверяется
      набором API-тестов на разных входных данных, а интерфейсный тест — один,
      про то, что скидка отображается в корзине.

      ### Senior
      Ждут понимания, что API-тесты — это ещё и защита обратной совместимости.
      Отдельный набор, гоняемый против новой версии сервиса со старыми
      ожиданиями, ловит ломающие изменения до того, как их получат мобильные
      клиенты, которые обновляются неделями.

      Полезно упомянуть, что тесты не должны собирать запросы вручную в каждом
      месте: клиент API выносится в отдельный слой с авторизацией, повторами и
      логированием, иначе изменение заголовка правится в сотне файлов.
    common_mistakes:
      - Проверять отдельные поля вместо схемы целиком.
      - Дублировать бизнес-правила на уровне интерфейса.
      - Собирать HTTP-запросы вручную в каждом тесте.
    follow_ups:
      - Как ловить ломающие изменения API?
      - Почему клиент API выносят в отдельный слой?

  - slug: qa_auto_contract_testing
    specializations: [qa_auto]
    topic: api_automation
    subtopic: contract_testing
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Что такое контрактное тестирование и какую проблему оно решает в микросервисах?"
    answer_short: >-
      Потребитель описывает, что ожидает от поставщика, и это ожидание
      проверяется против реального сервиса. Так ломающее изменение
      обнаруживается в конвейере поставщика, а не в интеграционной среде через
      неделю, и без поднятия всех сервисов сразу.
    answer_detailed: |
      ### Junior
      Проблема: сервис А зависит от сервиса Б. Проверить их вместе можно только
      на стенде со всеми сервисами — это дорого, медленно и нестабильно.

      ### Middle
      Идея контрактных тестов: потребитель записывает свои ожидания
      («на такой запрос жду поле id типа число»), эти ожидания сохраняются как
      контракт, и конвейер поставщика проверяет, что он их не нарушает.

      Выигрыш: поставщик узнаёт о поломке до выката, а тесты гоняются быстро,
      потому что не требуют реальных сервисов.

      ### Senior
      Ждут понимания границ: контракт проверяет форму и базовую семантику
      взаимодействия, но не бизнес-логику. Он скажет, что поле на месте, но не
      что расчёт верен.

      Второй сюжет — организационный. Контрактное тестирование работает, когда
      обе команды согласились его поддерживать: контракты нужно публиковать,
      версионировать и реагировать на их нарушение. Без этой договорённости
      инструмент превращается в набор игнорируемых красных сборок — и это
      главная причина неудачных внедрений.
    common_mistakes:
      - Ожидать от контрактов проверки бизнес-логики.
      - Внедрять инструмент без договорённости между командами.
      - Держать контракты только на стороне потребителя, не проверяя поставщика.
    follow_ups:
      - Что контрактное тестирование не проверяет?
      - Почему внедрение чаще проваливается по организационным причинам?

  - slug: qa_auto_mocks_stubs
    specializations: [qa_auto]
    topic: api_automation
    subtopic: mocks_stubs
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Когда подменять внешний сервис заглушкой, а когда тестировать против настоящего?"
    answer_short: >-
      Заглушка нужна, когда внешний сервис недоступен, платный, недетерминирован
      или когда нужно воспроизвести ошибку, которую иначе не получить.
      Против настоящего проверяют интеграцию и контракт — иначе тесты
      подтверждают только то, что заглушка соответствует представлениям автора.
    answer_detailed: |
      ### Junior
      Заглушка возвращает заранее заданный ответ. Это делает тест быстрым и
      предсказуемым, но проверяет он уже не взаимодействие с внешней системой.

      ### Middle
      Обязательные случаи для заглушек: платёжный шлюз (нельзя списывать деньги
      в тестах), отправка СМС и писем, сервисы с квотами, сценарии ошибок —
      таймаут, пятисотая, некорректный ответ. Воспроизвести их на живом сервисе
      обычно невозможно.

      Против настоящего сервиса нужен хотя бы небольшой набор: он ловит
      расхождение между тем, что вы заглушили, и тем, что сервис отдаёт на
      самом деле. Классическая ловушка — заглушка написана по документации, а
      реальный ответ отличается.

      ### Senior
      Ждут понимания уровня подмены. Подмена на уровне HTTP (перехват запросов)
      проверяет и слой сериализации, и заголовки; подмена модуля клиента внутри
      кода — нет. Второе быстрее, но оставляет непроверенным ровно то место,
      где чаще всего и ломается.

      Полезно упомянуть запись реальных ответов и их последующее
      воспроизведение: это компромисс между достоверностью и стабильностью, но
      записи устаревают, и их нужно обновлять по расписанию.
    common_mistakes:
      - Заглушать всё и не проверять реальную интеграцию.
      - Писать заглушку по документации без сверки с реальным ответом.
      - Подменять модуль клиента вместо перехвата на уровне HTTP.
    follow_ups:
      - Чем перехват на уровне HTTP лучше подмены модуля?
      - Как не дать записанным ответам устареть?

  # --- Тестовые данные --------------------------------------------------------

  - slug: qa_auto_test_isolation
    specializations: [qa_auto]
    topic: test_data
    subtopic: isolation
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Тесты проходят по одному, но падают при параллельном запуске. Почему и как чинить?"
    answer_short: >-
      Тесты делят состояние: одну учётную запись, одни и те же записи в базе,
      общий счётчик. При параллельном запуске они мешают друг другу. Лечится
      изоляцией: каждый тест создаёт свои данные и не полагается на то, что
      оставил другой.
    answer_detailed: |
      ### Junior
      Признак проблемы — тест зависит от того, что сделал предыдущий. Такой
      набор работает, только пока порядок фиксирован.

      ### Middle
      Способы изоляции:

      - **Свои данные на тест**: пользователь и заказ создаются в самом тесте с
        уникальными значениями.
      - **Уникальные значения**: почта вида `user-<uuid>@example.com`, чтобы не
        было конфликтов уникальности.
      - **Уборка после себя**: удалять созданное либо гонять в транзакции с
        откатом.
      - **Отказ от общих учётных записей**: один аккаунт на весь набор
        гарантирует конфликты.

      Подготовка данных через API работает быстрее и надёжнее, чем через
      интерфейс: не надо кликать пятнадцать шагов ради предусловия.

      ### Senior
      Ждут понимания, что полная изоляция не всегда достижима: есть глобальные
      настройки, справочники, внешние системы. Тогда такие тесты явно помечают
      и гоняют последовательно, а не делают вид, что их нет.

      Второй сюжет — стоимость: создание данных на каждый тест замедляет
      прогон. Компромисс — общие неизменяемые данные (справочники) готовятся
      один раз, а всё, что тест меняет, создаётся заново.
    common_mistakes:
      - Использовать одну учётную запись на весь набор.
      - Полагаться на данные, созданные другим тестом.
      - Готовить предусловия через интерфейс вместо API.
    follow_ups:
      - Что делать с тестами, которые нельзя изолировать?
      - Как готовить данные быстро, но безопасно?

  - slug: qa_auto_test_environments
    specializations: [qa_auto]
    topic: test_data
    subtopic: environments
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как организовать окружение для автотестов, чтобы прогон был воспроизводимым?"
    answer_short: >-
      Поднимать зависимости в контейнерах вместе с прогоном: своя база, свои
      заглушки внешних сервисов. Тогда состояние известно, тесты не мешают
      людям на общем стенде, а прогон одинаково работает локально и в
      конвейере.
    answer_detailed: |
      ### Junior
      Общий стенд — источник нестабильности: там параллельно работают люди,
      данные меняются, версия обновляется посреди прогона.

      ### Middle
      Контейнеры решают это: база поднимается на время прогона и удаляется
      после. Состояние гарантировано пустое, миграции применяются те же, что в
      проде.

      Внешние сервисы заменяются контейнером с заглушкой, отвечающей по
      заданным правилам, — так проверяются и ошибочные ответы.

      Важно, чтобы локальный запуск и запуск в конвейере отличались только
      настройками, а не способом. Иначе появляется вечное «у меня работает».

      ### Senior
      Ждут понимания, что не всё воспроизводится в контейнерах: платёжные
      шлюзы, внешние поставщики данных, специфичное железо. Для них нужны
      согласованные тестовые контуры, а прогон против них выносят в отдельный,
      более редкий набор.

      Полезно упомянуть требование к скорости подъёма: если окружение
      поднимается двадцать минут, разработчики перестанут гонять тесты
      локально, и вся выгода теряется. Отсюда приёмы вроде повторного
      использования контейнеров между прогонами.
    common_mistakes:
      - Гонять автотесты на общем стенде с людьми.
      - Делать локальный запуск непохожим на запуск в CI.
      - Не следить за временем подъёма окружения.
    follow_ups:
      - Что делать с зависимостями, которые нельзя поднять локально?
      - Почему важно время подъёма окружения?

  # --- CI и запуск ------------------------------------------------------------

  - slug: qa_auto_ci_pipeline_stages
    specializations: [qa_auto]
    topic: ci_cd
    subtopic: pipeline
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Как встроить автотесты в конвейер, чтобы они помогали, а не тормозили выпуск?"
    answer_short: >-
      Разделить по этапам: быстрые проверки на каждый коммит, средние — на
      пулл-реквест, долгие и сквозные — по расписанию или перед релизом.
      Обратная связь должна приходить за минуты; часовой прогон на каждый
      коммит перестают ждать и начинают обходить.
    answer_detailed: |
      ### Junior
      Если прогон занимает час, разработчики просто не будут его дожидаться, и
      польза от тестов исчезнет.

      ### Middle
      Разумное разделение:

      - **на коммит**: модульные и быстрые API-тесты, линтеры — до пяти минут;
      - **на пулл-реквест**: интеграционные и дымовой набор интерфейсных;
      - **ночью или перед релизом**: полная регрессия, кросс-браузерные,
        нагрузочные.

      Параллельный запуск сокращает время кратно, но требует изоляции тестов —
      без неё параллельность даёт нестабильность.

      ### Senior
      Ждут разговора о доверии к прогону. Красная сборка должна означать
      «что-то сломалось» и требовать реакции. Если падения привычны и их
      игнорируют, конвейер перестаёт быть защитой, и лучше временно вынести
      нестабильные тесты, чем приучать команду не смотреть на красное.

      Второй сюжет — отчёты. Падение должно быть разбираемо без локального
      воспроизведения: скриншот, запись, лог сети, ссылка на прогон. Иначе
      разбор каждого падения превращается в отдельное расследование.
    common_mistakes:
      - Гонять полную регрессию на каждый коммит.
      - Включать параллельный запуск без изоляции тестов.
      - Мириться с постоянно красной сборкой.
    follow_ups:
      - Что должно попадать в отчёт о падении?
      - Как поступать с постоянно нестабильными тестами в конвейере?

  - slug: qa_auto_reporting
    specializations: [qa_auto]
    topic: ci_cd
    subtopic: reporting
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 3
    type: single_choice
    title: "Что важнее всего в отчёте о прогоне автотестов?"
    options:
      - code: a
        text: "Процент пройденных тестов"
      - code: b
        text: "Возможность понять причину падения без локального воспроизведения"
        is_correct: true
      - code: c
        text: "Общее время прогона"
      - code: d
        text: "Число тестов в наборе"
    answer_short: >-
      Отчёт нужен, чтобы разобрать падение. Если для этого приходится повторять
      сценарий локально, отчёт не выполняет свою задачу. Проценты и счётчики
      полезны, но вторичны по сравнению с возможностью понять, что пошло не так.
    answer_detailed: |
      ### Junior
      Минимум для разбора: понятное название теста, шаг, на котором упало,
      сообщение об ошибке, скриншот на момент падения.

      ### Middle
      Что добавляет ценности: запись экрана или трассировка выполнения, лог
      сетевых запросов, состояние страницы, идентификатор прогона и версия
      сборки, ссылка на артефакты.

      Название теста должно говорить о проверяемом поведении, а не о шагах:
      «оплата картой с истёкшим сроком отклоняется» полезнее, чем «тест 42».

      ### Senior
      Ждут разговора об истории. Одного отчёта мало: нужно видеть, падает ли
      тест впервые или регулярно, и с какой версии началось. Это отличает
      регрессию от нестабильности и определяет, кому заниматься.

      Полезно упомянуть, что отчёт читают не только автоматизаторы: менеджеру
      нужна сводка по критичным сценариям, а не список из тысячи строк.
      Хороший отчёт отвечает на вопрос «можно ли выпускать», а не только
      «сколько тестов упало».
    common_mistakes:
      - Оценивать прогон только по проценту пройденных.
      - Давать названия тестам без указания проверяемого поведения.
      - Не хранить историю падений по тестам.
    follow_ups:
      - Как отличить регрессию от нестабильного теста по истории?
      - Что должен показывать отчёт менеджеру?

  # --- Архитектура фреймворка -------------------------------------------------

  - slug: qa_auto_framework_layers
    specializations: [qa_auto]
    topic: architecture
    subtopic: layers
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как устроить фреймворк автотестов, чтобы он не превратился в свалку через год?"
    answer_short: >-
      Разделить слои: тесты описывают сценарии на языке предметной области,
      ниже — действия и объекты страниц, ещё ниже — работа с транспортом,
      данными и настройками. Тест не должен знать про локаторы и HTTP-заголовки,
      иначе любое изменение расползается по всему набору.
    answer_detailed: |
      ### Junior
      Признак проблемы — тест на сто строк, где вперемешку локаторы, ожидания,
      подготовка данных и проверки. Такой тест невозможно ни прочитать, ни
      переиспользовать.

      ### Middle
      Рабочее разделение:

      - **тесты** — только сценарий и проверки;
      - **шаги и действия** — операции предметной области («создать заказ»);
      - **страницы и клиенты API** — техника взаимодействия;
      - **инфраструктура** — настройки, драйверы, данные, отчёты.

      Тест читается как описание поведения. Если для понимания приходится
      спускаться на уровень локаторов, слои размыты.

      ### Senior
      Ждут отношения к тестовому коду как к обычному: он проходит ревью, к нему
      применяются те же правила, у него есть владелец. Двойные стандарты
      («это же тесты») — прямая дорога к неподдерживаемому набору.

      Второй сюжет — баланс абстракции. Чрезмерная обобщённость не менее вредна:
      фреймворк, где для добавления простого теста нужно изучить пять уровней
      наследования, отпугивает и разработчиков, и новых тестировщиков. Критерий
      простой — насколько быстро новый человек добавляет первый тест.
    common_mistakes:
      - Смешивать сценарий, локаторы и подготовку данных в одном файле.
      - Применять к тестовому коду более низкие требования, чем к продуктовому.
      - Строить многоуровневые абстракции ради универсальности.
    follow_ups:
      - Как понять, что абстракций стало слишком много?
      - Кто должен делать ревью тестового кода?

  - slug: qa_auto_maintainability
    specializations: [qa_auto]
    topic: architecture
    subtopic: maintainability
    min_grade: middle
    peak_grade: middle_plus
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Набор из тысячи тестов стал обузой: прогон долгий, половина падает, чинить некому. Что делать?"
    answer_short: >-
      Признать, что количество не равно ценности, и сократить набор осознанно:
      удалить дубли и проверки устаревшей функциональности, разобрать
      нестабильные, оставить то, что реально ловит регрессии. Набор, которому
      верят, полезнее большого, который игнорируют.
    answer_detailed: |
      ### Junior
      Первое побуждение — починить всё сразу — обычно нереалистично. Нужен
      порядок действий и приоритеты.

      ### Middle
      Практические шаги:

      1. Собрать статистику: какие тесты падают, какие не падали ни разу за
         полгода, какие дольше всех.
      2. Удалить дубли и тесты на функциональность, которой больше нет.
      3. Разобрать нестабильные по причинам, а не по одному.
      4. Сократить долгие: перенести проверки на уровень API там, где это
         возможно.
      5. Договориться о правиле: красный прогон блокирует слияние.

      Тест, который ни разу не падал за год, — кандидат на вопрос: он проверяет
      что-то стабильное или просто ничего не проверяет?

      ### Senior
      Ждут разговора о причинах, а не только о лечении. Набор доходит до такого
      состояния, когда автоматизация оторвана от разработки: тесты пишет
      отдельный человек, падения разбирает он же, а команда не считает их
      своими.

      Устойчивое решение — общая ответственность: тесты живут в том же
      репозитории, падение блокирует слияние, разработчик чинит сломанный им
      тест. Без этого любая разовая чистка через полгода возвращает всё назад.
    common_mistakes:
      - Пытаться починить весь набор разом.
      - Оценивать набор по числу тестов.
      - Оставлять автоматизацию в зоне ответственности одного человека.
    follow_ups:
      - Что делать с тестом, который ни разу не падал за год?
      - Как добиться общей ответственности за тесты?

  # --- Программирование -------------------------------------------------------

  - slug: qa_auto_oop_in_tests
    specializations: [qa_auto]
    topic: programming
    subtopic: oop
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: single_choice
    title: "В наборе десять страниц с общей шапкой и меню. Как правильно устранить дублирование?"
    options:
      - code: a
        text: "Скопировать методы шапки в каждый класс страницы"
      - code: b
        text: "Вынести шапку и меню в отдельные компоненты и использовать их в страницах через композицию"
        is_correct: true
      - code: c
        text: "Создать базовый класс со всеми методами всех страниц"
      - code: d
        text: "Оставить дублирование: в тестах это допустимо"
    answer_short: >-
      Общие части интерфейса выносятся в компоненты и подключаются композицией.
      Базовый класс со всеми методами превращается в свалку: страница получает
      методы, к которым не имеет отношения, а изменение базового класса
      затрагивает всё.
    answer_detailed: |
      ### Junior
      Композиция — «страница содержит шапку», наследование — «страница является
      шапкой». Второе неверно по смыслу.

      ### Middle
      Проблема раздутого базового класса проявляется через полгода: в нём сотня
      методов, половина используется одной страницей, и никто не решается
      удалить что-то, потому что неясно, кто зависит.

      Наследование в тестах уместно узко: базовый класс теста с общей
      подготовкой и уборкой. И даже это часто лучше решается фикстурами,
      которые подключаются по необходимости, а не достаются всем потомкам.

      ### Senior
      Ждут понимания, что дублирование в тестах не всегда зло. Два похожих
      теста, которые изменятся по разным причинам, лучше оставить раздельными:
      преждевременное обобщение свяжет их и заставит менять оба.

      Критерий — причина изменения. Общий код выносят тогда, когда он меняется
      по одной причине; если по разным — дублирование честнее.
    common_mistakes:
      - Складывать всё общее в один базовый класс.
      - Обобщать похожие тесты, меняющиеся по разным причинам.
      - Применять наследование там, где нужна композиция.
    follow_ups:
      - Когда дублирование в тестах допустимо?
      - Чем фикстуры лучше базового класса теста?

  - slug: qa_auto_async_handling
    specializations: [qa_auto]
    topic: programming
    subtopic: async_waits
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Тест проверяет, что после нажатия кнопки данные сохранились в базе. Как это сделать надёжно?"
    answer_short: >-
      Не проверять базу сразу: запрос выполняется асинхронно, и проверка
      обгонит его. Нужно дождаться наблюдаемого признака завершения — ответа
      сервера или изменения интерфейса, — а затем проверять состояние с
      ожиданием по условию, а не одной попыткой.
    answer_detailed: |
      ### Junior
      Наивный вариант падает через раз: между кликом и проверкой проходят
      миллисекунды, а запрос ещё в пути.

      ### Middle
      Надёжная последовательность:

      1. Выполнить действие.
      2. Дождаться признака завершения: успешного ответа на конкретный запрос
         или появления сообщения об успехе.
      3. Проверить состояние с ожиданием по условию — повторять запрос к базе
         или API до совпадения либо до таймаута.

      Пауза вместо ожидания либо замедлит прогон, либо не спасёт на медленном
      стенде — и то и другое плохо.

      ### Senior
      Ждут понимания, что проверка через базу — не всегда правильный уровень.
      Она привязывает тест к схеме хранения: переименование колонки сломает
      тест, хотя поведение не изменилось. Проверка через API устойчивее и
      ближе к тому, что видит пользователь.

      Прямое обращение к базе оправдано там, где результат не виден снаружи:
      записи аудита, состояние очереди, служебные поля. И тогда это осознанный
      выбор, а не привычка.
    common_mistakes:
      - Проверять состояние сразу после действия.
      - Заменять ожидание фиксированной паузой.
      - Проверять через базу то, что доступно через API.
    follow_ups:
      - Когда проверка напрямую в базе оправдана?
      - Как дождаться завершения асинхронной операции надёжно?

