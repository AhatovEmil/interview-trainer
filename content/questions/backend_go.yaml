#
# Это данные, а не код. Все вопросы загружаются сидом с is_verified=false:
# проверенным вопрос становится только после ревью человеком (CLAUDE.md §8.1).
#
# Актуальность: ответы выверены по Go 1.22+. Там, где поведение менялось между
# версиями (переменная цикла, GOMEMLIMIT), это оговорено прямо в разборе —
# на собеседовании такие детали и отличают знание от заучивания.

version: 1

questions:
