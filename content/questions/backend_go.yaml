  - slug: go_http_server_graceful_shutdown
    specializations: [backend_go]
    topic: web
    subtopic: http_server
    min_grade: middle
    peak_grade: middle_plus
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как корректно остановить HTTP-сервер на Go, чтобы не оборвать текущие запросы?"
    answer_short: >-
      Слушать сигнал завершения, вызвать `srv.Shutdown(ctx)` с таймаутом: он
      перестаёт принимать новые соединения и ждёт завершения активных.
      Параллельно нужно закрыть фоновые задачи и пул БД, иначе процесс уйдёт
      с оборванными запросами.
    answer_detailed: |
      ### Junior
      `srv.Close()` рвёт соединения немедленно, `srv.Shutdown(ctx)` — вежливо
      дожидается активных обработчиков.

      ```go
      ctx, stop := signal.NotifyContext(context.Background(),
          os.Interrupt, syscall.SIGTERM)
      defer stop()

      go func() {
          if err := srv.ListenAndServe(); !errors.Is(err, http.ErrServerClosed) {
              log.Fatal(err)
          }
      }()

      <-ctx.Done()
      shutdownCtx, cancel := context.WithTimeout(context.Background(), 15*time.Second)
      defer cancel()
      if err := srv.Shutdown(shutdownCtx); err != nil {
          log.Error("не успели завершиться", err)
      }
      ```

      ### Middle
      Важные детали:

      - `ListenAndServe` возвращает `http.ErrServerClosed` при штатной остановке —
        это не ошибка, и её нужно отличать.
      - Таймаут shutdown должен быть меньше `terminationGracePeriodSeconds` в
        Kubernetes, иначе под убьют раньше.
      - `Shutdown` не трогает WebSocket и hijacked-соединения: их закрывают
        отдельно через `RegisterOnShutdown`.

      ### Senior
      Ждут разговора о порядке в кластере. Между отправкой SIGTERM и удалением
      пода из эндпоинтов проходит время, поэтому запросы продолжают приходить
      уже после сигнала. Практика — сначала переключить readiness-пробу в
      «не готов», подождать пару секунд, и только потом звать Shutdown.

      И про порядок закрытия ресурсов: сначала HTTP-сервер, потом фоновые
      воркеры, потом пул БД. Обратный порядок даст ошибки в обработчиках,
      которые ещё дорабатывают.
    common_mistakes:
      - Логировать http.ErrServerClosed как ошибку.
      - Закрывать пул БД до завершения активных обработчиков.
      - Ставить таймаут shutdown больше grace period в Kubernetes.
    follow_ups:
      - Почему readiness-пробу выключают раньше Shutdown?
      - Как закрыть долгоживущие WebSocket-соединения при остановке?

  - slug: go_http_client_reuse
    specializations: [backend_go]
    topic: web
    subtopic: http_server
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: multi_choice
    title: "Какие ошибки при работе с http.Client реально встречаются в проде?"
    options:
      - code: a
        text: "Создавать новый http.Client на каждый запрос, теряя пул соединений"
        is_correct: true
      - code: b
        text: "Не закрывать resp.Body, из-за чего соединения не возвращаются в пул"
        is_correct: true
      - code: c
        text: "Использовать http.DefaultClient без таймаута"
        is_correct: true
      - code: d
        text: "Передавать context в запрос — это лишнее, есть таймаут клиента"
    answer_short: >-
      Клиент нужно переиспользовать: он держит пул соединений. Body закрывают
      всегда, иначе соединение не вернётся. У `http.DefaultClient` нет таймаута
      вовсе — запрос может висеть вечно. Контекст нужен и при наличии таймаута:
      он даёт отмену по цепочке.
    answer_detailed: |
      ### Junior
      `http.Client` потокобезопасен и предназначен для переиспользования: внутри
      транспорт с пулом keep-alive соединений. Новый клиент на каждый запрос —
      это новое TCP- и TLS-рукопожатие каждый раз.

      Тело ответа закрывают всегда, даже если оно не нужно:

      ```go
      resp, err := client.Do(req)
      if err != nil {
          return err
      }
      defer resp.Body.Close()
      ```

      ### Middle
      Чтобы соединение вернулось в пул, тело нужно не просто закрыть, а
      **дочитать**. Если вы прочитали часть и закрыли, транспорт может закрыть
      соединение вместо переиспользования. Отсюда приём
      `io.Copy(io.Discard, resp.Body)` перед Close при отказе от чтения.

      У `http.DefaultClient` `Timeout` равен нулю — бесконечность. В проде
      всегда свой клиент с таймаутом и настроенным транспортом
      (`MaxIdleConnsPerHost` по умолчанию всего 2, что душит нагрузку на один
      хост).

      ### Senior
      Ждут разделения таймаутов: `Client.Timeout` покрывает весь запрос вместе с
      чтением тела, а контекст даёт отмену по цепочке вызовов и связывает жизнь
      запроса с жизнью входящего HTTP-запроса. Нужны оба.

      Полезно упомянуть, что для больших ответов `Client.Timeout` вреден — он
      оборвёт медленную, но живую загрузку; там разделяют
      `Transport.ResponseHeaderTimeout` и контроль скорости чтения.
    common_mistakes:
      - Создавать http.Client на каждый вызов.
      - Закрывать Body, не дочитав его, и терять keep-alive.
      - Полагаться на http.DefaultClient в продакшене.
    follow_ups:
      - Почему MaxIdleConnsPerHost по умолчанию мешает под нагрузкой?
      - Чем Client.Timeout отличается от контекста запроса?

  - slug: go_idempotency_key_design
    specializations: [backend_go]
    topic: web
    subtopic: idempotency
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Клиент повторяет POST-запрос на создание платежа из-за таймаута. Как гарантировать, что платёж не создастся дважды?"
    answer_short: >-
      Клиент генерирует ключ идемпотентности и шлёт его в заголовке. Сервер
      сохраняет ключ в таблице с уникальным индексом в той же транзакции, что и
      сам платёж. Повтор с тем же ключом возвращает сохранённый результат, а не
      создаёт новую запись.
    answer_detailed: |
      ### Junior
      POST не идемпотентен по определению, поэтому идемпотентность делают руками:
      клиент присылает `Idempotency-Key` (обычно UUID), сервер запоминает его и
      при повторе отдаёт прежний ответ.

      ### Middle
      Ключевое — атомарность. Ключ и результат операции должны записываться в
      **одной транзакции**:

      ```sql
      CREATE TABLE idempotency (
          key         text PRIMARY KEY,
          response    jsonb NOT NULL,
          created_at  timestamptz NOT NULL DEFAULT now()
      );
      ```

      Вставка ключа с уникальным индексом сама служит блокировкой: второй
      параллельный запрос получит нарушение уникальности и должен вернуть
      сохранённый ответ, а не ошибку.

      В Go это выглядит как проверка `pgErr.Code == "23505"` через `errors.As`.

      ### Senior
      Ждут разбора трёх тонкостей.

      Первая — гонка: если ключ пишется до завершения операции, второй запрос
      увидит ключ, но ответа ещё нет. Обычно хранят статус `in_progress` и
      отвечают 409 либо ждут с коротким таймаутом.

      Вторая — срок жизни: ключи нельзя хранить вечно, но и удалять раньше окна
      ретраев клиента нельзя. Практика — сутки, чистка по расписанию.

      Третья — область действия. Ключ должен быть привязан к пользователю и к
      телу запроса: иначе клиент, повторно использовавший ключ для другой суммы,
      получит чужой ответ. Обычно сохраняют хеш тела и при несовпадении
      возвращают 422.
    common_mistakes:
      - Проверять существование ключа отдельным SELECT вместо уникального индекса.
      - Писать ключ вне транзакции с самой операцией.
      - Не привязывать ключ к пользователю и телу запроса.
    follow_ups:
      - Что вернуть, если тот же ключ пришёл с другим телом запроса?
      - Чем идемпотентность отличается от безопасности метода в HTTP?
      - Как это работает при нескольких инстансах сервиса?

  # --- Архитектура ------------------------------------------------------------

  - slug: go_interface_on_consumer_side
    specializations: [backend_go]
    topic: architecture
    subtopic: dependency_injection
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Почему в Go интерфейсы принято объявлять на стороне потребителя, а не рядом с реализацией?"
    answer_short: >-
      Интерфейсы в Go неявные: реализации не нужно знать про интерфейс.
      Потребитель объявляет ровно тот минимум, который ему нужен, и не зависит
      от чужого пакета. Интерфейс рядом с реализацией тянет за собой всё её
      API и создаёт зависимость в обратную сторону.
    answer_detailed: |
      ### Junior
      В Go нет `implements`: тип удовлетворяет интерфейсу, просто имея нужные
      методы. Поэтому интерфейс можно объявить где угодно, в том числе там, где
      он используется.

      ### Middle
      Практическая разница. Если хранилище объявляет интерфейс `Repository` с
      двадцатью методами, то сервису, которому нужен один `GetUser`, придётся
      зависеть от всех двадцати и мокать их в тестах.

      Правильно наоборот:

      ```go
      // package service
      type userGetter interface {
          GetUser(ctx context.Context, id int64) (User, error)
      }

      type Service struct{ users userGetter }
      ```

      Интерфейс маленький, лежит рядом с потребителем и часто вообще
      неэкспортируемый. Тест подставляет заглушку из трёх строк.

      ### Senior
      Ждут понимания следствий для архитектуры. Такой подход даёт направление
      зависимостей от деталей к абстракциям без отдельного слоя «портов»:
      пакет `service` не импортирует `postgres`, а `main` связывает их вместе.
      Это и есть внедрение зависимостей в Go — обычно без DI-контейнера,
      просто конструкторами.

      Стоит упомянуть исключения: интерфейс рядом с реализацией уместен, когда
      реализаций заведомо несколько и они взаимозаменяемы (драйверы, кодеки),
      и когда интерфейс — часть публичного контракта библиотеки,
      как `io.Reader`.
    common_mistakes:
      - Объявлять большой интерфейс рядом с реализацией «на будущее».
      - Делать интерфейс с одной реализацией только ради мока.
      - Тащить DI-контейнер туда, где хватает конструктора.
    follow_ups:
      - Когда интерфейс всё-таки уместен рядом с реализацией?
      - Как это влияет на тестирование сервисного слоя?

  - slug: go_project_layout
    specializations: [backend_go]
    topic: architecture
    subtopic: project_layout
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: single_choice
    title: "Что даёт каталог `internal/` в проекте на Go?"
    options:
      - code: a
        text: "Это соглашение об именовании, компилятор его не различает"
      - code: b
        text: "Компилятор запрещает импортировать пакеты из internal за пределами родительского модуля"
        is_correct: true
      - code: c
        text: "Код в internal не попадает в сборку"
      - code: d
        text: "Пакеты в internal собираются без оптимизаций"
    answer_short: >-
      `internal/` — правило компилятора, а не соглашение. Пакеты внутри
      импортируются только из дерева, начинающегося на уровень выше `internal`.
      Это единственный способ в Go ограничить публичность на уровне пакетов.
    answer_detailed: |
      ### Junior
      Код в `internal/` доступен только своему проекту. Попытка импортировать
      его из чужого модуля — ошибка компиляции.

      ### Middle
      Правило точное: пакет `a/b/internal/c` может импортировать любой пакет
      внутри дерева `a/b`, и никто снаружи. Это позволяет держать реализацию
      закрытой, оставляя публичным только тонкий слой.

      Типовая раскладка: `cmd/<binary>/main.go` для точек входа, `internal/` для
      всего остального, `pkg/` — только если вы действительно предоставляете
      библиотеку наружу. Каталог `pkg/` часто заводят по инерции, и он ничего
      не даёт.

      ### Senior
      Ждут трезвого отношения к «стандартной раскладке»: репозиторий
      golang-standards/project-layout не является официальным, и команда Go
      прямо это отмечала. Для небольшого сервиса плоская структура из нескольких
      пакетов по смыслу читается лучше, чем пять уровней вложенности.

      Хороший ответ звучит как «структура следует за границами домена, а
      `internal` используется, чтобы эти границы не протекли наружу».
    common_mistakes:
      - Считать internal просто соглашением.
      - Заводить pkg/ без публичной библиотеки.
      - Копировать чужую раскладку каталогов вместо структуры по домену.
    follow_ups:
      - Чем cmd/ отличается от internal/ по назначению?
      - Как ограничить видимость внутри одного пакета?

  # --- Системный дизайн -------------------------------------------------------

  - slug: go_rate_limiting_design
    specializations: [backend_go]
    topic: system_design
    subtopic: rate_limiting
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Нужно ограничить API до 100 запросов в минуту на пользователя. Как реализовать на нескольких инстансах?"
    answer_short: >-
      Локальный лимитер не годится: у каждого инстанса свой счётчик. Состояние
      выносят в Redis — скользящее окно или token bucket одним атомарным
      скриптом. Отвечают 429 с заголовками Retry-After и X-RateLimit-*,
      а на недоступность Redis выбирают политику заранее.
    answer_detailed: |
      ### Junior
      В одном процессе хватает `golang.org/x/time/rate`: это token bucket,
      который пропускает всплески до размера корзины и держит среднюю скорость.

      ### Middle
      На нескольких инстансах локальный лимитер даёт лимит, умноженный на число
      подов. Состояние нужно общее — обычно Redis.

      Простой счётчик с окном по минуте страдает на границе: клиент может
      сделать 100 запросов в 59-ю секунду и ещё 100 в 61-ю. Поэтому берут
      скользящее окно или token bucket, реализованный Lua-скриптом, чтобы
      проверка и списание были атомарными.

      Ответ должен быть информативным: код 429, `Retry-After`, и заголовки
      `X-RateLimit-Limit/Remaining/Reset`, чтобы клиент мог вести себя разумно.

      ### Senior
      Ждут разговора о деградации. Что делать, если Redis недоступен?
      Fail-open пропускает всех и рискует уронить бэкенд, fail-closed отказывает
      всем и превращает сбой кеша в полный отказ сервиса. Обычно выбирают
      fail-open с локальным лимитером как страховкой — грубее, но живее.

      Второй сюжет — уровни. Часть лимитов дешевле держать на входе (nginx,
      API gateway), а на приложении оставлять то, что требует знания
      пользователя и тарифа. И различать rate limiting (сколько запросов) от
      concurrency limiting (сколько одновременных) — под нагрузкой второе часто
      важнее.
    common_mistakes:
      - Использовать локальный лимитер при нескольких инстансах.
      - Делать проверку и инкремент двумя командами вместо атомарной.
      - Не продумывать поведение при недоступности хранилища лимитов.
    follow_ups:
      - Чем token bucket отличается от leaky bucket?
      - Почему счётчик с фиксированным окном пропускает двойной всплеск?
      - Что выбрать при отказе Redis и почему?

  - slug: go_cache_stampede
    specializations: [backend_go]
    topic: system_design
    subtopic: caching
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Популярный ключ в кеше протух, и тысяча запросов одновременно пошла в базу. Как это предотвратить?"
    answer_short: >-
      Это cache stampede. Лечится схлопыванием одинаковых запросов (в Go —
      `singleflight`), вероятностным упреждающим обновлением и разбросом TTL,
      чтобы ключи не протухали одновременно.
    answer_detailed: |
      ### Junior
      При промахе кеша все запросы идут в базу одновременно. База получает
      тысячекратную нагрузку на ровном месте.

      ### Middle
      Первый инструмент — `golang.org/x/sync/singleflight`: он схлопывает
      одновременные вызовы с одним ключом в один реальный, остальные ждут и
      получают тот же результат.

      ```go
      var group singleflight.Group

      v, err, _ := group.Do(key, func() (any, error) {
          return loadFromDB(ctx, key)
      })
      ```

      Второй — разброс TTL: если все ключи записаны одним прогревом с
      одинаковым временем жизни, они протухнут одновременно. Добавляют джиттер
      в пределах 10–20%.

      ### Senior
      Ждут упоминания вероятностного упреждающего обновления (XFetch): значение
      обновляется с вероятностью, растущей по мере приближения к истечению TTL,
      поэтому кеш почти никогда не оказывается пустым.

      Важно, что `singleflight` работает в пределах процесса. На нескольких
      инстансах он снижает нагрузку в N раз (по числу подов), но не до единицы —
      для полного схлопывания нужен распределённый лок в Redis, и тогда встаёт
      вопрос его надёжности.

      Стоит отделять stampede от других сценариев: cache penetration (запросы
      несуществующих ключей — лечится негативным кешированием) и cache
      avalanche (падение всего кеша целиком).
    common_mistakes:
      - Ставить одинаковый TTL всем ключам при прогреве.
      - Считать, что singleflight решает проблему на всём кластере.
      - Путать stampede с проникновением запросов несуществующих ключей.
    follow_ups:
      - Как работает singleflight внутри?
      - Что такое негативное кеширование и чем оно опасно?

  - slug: go_observability_three_pillars
    specializations: [backend_go]
    topic: system_design
    subtopic: observability
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: multi_choice
    title: "Какие утверждения о наблюдаемости сервиса верны?"
    options:
      - code: a
        text: "Средняя задержка скрывает проблему: смотреть нужно перцентили"
        is_correct: true
      - code: b
        text: "Логи должны быть структурированными, чтобы по ним можно было искать и агрегировать"
        is_correct: true
      - code: c
        text: "Трассировка отвечает на вопрос, где именно ушло время в цепочке сервисов"
        is_correct: true
      - code: d
        text: "Метрики с высокой кардинальностью меток дешевы и их можно не ограничивать"
    answer_short: >-
      Средние значения маскируют хвосты — нужны p95 и p99. Логи структурируют
      для поиска. Трассировка показывает распределение времени по цепочке
      вызовов. Высокая кардинальность меток (user_id, URL с параметрами) —
      главная причина, по которой падают системы метрик.
    answer_detailed: |
      ### Junior
      Три опоры: метрики (числа во времени), логи (события), трейсы (путь
      запроса). В Go для метрик обычно Prometheus, для логов — `log/slog` из
      стандартной библиотеки (Go 1.21), для трассировки — OpenTelemetry.

      ### Middle
      Средняя задержка почти бесполезна: при 99 быстрых запросах и одном
      десятисекундном среднее выглядит приличным. Смотрят p95/p99, а по SLO —
      долю запросов быстрее порога.

      Кардинальность — главный практический риск. Метка `user_id` на счётчике
      создаёт по временному ряду на пользователя и кладёт Prometheus. То же с
      URL, содержащим идентификаторы: их нормализуют до шаблона маршрута
      (`/users/{id}`).

      ### Senior
      Ждут связности сигналов: trace_id должен попадать в логи, чтобы от
      медленного трейса можно было перейти к его логам. В Go это обычно делают
      через `slog` с обработчиком, достающим trace_id из контекста.

      Полезно упомянуть sampling: писать все трейсы дорого, обычно берут
      процент плюс принудительно все ошибочные и медленные (tail-based
      sampling). И то, что метрики отвечают на вопрос «что сломалось», а трейсы
      и логи — «почему»; строить алерты стоит на метриках, а не на логах.
    common_mistakes:
      - Строить дашборды на средних значениях.
      - Ставить идентификаторы в метки метрик.
      - Не связывать логи с трейсами общим идентификатором.
    follow_ups:
      - Почему p99 важнее среднего для пользовательского опыта?
      - Как нормализовать URL в метках метрик?

  # --- Тестирование -----------------------------------------------------------

  - slug: go_table_driven_tests
    specializations: [backend_go]
    topic: testing
    subtopic: table_tests
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что такое табличные тесты в Go и почему это фактический стандарт?"
    answer_short: >-
      Тест-кейсы описываются слайсом структур, а тело теста одно и прогоняется в
      цикле через `t.Run`. Добавление случая — это одна строка данных, а не
      копия кода. Подтесты дают отдельные имена в выводе и позволяют запускать
      их выборочно.
    answer_detailed: |
      ### Junior
      ```go
      func TestNormalize(t *testing.T) {
          tests := []struct {
              name string
              in   string
              want string
          }{
              {"пустая строка", "", ""},
              {"пробелы по краям", "  a  ", "a"},
              {"внутренние пробелы не трогаем", "a  b", "a  b"},
          }

          for _, tt := range tests {
              t.Run(tt.name, func(t *testing.T) {
                  if got := Normalize(tt.in); got != tt.want {
                      t.Errorf("Normalize(%q) = %q, want %q", tt.in, got, tt.want)
                  }
              })
          }
      }
      ```

      ### Middle
      Почему это работает лучше копипасты: новый случай стоит одну строку,
      имена подтестов видны в выводе, а `go test -run 'TestNormalize/пробелы'`
      запускает ровно один случай.

      Про параллельность: `t.Parallel()` внутри подтеста ускоряет прогон, но до
      Go 1.22 требовал копии переменной цикла — та же ловушка, что и с
      горутинами. С 1.22 копия не нужна.

      ### Senior
      Ждут разговора о границах приёма. Табличный тест хорош, когда случаи
      отличаются только данными. Если в половине случаев нужна своя подготовка и
      свои проверки, таблица превращается в набор флагов `wantErr`,
      `skipSetup` — и это сигнал, что нужно писать отдельные тесты.

      Стоит упомянуть `t.Cleanup` вместо defer для освобождения ресурсов,
      `t.Helper()` в вспомогательных функциях (иначе номер строки в ошибке
      указывает на хелпер), и golden-файлы для больших ожидаемых значений.
    common_mistakes:
      - Раздувать таблицу флагами вместо отдельных тестов.
      - Забывать t.Helper() и получать бесполезные номера строк.
      - Использовать общий изменяемый ресурс в параллельных подтестах.
    follow_ups:
      - Зачем нужен t.Helper?
      - Как устроены golden-файлы и когда они уместны?

  - slug: go_race_detector
    specializations: [backend_go]
    topic: testing
    subtopic: race_detector
    min_grade: junior_plus
    peak_grade: middle_plus
    max_grade: lead
    frequency: 4
    type: single_choice
    title: "Что делает `go test -race` и что означает отсутствие сообщений?"
    options:
      - code: a
        text: "Статически доказывает отсутствие гонок в коде"
      - code: b
        text: "Инструментирует обращения к памяти и сообщает о гонках, которые реально произошли на этом прогоне"
        is_correct: true
      - code: c
        text: "Запускает тесты последовательно, исключая гонки"
      - code: d
        text: "Проверяет только доступ к мапам и слайсам"
    answer_short: >-
      Детектор динамический: он отслеживает фактические обращения к памяти во
      время выполнения и ловит гонку, только если конфликтующие доступы реально
      случились. Чистый прогон не доказывает отсутствие гонок — он лишь не нашёл
      их на этом пути выполнения.
    answer_detailed: |
      ### Junior
      Флаг `-race` включает детектор. При обнаружении он печатает два стека:
      где читали и где писали. В CI его включают обязательно.

      ### Middle
      Ограничения важны не меньше возможностей. Детектор:

      - **динамический** — видит только выполненный код;
      - замедляет программу примерно в 5–10 раз и увеличивает память;
      - требует, чтобы конфликтующие доступы действительно произошли в прогоне.

      Отсюда практика: гонять тесты с `-race` и с `-count=N`, чтобы дать
      планировщику шанс переставить события. Редкая гонка иначе не проявится.

      ### Senior
      Ждут понимания, что детектор реализует happens-before на векторных часах,
      а не эвристику: ложных срабатываний он не даёт, и любое его сообщение —
      настоящая гонка, даже если «в этом месте всё выглядит безопасно».

      Полезно упомянуть, что `-race` имеет смысл включать и на нагрузочном
      стенде, а не только в юнит-тестах: реальная конкуренция там выше.
      И что гонка данных в Go — это неопределённое поведение, а не «просто
      неточный результат»: испорченный заголовок слайса даст падение.
    common_mistakes:
      - Считать чистый прогон -race доказательством отсутствия гонок.
      - Не включать -race в CI из-за замедления.
      - Игнорировать сообщение детектора как ложное срабатывание.
    follow_ups:
      - Почему детектор не даёт ложных срабатываний?
      - Как повысить шанс поймать редкую гонку?

