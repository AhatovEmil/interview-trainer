  - slug: go_slice_append_shared_backing_array
    specializations: [backend_go]
    topic: language
    subtopic: slices_arrays
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Что произойдёт, если сделать `b := a[:2]` и затем `append(b, x)`? Почему это одна из самых частых ошибок с слайсами?"
    answer_short: >-
      Слайсы делят один массив. Если у `b` есть запас ёмкости, append запишет
      элемент прямо в массив `a` и затрёт `a[2]`. Если запаса нет — выделится
      новый массив, и связь пропадёт. Поведение зависит от cap, поэтому баг
      проявляется не всегда.
    answer_detailed: |
      ### Junior
      Слайс — это структура из трёх полей: указатель на массив, длина и ёмкость.
      `b := a[:2]` не копирует данные, а создаёт второй вид на тот же массив.
      Поэтому изменение через `b` видно через `a`.

      ### Middle
      Ключевое — поведение `append`. Он смотрит на `cap(b)`: если места хватает,
      он пишет в существующий массив и молча портит соседние элементы `a`.
      Если места нет — выделяет новый массив, копирует туда и возвращает слайс,
      уже никак не связанный с `a`.

      Отсюда коварство: на коротких данных тест проходит, на других — нет.
      Защита — явно ограничить ёмкость трёхиндексным срезом: `a[:2:2]`. Тогда
      `cap` равен длине, и любой append гарантированно выделит новый массив.

      ### Senior
      Ждут разговора про владение данными на границах API. Функция, принимающая
      слайс и делающая append, обязана документировать, портит ли она вход.
      Возврат подслайса чужого массива удерживает весь массив в памяти — частая
      причина утечки, когда из большого буфера отрезали десять байт и держат их
      вечно. Лечится копированием: `append([]byte(nil), src...)`.

      Стоит упомянуть `slices.Clip` и `slices.Clone` из стандартной библиотеки
      (Go 1.21), которые делают эти намерения явными.
    common_mistakes:
      - Считать, что срез копирует данные.
      - Думать, что append всегда выделяет новый массив.
      - Возвращать подслайс большого буфера и удивляться росту памяти.
    follow_ups:
      - Что выведет len и cap после `a := make([]int, 0, 10); b := append(a, 1)`?
      - Зачем нужен третий индекс в `a[low:high:max]`?
      - Как скопировать слайс так, чтобы точно разорвать связь с исходным?

  - slug: go_typed_nil_interface_trap
    specializations: [backend_go]
    topic: language
    subtopic: interfaces
    min_grade: junior_plus
    peak_grade: middle_plus
    max_grade: lead
    frequency: 5
    type: single_choice
    title: "Функция возвращает `error`. Внутри объявлена `var e *MyError = nil`, и в конце `return e`. Что даст сравнение результата с nil у вызывающего?"
    options:
      - code: a
        text: "Сравнение с nil будет истинным — вернулся нулевой указатель"
      - code: b
        text: "Сравнение с nil будет ложным: интерфейс хранит тип и значение, тип не пустой"
        is_correct: true
      - code: c
        text: "Будет паника при сравнении интерфейса с nil"
      - code: d
        text: "Поведение зависит от версии компилятора"
    answer_short: >-
      Интерфейсное значение состоит из пары (тип, значение). При возврате
      типизированного nil-указателя тип равен *MyError, поэтому интерфейс не
      равен nil, хотя указатель внутри нулевой.
    answer_detailed: |
      ### Junior
      Интерфейс в Go — это не просто указатель, а пара: динамический тип и
      значение. `nil` для интерфейса означает, что пусты **оба** поля.

      ### Middle
      Когда в интерфейс кладут `(*MyError)(nil)`, тип становится `*MyError`,
      а значение — nil. Пара не пустая, значит `err != nil` истинно. Классическая
      ловушка: функция «не вернула ошибку», а вызывающий уходит в ветку обработки.

      Правильно — возвращать явный `nil` литералом, а не переменную конкретного
      типа:

      ```go
      func do() error {
          var e *MyError
          if somethingWrong() {
              e = &MyError{}
              return e
          }
          return nil // не return e
      }
      ```

      ### Senior
      Ждут понимания, где это стреляет системно: в обёртках и middleware, которые
      объявляют переменную конкретного типа ошибки и возвращают её из общего
      пути. И знания диагностики — `errors.Is/As` тут не помогут, потому что
      проблема на уровне представления интерфейса, а не сравнения ошибок.

      Полезно упомянуть, что `go vet` этот случай не ловит, зато его находит
      линтер `nilness` из `golang.org/x/tools`.
    common_mistakes:
      - Считать интерфейс просто указателем.
      - Объявлять переменную конкретного типа ошибки и возвращать её всегда.
      - Пытаться чинить проблему через errors.Is вместо возврата литерального nil.
    follow_ups:
      - Как проверить, что внутри интерфейса лежит nil-указатель?
      - Чем отличается nil-мапа от пустой при чтении и записи?

  - slug: go_error_wrapping_is_as
    specializations: [backend_go]
    topic: language
    subtopic: errors
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Как устроена обёртка ошибок в Go и чем errors.Is отличается от errors.As?"
    answer_short: >-
      `fmt.Errorf` с глаголом `%w` оборачивает ошибку, сохраняя цепочку.
      `errors.Is` идёт по цепочке и сравнивает со значением-часовым,
      `errors.As` — находит в цепочке ошибку нужного типа и присваивает её
      в переданную переменную.
    answer_detailed: |
      ### Junior
      Ошибка в Go — обычное значение. Чтобы добавить контекст, не потеряв
      исходную ошибку, используют `fmt.Errorf("читаю конфиг: %w", err)`.
      Глагол `%w` отличается от `%v` тем, что сохраняет ссылку на исходную.

      Проверять нужно через `errors.Is(err, os.ErrNotExist)`, а не сравнением
      `err == os.ErrNotExist`: после обёртки прямое сравнение перестанет работать.

      ### Middle
      `errors.Is` сравнивает со **значением**: подходит для часовых вроде
      `sql.ErrNoRows`, `context.Canceled`, `io.EOF`.
      `errors.As` ищет по **типу** и даёт доступ к полям:

      ```go
      var pgErr *pgconn.PgError
      if errors.As(err, &pgErr) && pgErr.Code == "23505" {
          // нарушение уникальности
      }
      ```

      Оборачивать нужно осмысленно: каждый уровень добавляет свой контекст, но
      обёртка делает исходную ошибку частью публичного контракта — вызывающий
      теперь может на неё завязаться.

      ### Senior
      Ждут разговора о границах. Внутри пакета обёртки полезны; наружу лучше
      отдавать свои типы ошибок, иначе смена драйвера БД сломает клиентский код,
      который ловил `*pgconn.PgError`. Тут помогает `%v` вместо `%w` — контекст
      сохраняется, а цепочка обрывается намеренно.

      Стоит упомянуть `errors.Join` (Go 1.20) для нескольких ошибок сразу и то,
      что `Is`/`As` умеют работать с деревом, а не только с линейной цепочкой.
    common_mistakes:
      - Сравнивать ошибки через == после обёртки.
      - Оборачивать всё подряд через %w, делая внутренние ошибки публичным API.
      - Терять исходную ошибку, используя %v там, где нужна цепочка.
    follow_ups:
      - Как реализовать свой тип ошибки, чтобы он работал с errors.Is?
      - Что делает errors.Join и когда он нужен?
      - Почему паникой ошибки в Go обрабатывать не принято?

  - slug: go_map_iteration_and_concurrent_access
    specializations: [backend_go]
    topic: language
    subtopic: maps
    min_grade: junior
    peak_grade: junior_plus
    max_grade: middle_plus
    frequency: 4
    type: multi_choice
    title: "Какие утверждения о map в Go верны?"
    options:
      - code: a
        text: "Порядок обхода не определён и намеренно рандомизирован"
        is_correct: true
      - code: b
        text: "Одновременные чтение и запись из разных горутин вызывают падение процесса"
        is_correct: true
      - code: c
        text: "Чтение отсутствующего ключа из nil-мапы вызывает панику"
      - code: d
        text: "Запись в nil-мапу вызывает панику"
        is_correct: true
    answer_short: >-
      Порядок обхода рандомизирован специально, чтобы на него не полагались.
      Гонка чтения и записи детектируется рантаймом и роняет процесс. Из
      nil-мапы читать можно (вернётся нулевое значение), а писать — паника.
    answer_detailed: |
      ### Junior
      Обход `range` по мапе даёт разный порядок при каждом запуске — это сделано
      намеренно, чтобы код не завязывался на порядок. Нужен детерминизм —
      собирайте ключи в слайс и сортируйте.

      Из nil-мапы чтение безопасно и возвращает нулевое значение типа, а вот
      запись паникует с `assignment to entry in nil map`.

      ### Middle
      Мапа не потокобезопасна. Рантайм содержит встроенную проверку: при
      одновременных чтении и записи процесс падает с `concurrent map read and
      map write` — это не паника, которую можно перехватить recover, а
      аварийное завершение. Сделано специально, потому что гонка на мапе может
      незаметно испортить структуру данных.

      Варианты защиты: `sync.RWMutex` рядом с мапой либо `sync.Map`.

      ### Senior
      Ждут понимания, когда `sync.Map` действительно уместен: она оптимизирована
      под два сценария — ключ пишется один раз и потом только читается, либо
      горутины работают с непересекающимися наборами ключей. В обычной нагрузке
      с частыми записями мапа под `RWMutex` быстрее, а шардированная мапа —
      ещё быстрее.

      Полезно знать про рост: мапа растёт инкрементально, эвакуация корзин
      размазана по операциям, и предварительный `make(map[K]V, n)` экономит
      заметное время на больших объёмах.
    common_mistakes:
      - Полагаться на порядок обхода мапы.
      - Считать, что гонку на мапе можно перехватить через recover.
      - Брать sync.Map по умолчанию вместо мапы под мьютексом.
    follow_ups:
      - Как получить детерминированный обход мапы?
      - Чем sync.Map отличается от map под RWMutex по внутреннему устройству?

  - slug: go_defer_evaluation_and_loops
    specializations: [backend_go]
    topic: language
    subtopic: defer_panic
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: single_choice
    title: "В цикле по 1000 файлов внутри одной функции стоит `defer f.Close()`. В чём проблема?"
    options:
      - code: a
        text: "Ошибки нет: defer выполнится сразу после каждой итерации"
      - code: b
        text: "Все 1000 файлов останутся открытыми до выхода из функции — можно упереться в лимит дескрипторов"
        is_correct: true
      - code: c
        text: "defer в цикле не компилируется"
      - code: d
        text: "Файлы закроются в случайном порядке"
    answer_short: >-
      defer привязан к выходу из функции, а не из итерации. Тысяча отложенных
      Close накапливается и выполнится только в конце, удерживая все дескрипторы.
      Тело цикла нужно вынести в отдельную функцию или закрывать явно.
    answer_detailed: |
      ### Junior
      `defer` откладывает вызов до возврата из **функции**. Блок цикла функцией
      не является, поэтому отложенные вызовы копятся, а дескрипторы не
      освобождаются.

      ### Middle
      Правильно вынести тело в функцию — тогда defer сработает на каждой итерации:

      ```go
      for _, name := range names {
          if err := process(name); err != nil {
              return err
          }
      }

      func process(name string) error {
          f, err := os.Open(name)
          if err != nil {
              return err
          }
          defer f.Close()
          // ...
      }
      ```

      Второй момент — аргументы defer вычисляются **в момент объявления**, а не
      выполнения. `defer fmt.Println(i)` напечатает значение `i` на момент
      строки с defer, а не финальное.

      ### Senior
      Ждут двух вещей. Первая — `defer f.Close()` для файла, открытого на
      запись, скрывает ошибку закрытия, а именно там всплывает ошибка сброса
      буфера. Правильно — именованный возврат и присваивание:

      ```go
      func write() (err error) {
          f, err := os.Create(path)
          if err != nil {
              return err
          }
          defer func() {
              if cerr := f.Close(); cerr != nil && err == nil {
                  err = cerr
              }
          }()
          // ...
      }
      ```

      Вторая — стоимость. С Go 1.14 большинство defer инлайнятся и стоят
      считаные наносекунды, так что «убрать defer ради скорости» — устаревший
      совет, кроме горячих циклов, где его всё равно измеряют.
    common_mistakes:
      - Считать, что defer срабатывает в конце итерации цикла.
      - Игнорировать ошибку Close при записи в файл.
      - Забывать, что аргументы defer вычисляются сразу.
    follow_ups:
      - Что напечатает `for i := 0; i < 3; i++ { defer fmt.Println(i) }`?
      - Как defer взаимодействует с panic и recover?

