  - slug: php_types_and_declarations
    specializations: [backend_php]
    topic: language
    subtopic: types
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Какие типы есть в PHP и что даёт объявление типов в сигнатуре?"
    answer_short: >-
      Скалярные (int, float, string, bool), массив, объект, null и несколько
      специальных. Объявление типов в сигнатуре заставляет PHP проверять
      значения на входе и выходе — ошибка обнаруживается на границе функции, а
      не через десять строк.
    answer_detailed: |
      ```php
      function totalWithDiscount(float $total, int $percent): float
      {
          return $total * (100 - $percent) / 100;
      }
      ```

      Без объявленных типов PHP молча преобразует значения: строка `"5 яблок"`
      в арифметике превратится в 5. Это удобно ровно до первой ошибки в данных,
      после чего разбираться, где именно значение испортилось, приходится
      вручную.

      С объявленными типами по умолчанию всё ещё действует мягкое приведение:
      строка `"5"` пройдёт как int. Строгий режим (`declare(strict_types=1)`)
      это отключает — передали строку туда, где ожидается int, получили
      ошибку. В современных проектах строгий режим включают везде.

      Типы указывают у параметров, у возвращаемого значения и у свойств
      классов. Свойство с типом, но без значения, остаётся
      неинициализированным, и обращение к нему до присваивания даёт ошибку — это
      лучше, чем тихий null.
    common_mistakes:
      - Не объявлять типы и полагаться на автоматическое приведение.
      - Забывать declare(strict_types=1) и получать мягкое приведение.
      - Считать неинициализированное типизированное свойство равным null.
    follow_ups:
      - Что меняет строгий режим?
      - Чем неинициализированное свойство отличается от null?

  - slug: php_arrays_basics
    specializations: [backend_php]
    topic: language
    subtopic: arrays
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Как устроен массив в PHP и чем он отличается от массива в других языках?"
    answer_short: >-
      Это упорядоченная хеш-таблица: одна структура работает и как список, и
      как словарь. Ключи бывают целыми и строковыми, порядок добавления
      сохраняется. Отдельного типа «словарь» в языке нет.
    answer_detailed: |
      ```php
      $list = [1, 2, 3];                       // ключи 0, 1, 2
      $map  = ['name' => 'Аня', 'age' => 30];  // строковые ключи

      $map['email'] ?? 'не указан';            // безопасное чтение
      ```

      Из-за такого устройства список после `unset` элемента остаётся с дырой в
      ключах, и при сериализации в JSON превращается не в массив, а в объект.
      Чтобы этого не случилось, ключи переиндексируют через `array_values`.

      Полезные функции, которые спрашивают: `array_map` для преобразования,
      `array_filter` для отбора, `array_column` для выборки поля, `in_array` и
      `array_key_exists` для проверки наличия.

      Важная деталь: `array_filter` сохраняет исходные ключи. Отфильтровали
      список — получили массив с дырами, и в JSON он снова уедет объектом.

      Массивы передаются по значению с копированием при записи: изменение копии
      не задевает оригинал, но пока изменений нет, копии физически не
      происходит.
    common_mistakes:
      - Не переиндексировать массив после фильтрации и получать объект в JSON.
      - Путать проверку наличия ключа и наличия значения.
      - Считать, что передача массива в функцию всегда копирует память.
    follow_ups:
      - Почему отфильтрованный список превращается в JSON-объект?
      - Чем array_key_exists отличается от in_array?

  - slug: php_request_lifecycle_basics
    specializations: [backend_php]
    topic: runtime
    subtopic: request_lifecycle
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что происходит с PHP-скриптом от прихода запроса до ответа?"
    answer_short: >-
      Веб-сервер передаёт запрос обработчику PHP, тот выполняет скрипт с нуля,
      отдаёт ответ и уничтожает всё состояние процесса. Следующий запрос
      начинается с чистого листа — глобальные переменные между запросами не
      живут.
    answer_detailed: |
      Порядок примерно такой: сервер получает запрос → передаёт его PHP-FPM →
      тот берёт свободный рабочий процесс → выполняется входной скрипт →
      формируется ответ → память процесса очищается.

      Главное следствие: **общего состояния между запросами нет**. Ничего нельзя
      «положить в память до следующего раза» — для этого есть сессия, кеш или
      база. Это отличает PHP от языков с долгоживущим процессом и заодно
      объясняет, почему утечки памяти в классическом PHP редко становятся
      проблемой.

      Второе следствие: каждый запрос заново подключает файлы классов. Этим
      занимается автозагрузчик Composer, а повторный разбор кода снимает
      OPcache, хранящий скомпилированное представление.

      Третье: число одновременных запросов ограничено числом рабочих процессов.
      Медленный внешний запрос занимает процесс целиком, и при исчерпании пула
      сайт перестаёт отвечать даже на быстрые страницы.

      Современные варианты вроде долгоживущих воркеров это меняют — и вместе с
      удобством возвращают проблему состояния, которое живёт между запросами.
    common_mistakes:
      - Пытаться сохранить данные в глобальной переменной между запросами.
      - Не учитывать, что медленный внешний вызов занимает рабочий процесс.
      - Считать, что число процессов PHP-FPM можно ставить произвольно большим.
    follow_ups:
      - Почему утечки памяти в классическом PHP редко заметны?
      - Что произойдёт при исчерпании рабочих процессов?

  - slug: php_composer_autoload
    specializations: [backend_php]
    topic: runtime
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 4
    type: open_answer
    title: "Что делает Composer и как работает автозагрузка классов?"
    answer_short: >-
      Composer управляет зависимостями и генерирует автозагрузчик: класс
      подключается в момент первого обращения, по соответствию пространства
      имён и пути к файлу. Ручные include для классов не нужны.
    answer_detailed: |
      ```json
      {
        "autoload": { "psr-4": { "App\\": "src/" } },
        "require": { "guzzlehttp/guzzle": "^7.8" }
      }
      ```

      По этому правилу класс `App\Service\OrderService` ищется в
      `src/Service/OrderService.php`. Отсюда требования: имя файла совпадает с
      именем класса, регистр важен — на Windows ошибка не проявится, на боевом
      Linux проявится сразу.

      Что коммитят: `composer.json` и `composer.lock`. Файл блокировки
      фиксирует точные версии, и без него у каждого разработчика и на сервере
      окажется свой набор. Каталог `vendor` в репозиторий не кладут — он
      восстанавливается командой установки.

      Разница между двумя командами: установка ставит версии из файла
      блокировки, обновление пересчитывает их по ограничениям из
      `composer.json`. На боевом сервере выполняют только первую.

      Зависимости для разработки — тесты, анализаторы — держат отдельным
      разделом и не ставят в бою.
    common_mistakes:
      - Не коммитить composer.lock.
      - Класть каталог vendor в репозиторий.
      - Выполнять обновление зависимостей при выкладке.
    follow_ups:
      - Чем установка отличается от обновления зависимостей?
      - Почему несовпадение регистра в имени файла ломает боевой сервер?

  - slug: php_memory_and_timeouts
    specializations: [backend_php]
    topic: runtime
    subtopic: memory
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Скрипт падает на большом объёме данных. Что вы проверите?"
    answer_short: >-
      Ограничение памяти и время выполнения, но главное — способ обработки.
      Загрузка миллиона строк в массив упирается в лимит на любой машине;
      данные обрабатывают порциями или потоком, а не целиком.
    answer_detailed: |
      ```php
      // так память кончится
      $rows = $pdo->query('SELECT * FROM orders')->fetchAll();

      // так — нет
      foreach ($pdo->query('SELECT * FROM orders') as $row) {
          process($row);
      }
      ```

      Поднять `memory_limit` — первое, что приходит в голову, и обычно неверный
      ход: он лишь отодвигает границу, а данные растут дальше. Правильнее
      обрабатывать порциями.

      Инструменты для этого: генераторы, которые отдают значения по одному и не
      держат весь набор; чтение файла построчно; выборка из базы курсором или
      постранично.

      Про время выполнения: у веб-запроса оно ограничено, и долгую работу
      делают не в запросе, а в фоновой задаче из очереди. Отчёт на десять минут
      в HTTP-запросе — это гарантированный обрыв по времени у веб-сервера, даже
      если у PHP лимит снят.

      Полезно и понимать, где память уходит на копирование: массивы копируются
      при записи, и изменение большого массива внутри функции удваивает расход.
    common_mistakes:
      - Поднимать memory_limit вместо порционной обработки.
      - Использовать fetchAll на большой выборке.
      - Выполнять долгие задачи в веб-запросе вместо очереди.
    follow_ups:
      - Чем генератор помогает при обработке большого набора?
      - Куда выносят работу, не укладывающуюся во время запроса?

  - slug: php_pdo_basics
    specializations: [backend_php]
    topic: db
    subtopic: pdo_prepared
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как выполнить запрос к базе через PDO и почему параметры не подставляют в строку?"
    answer_short: >-
      Через подготовленный запрос с плейсхолдерами: значения передаются
      отдельно от текста запроса. Склейка строкой открывает SQL-инъекцию —
      значение перестаёт быть значением и становится частью команды.
    answer_detailed: |
      ```php
      $stmt = $pdo->prepare('SELECT id, email FROM users WHERE status = :status');
      $stmt->execute(['status' => $status]);
      $rows = $stmt->fetchAll(PDO::FETCH_ASSOC);
      ```

      Почему это безопасно: база получает шаблон запроса и значения по
      отдельности и уже не может истолковать значение как часть команды. Никакое
      экранирование руками не даёт такой же гарантии.

      Настройки подключения, которые задают сразу:

      - режим ошибок — исключения. По умолчанию часть ошибок можно не заметить;
      - режим выборки — ассоциативные массивы;
      - отключение эмуляции подготовленных запросов, чтобы типы передавались
        по-настоящему.

      Чего плейсхолдер не умеет: подставлять имена таблиц и колонок. Если
      сортировка приходит от пользователя, её сверяют со списком разрешённых
      значений, а не подставляют в запрос.

      Устаревшие функции без подготовки в новом коде не используют.
    common_mistakes:
      - Склеивать значения в текст запроса.
      - Оставлять режим ошибок по умолчанию и терять сбои.
      - Подставлять имя колонки из запроса пользователя в ORDER BY.
    follow_ups:
      - Как безопасно принять имя колонки для сортировки от пользователя?
      - Зачем отключают эмуляцию подготовленных запросов?

  - slug: php_sql_select_basics
    specializations: [backend_php]
    topic: db
    subtopic: indexes
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Из чего состоит запрос на выборку и зачем нужен индекс?"
    answer_short: >-
      `SELECT` перечисляет колонки, `FROM` — таблицу, `WHERE` отбирает строки,
      `JOIN` соединяет таблицы, `ORDER BY` сортирует. Индекс позволяет найти
      нужные строки, не читая таблицу целиком.
    answer_detailed: |
      ```sql
      SELECT o.id, u.email
      FROM orders o
      JOIN users u ON u.id = o.user_id
      WHERE o.status = 'paid'
      ORDER BY o.created_at DESC
      LIMIT 20;
      ```

      Без индекса база читает всю таблицу. На тысяче строк это незаметно, на
      миллионе — секунды на каждый запрос. Индекс по колонке из условия
      превращает такой запрос в чтение небольшого куска данных.

      Плата: каждый индекс занимает место и замедляет вставку и обновление.
      Поэтому их ставят по реальным запросам, а не на все колонки подряд.

      Что стоит уметь сразу: `LEFT JOIN` оставляет строки левой таблицы даже
      без пары справа; `GROUP BY` собирает строки в группы для агрегатов;
      `SELECT *` в коде приложения не пишут.

      И главный инструмент разбора: `EXPLAIN` перед запросом показывает, будет
      ли использован индекс. Без него оптимизация превращается в угадывание.
    common_mistakes:
      - Ставить индексы на все колонки подряд.
      - Писать SELECT * в коде приложения.
      - Оптимизировать запрос, не посмотрев план выполнения.
    follow_ups:
      - Что показывает EXPLAIN?
      - Почему индексы замедляют запись?

  - slug: php_http_request_basics
    specializations: [backend_php]
    topic: web
    subtopic: http
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Из чего состоит HTTP-запрос и чем GET отличается от POST?"
    answer_short: >-
      Из метода, адреса, заголовков и необязательного тела. GET запрашивает
      данные и не должен ничего менять, POST отправляет данные и меняет
      состояние. Повторить GET безопасно, POST — нет.
    answer_detailed: |
      Ответ устроен так же: код состояния, заголовки, тело.

      Практическая разница: параметры GET видны в адресе, попадают в историю
      браузера, в закладки и в журналы сервера. Пароли и токены там передавать
      нельзя.

      GET кешируется браузерами и промежуточными узлами, POST — нет. Отсюда
      классическая ошибка: удаление по ссылке. Достаточно, чтобы по ней прошёл
      поисковый робот или предзагрузчик браузера, и данные исчезнут.

      В PHP параметры приходят в суперглобальных массивах `$_GET`, `$_POST`,
      `$_SERVER`, `$_COOKIE`. Ни один из них не является доверенным: всё, что
      пришло от клиента, проверяют перед использованием, включая заголовки.

      Отдельно про `$_SERVER['HTTP_HOST']` и подобные: их присылает клиент, и
      подставлять их в ссылки без проверки нельзя.
    common_mistakes:
      - Менять данные запросом GET.
      - Передавать токен параметром в адресе.
      - Считать содержимое заголовков доверенным.
    follow_ups:
      - Почему удаление по GET-ссылке опасно?
      - Какие суперглобальные массивы содержат данные от клиента?

  - slug: php_sessions_basics
    specializations: [backend_php]
    topic: web
    subtopic: sessions
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как работает сессия в PHP и что хранится у клиента?"
    answer_short: >-
      У клиента в cookie хранится только идентификатор сессии, сами данные
      лежат на сервере. По идентификатору сервер находит файл или запись в
      хранилище и восстанавливает данные для текущего запроса.
    answer_detailed: |
      ```php
      session_start();
      $_SESSION['user_id'] = $user->id;
      ```

      Что важно про безопасность:

      - cookie сессии помечают `HttpOnly`, чтобы её не прочитал сценарий на
        странице, и `Secure`, чтобы она не уходила по открытому каналу;
      - после входа идентификатор сессии меняют (`session_regenerate_id`) —
        иначе злоумышленник, заранее подсунувший свой идентификатор, получит
        доступ к чужому сеансу;
      - в сессии хранят идентификатор пользователя, а не его права: права
        меняются, а сессия живёт долго.

      Про масштабирование: по умолчанию сессии лежат файлами на диске сервера.
      Два сервера — и пользователь, попавший на второй, окажется разлогинен.
      Поэтому хранилище выносят в общее — обычно в Redis.

      Про размер: класть в сессию большие объекты не стоит, она читается и
      пишется на каждом запросе.
    common_mistakes:
      - Не менять идентификатор сессии после входа.
      - Хранить сессии в файлах при нескольких серверах.
      - Складывать в сессию права и большие объекты.
    follow_ups:
      - Почему идентификатор сессии меняют после входа?
      - Что произойдёт с сессиями при добавлении второго сервера?

  - slug: php_input_validation_basics
    specializations: [backend_php]
    topic: web
    subtopic: validation
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как проверяют данные, пришедшие от пользователя, и где это делают?"
    answer_short: >-
      На границе приложения, до того как данные попадут в логику или в базу.
      Проверяют по списку разрешённого, а не по списку запрещённого: перечислить
      всё плохое невозможно, перечислить допустимое — можно.
    answer_detailed: |
      ```php
      $email = filter_input(INPUT_POST, 'email', FILTER_VALIDATE_EMAIL);
      if ($email === false || $email === null) {
          return new JsonResponse(['error' => 'некорректный email'], 400);
      }
      ```

      Разделяют три вещи, которые часто путают:

      - **проверка** — данные соответствуют ожиданиям (тип, диапазон, формат);
      - **приведение** — значение переводят в нужный тип;
      - **экранирование** — данные готовят к выводу в конкретный контекст: HTML,
        SQL, адрес. Экранирование выполняют при выводе, а не при сохранении.

      Ошибка «почистили при вводе и забыли» приводит к тому, что данные хранятся
      искажёнными, а в новом месте вывода снова оказываются небезопасными.

      Проверять нужно всё, что пришло снаружи: тело запроса, параметры адреса,
      заголовки, cookie, загруженные файлы. Скрытое поле формы и значение из
      выпадающего списка — тоже данные от клиента, их легко подменить.

      В фреймворках для этого есть готовые правила проверки — писать её вручную
      имеет смысл только в мелких скриптах.
    common_mistakes:
      - Фильтровать по списку запрещённого вместо списка разрешённого.
      - Экранировать при сохранении вместо вывода.
      - Доверять скрытым полям формы и значениям из выпадающих списков.
    follow_ups:
      - Почему экранирование делают при выводе?
      - Чем проверка отличается от экранирования?
  - slug: php_xss_escaping_basics
    specializations: [backend_php]
    topic: security
    subtopic: xss_csrf
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что такое XSS и как от него защищаются при выводе данных?"
    answer_short: >-
      Внедрение чужого кода в страницу через данные, которые вывели без
      экранирования. Защита — экранировать при выводе по контексту: в HTML одно,
      в атрибуте другое, в JavaScript третье.
    answer_detailed: |
      ```php
      echo htmlspecialchars($comment, ENT_QUOTES | ENT_SUBSTITUTE, 'UTF-8');
      ```

      Как это работает у атакующего: он оставляет комментарий со сценарием,
      сайт выводит его как есть, и сценарий выполняется у каждого посетителя —
      с его правами и его cookie.

      Ключевая мысль: экранирование зависит от места вывода. Одна и та же
      строка требует разной обработки в тексте страницы, в значении атрибута, в
      адресе ссылки и внутри сценария. Универсального «почистить один раз» не
      существует.

      Поэтому в шаблонизаторах экранирование включено по умолчанию, а отключать
      его приходится явно — и каждое такое отключение должно быть осознанным.

      Дополнительный рубеж — заголовок политики безопасности контента: он
      запрещает выполнять сценарии из недоверенных источников и превращает
      часть уязвимостей в неработающие.

      И `HttpOnly` на cookie сессии: даже сработавший сценарий не сможет её
      прочитать.
    common_mistakes:
      - Экранировать при сохранении вместо вывода.
      - Отключать автоэкранирование шаблонизатора не разобравшись.
      - Считать, что достаточно вырезать слово script.
    follow_ups:
      - Почему экранирование зависит от контекста вывода?
      - Что даёт HttpOnly на cookie сессии?

  - slug: php_framework_structure_basics
    specializations: [backend_php]
    topic: frameworks
    subtopic: config
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 4
    type: open_answer
    title: "Зачем нужен фреймворк и что он берёт на себя?"
    answer_short: >-
      Он задаёт устройство приложения и закрывает задачи, которые есть в любом
      проекте: маршрутизацию, работу с запросом и ответом, шаблоны, доступ к
      базе, очереди, миграции, конфигурацию. Это экономит не строки, а решения.
    answer_detailed: |
      Типичная структура: одна точка входа, маршрутизатор, контроллеры,
      сервисный слой, шаблоны, конфигурация в отдельном каталоге.

      Единая точка входа — важная деталь: наружу открыт только каталог
      `public`, весь остальной код лежит выше и по прямой ссылке недоступен.
      Проекты, где `.php` разбросаны по всему дереву, страдают именно от этого.

      Что даёт фреймворк кроме кода: общие соглашения. Новый человек находит
      маршруты, миграции и конфигурацию там, где ожидает, а не там, где решил
      предыдущий разработчик.

      Чего он не отменяет: понимания HTTP, SQL и безопасности. Фреймворк даёт
      инструменты, но подставит запрос в строку или отключит экранирование
      разработчик.

      Про выбор: для API и приложений средней сложности берут популярный
      фреймворк с живым сообществом. Собственный микрофреймворк выглядит
      привлекательно ровно до момента, когда его нужно поддерживать и объяснять
      новичкам.
    common_mistakes:
      - Держать исполняемые файлы вне каталога public.
      - Писать собственный фреймворк вместо использования готового.
      - Считать, что фреймворк сам обеспечивает безопасность.
    follow_ups:
      - Зачем нужна единая точка входа?
      - Что фреймворк не берёт на себя?

  - slug: php_di_basics
    specializations: [backend_php]
    topic: frameworks
    subtopic: di_container
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое внедрение зависимостей и чем оно лучше создания объекта внутри класса?"
    answer_short: >-
      Класс получает зависимости снаружи, а не создаёт их сам. Тогда его можно
      собрать с другой реализацией — в тесте с заглушкой, в бою с настоящей — и
      он перестаёт зависеть от способа создания своих зависимостей.
    answer_detailed: |
      ```php
      final class OrderService
      {
          public function __construct(
              private readonly OrderRepository $orders,
              private readonly Mailer $mailer,
          ) {}
      }
      ```

      Если бы сервис делал `new PdoOrderRepository(...)` внутри, подменить его
      в тесте было бы нечем, и каждый тест требовал бы базы.

      Контейнер собирает объекты по типам параметров конструктора. Класс при
      этом ничего не знает о контейнере — это важно: класс, который сам достаёт
      зависимости из контейнера, снова становится непроверяемым, только теперь
      скрытно.

      Зависимости объявляют интерфейсами там, где реализация может меняться, и
      конкретными классами там, где не может. Интерфейс с единственной
      реализацией «на всякий случай» — лишний файл.

      Признак, что зависимостей слишком много: конструктор на семь параметров.
      Обычно это значит, что класс делает несколько разных дел.
    common_mistakes:
      - Создавать зависимости через new внутри сервиса.
      - Доставать зависимости из контейнера внутри класса.
      - Заводить интерфейс с единственной реализацией ради формы.
    follow_ups:
      - Почему класс не должен знать о контейнере?
      - О чём говорит конструктор на семь параметров?

  - slug: php_routing_and_controllers
    specializations: [backend_php]
    topic: frameworks
    subtopic: middleware
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Как запрос попадает в нужный контроллер и что такое middleware?"
    answer_short: >-
      Маршрутизатор сопоставляет метод и путь запроса с описанным маршрутом и
      вызывает соответствующий обработчик. Middleware — слои вокруг него,
      через которые проходит каждый запрос: аутентификация, журналирование,
      обработка ошибок.
    answer_detailed: |
      ```php
      Route::get('/orders/{id}', [OrderController::class, 'show'])
          ->middleware('auth');
      ```

      Middleware выполняются в порядке объявления и могут остановить обработку —
      например, вернуть 401, не доходя до контроллера. На обратном пути они
      видят ответ и могут его изменить.

      Что в них выносят: всё сквозное — проверку аутентификации, идентификатор
      запроса, единый формат ошибки, ограничение частоты обращений.

      Чего не выносят: бизнес-правила. Спрятанные в middleware условия
      предметной области почти невозможно найти при чтении контроллера.

      Про контроллер: его задача — принять запрос, вызвать сервис, вернуть
      ответ. Как только внутри появляются вычисления и обращения к базе,
      проверить их можно только через HTTP, а такие тесты медленные и хрупкие.

      Маршруты именуют по ресурсам, действие выражают методом HTTP:
      `DELETE /orders/42`, а не `GET /orders/delete?id=42`.
    common_mistakes:
      - Прятать бизнес-правила в middleware.
      - Держать запросы к базе прямо в контроллере.
      - Кодировать действие словом в адресе вместо метода HTTP.
    follow_ups:
      - Что происходит, если middleware вернёт ответ сам?
      - Почему тесты бизнес-логики через HTTP хрупкие?

  - slug: php_layers_basics
    specializations: [backend_php]
    topic: architecture
    subtopic: layered_architecture
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Зачем выносить логику из контроллера в отдельный слой?"
    answer_short: >-
      Чтобы правила можно было проверять и переиспользовать без HTTP. Один и
      тот же сценарий вызывается из контроллера, из консольной команды и из
      обработчика очереди — если он живёт в контроллере, его придётся
      скопировать.
    answer_detailed: |
      ```
      Controller → Service → Repository → БД
      ```

      Практический признак, что пора выносить: в контроллере появились
      вычисления, обращения к базе и условия про предметную область, а метод
      перестал помещаться на экран.

      Что это даёт: сервис проверяется обычным тестом с подставленным
      репозиторием, без поднятия приложения. Такие тесты идут миллисекунды,
      поэтому их действительно запускают.

      Правила, за которые обычно спрашивают:

      - контроллер не ходит в базу напрямую;
      - репозиторий ничего не знает про HTTP;
      - наружу отдают отдельный объект ответа, а не сущность из базы.

      Честная оговорка: для страницы, которая просто показывает список из
      таблицы, отдельный сервис без единого правила бывает лишней церемонией. Но
      как только правило появляется, ему нужно предсказуемое место — иначе оно
      расползётся по контроллерам и шаблонам.
    common_mistakes:
      - Держать запросы к базе и бизнес-правила в контроллере.
      - Дублировать сценарий между контроллером и консольной командой.
      - Заводить пустые прослойки ради формального соблюдения слоёв.
    follow_ups:
      - Где ещё, кроме контроллера, вызывается тот же сценарий?
      - Когда отдельный сервисный слой избыточен?

  - slug: php_srp_basics
    specializations: [backend_php]
    topic: architecture
    subtopic: solid
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое принцип единственной ответственности и как понять, что он нарушен?"
    answer_short: >-
      У класса должна быть одна причина для изменения. Признак нарушения:
      описание требует союза «и» — «считает стоимость и отправляет письмо», — и
      правки по разным причинам приходят в один файл.
    answer_detailed: |
      Практические признаки, что класс делает слишком много:

      - имя содержит `Manager`, `Helper`, `Utils`: честное имя придумать не
        удалось;
      - чтобы проверить одно правило, в тесте нужно подставить пять
        зависимостей;
      - каждая задача спринта задевает этот файл, и правки конфликтуют.

      ```php
      final class PriceCalculator { ... }   // меняется вместе с правилами цен
      final class OrderNotifier   { ... }   // меняется вместе с форматом письма
      ```

      Обратная крайность реальна не меньше: класс на один метод, вызываемый из
      одного места, добавляет косвенность и ничего не упрощает. Принцип — про
      причины изменения, а не про число строк.

      Тот же критерий применим к методу: если внутри читается «сначала одно,
      потом совсем другое», это обычно два метода. И к контроллеру: метод,
      который проверяет права, считает, пишет в базу и формирует письмо, — это
      четыре причины меняться в одном месте.
    common_mistakes:
      - Понимать принцип как «класс должен быть маленьким».
      - Заводить Helpers и складывать туда всё подряд.
      - Дробить на классы по одному методу ради формы.
    follow_ups:
      - Почему имя Manager — признак проблемы?
      - Чем плохо дробление на классы по одному методу?

  - slug: php_cache_basics
    specializations: [backend_php]
    topic: system_design
    subtopic: caching
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое кеш и какую проблему он создаёт вместе с той, что решает?"
    answer_short: >-
      Хранилище готового результата, чтобы не считать его заново. Решает
      проблему скорости и нагрузки, создаёт проблему устаревших данных: где-то
      лежит копия, и она может разойтись с источником.
    answer_detailed: |
      Кеш уместен, когда данные читают часто, а меняют редко, и небольшое
      отставание допустимо: справочники, настройки, собранные страницы. Он не
      подходит там, где нужна точность прямо сейчас, — остаток на счёте, число
      мест.

      Главный вопрос при добавлении — не «как положить», а «когда убрать». Два
      подхода: время жизни (проще, устаревание предсказуемо) и удаление при
      изменении (точнее, но нужно не забыть ни одного места записи).

      Важная деталь именно для PHP: кеш в памяти процесса бесполезен —
      процесс живёт один запрос. Поэтому кеш всегда внешний: Redis, Memcached
      или файлы. И при нескольких серверах файловый кеш у каждого свой.

      И кеш не лечит плохой запрос: сначала чинят запрос и индексы, потом
      думают про кеш. Иначе под ним остаётся мина, которая срабатывает при
      сбросе — база получает всю нагрузку разом.
    common_mistakes:
      - Кешировать данные, требующие точности прямо сейчас.
      - Держать файловый кеш при нескольких серверах.
      - Прятать под кешем медленный запрос вместо его исправления.
    follow_ups:
      - Почему кеш в памяти процесса в PHP бесполезен?
      - Что произойдёт при одновременном сбросе кеша?

  - slug: php_scaling_basics
    specializations: [backend_php]
    topic: system_design
    subtopic: scaling
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что нужно изменить в приложении, чтобы запустить его на нескольких серверах?"
    answer_short: >-
      Убрать всё, что живёт на локальном сервере: сессии, кеш, загруженные
      файлы, запланированные задачи. Всё это выносят в общее хранилище, иначе
      поведение начинает зависеть от того, на какой сервер попал запрос.
    answer_detailed: |
      Что ломается первым:

      - **сессии** в файлах: пользователь на втором сервере оказывается
        разлогинен. Выносят в Redis или в базу;
      - **загруженные файлы** на локальном диске: картинка загружена на один
        сервер, а отдаётся с другого. Выносят в объектное хранилище;
      - **кеш** в файлах: у каждого сервера свой, данные расходятся;
      - **запланированные задачи**: настроенные на всех серверах, они начинают
        выполняться в несколько экземпляров. Нужен один исполнитель или
        блокировка.

      Само PHP-приложение к горизонтальному росту располагает: процесс живёт
      один запрос и состояния между запросами не хранит. Основная работа — как
      раз вынести перечисленное.

      Дальше узким местом становится база: она общая, и три сервера приложения
      просто быстрее её нагружают. Отсюда индексы, кеш и реплики на чтение.

      И порядок действий: прежде чем добавлять серверы, смотрят, где уходит
      время. Три копии медленного запроса дают три медленных запроса.
    common_mistakes:
      - Оставлять сессии и загруженные файлы на локальном диске.
      - Запускать запланированные задачи на всех серверах.
      - Масштабировать вширь, не разобравшись с базой.
    follow_ups:
      - Что станет узким местом после добавления серверов?
      - Как быть с задачами по расписанию при нескольких серверах?

  - slug: php_phpunit_basics
    specializations: [backend_php]
    topic: testing
    subtopic: unit
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как выглядит тест на PHPUnit и что в нём стоит проверять?"
    answer_short: >-
      Метод класса-теста: подготовили данные, выполнили действие, проверили
      результат. Проверяют поведение, а не реализацию: расчёты, границы,
      обработку ошибок, а не то, какие методы внутри вызвались.
    answer_detailed: |
      ```php
      public function testAppliesDiscountToTotal(): void
      {
          $order = new Order([100, 200]);

          $total = $order->totalWithDiscount(10);

          self::assertSame(270, $total);
      }
      ```

      `assertSame` вместо `assertEquals` — важная деталь: второй сравнивает с
      приведением типов, и тест пропустит `"270"` вместо `270`.

      Имя теста описывает поведение, а не метод: по списку упавших тестов сразу
      видно, что сломалось.

      Что проверять в первую очередь — не то, что легко, а то, что легко
      сломать: расчёты, граничные значения, поведение при пустых данных и при
      ошибках. Тест на геттер не даёт ничего.

      Для набора однотипных случаев берут поставщика данных: одна логика,
      разные входные значения, вместо десяти похожих методов.

      И привычка: получив ошибку от пользователя, сначала пишут тест, который
      её воспроизводит, и только потом чинят.
    common_mistakes:
      - Использовать assertEquals там, где нужен assertSame.
      - Проверять геттеры вместо расчётов и границ.
      - Копировать похожие тесты вместо поставщика данных.
    follow_ups:
      - Чем assertSame отличается от assertEquals?
      - Почему тест на ошибку пишут до исправления?

  - slug: php_integration_test_basics
    specializations: [backend_php]
    topic: testing
    subtopic: integration
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Чем интеграционный тест отличается от юнит-теста и что проверяют им?"
    answer_short: >-
      Юнит-тест проверяет один класс с подставленными зависимостями и идёт
      миллисекунды. Интеграционный поднимает приложение и базу и проверяет
      стыки: запросы, миграции, маршруты, формат ответа.
    answer_detailed: |
      Что нельзя проверить юнит-тестом: сгенерированный ORM запрос, работу
      транзакций, миграции схемы, маршрутизацию, сериализацию ответа,
      конфигурацию. Все случаи «на моей машине работает» живут именно здесь.

      Практическое устройство: отдельная тестовая база, миграции накатываются
      перед прогоном, данные откатываются после каждого теста — обычно
      транзакцией. Тест, оставляющий за собой данные, ломает следующий, и это
      выглядит как случайное падение.

      Базу в тестах не подменяют заглушкой: слишком много логики живёт в самом
      SQL и в отображении. Подменяют то, что выходит наружу: платёжный шлюз,
      почту, чужой API.

      Пропорция: основная масса — быстрые тесты, интеграционных меньше. Набор,
      который идёт десять минут, локально запускать перестают, и обратная связь
      исчезает.
    common_mistakes:
      - Оставлять после теста данные в базе.
      - Подменять базу заглушкой вместо настоящей тестовой.
      - Проверять всё через поднятие приложения.
    follow_ups:
      - Как обеспечивают чистое состояние базы между тестами?
      - Что подменяют в интеграционном тесте, а что нет?

  - slug: php_soft_asking_for_help
    specializations: [backend_php]
    topic: soft
    subtopic: teamwork
    min_grade: intern
    peak_grade: junior
    max_grade: middle
    frequency: 4
    type: open_answer
    title: "Вы застряли на задаче. Через сколько времени и как правильно просить помощи?"
    answer_short: >-
      Обычная договорённость — от получаса до часа самостоятельных попыток,
      дальше спрашивать. Просьба содержит задачу, что уже пробовали и что
      получилось, а не «у меня не работает».
    answer_detailed: |
      ### Junior
      Молчать полдня хуже, чем спросить через час: команда теряет день, а не вы
      сохраняете лицо.

      Форма вопроса решает многое:

      > Отдаю файл на скачивание, у части пользователей он приходит битым.
      > Проверил заголовки, они верные; локально воспроизвести не удалось;
      > заметил, что ломается только на больших файлах. Вот код отдачи. Куда
      > смотреть?

      Это отвечается за минуту. «Помогите, не работает» требует пяти уточняющих
      вопросов, и каждый — отдельное переключение для того, кто помогает.

      ### Middle
      Ждут, что вы сами оцениваете цену молчания: задача на день и задача на
      спринт допускают разное время самостоятельных попыток. Полезная привычка —
      записывать, что уже проверено: половина проблем решается по дороге, пока
      формулируешь.

      ### Senior
      Ждут обратной стороны: умения принимать такие вопросы и не отбивать охоту
      их задавать. Ответ «сам разберись» экономит десять минут и стоит команде
      дня.

      Сильная версия включает системный вывод: если люди регулярно застревают в
      одном месте, дело не в людях, а в отсутствии документации или в запутанном
      коде.
    common_mistakes:
      - Молчать полдня, боясь показаться некомпетентным.
      - Спрашивать без описания того, что уже пробовали.
      - Отвечать новичкам так, что спрашивать перестают.
    follow_ups:
      - Что должно быть в хорошо сформулированном вопросе?
      - Что делать, если люди регулярно застревают на одном месте?
  # Вопросы, которые задают и джуну, и сеньору — разница в глубине ответа.

  - slug: php_rest_contract_practice
    specializations: [backend_php]
    topic: web
    subtopic: rest_design
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как вы проектируете ответ API и что считаете ломающим изменением?"
    answer_short: >-
      Ресурсы во множественном числе, действие выражено методом HTTP, коды
      состояния по смыслу, ошибки в едином формате с машиночитаемым кодом.
      Ломает всё, на что клиент мог рассчитывать: удаление поля, смена типа,
      изменение смысла кода ошибки.
    answer_detailed: |
      ### Junior
      Базовое: `GET /orders/42`, а не `GET /getOrder?id=42`. Коды ответа по
      смыслу: 200, 201 при создании, 404, 400 при неверных данных. Ошибку не
      возвращают с кодом 200.

      Формат ответа один на весь сервис — иначе каждый клиент пишет свой разбор.

      ### Middle
      Ждут разделения ожидаемых ошибок и непредвиденных. Ожидаемые — часть
      контракта: у них стабильный машиночитаемый код, по которому клиент
      принимает решение. Непредвиденные — 500 и идентификатор запроса, по
      которому в журнале находится всё остальное.

      Здесь же — понимание совместимости: добавление необязательного поля
      безопасно, удаление или переименование — нет. Мобильные клиенты
      обновляются неделями, и старый формат приходится поддерживать.

      И постраничная выдача с самого начала: список без ограничения однажды
      вернёт всю таблицу.

      ### Senior
      Ждут разговора о контракте как обязательстве: сколько живут версии, как
      объявляют устаревание, как узнают, что старой версией перестали
      пользоваться. Без измерений её не выключают никогда — просто боятся.

      Сильный ответ включает влияние кодов на автоматику: по 5xx срабатывают
      оповещения и повторные попытки, и «удобное» превращение ожидаемой ошибки
      в 500 будит дежурных на ровном месте.

      И согласованность между сервисами: если каждый отдаёт ошибки по-своему,
      общий формат приходится собирать в шлюзе, и это работает хуже, чем
      договорённость на входе.
    common_mistakes:
      - Кодировать действие словом в адресе.
      - Отдавать 200 с признаком ошибки в теле.
      - Возвращать список без постраничной выдачи.
    follow_ups:
      - Что можно менять в контракте, а что нельзя?
      - Как понять, что старую версию можно выключить?

  - slug: php_dependency_direction_practice
    specializations: [backend_php]
    topic: architecture
    subtopic: patterns
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Почему бизнес-логика не должна зависеть от фреймворка и как этого добиться?"
    answer_short: >-
      Чтобы правила можно было проверять без поднятия приложения и не
      переписывать при смене версии фреймворка. Достигается тем, что логика
      работает с собственными типами и интерфейсами, а фреймворк остаётся
      снаружи — в контроллерах и реализациях.
    answer_detailed: |
      ### Junior
      Практический признак: если в классе с бизнес-правилами есть обращение к
      объекту запроса или к активной записи, он уже привязан к фреймворку.
      Сервис должен принимать простые значения и объекты предметной области.

      ```php
      // плохо: сервис знает про HTTP
      public function handle(Request $request): void

      // лучше
      public function place(OrderDraft $draft): Order
      ```

      ### Middle
      Ждут понимания выгоды и цены. Выгода — быстрые тесты и независимость от
      версии фреймворка. Цена — дополнительный слой типов и преобразований,
      который надо поддерживать.

      Отсюда честность: для приложения, которое в основном читает и пишет
      таблицы, полная развязка часто оказывается лишней церемонией. Она
      окупается там, где правил действительно много и они живут дольше
      фреймворка.

      Здесь же — про активную запись: она удобна и намеренно смешивает данные с
      доступом к базе. Это осознанный обмен, а не ошибка, но его последствия
      надо понимать.

      ### Senior
      Ждут разговора об утечке абстракции. Репозиторий, возвращающий построитель
      запросов, не развязывает ничего: вызывающий код по-прежнему пишет запросы
      к базе, просто в другом файле. Настоящая граница возвращает готовые
      объекты.

      Сильный ответ включает выбор по контексту и умение назвать, что именно
      станет дороже при каждом варианте. Проблема начинается не тогда, когда
      выбирают простой путь, а когда его называют архитектурой, которой нет.
    common_mistakes:
      - Передавать объект запроса в сервисный слой.
      - Возвращать построитель запросов наружу и считать это развязкой.
      - Строить развязку там, где правил почти нет.
    follow_ups:
      - Почему возврат построителя запросов не развязывает слои?
      - Какой обмен предлагает активная запись?

  - slug: php_workers_and_queues_practice
    specializations: [backend_php]
    topic: system_design
    subtopic: observability
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как понять, что происходит внутри фоновых обработчиков, и что измерять?"
    answer_short: >-
      Метрики очереди — длина, возраст самого старого сообщения, доля неудач —
      и структурированный журнал с идентификатором задачи. Без этого рост
      очереди замечают по жалобам пользователей.
    answer_detailed: |
      ### Junior
      Минимум: задача пишет в журнал начало, конец и ошибку, у каждой записи
      есть идентификатор задачи. Ошибки обработчиков не должны теряться —
      неудачные задачи складывают отдельно, а не забывают.

      Что не пишут в журнал: пароли, токены, персональные данные. Журналы живут
      дольше и доступны шире, чем база.

      ### Middle
      Ждут понимания, какие показатели важны. Длина очереди сама по себе мало
      что говорит: важен возраст самого старого сообщения — он и есть задержка
      для пользователя. Плюс доля неудачных обработок и время выполнения.

      Здесь же — про повторы: неудачная задача повторяется с нарастающей
      паузой, и после нескольких попыток уходит в отдельную очередь. Без этого
      она либо крутится вечно, либо блокирует остальные.

      И про идемпотентность: повтор не должен создавать второе письмо или второе
      списание.

      ### Senior
      Ждут разговора об оповещениях по симптомам: будят на рост возраста
      сообщений и доли ошибок, а не на каждый всплеск числа задач. Оповещение,
      на которое дежурный не предпринимает действий, отключают — иначе оно
      приучает игнорировать все остальные.

      Сильный ответ включает согласованность: запись в базу и постановка задачи
      — две операции без общей транзакции. Упало между ними — данные разошлись.
      Решение — исходящий журнал, из которого задачи досылаются отдельно.

      И честное наблюдение: очередь не ускоряет работу, а переносит её во
      времени. Если обработчики стабильно медленнее, очередь просто растёт.
    common_mistakes:
      - Следить за длиной очереди вместо возраста сообщений.
      - Терять неудачные задачи вместо отдельной очереди.
      - Ставить задачу в очередь и записывать в базу без согласования.
    follow_ups:
      - Почему возраст сообщения важнее длины очереди?
      - Как согласовать запись в базу с постановкой задачи?

  - slug: php_test_strategy_practice
    specializations: [backend_php]
    topic: testing
    subtopic: unit
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как вы распределяете тесты и что делать с проектом, где их нет?"
    answer_short: >-
      Основная масса — быстрые тесты правил, поверх — интеграционные на стыки.
      В проекте без тестов не пишут их «на всё сразу»: покрывают то, что
      меняют, и то, что чаще всего ломается.
    answer_detailed: |
      ### Junior
      Практический признак: если тест поднимает приложение и базу, он уже не
      юнит. Юнит-тест проверяет один класс с подставленными зависимостями и
      идёт миллисекунды.

      Первое, что стоит покрыть в незнакомом коде, — то, что вы собираетесь
      менять. Тест здесь не про качество, а про страховку: он фиксирует текущее
      поведение до правки.

      ### Middle
      Ждут понимания, что в унаследованном коде тест часто невозможно написать
      без изменения кода — потому что зависимости создаются внутри. Отсюда
      обычный порядок: сначала вынести зависимости в конструктор, потом писать
      тест.

      Здесь же — характеристический тест: фиксируем то, что система делает
      сейчас, даже если это неправильно. Он ловит непреднамеренные изменения
      при переработке.

      И приоритет: покрывают то, что ломается чаще всего и дороже всего —
      деньги, права доступа, интеграции.

      ### Senior
      Ждут разговора о доверии к набору. Тест, падающий через раз, хуже
      отсутствующего: на него перестают смотреть, а вместе с ним перестают
      замечать настоящие падения.

      Сильный ответ включает связь с архитектурой: если правила перемешаны с
      обращениями к базе и к фреймворку, юнит-тестировать нечего, и команда
      обречена на медленный набор. Улучшение тестируемости и есть улучшение
      структуры.

      И про конвейер: быстрые тесты на каждый коммит, медленные — на слияние,
      чтобы обратная связь приходила за минуты, а не за полчаса.
    common_mistakes:
      - Начинать с попытки покрыть весь унаследованный код сразу.
      - Терпеть нестабильные тесты.
      - Писать только интеграционные тесты и получать набор на десять минут.
    follow_ups:
      - Что такое характеристический тест и зачем он нужен?
      - Почему код без тестов часто невозможно протестировать без правки?

  - slug: php_static_analysis_practice
    specializations: [backend_php]
    topic: testing
    subtopic: static_analysis
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что даёт статический анализ в PHP и как его внедряют в существующий проект?"
    answer_short: >-
      Он находит ошибки, которые в динамическом языке иначе видны только в бою:
      обращение к несуществующему методу, неверные типы, недостижимый код.
      Внедряют по уровням, зафиксировав текущие ошибки, а не требуя починить всё
      сразу.
    answer_detailed: |
      ### Junior
      Базовое: анализатор читает код, не выполняя его, и сверяет типы по
      объявлениям и подсказкам. Чем больше объявленных типов, тем больше он
      находит.

      Вместе с ним обычно идёт единый стиль кода, проверяемый автоматически:
      споры о форматировании в ревью — потерянное время команды.

      ### Middle
      Ждут понимания, как внедрять. В проекте на сто тысяч строк анализатор при
      первом запуске выдаёт тысячи замечаний, и требование «починить всё» ведёт
      к тому, что его отключают.

      Работающий порядок: включить на низком уровне строгости, зафиксировать
      текущие замечания в файле исключений, запретить появление новых. Дальше
      уровень повышают постепенно, а список исключений сокращают.

      Здесь же — место в конвейере: проверка на каждое изменение, а не раз в
      месяц вручную.

      ### Senior
      Ждут понимания границ. Анализатор не заменяет тесты: он проверяет
      согласованность типов и вызовов, а не правильность бизнес-правил. И не
      заменяет ревью: он не скажет, что решение усложняет систему.

      Сильный ответ включает влияние на код: чтобы анализатор был полезен, код
      должен быть типизирован, а массивы с произвольной структурой — заменены
      объектами. Это и есть основная польза — не сами замечания, а изменения,
      к которым они подталкивают.

      И честность: строгий уровень в проекте, где половина кода унаследована,
      может стоить дороже, чем даёт.
    common_mistakes:
      - Включать максимальный уровень сразу и получать тысячи замечаний.
      - Считать, что анализатор заменяет тесты.
      - Запускать анализ вручную вместо проверки на каждое изменение.
    follow_ups:
      - Как внедрить анализатор в проект с большой историей?
      - Чего статический анализ принципиально не увидит?

  - slug: php_soft_review_disagreement
    specializations: [backend_php]
    topic: soft
    subtopic: conflict
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "На ревью коллега настаивает на решении, которое вы считаете неверным. Ваши действия?"
    answer_short: >-
      Разделить факты и предпочтения. Вкусовое — уступить и не тратить время
      команды. Существенное — привести измеримое последствие и предложить
      проверку. Не сходится — быстро привлечь третьего, а не спорить кругами.
    answer_detailed: |
      ### Junior
      Главное — обсуждать код, а не человека. Вопрос «почему здесь так?»
      работает лучше утверждения «так неправильно»: половина споров кончается на
      объяснении контекста, которого вы не знали.

      О своём варианте полезно уметь сказать в величинах: числом запросов,
      временем ответа, простотой изменения.

      ### Middle
      Ждут умения отделять существенное от вкусового. Форматирование и имена —
      не повод для спора, для этого есть анализатор и общий стиль. Существенно
      то, что дорого менять потом: контракт API, схема данных, границы модулей.

      Полезный приём — выписать оба варианта с последствиями и позвать
      третьего. Спор о вкусах при этом обычно исчезает сам.

      ### Senior
      Ждут ответственности за исход, а не за свою правоту. Иногда верное решение
      — принять худший вариант, потому что цена спора выше разницы между
      вариантами.

      Сильный ответ включает системный взгляд: повторяющиеся споры об одном и
      том же означают отсутствие договорённости. Её и стоит зафиксировать —
      коротким соглашением команды, а не обсуждением в каждом ревью.

      И про тон: от него зависит, будут ли присылать изменения маленькими
      кусками или копить до огромных, которые никто толком не прочитает.
    common_mistakes:
      - Спорить о форматировании вместо настройки анализатора.
      - Переходить с обсуждения кода на обсуждение автора.
      - Тянуть спор кругами вместо привлечения третьего.
    follow_ups:
      - Что стоит зафиксировать соглашением команды?
      - Как тон замечаний влияет на размер присылаемых изменений?

  - slug: php_soft_production_mistake
    specializations: [backend_php]
    topic: soft
    subtopic: failure_story
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Расскажите про случай, когда вы сломали что-то в бою."
    answer_short: >-
      Ждут разбора, а не покаяния: что произошло, как заметили, как
      восстановили, что изменили, чтобы это не повторилось. Ответ «я ничего не
      ломал» слышится как отсутствие опыта или отсутствие ответственности.
    answer_detailed: |
      ### Junior
      Достаточно честной истории с выводом. Типичные случаи: миграция без
      проверки на объёме, забытый отладочный вывод, выкладка в пятницу вечером,
      правка прямо на боевом сервере.

      Важнее самой ошибки — как быстро вы о ней сказали. Молчание в надежде, что
      не заметят, обходится дороже любой поломки.

      ### Middle
      Ждут порядка действий: сначала восстановить работу, потом искать причину.
      Откат последней выкладки, отключение функции, возврат трафика — всё это
      делают до расследования, потому что пока сервис лежит, каждая минута
      стоит денег.

      Здесь же — про предотвращение: почему поломка вообще доехала до боя. Не
      было тестов на этот случай, не было проверки на объёме, не было
      возможности откатиться.

      ### Senior
      Ждут разговора о системе, а не о себе. Один и тот же тип ошибки,
      случившийся дважды, — это признак, что первый разбор закончился словами.

      Сильный ответ включает разбор без поиска виноватого: у человека, нажавшего
      кнопку, была та информация, которую дала ему система. Меняют систему —
      проверки, предупреждения, возможность отката. Разбор с наказанием даёт
      один результат: про инциденты перестают сообщать.

      И готовность заранее: откат одной командой, переключатели функций,
      миграции, применимые без простоя, — это делают до инцидента.
    common_mistakes:
      - Утверждать, что никогда ничего не ломали.
      - Молчать о поломке в надежде, что не заметят.
      - Заканчивать разбор словами без изменений в системе.
    follow_ups:
      - "Что делают в первую очередь: ищут причину или восстанавливают работу?"
      - Почему разбор ведут без поиска виноватого?
  # Уровень senior и выше: решения, за которые отвечают перед командой и
  # бизнесом, а не только перед интерпретатором.

  - slug: php_lead_legacy_strategy
    specializations: [backend_php]
    topic: architecture
    subtopic: patterns
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Вам достался большой проект без тестов и структуры. С чего начнёте?"
    answer_short: >-
      Не с переписывания. Сначала — возможность безопасно менять: система
      сборки и выкладки, откат, журналы, характеристические тесты вокруг того,
      что предстоит трогать. Улучшения идут вместе с продуктовыми задачами.
    answer_detailed: |
      ### Senior
      Порядок, который работает:

      1. **Понять, что происходит.** Журналы, ошибки, самые медленные страницы,
         самые частые обращения в поддержку. Без данных улучшения делаются по
         ощущениям и попадают не туда.
      2. **Обеспечить откат.** Пока выкладка необратима, менять страшно, и
         поэтому не меняют ничего.
      3. **Обложить тестами то, что трогаете.** Не весь код — только границу
         предстоящей правки.
      4. **Улучшать по ходу задач.** Меняете модуль по продуктовой задаче —
         заодно приводите его в порядок.

      Переписывание с нуля почти всегда заканчивается плохо: старая система
      продолжает развиваться, новая догоняет вечно, а знания, зашитые в
      «уродливых» условиях, теряются — там обычно годы исправлений.

      ### Lead
      Ждут разговора о договорённостях, а не о коде. Улучшения нужно защитить в
      плане: согласованная доля мощности команды, иначе первая же срочная задача
      их вытеснит.

      Сюда же — порядок приоритетов: сначала то, что чаще всего ломается и
      дороже всего стоит при поломке, а не то, что раздражает разработчиков.

      Сильный ответ включает измеримость: доля выкладок с откатом, время
      выкладки, число инцидентов, время правки типовой задачи. Без цифр разговор
      об улучшении превращается в разговор о вкусах.

      И честное признание: часть кода трогать не нужно вовсе. Модуль, который
      работает и не меняется, не требует ни рефакторинга, ни тестов.
    common_mistakes:
      - Начинать с переписывания с нуля.
      - Улучшать то, что раздражает, а не то, что ломается.
      - Вести улучшения без согласованной доли времени команды.
    follow_ups:
      - Почему переписывание с нуля обычно проваливается?
      - Какие показатели покажут, что улучшения работают?

  - slug: php_lead_version_upgrade
    specializations: [backend_php]
    topic: runtime
    subtopic: long_running
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как вы обновляете версию PHP и фреймворка в живом проекте?"
    answer_short: >-
      Небольшими шагами с работающей системой на каждом. Сначала совместимость
      со следующей версией без изменения поведения, затем прогон тестов и
      анализатора, затем выкладка на часть трафика, и только потом снятие
      старой версии.
    answer_detailed: |
      ### Senior
      Что делает обновление предсказуемым:

      - **анализатор с правилами совместимости** — он покажет места, ломающиеся
        на новой версии, до запуска;
      - **тесты** — прежде всего вокруг того, что зависит от поведения языка:
        сравнения, работа со строками и датами, обработка ошибок;
      - **параллельная проверка** — прогнать набор тестов на обеих версиях в
        конвейере, прежде чем менять боевую;
      - **выкладка на часть трафика** и сравнение доли ошибок.

      Чего не делать: совмещать обновление версии с изменением поведения. При
      поломке невозможно понять, что именно её вызвало.

      ### Lead
      Ждут разговора о регулярности. Проект, который обновляют раз в пять лет,
      обновить почти невозможно: между версиями накопилось слишком много
      изменений, и часть зависимостей уже заброшена.

      Аргумент для бизнеса — срок поддержки: версия вне поддержки не получает
      исправлений безопасности. Это разговор о риске в терминах вероятности и
      последствий, а не о желании работать на свежем.

      Сильный ответ включает заброшенные зависимости: их надо замечать до того,
      как они заблокируют обновление, и планировать замену заранее.

      И организационную часть: у обновления должен быть владелец и срок, иначе
      оно живёт в вечно отстающей ветке и не доезжает.
    common_mistakes:
      - Совмещать обновление версии с изменением поведения.
      - Копить обновления до состояния, когда обновиться невозможно.
      - Не замечать заброшенные зависимости заранее.
    follow_ups:
      - Как объяснить бизнесу необходимость обновления версии?
      - Почему обновление ведут не в долгоживущей ветке?

  - slug: php_lead_module_boundaries
    specializations: [backend_php]
    topic: architecture
    subtopic: layered_architecture
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как вы проводите границы между модулями и когда стоит выделять отдельный сервис?"
    answer_short: >-
      По областям ответственности бизнеса, а не по техническим слоям. Отдельный
      сервис оправдан, когда части требуют разной скорости выпуска, разного
      масштабирования или разных владельцев, — и только после того, как граница
      проверена внутри кода.
    answer_detailed: |
      ### Senior
      Признак верной границы: изменение внутри модуля не задевает остальные, а
      обращения между модулями идут через явный контракт, а не через общую базу.

      Признак неверной: чтобы добавить поле, нужно тронуть четыре модуля.

      Границы проводят по области — «оплата», «каталог», «доставка», — а не по
      слоям «контроллеры», «модели», «сервисы». Второй вариант выглядит
      аккуратно и не даёт ничего: любое изменение всё равно проходит через все
      слои.

      Общая база — самая частая скрытая связь. Пока два модуля пишут в одни
      таблицы, они остаются одним модулем, как бы ни выглядели каталоги.

      ### Lead
      Ждут разговора о людях и владении. Границы, которые держатся, обычно
      совпадают с границами команд. Модуль без явного владельца становится
      ничьим, и правила в нём быстро размываются.

      Сюда же — цена выделения сервиса: сетевые отказы, отсутствие общей
      транзакции, распределённая отладка, нужда в развитой эксплуатации.
      Команда без наблюдаемости и автоматической выкладки получит только цену.

      Сильный ответ включает промежуточный вариант — модульный монолит:
      границы соблюдаются, выкладка одна, распределённые отказы не появляются.
      И обратный ход: два сервиса, которые всегда выкладываются вместе и всегда
      вместе ломаются, — это один сервис с сетью посередине.
    common_mistakes:
      - Проводить границы по слоям вместо областей ответственности.
      - Оставлять общую базу и считать модули разделёнными.
      - Выделять сервис до проверки границы внутри кода.
    follow_ups:
      - Почему общая база сводит на нет разделение модулей?
      - Чем модульный монолит отличается от набора сервисов?

  - slug: php_lead_security_process
    specializations: [backend_php]
    topic: security
    subtopic: injection
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как вы выстраиваете безопасность в команде, а не в отдельном участке кода?"
    answer_short: >-
      Так, чтобы безопасный способ был способом по умолчанию: подготовленные
      запросы и экранирование встроены в инструменты, проверки идут в конвейере
      автоматически, обновления зависимостей приходят регулярно, а не после
      инцидента.
    answer_detailed: |
      ### Senior
      Что реально снижает число уязвимостей:

      - **умолчания.** Шаблонизатор экранирует сам, слой доступа к базе не
        принимает склеенные строки, каркас проекта уже настроен правильно.
        Полагаться на внимательность каждого разработчика бессмысленно;
      - **автоматические проверки в конвейере**: анализатор, поиск известных
        уязвимостей в зависимостях, проверка секретов в коммитах;
      - **обновления зависимостей потоком**, а не раз в год. Большинство
        реальных проникновений идёт через известную уязвимость в старой версии
        библиотеки;
      - **разграничение доступа**: у приложения нет прав администратора базы, у
        разработчика нет постоянного доступа к боевым данным.

      ### Lead
      Ждут разговора о процессе. Обзор изменений на предмет безопасности — часть
      обычного ревью, а не отдельный ритуал. Опасные места помечены в коде и в
      документации.

      Сюда же — обращение с персональными данными: что собираем, зачем, сколько
      храним, кто имеет доступ. Часть требований приходит извне, и незнание их
      — риск не технический, а юридический.

      Сильный ответ включает подготовку к худшему: что делаем при утечке —
      как отзываем сессии и ключи, как уведомляем, как понимаем масштаб. Это
      продумывают заранее, а не в ночь инцидента.

      И честную оценку: полностью безопасной системы не бывает, вопрос в
      стоимости атаки и в скорости обнаружения.
    common_mistakes:
      - Полагаться на внимательность разработчиков вместо безопасных умолчаний.
      - Обновлять зависимости только после инцидента.
      - Давать приложению права администратора базы.
    follow_ups:
      - Через что чаще всего происходят реальные проникновения?
      - Что должно быть продумано до утечки, а не после?

  - slug: php_lead_incident_handling
    specializations: [backend_php]
    topic: system_design
    subtopic: observability
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Сайт лежит. Опишите ваши действия по шагам."
    answer_short: >-
      Сначала восстановить работу, потом искать причину: откат последней
      выкладки, отключение тяжёлой функции, увеличение числа обработчиков.
      Параллельно — короткое сообщение заинтересованным и фиксация времени и
      действий.
    answer_detailed: |
      ### Senior
      Порядок:

      1. **Оценить масштаб.** Что сломано, для скольких пользователей, есть ли
         обход.
      2. **Восстановить.** Откат, отключение функции переключателем, перевод
         трафика. Расследование — потом.
      3. **Сообщить.** Что сломано, что делаем, когда следующее обновление.
         Молчание порождает десяток людей, отвлекающих вас вопросами.
      4. **Зафиксировать.** Время, действия, гипотезы: через два часа порядок
         событий никто не вспомнит, а он нужен для разбора.

      Типичные для PHP причины, которые проверяют первыми: исчерпание рабочих
      процессов из-за медленного внешнего вызова, тяжёлый запрос без индекса
      после роста таблицы, сброшенный кеш, кончившееся место на диске.

      Что не делать: править прямо на боевом сервере вслепую и менять несколько
      вещей одновременно.

      ### Lead
      Ждут разговора о ролях: в затяжном инциденте нужен координатор отдельно от
      того, кто копается в системе. Совмещать невозможно.

      Сюда же — разбор без поиска виноватого. У человека, нажавшего кнопку, была
      та информация, которую дала ему система. Меняют систему: проверки,
      предупреждения, возможность отката.

      Сильный ответ включает работу с повторяемостью: та же причина второй раз
      означает, что первый разбор закончился словами. Поэтому у каждого пункта
      есть исполнитель и срок.

      И подготовку: откат одной командой, переключатели функций, отрепетированные
      действия — это делают до инцидента.
    common_mistakes:
      - Искать причину, пока сайт лежит, вместо восстановления.
      - Править на боевом сервере вслепую.
      - Заканчивать разбор словами без исполнителей и сроков.
    follow_ups:
      - Какие причины проверяют первыми в PHP-приложении?
      - Почему координатора отделяют от того, кто чинит?

  - slug: php_lead_load_growth
    specializations: [backend_php]
    topic: system_design
    subtopic: scaling
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Ожидается рост нагрузки в десять раз. Как вы к нему готовитесь?"
    answer_short: >-
      Измерением, а не догадками: где сейчас узкое место, как система ведёт
      себя под нагрузочным тестом, что откажет первым. Затем устраняют первое
      ограничение и повторяют — второе заранее не угадать.
    answer_detailed: |
      ### Senior
      Порядок работы:

      1. **Измерить.** Время ответа по процентилям, самые тяжёлые запросы,
         использование рабочих процессов и соединений с базой.
      2. **Найти первое ограничение.** В PHP-приложениях это почти всегда либо
         база, либо число рабочих процессов, занятых ожиданием внешних вызовов.
      3. **Проверить нагрузочным тестом** на среде, похожей на боевую.
      4. **Устранить и повторить.**

      Что даёт результат чаще всего: индексы и переписанные запросы, кеш на
      горячие чтения, вынос тяжёлой работы в очередь, OPcache и предзагрузка,
      отдача статики без участия PHP.

      ### Lead
      Ждут разговора о деградации вместо отказа. При всплеске система должна
      ухудшаться постепенно: ограничение частоты обращений, очередь, отключение
      необязательных функций. Полный отказ хуже медленной работы части.

      Сюда же — стоимость. Десятикратный рост инфраструктуры может оказаться
      дороже переработки одного запроса, и это решение принимают с цифрами.

      Сильный ответ включает организационную часть: кто дежурит, какие пороги
      оповещений, где предел автоматического масштабирования и что происходит
      при его достижении.

      И честное «мы не знаем»: без нагрузочного теста обещания о десятикратном
      росте — предположения.
    common_mistakes:
      - Добавлять серверы, не найдя узкое место.
      - Проверять нагрузку на среде, не похожей на боевую.
      - Проектировать на отказ вместо постепенной деградации.
    follow_ups:
      - Что чаще всего оказывается узким местом в PHP-приложении?
      - Как система должна вести себя при превышении расчётной нагрузки?

  - slug: php_lead_tech_debt_conversation
    specializations: [backend_php]
    topic: architecture
    subtopic: solid
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как вы объясняете бизнесу необходимость технической работы без видимого результата?"
    answer_short: >-
      Переводом в величины, которые бизнес считает и так: время выпуска
      изменений, доля инцидентов, стоимость поддержки, риск простоя. Разговор о
      «плохом коде» не работает — работает разговор о скорости и рисках.
    answer_detailed: |
      ### Senior
      Что звучит убедительно: «на этот модуль приходится половина инцидентов
      квартала», «правка здесь занимает три дня вместо одного», «версия вне
      поддержки, уязвимости не закрываются».

      Что не звучит: «код плохой», «хочется переписать», «так не делают».

      Полезно приносить варианты с разной ценой, а не ультиматум: минимальное
      вмешательство сейчас, полноценное — в следующем квартале, и что будет,
      если не делать ничего.

      ### Lead
      Ждут постоянного механизма вместо разовых переговоров: согласованная доля
      мощности команды на техническую работу. Тогда её не нужно каждый раз
      выторговывать, и она не копится до состояния, когда требуется остановка
      разработки.

      Сюда же — честность в обе стороны. Иногда правильный ответ «не чиним»:
      модуль будет заменён через полгода, вкладываться в него бессмысленно.
      Инженер, который это признаёт, вызывает больше доверия, чем требующий
      исправить всё.

      Сильный ответ включает измеримость: работа, которую нельзя связать ни с
      одним наблюдаемым показателем, скорее всего, действительно слабо
      обоснована.

      И язык разговора: риск описывают вероятностью и последствиями, а не
      словами «может рвануть».
    common_mistakes:
      - Обосновывать переработку качеством кода, а не издержками.
      - Приходить с одним вариантом вместо нескольких.
      - Копить техническую работу до требования остановить разработку.
    follow_ups:
      - Какую долю мощности команды вы бы отвели на техническую работу?
      - Когда правильный ответ — не чинить вовсе?

  - slug: php_lead_release_process
    specializations: [backend_php]
    topic: frameworks
    subtopic: config
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как устроена выкладка, чтобы её не боялись делать в середине дня?"
    answer_short: >-
      Автоматически, небольшими порциями, с откатом и без простоя. Схема базы
      меняется совместимыми шагами, новая функциональность закрыта
      переключателем, а решение о раскатке принимается по показателям.
    answer_detailed: |
      Что должно прозвучать.

      **Автоматизация.** Выкладка одной командой или по слиянию. Ручная
      последовательность из десяти шагов рано или поздно выполняется с ошибкой,
      причём в самый неподходящий момент.

      **Без простоя.** Новая версия поднимается рядом, трафик переключается,
      старая гасится после завершения текущих запросов. Для PHP это ещё и сброс
      OPcache в правильный момент — иначе часть процессов работает на старом
      коде.

      **Миграции совместимыми шагами.** Колонку сначала добавляют, потом
      начинают писать, потом переносят данные, потом переключают чтение и только
      потом удаляют старую. Каждый шаг работает и со старым, и с новым кодом —
      иначе откат невозможен.

      **Переключатели функций.** Они отделяют выкладку кода от включения
      возможности: код едет в бой выключенным, включается отдельно и отключается
      мгновенно при проблеме.

      **Показатели после выкладки.** Доля ошибок и время ответа — если они
      ухудшились, откат, а не расследование.

      **Небольшие порции.** Изменение на двадцать файлов откатывается легко.
      Накопленный за месяц выпуск не откатывается вовсе — придётся чинить на
      месте.

      И культурная часть: если выкладку делают ночью в пятницу, дело не в
      расписании, а в отсутствии доверия к процессу. Это чинят процессом, а не
      расписанием.
    common_mistakes:
      - Выкладывать вручную по списку шагов.
      - Удалять колонку в той же миграции, где перестали её писать.
      - Копить изменения до крупного выпуска.
    follow_ups:
      - Почему удаление колонки разносят на отдельный шаг?
      - Что означает привычка выкладывать ночью?

  - slug: php_lead_team_standards
    specializations: [backend_php]
    topic: soft
    subtopic: teamwork
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как вы вводите общие правила в команде, где каждый пишет по-своему?"
    answer_short: >-
      Автоматизацией вместо уговоров: стиль проверяет форматтер, типы —
      анализатор, остальное фиксируется коротким соглашением, принятым
      командой, а не спущенным сверху.
    answer_detailed: |
      Что работает.

      **Автоматика вместо ревью.** Всё, что можно проверить машиной, машина и
      проверяет. Замечания о пробелах и порядке импортов в ревью — потерянное
      время и источник раздражения.

      **Соглашение принимают вместе.** Правило, объявленное сверху, соблюдают,
      пока смотрят. Правило, о котором договорились, поддерживают сами — и
      объясняют новичкам.

      **Правил мало, и у каждого есть причина.** Список на сорок пунктов не
      читает никто. Пять правил с объяснением «почему» работают лучше.

      **Внедрение постепенное.** В существующем коде фиксируют текущее
      состояние и запрещают ухудшение, а не требуют переписать всё за спринт.

      **Пример важнее документа.** Если правило нарушает тот, кто его ввёл, оно
      мертво.

      Отдельно — про что договариваться в первую очередь: не про стиль
      (его закрывает форматтер), а про то, что дорого менять потом. Где живут
      бизнес-правила, как обрабатываются ошибки, что попадает в журнал, как
      именуются маршруты и события.

      И про исключения: правило без описанного способа его нарушить порождает
      либо саботаж, либо плохие решения ради формального соответствия.
    common_mistakes:
      - Обсуждать стиль в ревью вместо настройки инструментов.
      - Спускать правила сверху без обсуждения.
      - Требовать привести весь существующий код к новым правилам сразу.
    follow_ups:
      - О чём стоит договориться в первую очередь?
      - Что делать с правилом, которое иногда нужно нарушить?

  - slug: php_lead_wrong_decision
    specializations: [backend_php]
    topic: soft
    subtopic: motivation
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Расскажите про техническое решение, которое вы приняли и которое оказалось неверным."
    answer_short: >-
      Ждут не покаяния, а механизма: как решение принималось, какой сигнал вы
      пропустили, когда признали ошибку и как её отменяли. Умение отменить своё
      решение ценится выше умения его защищать.
    answer_detailed: |
      Что должно прозвучать в сильном ответе.

      **Как решение принималось.** Какие варианты рассматривались, по каким
      критериям выбирали, что было известно тогда. Решение, разумное при
      имеющейся информации и оказавшееся неверным, — нормальная ситуация.
      Решение по привычке — другой разговор.

      **Какой сигнал пропустили.** Обычно он был: возражение коллеги, которое
      отмели; неудобство, списанное на привыкание; растущее время выкладки.

      **Когда признали.** Здесь и проверяется зрелость: чем дольше решение
      защищают, тем дороже отмена и тем сильнее оно обрастает кодом.

      **Как отменяли.** Резкий откат редко возможен. Обычно это сосуществование
      старого и нового, перевод по частям, измеримый прогресс.

      **Что изменили в способе принимать решения.** Например, фиксировать
      контекст письменно: через год никто не помнит, почему выбрали так, и
      обсуждение начинается заново. Или назначать срок пересмотра — «вернуться
      через квартал с данными».

      Слабый ответ — история, где виноваты обстоятельства, или «неверных решений
      не было». Второе означает либо отсутствие решений, либо отсутствие
      обратной связи о результате.
    common_mistakes:
      - Рассказывать историю, где виноваты обстоятельства.
      - Утверждать, что неверных решений не принимали.
      - Защищать решение до момента, когда отмена становится непосильной.
    follow_ups:
      - Как вы фиксируете контекст принятого решения?
      - Что заставило вас признать решение неверным?
