  - slug: ng_typescript_basics
    specializations: [frontend_angular]
    topic: typescript
    subtopic: types_generics
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Что даёт TypeScript в Angular-проекте и во что он не превращается?"
    answer_short: >-
      Он проверяет типы до запуска: входные параметры компонента, форму данных
      с сервера, сигнатуры сервисов. В рантайме его нет — скомпилированный код
      ничего не проверяет, поэтому ответы сервера всё равно валидируют.
    answer_detailed: |
      ```ts
      export interface Order {
        id: string;
        total: number;
        status: 'new' | 'paid' | 'cancelled';
      }
      ```

      Объединение строковых литералов в поле `status` — самый частый способ
      сузить тип в Angular-коде: компилятор не даст присвоить произвольную
      строку и подскажет варианты в редакторе.

      Что это даёт: переименовали поле — компилятор показал все места; забыли
      обязательный параметр — ошибка до запуска.

      Чего это не даёт: гарантий на данные извне. Ответ типизируют как `Order`,
      но если сервер прислал другое, приложение упадёт в рантайме. Типы
      описывают ожидание, а не проверяют факт.

      Про `any`: он выключает проверку и заражает всё, к чему прикасается. Когда
      тип неизвестен, берут `unknown` — компилятор потребует проверку перед
      использованием. В Angular-проектах строгий режим включён по умолчанию, и
      отключать его ради скорости — решение, о котором жалеют через полгода.
    common_mistakes:
      - Считать, что типы проверяют ответ сервера.
      - Затыкать ошибки через any.
      - Отключать строгий режим ради скорости на старте.
    follow_ups:
      - Чем unknown лучше any?
      - Что проверяет данные из сети, если не типы?

  - slug: ng_decorators_basics
    specializations: [frontend_angular]
    topic: typescript
    subtopic: decorators
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое декораторы и зачем они в Angular?"
    answer_short: >-
      Декоратор — функция, которая помечает класс или поле метаданными.
      Angular по этим меткам понимает, что класс — компонент, сервис или модуль,
      и как его собирать: какой шаблон, какие зависимости, куда внедрять.
    answer_detailed: |
      ```ts
      @Component({
        selector: 'app-order-card',
        templateUrl: './order-card.html',
      })
      export class OrderCardComponent {}

      @Injectable({ providedIn: 'root' })
      export class OrderService {}
      ```

      Без метки `@Component` это обычный класс: Angular не узнает про шаблон и
      не создаст компонент. Без `@Injectable` фреймворк не сможет разобрать, что
      внедрять в конструктор.

      Полезно понимать, что декоратор — не магия, а вызов функции, которая
      сохраняет метаданные рядом с классом. Компилятор Angular потом читает их и
      генерирует код.

      Практическое следствие: селектор компонента — это часть публичного
      контракта. Переименование ломает все шаблоны, где он использован, и
      компилятор шаблонов об этом скажет — но только если строгая проверка
      шаблонов включена.

      `providedIn: 'root'` означает единственный экземпляр сервиса на
      приложение — самый частый случай.
    common_mistakes:
      - Забывать @Injectable у сервиса с зависимостями.
      - Считать декоратор особым синтаксисом фреймворка, а не функцией.
      - Менять селектор компонента, не проверив шаблоны.
    follow_ups:
      - Что означает providedIn root?
      - Откуда Angular знает, что внедрять в конструктор?

  - slug: ng_component_basics
    specializations: [frontend_angular]
    topic: components
    subtopic: standalone
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Из чего состоит компонент и что такое standalone-компонент?"
    answer_short: >-
      Из класса с логикой, шаблона и стилей. Standalone-компонент объявляет свои
      зависимости сам, через `imports`, и не требует модуля — это текущий способ
      по умолчанию.
    answer_detailed: |
      ```ts
      @Component({
        selector: 'app-order-list',
        imports: [OrderCardComponent, DatePipe],
        template: `
          @for (order of orders; track order.id) {
            <app-order-card [order]="order" />
          }
        `,
      })
      export class OrderListComponent {
        orders: Order[] = [];
      }
      ```

      Раньше каждый компонент нужно было объявить в модуле, а модуль — собрать
      из других модулей. Это давало много файлов и ошибок вида «компонент не
      найден в шаблоне». Standalone убирает этот слой: компонент перечисляет
      зависимости прямо у себя.

      Что важно на старте: то, что используется в шаблоне, должно быть в
      `imports`. Забыли — компилятор шаблонов скажет об этом при сборке.

      Стили компонента по умолчанию изолированы: они не протекают наружу и не
      ломают соседей. Это удобно, но означает, что стилизовать чужой компонент
      снаружи просто так нельзя — для этого есть отдельные механизмы.
    common_mistakes:
      - Забывать добавить компонент или пайп в imports.
      - Ожидать, что стили компонента подействуют на дочерние.
      - Создавать модуль там, где хватает standalone-компонента.
    follow_ups:
      - Что произойдёт, если не добавить пайп в imports?
      - Почему стили не протекают наружу?

  - slug: ng_inputs_outputs_basics
    specializations: [frontend_angular]
    topic: components
    subtopic: inputs_outputs
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Как компоненты обмениваются данными: input и output?"
    answer_short: >-
      Данные идут вниз через входные параметры, события наверх — через выходные.
      Дочерний компонент не меняет то, что ему передали: он сообщает о
      намерении, а родитель меняет свои данные.
    answer_detailed: |
      ```ts
      export class OrderCardComponent {
        order = input.required<Order>();
        remove = output<string>();

        onRemove() {
          this.remove.emit(this.order().id);
        }
      }
      ```

      ```html
      <app-order-card [order]="order" (remove)="onRemove($event)" />
      ```

      Квадратные скобки — передача данных вниз, круглые — подписка на событие.
      Это стоит запомнить сразу: половина ошибок новичка в шаблоне — перепутанные
      скобки.

      Почему дочерний не меняет входные данные: у данных должен быть один
      владелец. Иначе непонятно, кто последний записал значение, и изменения
      теряются непредсказуемо.

      Про `input.required`: он делает параметр обязательным, и компилятор
      скажет, если его забыли передать. Раньше это ловилось только в рантайме и
      обычно уже в бою.
    common_mistakes:
      - Путать квадратные и круглые скобки в шаблоне.
      - Менять объект, пришедший через input, внутри компонента.
      - Передавать данные наверх через общий сервис вместо события.
    follow_ups:
      - Что означают квадратные и круглые скобки в шаблоне?
      - Зачем помечать input обязательным?

  - slug: ng_lifecycle_basics
    specializations: [frontend_angular]
    topic: components
    subtopic: lifecycle
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Какие есть хуки жизненного цикла и где загружать данные?"
    answer_short: >-
      Основные — `ngOnInit` после создания и установки входных параметров,
      `ngOnDestroy` перед удалением, `ngOnChanges` при изменении входных данных.
      Загружают данные в `ngOnInit`, а в `ngOnDestroy` отписываются.
    answer_detailed: |
      ```ts
      export class OrderListComponent implements OnInit, OnDestroy {
        ngOnInit() {
          this.subscription = this.service.load().subscribe(...);
        }

        ngOnDestroy() {
          this.subscription.unsubscribe();
        }
      }
      ```

      Почему не в конструкторе: на момент его вызова входные параметры ещё не
      установлены, и работать с ними нельзя. Конструктор оставляют для
      получения зависимостей.

      Отписка обязательна. Подписка на поток, который не завершается сам,
      переживает компонент: обработчик продолжает работать, обращается к
      уничтоженному состоянию и удерживает его в памяти. На экране, который
      открывают сотни раз за сессию, это заметная утечка.

      Отписываться руками нужно не всегда: `async` в шаблоне делает это сам,
      как и специальная функция, привязывающая подписку к времени жизни
      компонента. Это и есть предпочтительный путь — руками отписываются там,
      где иначе никак.
    common_mistakes:
      - Работать с входными параметрами в конструкторе.
      - Не отписываться от бесконечных потоков.
      - Подписываться вручную там, где хватило бы async в шаблоне.
    follow_ups:
      - Почему нельзя читать input в конструкторе?
      - Как не отписываться руками?

  - slug: ng_signals_intro
    specializations: [frontend_angular]
    topic: signals
    subtopic: basics
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что такое сигналы и чем они отличаются от обычного поля класса?"
    answer_short: >-
      Сигнал — значение, которое знает, кто его прочитал. При изменении он сам
      оповещает зависимых, и Angular обновляет только то, что действительно
      зависит от значения, а не проверяет всё дерево.
    answer_detailed: |
      ```ts
      count = signal(0);
      double = computed(() => this.count() * 2);

      increment() {
        this.count.update((value) => value + 1);
      }
      ```

      Читают сигнал вызовом — со скобками, и в шаблоне тоже: `{{ count() }}`.
      Это самая частая ошибка на старте: без скобок в шаблон попадает сам
      объект сигнала, а не значение.

      Меняют через `set` для нового значения и `update` — когда новое зависит от
      старого.

      `computed` — производное значение: оно кешируется и пересчитывается,
      только когда изменились сигналы, которые оно читает. Хранить производное в
      отдельном поле и обновлять руками не нужно — это две правды, которые
      разойдутся.

      Зачем всё это: раньше Angular при любом событии проверял дерево
      компонентов целиком. Сигналы позволяют обновлять точечно — это заметно на
      больших экранах.
    common_mistakes:
      - Забывать скобки при чтении сигнала в шаблоне.
      - Хранить производное значение отдельным полем вместо computed.
      - Менять сигнал напрямую вместо set и update.
    follow_ups:
      - Чем set отличается от update?
      - Почему computed лучше отдельного поля?

  - slug: ng_signal_inputs_basics
    specializations: [frontend_angular]
    topic: signals
    subtopic: signal_inputs
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Чем сигнальные входные параметры лучше прежних и как на них реагировать?"
    answer_short: >-
      Они читаются как сигнал, поэтому от них можно строить `computed` и
      `effect` без отдельного хука изменений. Обязательность проверяется
      компилятором, а не в рантайме.
    answer_detailed: |
      ```ts
      order = input.required<Order>();
      isPaid = computed(() => this.order().status === 'paid');
      ```

      Раньше, чтобы среагировать на изменение входного параметра, писали
      `ngOnChanges` и разбирали объект изменений по строковым ключам — легко
      ошибиться, и типизации там почти нет.

      С сигнальными параметрами производное значение объявляется один раз, и
      оно само пересчитается при новом значении.

      Что стоит помнить: `input` только для чтения — записать в него из
      компонента нельзя, и это правильно. Если значение нужно менять локально,
      заводят свой сигнал и осознанно решают, что делать при обновлении
      входного.

      Для двусторонней связи есть отдельный вид параметра, который умеет и
      получать, и возвращать значение родителю. Использовать его стоит для полей
      ввода, а не для всего подряд: двусторонняя связь легко превращает поток
      данных в кашу.
    common_mistakes:
      - Разбирать изменения через ngOnChanges там, где хватает computed.
      - Пытаться записать значение в input.
      - Делать двустороннюю связь по умолчанию.
    follow_ups:
      - Как реагировать на изменение входного параметра без ngOnChanges?
      - Когда уместна двусторонняя связь?

  - slug: ng_observable_basics
    specializations: [frontend_angular]
    topic: rxjs
    subtopic: subscriptions
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что такое Observable и чем он отличается от Promise?"
    answer_short: >-
      Promise — одно значение в будущем, отменить нельзя. Observable — поток
      значений: их может быть ноль, одно или много, на него подписываются и от
      него отписываются, а работа начинается только при подписке.
    answer_detailed: |
      ```ts
      this.http.get<Order[]>('/api/v1/orders').subscribe((orders) => {
        this.orders = orders;
      });
      ```

      Три отличия, которые проверяют:

      - **ленивость.** Promise выполняется сразу при создании, Observable — при
        подписке. Поэтому HTTP-запрос без подписки просто не уйдёт;
      - **много значений.** События ввода, сообщения сокета, таймер — это поток,
        а не одно значение;
      - **отмена.** Отписка прекращает работу: незавершённый запрос
        отменяется, таймер останавливается.

      Из ленивости следует частая ошибка новичка: вызвал метод сервиса, а
      запроса нет — забыл подписаться.

      Из отмены следует другая: подписался и не отписался — обработчик живёт
      после уничтожения компонента.

      Лучший способ избежать обеих — не подписываться руками: `async` в шаблоне
      подписывается и отписывается сам.
    common_mistakes:
      - Не подписаться и удивляться, что запрос не ушёл.
      - Подписываться вручную и забывать отписку.
      - Считать Observable синонимом Promise.
    follow_ups:
      - Почему запрос не уходит без подписки?
      - Что делает async в шаблоне?

  - slug: ng_async_pipe_basics
    specializations: [frontend_angular]
    topic: change_detection
    subtopic: async_pipe
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: single_choice
    title: "Что делает async в шаблоне?"
    options:
      - code: a
        text: "Превращает синхронный код в асинхронный"
      - code: b
        text: "Подписывается на поток, подставляет последнее значение и сам отписывается при уничтожении компонента"
        is_correct: true
      - code: c
        text: "Ждёт завершения потока и только потом показывает шаблон"
      - code: d
        text: "Кеширует значение потока навсегда"
    answer_short: >-
      Подписывается на поток, подставляет в шаблон последнее пришедшее значение
      и отписывается, когда компонент уничтожается. Избавляет от ручных подписок
      и связанных с ними утечек.
    answer_detailed: |
      ```html
      @if (orders$ | async; as orders) {
        <app-order-list [orders]="orders" />
      } @else {
        <app-spinner />
      }
      ```

      Форма с `as` важна: без неё повторное использование `| async` в шаблоне
      создаёт вторую подписку, а значит второй HTTP-запрос. Это классическая
      ошибка — на экране два одинаковых запроса, и никто не понимает откуда.

      Ещё `async` сам сообщает Angular, что данные изменились. Это то, что
      позволяет включить экономный режим обнаружения изменений и не проверять
      дерево при каждом событии.

      Чего он не делает: не кеширует и не повторяет запрос. Если поток холодный
      и на него подписались дважды, работа выполнится дважды.

      В приложениях на сигналах ту же роль играет чтение сигнала в шаблоне, и
      для новых экранов это обычно проще.
    common_mistakes:
      - Использовать async несколько раз без as и получать лишние запросы.
      - Подписываться вручную там, где хватает async.
      - Ожидать от async кеширования.
    follow_ups:
      - Почему на экране два одинаковых запроса?
      - Как async связан с обнаружением изменений?

  - slug: ng_change_detection_basics
    specializations: [frontend_angular]
    topic: change_detection
    subtopic: strategies
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что такое обнаружение изменений и зачем нужна стратегия OnPush?"
    answer_short: >-
      После любого события Angular проверяет, изменились ли данные в шаблонах.
      По умолчанию он проверяет всё дерево; `OnPush` говорит проверять компонент
      только при новых входных данных, событии внутри него или сигнале.
    answer_detailed: |
      Проверка всего дерева на каждый клик и каждый таймер — это работа,
      пропорциональная размеру приложения. На маленьком экране незаметно, на
      большом — заметно.

      ```ts
      @Component({
        changeDetection: ChangeDetectionStrategy.OnPush,
      })
      ```

      Что важно понимать сразу: `OnPush` сравнивает входные данные по ссылке.
      Если менять поле внутри переданного объекта, ссылка не изменится, и
      компонент не обновится. Отсюда правило — передавать новый объект, а не
      править старый.

      Что запускает проверку при `OnPush`: новая ссылка во входных данных,
      событие внутри компонента, срабатывание `async` в шаблоне, изменение
      сигнала.

      Практический совет: включать `OnPush` сразу, с первого компонента. Перевод
      готового приложения на него позже — отдельная неприятная работа, потому что
      к тому моменту повсюду накопились изменения объектов на месте.
    common_mistakes:
      - Менять поля внутри объекта, переданного в OnPush-компонент.
      - Оставлять стратегию по умолчанию и удивляться лишним проверкам.
      - Переводить приложение на OnPush в самом конце.
    follow_ups:
      - Почему OnPush-компонент не обновился?
      - Что запускает проверку при OnPush?

  - slug: ng_di_basics
    specializations: [frontend_angular]
    topic: di
    subtopic: providers
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как работает внедрение зависимостей и что означает providedIn root?"
    answer_short: >-
      Компонент просит зависимость в конструкторе или через `inject`, а Angular
      находит её у ближайшего поставщика. `providedIn: 'root'` означает один
      экземпляр на всё приложение — самый частый случай для сервисов.
    answer_detailed: |
      ```ts
      @Injectable({ providedIn: 'root' })
      export class OrderService {
        private http = inject(HttpClient);
      }
      ```

      Зачем это нужно: компонент не создаёт сервис сам, а получает готовый.
      Значит, в тесте можно подставить другой — и проверить компонент без сети.
      Это и есть главная практическая польза, а не «фреймворк так требует».

      Что стоит понимать про область видимости: сервис, объявленный на уровне
      компонента, создаётся заново для каждого экземпляра этого компонента. Это
      удобно для состояния одного экрана и неудобно, если ожидался общий.

      Отсюда типичная путаница: сервис объявили и в корне, и у компонента, и
      получились два разных экземпляра с разным состоянием.

      Про `inject`: он делает то же самое, что параметры конструктора, но
      читается короче и работает в местах, где конструктора нет.
    common_mistakes:
      - Создавать сервис через new вместо внедрения.
      - Объявлять сервис в нескольких местах и получать разные экземпляры.
      - Не понимать, что сервис компонента живёт столько же, сколько компонент.
    follow_ups:
      - Почему у двух компонентов оказалось разное состояние сервиса?
      - Чем inject отличается от параметров конструктора?
  - slug: ng_reactive_forms_basics
    specializations: [frontend_angular]
    topic: forms
    subtopic: reactive
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как устроена реактивная форма и чем она лучше формы на шаблоне?"
    answer_short: >-
      Структура формы описывается в классе объектом: поля, начальные значения,
      правила проверки. Это даёт типизацию, тестируемость без разметки и
      возможность собирать форму динамически.
    answer_detailed: |
      ```ts
      form = new FormGroup({
        email: new FormControl('', [Validators.required, Validators.email]),
        age: new FormControl<number | null>(null),
      });
      ```

      ```html
      <form [formGroup]="form" (ngSubmit)="submit()">
        <input formControlName="email">
      </form>
      ```

      Почему обычно берут именно реактивные формы: логика формы лежит в классе,
      её видно целиком и можно проверить тестом без отрисовки разметки. Формы на
      шаблоне удобны для двух полей и быстро становятся неудобными дальше.

      Что стоит знать сразу:

      - у поля есть состояния `touched`, `dirty`, `valid` — ошибку показывают
        после того, как человек ушёл из поля, а не пока он печатает первую букву;
      - `value` формы не содержит отключённых полей. Это регулярно удивляет при
        отправке;
      - сброс формы возвращает и значения, и состояния — иначе после отправки
        поля остаются подсвеченными как тронутые.
    common_mistakes:
      - Показывать ошибку до того, как человек ушёл из поля.
      - Забывать, что отключённые поля не попадают в значение формы.
      - Собирать сложную форму на шаблоне вместо реактивной.
    follow_ups:
      - Когда показывать ошибку валидации?
      - Почему поле пропало из значения формы?

  - slug: ng_validation_basics
    specializations: [frontend_angular]
    topic: forms
    subtopic: validation
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Как добавить свою проверку в форму и защищает ли она данные?"
    answer_short: >-
      Своя проверка — функция, которая получает поле и возвращает объект ошибки
      или null. Данные она не защищает: это удобство для пользователя, а
      настоящая проверка обязана быть на сервере.
    answer_detailed: |
      ```ts
      export function noSpaces(control: AbstractControl): ValidationErrors | null {
        return control.value?.includes(' ') ? { noSpaces: true } : null;
      }
      ```

      Что важно про сообщения: объект ошибки — это код, а не текст. Текст живёт
      в разметке или в словаре сообщений, иначе перевести интерфейс будет
      нечем.

      Проверки бывают синхронные и асинхронные. Асинхронная (например,
      «занят ли такой email») выполняется отдельно, и её не запускают на каждое
      нажатие клавиши — иначе сервер получает запрос на каждую букву.

      Про границу ответственности: клиентская проверка нужна, чтобы человек
      узнал об ошибке сразу, а не после отправки. Обойти её — вопрос пары минут
      в инструментах разработчика, поэтому сервер обязан проверить всё заново.

      И про доступность: сообщение об ошибке должно быть связано с полем, иначе
      программа чтения с экрана его не свяжет, а красная рамка сама по себе
      ничего не сообщает.
    common_mistakes:
      - Класть текст сообщения в объект ошибки.
      - Слать асинхронную проверку на каждое нажатие клавиши.
      - Считать клиентскую проверку защитой данных.
    follow_ups:
      - Почему текст ошибки не хранят в объекте ошибки?
      - Кто отвечает за настоящую проверку данных?

  - slug: ng_routing_basics
    specializations: [frontend_angular]
    topic: routing
    subtopic: lazy_loading
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Как описывают маршруты и что такое ленивая загрузка?"
    answer_short: >-
      Маршрут связывает адрес с компонентом, `router-outlet` показывает
      текущий. Ленивая загрузка означает, что код страницы скачивается при
      первом переходе на неё, а не при запуске приложения.
    answer_detailed: |
      ```ts
      export const routes: Routes = [
        { path: 'orders', component: OrderListComponent },
        { path: 'orders/:id', component: OrderDetailsComponent },
        {
          path: 'admin',
          loadComponent: () => import('./admin/admin.component').then((m) => m.AdminComponent),
        },
      ];
      ```

      Ленивая загрузка — самый дешёвый выигрыш в размере: код админки не поедет
      тому, кто открыл каталог. На старте приложения скачивается только то, что
      нужно для первого экрана.

      Параметр адреса читают из сервиса маршрута. Важная деталь: при переходе с
      `/orders/1` на `/orders/2` компонент не пересоздаётся — меняются только
      параметры. Загрузка данных в `ngOnInit` во второй раз не сработает, и на
      экране останутся старые данные.

      Фильтры и номер страницы списка стоит держать в параметрах запроса, а не в
      поле компонента: тогда ссылку можно отправить коллеге, а кнопка «назад»
      работает как ожидается.
    common_mistakes:
      - Грузить весь код приложения сразу.
      - Загружать данные только в ngOnInit и не реагировать на смену параметра.
      - Хранить фильтры списка в компоненте вместо адреса.
    follow_ups:
      - Почему при смене id данные не обновились?
      - Что выигрывает состояние, вынесенное в адрес?

  - slug: ng_guards_basics
    specializations: [frontend_angular]
    topic: routing
    subtopic: guards
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Зачем нужны защитники маршрутов и защищают ли они данные?"
    answer_short: >-
      Они решают, пускать ли на маршрут: проверить вход, подтвердить уход с
      незаполненной формы. Данные не защищают — это удобство интерфейса,
      настоящая проверка прав живёт на сервере.
    answer_detailed: |
      ```ts
      export const authGuard: CanActivateFn = (route, state) => {
        const auth = inject(AuthService);
        const router = inject(Router);
        return auth.isLoggedIn() || router.createUrlTree(['/login'], {
          queryParams: { redirect: state.url },
        });
      };
      ```

      Два частых применения: перенаправить неавторизованного на вход и
      предупредить при уходе с формы, где есть несохранённые изменения.

      Что важно понимать: весь этот код выполняется в браузере пользователя.
      Открыть страницу в обход защитника — вопрос пары минут в инструментах
      разработчика. Если сервер отдаёт данные без проверки, они утекут.

      Правильное разделение: маршрутизатор отвечает за то, чтобы человек не
      попал на бесполезный экран, сервер — за то, чтобы он не получил чужие
      данные.

      Частая ошибка — бесконечное перенаправление: защитник отправляет на
      страницу входа, а она тоже под защитой. Условие выхода должно быть явным,
      и это стоит проверить тестом.
    common_mistakes:
      - Считать закрытый маршрут защитой данных.
      - Создавать бесконечное перенаправление на страницу входа.
      - Не возвращать человека туда, куда он шёл, после входа.
    follow_ups:
      - Что произойдёт, если открыть закрытый маршрут напрямую?
      - Кто отвечает за проверку прав?

  - slug: ng_bundle_basics
    specializations: [frontend_angular]
    topic: performance
    subtopic: bundle_size
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Почему размер бандла важен и как его уменьшают в Angular?"
    answer_short: >-
      Пока код не скачался и не выполнился, страница не отвечает на действия.
      Уменьшают ленивой загрузкой маршрутов, отказом от лишних зависимостей и
      точечными импортами вместо целых пакетов.
    answer_detailed: |
      Что даёт результат чаще всего:

      - **ленивые маршруты.** Самый дешёвый выигрыш: каждая страница едет
        отдельно;
      - **зависимости.** Библиотека дат на триста килобайт ради одной строки —
        обычная история. Анализатор бандла показывает, кто занимает место;
      - **точечные импорты.** Импорт пакета целиком мешает сборщику выкинуть
        неиспользуемое;
      - **бюджеты сборки.** В конфигурации Angular можно задать предел размера,
        и сборка будет предупреждать или падать при его превышении. Это дешевле,
        чем замечать рост раз в полгода.

      Измеряют объём после сжатия и время до интерактивности на медленном
      устройстве: на быстром ноутбуке с проводным интернетом проблемы не видно.

      И про картинки: они обычно весят больше кода, но вспоминают о них
      последними.
    common_mistakes:
      - Грузить весь код приложения одним куском.
      - Импортировать пакет целиком ради одной функции.
      - Не настраивать бюджеты размера в сборке.
    follow_ups:
      - Что показывает анализатор бандла?
      - Зачем нужны бюджеты в конфигурации сборки?

  - slug: ng_track_lists_basics
    specializations: [frontend_angular]
    topic: performance
    subtopic: lists
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Зачем в цикле по списку нужен track и что будет без него?"
    answer_short: >-
      `track` говорит Angular, как отличить элементы друг от друга. Без
      устойчивого признака при изменении списка перерисовываются все строки, а
      состояние внутри них — введённый текст, фокус — переезжает не туда.
    answer_detailed: |
      ```html
      @for (order of orders(); track order.id) {
        <app-order-card [order]="order" />
      }
      ```

      Что происходит без устойчивого признака: Angular не понимает, что строка
      «та же самая», и пересоздаёт элементы. На списке из тысячи строк это
      заметно, а на списке с полями ввода приводит к странностям — набранный
      текст оказывается в другой строке.

      Использовать индекс в качестве признака — почти то же самое, что не
      использовать ничего: при вставке в начало все индексы сдвигаются, и Angular
      считает все строки изменившимися.

      Правильный признак — идентификатор из данных.

      Если список очень длинный, сам по себе `track` не спасёт: тысяча
      компонентов остаётся тысячей компонентов. Тогда нужна виртуализация —
      в DOM держат только видимые строки.
    common_mistakes:
      - Использовать индекс как признак элемента.
      - Считать, что track решает проблему очень длинных списков.
      - Рисовать тысячи строк без виртуализации.
    follow_ups:
      - Почему индекс — плохой признак?
      - Что делать со списком из десяти тысяч строк?

  - slug: ng_component_test_basics
    specializations: [frontend_angular]
    topic: testing
    subtopic: component_tests
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что проверяют в тесте Angular-компонента?"
    answer_short: >-
      Поведение с точки зрения пользователя: что видно на экране и что
      происходит после действия. Зависимости подставляют через внедрение —
      именно ради этого оно и нужно.
    answer_detailed: |
      ```ts
      TestBed.configureTestingModule({
        imports: [OrderListComponent],
        providers: [{ provide: OrderService, useValue: stubService }],
      });
      ```

      Подстановка сервиса-заглушки — главная практическая польза внедрения
      зависимостей: компонент проверяется без сети и без базы, тест выполняется
      за миллисекунды.

      Что проверяют: отрисовался ли список, показалось ли сообщение об ошибке,
      ушло ли событие наверх при клике. Не внутренние поля класса — они меняются
      при любой переработке.

      Важная деталь Angular: после изменения данных нужно попросить фреймворк
      обновить представление, иначе разметка ещё старая и проверка провалится.
      Забытый вызов обновления — самая частая причина «тест не видит текст,
      который точно есть».

      Асинхронность: ждут появления результата, а не фиксированной задержки.
      Тест с ожиданием в триста миллисекунд рано или поздно начнёт падать на
      медленной машине конвейера.
    common_mistakes:
      - Забывать обновить представление перед проверкой.
      - Проверять внутренние поля вместо видимого результата.
      - Ждать фиксированное время вместо появления элемента.
    follow_ups:
      - Почему тест не видит текст, который есть в шаблоне?
      - Зачем подставляют сервис-заглушку?

  - slug: ng_test_async_basics
    specializations: [frontend_angular]
    topic: testing
    subtopic: async_testing
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 3
    type: open_answer
    title: "Как тестировать код с запросами и таймерами?"
    answer_short: >-
      Запросы подменяют тестовым HTTP-контроллером: он ловит запрос, отдаёт
      заранее заданный ответ и позволяет проверить, что запрос вообще был.
      Таймеры прокручивают виртуальным временем, а не ждут по-настоящему.
    answer_detailed: |
      ```ts
      const req = httpMock.expectOne('/api/v1/orders');
      req.flush([{ id: '1' }]);
      ```

      Что это даёт: тест не ходит в сеть, выполняется мгновенно и не зависит от
      чужого сервера. И заодно проверяет, что запрос ушёл по нужному адресу и с
      нужным методом.

      В конце такие тесты проверяют, что не осталось необработанных запросов:
      лишний запрос — обычно признак ошибки, например двойной подписки.

      Таймеры: вместо настоящего ожидания используют механизм виртуального
      времени — «прокрутить две секунды» выполняется мгновенно. Тест с
      настоящей паузой делает набор медленным и нестабильным.

      Общее правило: тест не должен зависеть от настоящего времени и настоящей
      сети. Как только он от них зависит, он начинает падать через раз, а
      нестабильный тест хуже отсутствующего — на него перестают смотреть.
    common_mistakes:
      - Ходить в настоящую сеть из теста.
      - Ждать настоящие секунды вместо виртуального времени.
      - Не проверять, что не осталось лишних запросов.
    follow_ups:
      - Как поймать лишний запрос в тесте?
      - Почему нестабильный тест хуже отсутствующего?

  - slug: ng_subject_basics
    specializations: [frontend_angular]
    topic: rxjs
    subtopic: subjects
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое Subject и когда он нужен?"
    answer_short: >-
      Это одновременно поток и способ в него писать. Нужен, когда события
      порождает ваш код: клик, команда из сервиса, обновление состояния.
      Наружу его отдают только для чтения, чтобы писать мог один владелец.
    answer_detailed: |
      ```ts
      private readonly refresh$ = new Subject<void>();
      readonly orders$ = this.refresh$.pipe(switchMap(() => this.load()));

      reload() {
        this.refresh$.next();
      }
      ```

      Обратите внимание на разделение: поле для записи приватное, наружу
      уходит только поток для чтения. Иначе писать в него сможет кто угодно, и
      найти источник значения станет невозможно.

      Разновидности, о которых спрашивают: обычный `Subject` не помнит
      последнее значение — подписавшийся позже ничего не получит, пока не
      придёт новое. `BehaviorSubject` хранит текущее значение и сразу отдаёт его
      новому подписчику — поэтому его берут для состояния.

      Частая ошибка — использовать `Subject` там, где хватает обычного потока
      от источника данных. Признак: вы подписываетесь на один поток и вручную
      прокидываете значения в другой. Почти всегда это делается одним
      оператором.

      В новых экранах роль хранилища состояния всё чаще берут сигналы, а
      `Subject` остаётся для событий.
    common_mistakes:
      - Отдавать наружу Subject целиком, а не поток для чтения.
      - Подписываться на поток и вручную прокидывать значения в Subject.
      - Брать обычный Subject для хранения состояния.
    follow_ups:
      - Чем BehaviorSubject отличается от Subject?
      - Почему наружу отдают только поток для чтения?

  - slug: ng_soft_asking_for_help
    specializations: [frontend_angular]
    topic: soft
    subtopic: teamwork
    min_grade: intern
    peak_grade: junior
    max_grade: middle
    frequency: 4
    type: open_answer
    title: "Вы застряли на задаче. Через сколько времени и как правильно просить помощи?"
    answer_short: >-
      Обычная договорённость — от получаса до часа самостоятельных попыток,
      дальше спрашивать. Просьба содержит задачу, что уже пробовали и что
      получилось, а не «у меня не работает».
    answer_detailed: |
      ### Junior
      Молчать полдня хуже, чем спросить через час: команда теряет день, а не вы
      сохраняете лицо.

      Форма вопроса решает многое:

      > Компонент не обновляется после ответа сервера. Данные приходят, вижу их
      > в консоли. Стратегия OnPush, объект меняю на месте — подозреваю, что
      > дело в ссылке. Вот код. Туда смотрю?

      Это отвечается за минуту. «Помогите, не работает» требует пяти уточняющих
      вопросов, и каждый — отдельное переключение для того, кто помогает.

      ### Middle
      Ждут, что вы сами оцениваете цену молчания: задача на день и задача на
      спринт допускают разное время попыток. Полезная привычка — записывать, что
      уже проверено: половина проблем решается по дороге, пока формулируешь.

      ### Senior
      Ждут обратной стороны: умения принимать такие вопросы и не отбивать охоту
      их задавать. Ответ «сам разберись» экономит десять минут и стоит команде
      дня.

      Сильная версия включает системный вывод: если люди регулярно застревают в
      одном месте, дело не в людях, а в отсутствии документации или в запутанном
      коде.
    common_mistakes:
      - Молчать полдня, боясь показаться некомпетентным.
      - Спрашивать без описания того, что уже пробовали.
      - Отвечать новичкам так, что спрашивать перестают.
    follow_ups:
      - Что должно быть в хорошо сформулированном вопросе?
      - Что делать, если люди регулярно застревают на одном месте?
  # Вопросы, которые задают и джуну, и сеньору — разница в глубине ответа.

  - slug: ng_strict_typing_practice
    specializations: [frontend_angular]
    topic: typescript
    subtopic: strict_mode
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что даёт строгий режим TypeScript и как жить с проверкой на null?"
    answer_short: >-
      Строгий режим заставляет обрабатывать отсутствующие значения там, где они
      возможны. Это переносит целый класс ошибок из рантайма в компиляцию, но
      требует честно описывать, где значения может не быть.
    answer_detailed: |
      ### Junior
      Главное правило: проверять на границе, а не по всему коду. Данные из
      запроса, из адреса, из формы — проверили один раз, дальше внутрь идёт уже
      известный тип.

      Оператор с восклицательным знаком, утверждающий «здесь точно не null», —
      не решение, а обещание компилятору. Каждое такое место стоит считать
      помеченным риском.

      ### Middle
      Ждут понимания, что строгость окупается на изменениях. Добавили
      необязательное поле — компилятор показал все места, где его не
      обрабатывают. Без строгого режима это выясняется у пользователя.

      Здесь же — про типизацию ответов сервера: она описывает ожидание, а не
      проверяет факт. Если контракт может разойтись, ответ разбирают схемой, и
      тогда тип получается из проверки, а не наоборот.

      И про формы: типизированные формы избавляют от целого класса опечаток в
      именах полей, но требуют описывать структуру заранее — динамические формы
      от этого немного проигрывают.

      ### Senior
      Ждут разговора о цене. Строгость требует дисциплины: под давлением сроков
      её обходят приведениями, и через полгода типы врут — а это хуже, чем их
      отсутствие, потому что им доверяют.

      Сильный ответ включает практику: приведения через `as` и восклицательный
      знак не запрещают, но делают заметными — правилом линтера и обсуждением в
      ревью. И про генерацию типов из описания API: она снимает целый класс
      расхождений между фронтендом и бэкендом.
    common_mistakes:
      - Затыкать проверку восклицательным знаком.
      - Проверять на null по всему коду вместо границы.
      - Доверять типам ответа сервера как проверке.
    follow_ups:
      - Что делать, если контракт API может измениться?
      - Почему врущие типы хуже отсутствующих?

  - slug: ng_signals_vs_rxjs
    specializations: [frontend_angular]
    topic: signals
    subtopic: interop_rxjs
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Сигналы или RxJS — как выбрать и как они уживаются?"
    answer_short: >-
      Сигналы — для состояния: «чему равно значение сейчас». RxJS — для
      потоков событий во времени: запросы, ввод с задержкой, отмена, объединение
      источников. В одном приложении они живут вместе через явные переходники.
    answer_detailed: |
      ### Junior
      Простое разделение: если значение нужно показать в шаблоне и оно
      меняется — сигнал. Если это последовательность событий, которую нужно
      преобразовать — поток.

      Для перехода между ними есть функции в обе стороны: из потока в сигнал и
      обратно.

      ### Middle
      Ждут понимания, зачем вообще нужны операторы. Задержка перед отправкой
      запроса, отмена предыдущего при новом вводе, повтор при ошибке,
      объединение нескольких источников — всё это на сигналах пришлось бы писать
      руками и с ошибками.

      Здесь же — про переход: превращая поток в сигнал, нужно решить, что
      показывать до первого значения. Обычно задают начальное значение, иначе
      сигнал будет пустым в первый момент.

      И про обратную сторону: у сигнала нет понятия «завершился» и «ошибка» —
      это состояние, а не поток. Ошибку загрузки хранят отдельным сигналом.

      ### Senior
      Ждут разговора о направлении развития и о цене переписывания. Сигналы
      упрощают обнаружение изменений и делают зависимости явными; RxJS остаётся
      там, где есть время и асинхронность.

      Сильный ответ включает решение для команды: где проходит граница, чтобы в
      проекте не было трёх подходов сразу. Обычно так: состояние компонента и
      производные значения — сигналы; работа с сетью и события — потоки;
      переходники в одном месте, а не разбросаны по коду.

      Уместно и признание: массовое переписывание рабочего кода на сигналы ради
      единообразия почти никогда не окупается.
    common_mistakes:
      - Писать руками то, что делает один оператор RxJS.
      - Ожидать от сигнала обработки ошибок и завершения.
      - Переписывать рабочий код ради единообразия.
    follow_ups:
      - Как показать состояние ошибки на сигналах?
      - Где провести границу между сигналами и потоками в проекте?

  - slug: ng_flattening_operators
    specializations: [frontend_angular]
    topic: rxjs
    subtopic: flattening
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Чем switchMap отличается от mergeMap, concatMap и exhaustMap?"
    answer_short: >-
      Они по-разному ведут себя, когда приходит новое значение, а предыдущая
      операция не закончилась: switchMap отменяет предыдущую, mergeMap запускает
      параллельно, concatMap ставит в очередь, exhaustMap игнорирует новое.
    answer_detailed: |
      ### Junior
      Практическое правило по задачам:

      - **поиск по вводу** — `switchMap`: ответ на устаревший запрос никому не
        нужен;
      - **отправка формы по кнопке** — `exhaustMap`: двойное нажатие не должно
        создать два заказа;
      - **сохранение изменений по порядку** — `concatMap`;
      - **независимые параллельные загрузки** — `mergeMap`.

      ### Middle
      Ждут понимания, что неправильный выбор даёт трудноуловимые ошибки. С
      `mergeMap` в поиске ответы приходят в произвольном порядке, и на экране
      может оказаться результат предпоследнего запроса.

      Здесь же — про ошибки: ошибка внутри потока завершает его, и подписка
      перестаёт работать. Если это поток кликов, кнопка молча перестаёт
      реагировать. Поэтому ошибку обрабатывают внутри внутреннего потока, а не
      снаружи.

      И про повторные подписки: два `async` на один холодный поток — два
      запроса. Спасает оператор, разделяющий один источник между подписчиками.

      ### Senior
      Ждут разговора о том, что это вопрос предметной области, а не вкуса.
      Отмена предыдущего запроса допустима для чтения и опасна для записи:
      отменённое сохранение могло дойти до сервера.

      Сильный ответ включает идемпотентность: если повторная отправка возможна,
      её решают ключом на стороне API, а не только выбором оператора на
      клиенте.

      Уместно и про отладку: цепочку из шести операторов читать тяжело, и
      разбивать её на именованные части — не украшение, а способ передать код
      другому человеку.
    common_mistakes:
      - Брать mergeMap для поиска и получать чужой результат.
      - Обрабатывать ошибку снаружи и терять подписку.
      - Отменять запросы записи так же, как запросы чтения.
    follow_ups:
      - Почему кнопка перестала реагировать после ошибки?
      - Чем защититься от двойной отправки, кроме оператора?

  - slug: ng_zoneless_change_detection
    specializations: [frontend_angular]
    topic: change_detection
    subtopic: zone
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Зачем Angular нужна зона и что меняет работа без неё?"
    answer_short: >-
      Зона перехватывает асинхронные операции и сообщает фреймворку, что
      что-то могло измениться. Без неё Angular полагается на явные сигналы об
      изменениях — от сигналов и `async`, — и лишней работы становится меньше.
    answer_detailed: |
      ### Junior
      Что делает зона: подменяет таймеры, обработчики событий и запросы, чтобы
      после каждого из них запустить проверку изменений. Именно поэтому
      обновление поля класса в обработчике сразу видно на экране.

      Цена — проверка запускается на любое событие, даже если ничего не
      менялось.

      ### Middle
      Ждут понимания, откуда берутся классические проблемы: сторонняя
      библиотека, работающая вне зоны, обновляет данные, а экран не меняется —
      Angular не узнал об изменении. Или наоборот: частый таймер держит
      приложение в постоянной проверке.

      Отсюда приёмы: выполнять шумные операции вне зоны и возвращаться внутрь
      только для обновления данных.

      Работа без зоны переворачивает подход: фреймворк не угадывает, а получает
      явное уведомление от сигнала или `async`. Это требует, чтобы состояние
      действительно жило в сигналах.

      ### Senior
      Ждут оценки перехода как проекта: приложение, где данные лежат в обычных
      полях класса и меняются в обработчиках, без зоны просто перестанет
      обновляться в части мест.

      Сильный ответ включает порядок: сначала `OnPush` везде, потом перевод
      состояния на сигналы, и только потом отключение зоны. И измерение —
      сколько времени уходило на проверку изменений до и после, иначе это
      изменение ради изменения.

      Уместно и про размер: зона — заметный кусок бандла, и её удаление даёт не
      только скорость.
    common_mistakes:
      - Ожидать обновления экрана после изменений вне зоны.
      - Держать частые таймеры внутри зоны.
      - Отключать зону до перевода состояния на сигналы.
    follow_ups:
      - Почему экран не обновился после работы сторонней библиотеки?
      - В каком порядке готовят приложение к работе без зоны?

  - slug: ng_di_hierarchy_practice
    specializations: [frontend_angular]
    topic: di
    subtopic: hierarchy
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как устроена иерархия инжекторов и зачем объявлять сервис не в корне?"
    answer_short: >-
      Поиск зависимости идёт от компонента вверх до корня. Объявление сервиса на
      уровне компонента даёт отдельный экземпляр на каждый экземпляр компонента —
      это способ дать состояние конкретному экрану или поддереву.
    answer_detailed: |
      ### Junior
      Правило поиска: сначала свой инжектор, потом родительский, и так до корня.
      Первый найденный поставщик выигрывает.

      Отсюда самый частый сюрприз: сервис объявили и в корне, и у компонента —
      получились два разных экземпляра с разным состоянием, и данные «не
      совпадают».

      ### Middle
      Ждут примеров, когда локальный экземпляр полезен: состояние сложного
      мастера, живущее ровно столько, сколько открыт экран; хранилище фильтров
      таблицы, своё у каждой таблицы на странице.

      Здесь же — про уничтожение: сервис уровня компонента уничтожается вместе с
      ним, и в нём можно освобождать ресурсы. Сервис в корне живёт всё время
      работы приложения, и накопленное в нём состояние переживает переходы между
      экранами — иногда это то, чего не ждали.

      И про токены: зависимость не обязана быть классом. Настройки удобно
      передавать через токен, и тогда их легко подменить в тесте или в другой
      сборке.

      ### Senior
      Ждут взгляда на это как на инструмент архитектуры: границы владения
      состоянием задаются местом объявления. Всё в корне — значит, всё общее, и
      никто не знает, кто что меняет.

      Сильный ответ включает предостережение: слишком хитрая иерархия
      поставщиков тяжело читается — понять, какой экземпляр достанется
      компоненту, можно только пройдя дерево вверх.

      Уместно и про тестируемость: подмена зависимости на уровне теста и есть
      главная причина, по которой сервисы не создают через `new`.
    common_mistakes:
      - Объявлять сервис в двух местах и получать разные экземпляры.
      - Держать в корневом сервисе состояние одного экрана.
      - Строить сложную иерархию поставщиков без необходимости.
    follow_ups:
      - Когда сервис объявляют на уровне компонента?
      - Зачем нужны токены вместо классов?

  - slug: ng_dynamic_forms_practice
    specializations: [frontend_angular]
    topic: forms
    subtopic: dynamic
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как собрать форму, структура которой приходит с сервера?"
    answer_short: >-
      Форму строят из описания: по списку полей создают элементы управления с
      нужными проверками. Главное — не пытаться описать всё в шаблоне, а
      разделить описание структуры, отрисовку и правила проверки.
    answer_detailed: |
      ### Junior
      Базовая механика: массив полей с типом и правилами превращается в набор
      элементов управления, шаблон рисует их по типу.

      Что важно: значения по умолчанию, обязательность и порядок должны прийти
      из того же описания — иначе часть логики окажется зашита в шаблон и
      разойдётся с сервером.

      ### Middle
      Ждут понимания сложных случаев: поля, зависящие друг от друга («покажи
      город после выбора страны»), проверки на уровне группы, добавляемые и
      удаляемые повторяющиеся блоки.

      Здесь же — про производительность: форма на двести полей с проверками на
      каждое нажатие клавиши ощутимо тормозит. Помогает выполнение проверок при
      потере фокуса и отказ от лишних подписок на изменения.

      И про типизацию: динамическая форма плохо дружит со строгими типами —
      структура известна только в рантайме. Обычно это принимают и проверяют
      результат схемой перед отправкой.

      ### Senior
      Ждут разговора о границе: описание формы — это контракт между сервером и
      клиентом, и его изменения ломают клиент так же, как изменения API.
      Значит, у него должна быть версия и правила совместимости.

      Сильный ответ включает вопрос, а нужна ли динамика вообще. Часто за
      требованием «формы настраиваются без разработчика» стоит три-четыре
      варианта, которые проще описать явно и понятно — а конструктор форм
      придётся поддерживать годами.

      Уместно и про доступность: сгенерированные поля так же обязаны иметь
      подписи и связанные сообщения об ошибках.
    common_mistakes:
      - Зашивать часть правил в шаблон вместо описания.
      - Проверять двести полей на каждое нажатие клавиши.
      - Строить конструктор форм там, где хватает нескольких явных вариантов.
    follow_ups:
      - Что делать с типизацией динамической формы?
      - Когда динамическая форма — лишнее усложнение?

  - slug: ng_resolvers_practice
    specializations: [frontend_angular]
    topic: routing
    subtopic: resolvers
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Загружать данные до перехода на страницу или после? Зачем нужны резолверы?"
    answer_short: >-
      Резолвер загружает данные до отрисовки маршрута: экран открывается сразу
      заполненным. Цена — задержка перехода без обратной связи, поэтому для
      медленных запросов чаще лучше показать экран со скелетом.
    answer_detailed: |
      ### Junior
      Разница видна пользователю. С резолвером: нажал — ничего не происходит —
      появился готовый экран. Без него: экран появился сразу, данные подгрузились
      следом.

      Для быстрых запросов первый вариант приятнее, для медленных — хуже:
      приложение выглядит зависшим.

      ### Middle
      Ждут понимания компромисса и знания, что при задержке нужно показывать
      индикатор перехода — иначе интерфейс молчит.

      Здесь же — обработка ошибки: если резолвер не смог загрузить данные,
      переход должен куда-то привести. Молча остаться на старой странице —
      худший вариант из возможных.

      И про повторные переходы: данные, загруженные резолвером, живут ровно до
      следующего перехода, кеша у него нет. Если экран открывают часто,
      запросы будут уходить каждый раз.

      ### Senior
      Ждут вывода, что резолверы решают частный случай задачи, у которой есть
      более общее решение — слой кеша запросов. С ним данные могут показаться
      мгновенно из кеша и обновиться в фоне, а резолвер такого не умеет.

      Сильный ответ включает измерение: сколько людей уходят, не дождавшись
      перехода. Это отвечает на вопрос лучше любых рассуждений об удобстве.

      Уместно и про предзагрузку: код и данные следующего вероятного экрана
      можно подтянуть заранее, пока браузер свободен.
    common_mistakes:
      - Использовать резолвер для медленного запроса без индикатора.
      - Не обрабатывать ошибку загрузки в резолвере.
      - Ожидать от резолвера кеширования.
    follow_ups:
      - Что показать пользователю во время работы резолвера?
      - Чем слой кеша лучше резолвера?

  - slug: ng_ssr_hydration_practice
    specializations: [frontend_angular]
    topic: performance
    subtopic: ssr_hydration
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Когда Angular-приложению нужен серверный рендеринг и что он усложняет?"
    answer_short: >-
      Когда важны первый показ и индексация: публичные страницы, витрины,
      контент. Усложняет он всё, что зависит от браузера: обращения к окну,
      разное состояние на сервере и клиенте, двойные запросы при оживлении.
    answer_detailed: |
      ### Junior
      Что видно пользователю: без серверного рендеринга он ждёт скачивания и
      выполнения кода, глядя на пустой экран. С ним разметка приходит готовой.

      Для личного кабинета за логином это обычно не нужно — там нечего
      индексировать, а первый показ не так критичен.

      ### Middle
      Ждут понимания оживления: разметка пришла, но до выполнения кода страница
      не реагирует на клики. Она выглядит готовой и не работает — субъективно
      это хуже честного индикатора.

      Здесь же — типичные грабли: обращение к объектам браузера в коде, который
      выполняется на сервере; таймеры, не дающие серверу завершить отрисовку;
      повторный запрос тех же данных на клиенте, если состояние не передано с
      сервера.

      И то, что оживление можно делать не для всего дерева сразу, а по частям —
      это заметно сокращает время до интерактивности.

      ### Senior
      Ждут разговора о цене эксплуатации: нужен работающий сервер рядом с
      пользователем, кеширование и план на отказ. Плюс двойная среда выполнения:
      один и тот же код должен работать и там, и там, и это надо держать в
      голове при каждом изменении.

      Сильный ответ включает мысль, что серверный рендеринг — не первое
      средство от медленной загрузки. Сначала смотрят на размер бандла и число
      запросов: там обычно лежит основная задержка, и стоит она дешевле.

      Уместно и про измерение: решение принимают по метрикам на настоящих
      пользователях, а не по ощущению «так современнее».
    common_mistakes:
      - Обращаться к window в коде, выполняемом на сервере.
      - Повторять на клиенте запросы, уже сделанные на сервере.
      - Брать серверный рендеринг вместо разбора размера бандла.
    follow_ups:
      - Почему страница выглядит готовой, но не отвечает?
      - Что проверяют раньше, чем включать серверный рендеринг?

  - slug: ng_testing_strategy
    specializations: [frontend_angular]
    topic: testing
    subtopic: mocking
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что покрывать тестами в Angular-приложении, а что нет?"
    answer_short: >-
      Логику: сервисы, преобразования данных, правила форм, ветвления
      состояний. Компоненты — на уровне поведения с подставленными сервисами.
      Поверх — несколько сквозных сценариев на критичные пути.
    answer_detailed: |
      ### Junior
      Ориентир: тест должен ломаться, когда ломается поведение, и не ломаться от
      перестановки разметки.

      Сервисы тестировать проще и полезнее всего: там живёт логика, и им не
      нужна отрисовка.

      ### Middle
      Ждут понимания уровней и цены. Тест компонента с поднятием окружения
      медленнее теста сервиса в десятки раз; если вся логика в компонентах,
      набор будет медленным, и его перестанут запускать локально.

      Здесь же — подмена зависимостей: сервис подставляют через поставщика, сеть
      — тестовым HTTP-контроллером. Подменять внутренние методы того же класса,
      который проверяешь, — путь к тесту, который ничего не проверяет.

      И про сквозные тесты: их делают немного и только на пути, которые нельзя
      ломать. Нестабильный набор перестают смотреть.

      ### Senior
      Ждут связи с архитектурой: тестируемость — следствие того, где лежит
      логика. Компонент, который только отображает переданное, проверяется
      тривиально; компонент, который сам ходит в сеть и считает правила, — нет.

      Сильный ответ включает мысль, что покрытие не цель: десять осмысленных
      тестов на расчёты защищают лучше, чем девяносто процентов строк, покрытых
      формально.

      Уместно и про конвейер: быстрые тесты на каждый коммит, медленные — на
      слияние, чтобы обратная связь приходила за минуты.
    common_mistakes:
      - Держать логику в компонентах и получать медленный набор.
      - Подменять внутренние методы проверяемого класса.
      - Гнаться за процентом покрытия.
    follow_ups:
      - Почему тесты сервисов дешевле тестов компонентов?
      - Как распределить тесты по конвейеру?

  - slug: ng_error_states_practice
    specializations: [frontend_angular]
    topic: testing
    subtopic: async_testing
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как показывать загрузку, пустоту и ошибки, чтобы интерфейс не врал?"
    answer_short: >-
      У каждого асинхронного участка четыре состояния: идёт загрузка,
      получилось, пусто, не получилось. Все четыре проектируют. Ошибку
      показывают с действием — повтором, а не абзацем извинений.
    answer_detailed: |
      ### Junior
      Чаще всего забывают пустоту: список без элементов и список, который не
      загрузился, должны выглядеть по-разному. Первый — нормальная ситуация,
      второй — сбой.

      Ошибка сопровождается кнопкой «Повторить»: она полезнее любых объяснений.

      ### Middle
      Ждут единого места обработки: перехватчик HTTP превращает коды ответа в
      понятные ошибки, а не заставляет каждый компонент разбирать статусы
      самостоятельно. Там же живут повторы при сетевых сбоях и обновление
      токена.

      Здесь же — про мерцание: если данные приходят за сто миллисекунд, спиннер
      успевает мигнуть. Индикатор показывают с задержкой, скелет делают похожим
      на будущий контент, чтобы страница не прыгала.

      И про сообщения: техническая ошибка человеку ничего не говорит. Он должен
      узнать, что произошло и что делать, а подробности идут в журнал.

      ### Senior
      Ждут разговора о частичных отказах: один из трёх запросов не удался — экран
      показывает то, что есть, и честно отмечает, чего не хватает.

      Сильный ответ включает наблюдаемость: без сбора клиентских ошибок команда
      узнаёт о поломке от пользователей, и то не сразу. И обработчик верхнего
      уровня, чтобы необработанная ошибка не оставляла белый экран.

      Уместно и про повторы: автоматический повтор помогает при сетевых сбоях,
      но на неидемпотентных действиях создаёт дубли — это решается ключом
      идемпотентности на стороне API.
    common_mistakes:
      - Разбирать коды ответа в каждом компоненте.
      - Показывать пустой список и ошибку одинаково.
      - Повторять неидемпотентный запрос автоматически.
    follow_ups:
      - Что удобно вынести в перехватчик HTTP?
      - Чем опасен автоматический повтор?

  - slug: ng_soft_deadline_pressure
    specializations: [frontend_angular]
    topic: soft
    subtopic: conflict
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Менеджер торопит, а вы видите, что экран тормозит и код придётся переделывать. Что делаете?"
    answer_short: >-
      Переводите разговор в измеримое: что именно тормозит, у скольких
      пользователей, сколько стоит починка сейчас и сколько потом. Решение о
      приоритете принимает продукт, ваша задача — честная оценка последствий.
    answer_detailed: |
      ### Junior
      Первое — не спорить вслепую. Замер на среднем устройстве превращает
      «кажется, тормозит» в факт: столько-то миллисекунд, столько-то
      пропущенных кадров.

      Дальше показать варианты и их цену, а не только проблему.

      ### Middle
      Ждут умения предложить компромисс с условием возврата: «сделаем проще
      сейчас, вернёмся через месяц» — с записанной задачей, а не устно.
      Незаписанное «починим потом» не чинится никогда.

      Здесь же — понимание, что приоритет принадлежит продукту. Инженер отвечает
      за то, чтобы решение принималось с открытыми глазами.

      ### Senior
      Ждут системного взгляда: если такие столкновения повторяются, дело в
      отсутствии договорённостей о качестве. Бюджеты размера в сборке, проверка
      в конвейере, критерий готовности превращают спор в правило.

      Сильный ответ включает работу с ожиданиями заранее: показать стоимость на
      этапе обсуждения дешевле, чем спорить после разработки.

      И честность в обе стороны: иногда правильный ответ — сделать как просят,
      потому что цена спора выше разницы между вариантами. Умение отличать один
      случай от другого и есть работа сеньора.
    common_mistakes:
      - Спорить об ощущениях без измерений.
      - Соглашаться на «починим потом» без записи.
      - Считать выбор приоритета своей зоной ответственности.
    follow_ups:
      - Как договориться о бюджете производительности?
      - Когда стоит согласиться на худший вариант?
