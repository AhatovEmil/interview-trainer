  - slug: cs_null_and_nullable_basics
    specializations: [backend_csharp]
    topic: language
    subtopic: nullable
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Что такое null в C# и какие типы могут его принимать?"
    answer_short: >-
      null — отсутствие ссылки. Ссылочные типы принимают его всегда, значимые
      (int, DateTime, структуры) — только в форме `int?`. Обращение к члену по
      null даёт NullReferenceException.
    answer_detailed: |
      ```csharp
      string? name = null;      // ссылочный, допускает null
      int count = null;         // ошибка компиляции
      int? maybe = null;        // Nullable<int>, так можно
      ```

      Операторы, которые сокращают проверки:

      ```csharp
      var length = name?.Length ?? 0;   // ?. не падает на null, ?? даёт запасное значение
      ```

      Разница между `int?` и `int`: у первого есть `HasValue` и `Value`, и
      обращение к `Value` при отсутствии значения бросает исключение. То есть
      `int?` — не «ноль по умолчанию», а «значения может не быть».

      Практическое правило: обязательные значения проверяют на границе — там,
      где данные приходят из запроса или из базы. Дальше внутрь null не пускают,
      и тогда проверки не расползаются по всему коду.
    common_mistakes:
      - Обращаться к Value у пустого Nullable.
      - Расставлять проверки на null по всему коду вместо контроля на границе.
      - Считать int? числом со значением по умолчанию.
    follow_ups:
      - Чем ?? отличается от ?.
      - Где именно проверяют входные данные на null?

  - slug: cs_string_equality_basics
    specializations: [backend_csharp]
    topic: language
    subtopic: equality
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 4
    type: single_choice
    title: "Как сравнить содержимое двух строк в C#?"
    options:
      - code: a
        text: "Только через ReferenceEquals"
      - code: b
        text: "Через == или Equals: для string оператор == сравнивает именно содержимое"
        is_correct: true
      - code: c
        text: "Через оператор ===, как в JavaScript"
      - code: d
        text: "Через CompareTo, потому что Equals для строк не переопределён"
    answer_short: >-
      Через `==` или `Equals` — для `string` оператор переопределён и сравнивает
      содержимое. Это отличает C# от Java, где `==` у строк сравнивает ссылки.
    answer_detailed: |
      ```csharp
      var a = "hello";
      var b = new string("hello".ToCharArray());

      a == b;                   // true — сравнивается содержимое
      ReferenceEquals(a, b);    // false — объекты разные
      ```

      Что важно помнить:

      - для собственных классов `==` по умолчанию сравнивает ссылки, а не
        содержимое. Чтобы сравнение шло по значению, переопределяют `Equals` и
        `GetHashCode`, а часто просто берут `record`;
      - сравнение без учёта регистра делают явно:
        `string.Equals(a, b, StringComparison.OrdinalIgnoreCase)`. Сравнение с
        учётом культуры для внутренних идентификаторов не подходит: результат
        зависит от языковых настроек;
      - пустую строку проверяют через `string.IsNullOrWhiteSpace`, а не
        сравнением с `""`.

      Строки неизменяемы: любая операция создаёт новую строку. Поэтому склейку в
      цикле делают через `StringBuilder`.
    common_mistakes:
      - Ожидать от == сравнения по значению для собственных классов.
      - Сравнивать идентификаторы с учётом культуры.
      - Склеивать строки в цикле через +=.
    follow_ups:
      - Почему для собственного класса == сравнивает ссылки?
      - Когда берут StringBuilder?

  - slug: cs_collections_choice_basics
    specializations: [backend_csharp]
    topic: language
    subtopic: generics
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Как выбрать между List, Dictionary и HashSet?"
    answer_short: >-
      `List<T>` — упорядоченный список с доступом по индексу. `Dictionary<K,V>` —
      быстрый поиск по ключу. `HashSet<T>` — набор уникальных значений с быстрой
      проверкой наличия. Выбор определяет, какая операция будет частой.
    answer_detailed: |
      ```csharp
      var orders = new List<Order>();                  // порядок, обход, индекс
      var byId   = new Dictionary<long, Order>();      // поиск по ключу
      var seen   = new HashSet<string>();              // уникальность и Contains
      ```

      Самая частая ошибка новичка — `list.Contains(x)` внутри цикла. Проверка у
      списка проходит по всем элементам, у множества и словаря — почти
      мгновенная. На тысяче элементов разница уже заметна, на десятках тысяч —
      катастрофична.

      Что ещё стоит знать сразу:

      - обращение к несуществующему ключу словаря бросает исключение; безопасный
        вариант — `TryGetValue`;
      - для ключей и элементов множества важны `Equals` и `GetHashCode`. У
        `record` они генерируются, у обычного класса — нет;
      - если размер известен заранее, его передают в конструктор: это избавляет
        от нескольких перевыделений.

      Для возврата наружу обычно указывают интерфейс (`IReadOnlyList<T>`), а не
      конкретный тип: вызывающий код не должен менять вашу коллекцию.
    common_mistakes:
      - Искать элемент через Contains у списка в цикле.
      - Обращаться к словарю по ключу без TryGetValue.
      - Возвращать наружу изменяемый List вместо интерфейса только для чтения.
    follow_ups:
      - Что нужно типу, чтобы корректно работать ключом словаря?
      - Почему наружу отдают IReadOnlyList?

  - slug: cs_exceptions_basics
    specializations: [backend_csharp]
    topic: language
    subtopic: exceptions
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как устроен try-catch-finally и зачем нужен using?"
    answer_short: >-
      `try` содержит код, который может бросить исключение, `catch` ловит
      конкретный тип, `finally` выполняется всегда. `using` освобождает ресурс
      при выходе из области видимости — это тот же `finally`, но короче и
      надёжнее.
    answer_detailed: |
      ```csharp
      using var connection = new NpgsqlConnection(connectionString);
      try
      {
          return await ReadAsync(connection);
      }
      catch (PostgresException ex)
      {
          throw new StorageException($"не смог прочитать заказ {id}", ex);
      }
      ```

      Правила, которые проверяют:

      - ловят конкретный тип, а не `Exception`. Широкий перехват проглотит и
        ошибку в коде рядом;
      - исходное исключение передают внутрь нового. Иначе теряется причина;
      - при повторном выбросе пишут `throw;`, а не `throw ex;` — второй вариант
        обнуляет стек вызовов, и место возникновения ошибки исчезает;
      - пустой `catch` — почти всегда дефект.

      `using` работает с любым типом, реализующим `IDisposable`, и вызывает
      `Dispose` даже при исключении. Соединения, файлы, потоки освобождают
      только так.

      Исключения не используют для управления обычным ходом программы: они
      дороги и запутывают чтение. «Пользователь не найден» — это результат, а не
      исключительная ситуация.
    common_mistakes:
      - Писать throw ex вместо throw и терять стек.
      - Ловить Exception вместо конкретного типа.
      - Использовать исключения для обычных ветвлений логики.
    follow_ups:
      - Чем throw; отличается от throw ex;?
      - Что произойдёт с ресурсом, если внутри using случится исключение?

  - slug: cs_properties_and_records
    specializations: [backend_csharp]
    topic: language
    subtopic: records
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Чем свойство отличается от поля и что даёт record?"
    answer_short: >-
      Поле хранит данные, свойство — пара методов доступа с синтаксисом поля:
      его можно сделать только для чтения, добавить проверку, реализовать в
      интерфейсе. `record` — класс со сравнением по значению и удобным
      копированием.
    answer_detailed: |
      ```csharp
      public class Order
      {
          public long Id { get; init; }          // задаётся только при создании
          public decimal Total { get; private set; }
      }

      public record Money(string Currency, decimal Amount);
      ```

      Почему публичных полей избегают: поле нельзя добавить в интерфейс, нельзя
      перехватить установку, и его изменение — двоичная несовместимость для
      библиотеки. Свойство с автоматической реализацией стоит столько же, а
      руки не связывает.

      `init` вместо `set` даёт объект, который нельзя изменить после создания.
      Неизменяемые объекты безопасны в многопоточной среде и не преподносят
      сюрпризов при передаче.

      `record` добавляет сравнение по значению, генерируемый `GetHashCode`,
      понятный `ToString` и копирование с изменением через `with`. Для объектов
      значений — денег, координат, идентификаторов — это ровно то, что нужно.

      Для сущностей с изменяемым состоянием и собственным поведением
      по-прежнему берут обычный класс.
    common_mistakes:
      - Выставлять публичные поля вместо свойств.
      - Делать все свойства с открытым set без необходимости.
      - Использовать record для сущности с изменяемым состоянием.
    follow_ups:
      - Чем init отличается от set?
      - Для чего record не подходит?

  - slug: cs_async_await_basics
    specializations: [backend_csharp]
    topic: async
    subtopic: async_await
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что делает await и почему асинхронность повышает пропускную способность?"
    answer_short: >-
      `await` освобождает поток на время ожидания и возвращает управление, а
      продолжение выполняется, когда операция завершится. Поток не простаивает
      в ожидании сети или диска, и тем же числом потоков сервис обслуживает
      больше запросов.
    answer_detailed: |
      ```csharp
      public async Task<Order> GetAsync(long id)
      {
          var order = await _repository.FindAsync(id);   // поток свободен на время ожидания
          return order;
      }
      ```

      Ключевое, что проверяют на этом уровне: асинхронность не делает операцию
      быстрее. Один запрос к базе занимает столько же. Выигрыш в том, что поток
      не заблокирован и обслуживает другие запросы.

      Отсюда правило: если внутри нет ожидания ввода-вывода, метод не должен
      быть асинхронным. Асинхронность вокруг расчёта в памяти только добавляет
      накладные расходы.

      Две вещи, о которых спрашивают следом:

      - `async void` допустим только для обработчиков событий: исключение из
        такого метода перехватить нечем, и оно роняет процесс;
      - `.Result` и `.Wait()` в веб-приложении приводят к взаимной блокировке
        или к исчерпанию пула потоков. Асинхронность проводят по всей цепочке
        вызовов, а не обрывают посередине.
    common_mistakes:
      - Вызывать .Result или .Wait() вместо await.
      - Делать async методы, внутри которых нет ожидания ввода-вывода.
      - Использовать async void вне обработчиков событий.
    follow_ups:
      - Почему .Result опасен в веб-приложении?
      - Ускоряет ли await саму операцию?

  - slug: cs_task_vs_thread_basics
    specializations: [backend_csharp]
    topic: async
    subtopic: parallel
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Чем Task отличается от Thread и когда нужен реальный параллелизм?"
    answer_short: >-
      `Thread` — поток операционной системы, дорогой ресурс. `Task` — единица
      работы, которую выполняет пул потоков; для ожидания ввода-вывода поток
      вообще не занимается. Отдельные потоки нужны для расчётов, а не ожидания.
    answer_detailed: |
      ```csharp
      var results = await Task.WhenAll(ids.Select(FetchAsync));   // параллельные запросы
      Parallel.ForEach(items, Process);                            // параллельные расчёты
      ```

      Разделение простое:

      - **ожидание** — сеть, диск, база. Здесь нужна асинхронность: поток
        освобождается, дополнительных потоков не требуется;
      - **расчёт** — обработка данных, преобразования. Здесь нужен параллелизм:
        работа раскладывается по ядрам.

      Путаница между этими случаями — самая частая ошибка. Обернуть обращение к
      базе в `Task.Run` не даёт ничего: поток всё равно будет ждать, только
      теперь чужой.

      Создавать `new Thread` в серверном приложении почти никогда не нужно: пул
      потоков управляет их количеством, а свои потоки конкурируют с ним за
      процессор.

      Для параллельных запросов берут `Task.WhenAll`, но помнят про нагрузку на
      получателя: сто одновременных обращений к чужому сервису — это отказ в
      обслуживании, устроенный себе.
    common_mistakes:
      - Оборачивать асинхронный ввод-вывод в Task.Run.
      - Создавать собственные потоки в серверном приложении.
      - Запускать WhenAll без ограничения на число одновременных обращений.
    follow_ups:
      - Что даст Task.Run вокруг запроса к базе?
      - Как ограничить число одновременных запросов в WhenAll?

  - slug: cs_gc_and_memory_basics
    specializations: [backend_csharp]
    topic: dotnet
    subtopic: gc
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Как работает сборщик мусора в .NET и что такое утечка памяти в управляемой среде?"
    answer_short: >-
      Сборщик освобождает объекты, до которых больше нельзя добраться по
      ссылкам. Утечка здесь — не «забыли освободить», а «случайно держим
      ссылку»: статическая коллекция, неотписанное событие, кеш без ограничения.
    answer_detailed: |
      Сборка идёт по поколениям: новые объекты живут в нулевом, пережившие
      сборку переходят дальше. Это опирается на наблюдение, что большинство
      объектов умирает молодыми, и делает частые сборки дешёвыми.

      Что важно на практике:

      - `Dispose` и сборщик решают разные задачи. Сборщик — про память,
        `Dispose` — про внешние ресурсы: файлы, соединения, сокеты. Их сборщик
        не освобождает вовремя;
      - вызывать `GC.Collect()` вручную не нужно: почти всегда это попытка
        лечить симптом, и обычно она делает хуже;
      - крупные объекты попадают в отдельную кучу, которая уплотняется редко.
        Частое создание больших массивов приводит к фрагментации.

      Типичные источники удержания ссылок: статический словарь-кеш, в который
      только добавляют; подписка на событие долгоживущего объекта без отписки;
      захват объекта в лямбде, живущей дольше, чем ожидалось.

      Диагностируют это не рассуждениями, а снимком памяти: смотрят, какие типы
      занимают место и кто их держит.
    common_mistakes:
      - Считать, что сборщик освобождает файлы и соединения.
      - Вызывать GC.Collect для решения проблем с памятью.
      - Складывать в статический кеш без ограничения размера.
    follow_ups:
      - Зачем нужен Dispose, если есть сборщик мусора?
      - Как обычно находят удерживаемые ссылки?

  - slug: cs_idisposable_using_basics
    specializations: [backend_csharp]
    topic: dotnet
    subtopic: disposable
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: single_choice
    title: "Что произойдёт с соединением, если не обернуть его в using?"
    options:
      - code: a
        text: "Ничего: сборщик мусора освободит его сразу после выхода из метода"
      - code: b
        text: "Внешний ресурс останется занятым до неопределённого момента, и пул соединений может исчерпаться"
        is_correct: true
      - code: c
        text: "Компилятор не позволит создать такой объект без using"
      - code: d
        text: "Соединение закроется, но с задержкой ровно в одну секунду"
    answer_short: >-
      Соединение останется занятым: сборщик мусора освобождает память, а не
      внешние ресурсы, и момент сборки не определён. Под нагрузкой пул
      соединений заканчивается, и сервис встаёт целиком.
    answer_detailed: |
      ```csharp
      await using var connection = dataSource.CreateConnection();
      // Dispose вызовется при выходе из области видимости, в том числе при исключении
      ```

      `IDisposable` — договорённость: «у объекта есть внешний ресурс, освободи
      его явно». `using` вызывает `Dispose` при любом выходе из блока, включая
      исключение, и потому надёжнее ручного вызова в `finally`.

      Что попадает под это правило: соединения с базой, файловые потоки, сокеты,
      таймеры, объекты синхронизации.

      Отдельный случай — `HttpClient`. Его как раз не создают на каждый запрос:
      частое создание и освобождение исчерпывает сокеты. Для него используют
      фабрику, которая переиспользует соединения.

      Если ваш класс хранит поле с `IDisposable`, он тоже становится
      `IDisposable`: ответственность за освобождение передаётся вверх по цепочке
      владения.
    common_mistakes:
      - Полагаться на сборщик мусора в освобождении соединений.
      - Создавать HttpClient на каждый запрос.
      - Хранить IDisposable в поле и не реализовать Dispose у своего класса.
    follow_ups:
      - Почему HttpClient — исключение из правила?
      - Что делать, если ваш класс хранит поле с IDisposable?

  - slug: cs_di_lifetimes_basics
    specializations: [backend_csharp]
    topic: aspnet
    subtopic: di_lifetime
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Какие бывают времена жизни зависимостей в ASP.NET Core и как выбрать?"
    answer_short: >-
      `Transient` — новый экземпляр на каждое обращение, `Scoped` — один на
      запрос, `Singleton` — один на всё приложение. Сервисы без состояния —
      singleton, всё, что связано с запросом или с DbContext, — scoped.
    answer_detailed: |
      ```csharp
      builder.Services.AddScoped<IOrderRepository, OrderRepository>();
      builder.Services.AddSingleton<IClock, SystemClock>();
      ```

      Правило выбора простое: время жизни определяется состоянием. Нет
      состояния — singleton. Состояние живёт ровно один запрос — scoped.
      Дешёвый объект с внутренним состоянием — transient.

      Главная ловушка, о которой спрашивают почти всегда: singleton не может
      зависеть от scoped. Иначе объект запроса «застрянет» внутри singleton и
      будет переиспользоваться следующими запросами. Для `DbContext` это
      означает и утечку данных между пользователями, и ошибки многопоточности.

      Контейнер такое ловит при проверке области видимости, но только если она
      включена — в среде разработки она включена по умолчанию.

      Регистрируют интерфейс, а не конкретный класс: иначе в тестах подменить
      реализацию нечем, и весь смысл контейнера теряется.
    common_mistakes:
      - Внедрять scoped-зависимость в singleton.
      - Делать DbContext синглтоном ради «экономии».
      - Регистрировать конкретный класс вместо интерфейса.
    follow_ups:
      - Что произойдёт, если DbContext окажется внутри singleton?
      - Какое время жизни выбрать для сервиса без состояния?

  - slug: cs_configuration_basics
    specializations: [backend_csharp]
    topic: aspnet
    subtopic: configuration
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 4
    type: open_answer
    title: "Откуда приложение на ASP.NET Core берёт настройки и где хранят строку подключения?"
    answer_short: >-
      Из нескольких источников с приоритетом: `appsettings.json`, файл профиля,
      переменные окружения, аргументы командной строки — каждый следующий
      перекрывает предыдущий. Пароли и строки подключения хранят в окружении, а
      не в файле репозитория.
    answer_detailed: |
      ```csharp
      builder.Services.Configure<StorageOptions>(
          builder.Configuration.GetSection("Storage"));
      ```

      Настройки читают не по строковым ключам по всему коду, а один раз — в
      типизированный класс. Тогда опечатка в имени ключа обнаруживается на
      старте, а не в момент обращения.

      Порядок источников важен: одна и та же сборка запускается в любой среде,
      отличаются только значения. Разводить поведение по средам через условия в
      коде — плохая идея: боевая ветка окажется непроверенной.

      Секреты: в разработке — механизм пользовательских секретов, вне
      репозитория; в бою — переменные окружения или хранилище секретов. В
      `appsettings.json` кладут только безопасные значения.

      Обязательную настройку проверяют на старте и падают, если её нет. Тихое
      значение по умолчанию для строки подключения приводит к тому, что сервис
      поднимается и работает не с той базой.
    common_mistakes:
      - Хранить строку подключения с паролем в appsettings.json.
      - Читать настройки строковыми ключами по всему коду.
      - Разводить логику по средам условиями в коде.
    follow_ups:
      - Что перекрывает значение из appsettings.json?
      - Почему приложение должно падать при отсутствии обязательной настройки?
  - slug: cs_sql_query_basics
    specializations: [backend_csharp]
    topic: db
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Из чего состоит запрос на выборку и зачем нужен индекс?"
    answer_short: >-
      `SELECT` перечисляет колонки, `FROM` — таблицу, `WHERE` отбирает строки,
      `JOIN` соединяет таблицы, `ORDER BY` сортирует. Индекс — структура,
      позволяющая найти нужные строки, не читая таблицу целиком.
    answer_detailed: |
      ```sql
      SELECT o.Id, u.Email
      FROM Orders o
      JOIN Users u ON u.Id = o.UserId
      WHERE o.Status = 'Paid'
      ORDER BY o.CreatedAt DESC;
      ```

      Без индекса база читает всю таблицу. На тысяче строк это незаметно, на
      миллионе — секунды на каждый запрос. Индекс по колонке из `WHERE`
      превращает такой запрос в чтение небольшого куска данных.

      Плата: каждый индекс занимает место и замедляет вставку и обновление — его
      нужно поддерживать при каждой записи. Поэтому индексы ставят по реальным
      запросам, а не на все колонки подряд.

      Что стоит знать сразу: `LEFT JOIN` оставляет строки левой таблицы даже без
      пары справа; `GROUP BY` собирает строки в группы для агрегатов;
      `SELECT *` в коде приложения не пишут — добавили колонку, и запрос стал
      тянуть лишнее.

      Даже при работе через EF Core стоит уметь прочитать сгенерированный SQL:
      без этого причины медленной страницы не найти.
    common_mistakes:
      - Ставить индексы на все колонки подряд.
      - Писать SELECT * в коде приложения.
      - Не смотреть на SQL, который сгенерировал ORM.
    follow_ups:
      - Почему индексы замедляют запись?
      - Чем LEFT JOIN отличается от обычного?

  - slug: cs_ef_core_basics
    specializations: [backend_csharp]
    topic: db
    subtopic: ef_tracking
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что такое DbContext и как через него сохраняют изменения?"
    answer_short: >-
      `DbContext` — единица работы: он отслеживает загруженные сущности,
      накапливает изменения и записывает их одним `SaveChangesAsync` в одной
      транзакции. Живёт он ровно один запрос, не дольше.
    answer_detailed: |
      ```csharp
      var order = await db.Orders.FirstOrDefaultAsync(o => o.Id == id);
      order.Status = OrderStatus.Paid;      // явного Update не требуется
      await db.SaveChangesAsync();
      ```

      Отслеживание изменений и означает, что вызывать `Update` не нужно: контекст
      сам видит, что свойство изменилось. Для чтения без последующей записи
      отслеживание отключают через `AsNoTracking` — это заметно дешевле.

      Почему контекст не делают долгоживущим: он накапливает загруженные
      сущности и не рассчитан на одновременное использование из нескольких
      потоков. В ASP.NET Core его регистрируют как `Scoped` — один на запрос.

      Главная ловушка на старте — запрос на каждую связанную сущность в цикле.
      Обращение к навигационному свойству внутри обхода превращает один запрос в
      сотню. Связь загружают заранее через `Include` или проекцию в нужный
      объект.

      Схему меняют миграциями, а не правкой базы руками: иначе состояние базы у
      каждого своё.
    common_mistakes:
      - Делать DbContext синглтоном или использовать из нескольких потоков.
      - Обращаться к навигационным свойствам в цикле.
      - Менять схему базы руками вместо миграции.
    follow_ups:
      - Зачем нужен AsNoTracking?
      - Как загрузить связанные сущности одним запросом?

  - slug: cs_controller_basics
    specializations: [backend_csharp]
    topic: web
    subtopic: rest_design
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как устроен контроллер в ASP.NET Core и почему сущность не отдают наружу?"
    answer_short: >-
      Контроллер принимает запрос, вызывает сервис и возвращает результат.
      Сущность базы наружу не отдают: она тянет связи, раскрывает внутренние
      поля, а изменение схемы становится изменением публичного контракта.
    answer_detailed: |
      ```csharp
      [ApiController]
      [Route("api/v1/orders")]
      public class OrdersController(IOrderService service) : ControllerBase
      {
          [HttpGet("{id:long}")]
          public async Task<ActionResult<OrderResponse>> Get(long id)
              => await service.FindAsync(id) is { } order
                  ? Ok(OrderResponse.From(order))
                  : NotFound();
      }
      ```

      Отдельный класс ответа решает сразу три задачи: наружу не утекают поля
      вроде хеша пароля, сериализация не тянет ленивые связи, а переименование
      колонки не ломает клиентов.

      Бизнес-логике в контроллере не место. Его работа — разобрать запрос,
      позвать сервис, выбрать код ответа. Как только внутри появляются правила
      предметной области, проверить их можно только через HTTP, и тесты
      становятся медленными.

      Атрибут `[ApiController]` включает автоматическую проверку модели: при
      нарушении правил валидации возвращается 400 с описанием полей, и писать
      это руками не нужно.

      Маршруты именуют по ресурсам во множественном числе, действие выражают
      методом HTTP, а не словом в адресе.
    common_mistakes:
      - Возвращать сущность EF прямо из контроллера.
      - Держать бизнес-логику в контроллере.
      - Кодировать действие словом в адресе вместо метода HTTP.
    follow_ups:
      - Что даёт атрибут ApiController?
      - Почему тесты бизнес-логики через HTTP медленные?

  - slug: cs_status_codes_validation
    specializations: [backend_csharp]
    topic: web
    subtopic: validation
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: single_choice
    title: "Запрос пришёл без обязательного поля. Какой код ответа вернуть?"
    options:
      - code: a
        text: "200 с описанием ошибки в теле"
      - code: b
        text: "400 — запрос не прошёл проверку, ошибка на стороне клиента"
        is_correct: true
      - code: c
        text: "500 — сервер не смог обработать запрос"
      - code: d
        text: "204 — раз данных нет, возвращать нечего"
    answer_short: >-
      400. Это ошибка клиента: запрос не прошёл проверку. Код 500 означал бы
      поломку на нашей стороне и поднял бы дежурных, а 200 с ошибкой в теле
      клиенты и промежуточные узлы сочтут успехом.
    answer_detailed: |
      ```csharp
      public record CreateOrderRequest(
          [Required, EmailAddress] string CustomerEmail,
          [Range(1, 100)] int Quantity);
      ```

      С атрибутом `[ApiController]` нарушение правил само превращается в 400 с
      перечнем полей в стандартном формате. Клиенту важно знать не «что-то не
      так», а какое именно поле не прошло.

      Что различают внутри 4xx: 400 — запрос не разобрали или он не прошёл
      проверку; 401 — непонятно, кто вы; 403 — понятно, но нельзя; 404 — ресурса
      нет; 409 — конфликт с текущим состоянием.

      Почему это важнее, чем кажется: по кодам ответа работает вся автоматика —
      повторные попытки, оповещения, графики доступности. Сервис, отвечающий 200
      на ошибки, на всех панелях выглядит здоровым.

      Проверку входных данных делают на границе. Дальше внутрь идут уже
      проверенные значения, и сервисный слой не обвешан условиями «а вдруг
      пусто».
    common_mistakes:
      - Возвращать 200 с признаком ошибки в теле.
      - Отдавать 500 на неверные входные данные.
      - Проверять входные данные в глубине сервисного слоя.
    follow_ups:
      - Чем 400 отличается от 409?
      - Почему проверку делают на границе приложения?

  - slug: cs_layers_basics
    specializations: [backend_csharp]
    topic: architecture
    subtopic: layered_architecture
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Зачем приложение делят на контроллер, сервис и репозиторий?"
    answer_short: >-
      Чтобы разделить ответственность: контроллер отвечает за протокол, сервис —
      за бизнес-правила, репозиторий — за доступ к данным. Зависимости идут
      сверху вниз, и правила можно проверять без HTTP и без базы.
    answer_detailed: |
      ```
      Controller → Service → Repository → БД
      ```

      Что это даёт на практике: сервис проверяется обычным тестом с подставленным
      репозиторием, без поднятия приложения. Такие тесты выполняются за
      миллисекунды, поэтому их действительно запускают.

      Правила, за которые обычно и спрашивают:

      - контроллер не обращается к репозиторию напрямую;
      - репозиторий ничего не знает про HTTP и не возвращает веб-результатов;
      - сущность базы не путешествует в контроллер — там отдельный объект
        ответа.

      Слои — инструмент, а не догма. Для операции «отдать справочник» пустой
      сервис-прослойка иногда действительно лишний, и это честно признают. Но
      как только появляется бизнес-правило, ему нужно предсказуемое место.

      В .NET к этому же относится вопрос про зависимости между проектами:
      проект с бизнес-логикой не должен ссылаться на веб-проект, иначе слои
      существуют только на словах.
    common_mistakes:
      - Обращаться к репозиторию прямо из контроллера.
      - Ссылаться из проекта с логикой на веб-проект.
      - Создавать пустые прослойки ради формального соблюдения слоёв.
    follow_ups:
      - Куда попадёт бизнес-правило, если сервиса нет?
      - Как проверить, что слои существуют не только на словах?

  - slug: cs_srp_basics
    specializations: [backend_csharp]
    topic: architecture
    subtopic: solid
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое принцип единственной ответственности и как понять, что он нарушен?"
    answer_short: >-
      У класса должна быть одна причина для изменения. Признак нарушения:
      описание класса требует союза «и» — «считает скидку и отправляет письмо», —
      и правки по разным причинам приходят в один и тот же файл.
    answer_detailed: |
      Практические признаки, что класс делает слишком много:

      - имя содержит `Manager`, `Helper`, `Utils` — честное имя придумать не
        удалось;
      - чтобы проверить одно правило, в тесте приходится подставлять пять
        зависимостей;
      - каждая задача спринта задевает этот файл, и правки конфликтуют.

      ```csharp
      // одна причина меняться — правила скидок
      public sealed class DiscountCalculator { ... }

      // другая — способ уведомления
      public sealed class OrderNotifier { ... }
      ```

      Обратная крайность реальна не меньше: класс на один метод, вызываемый из
      единственного места, добавляет уровень косвенности и ничего не упрощает.
      Принцип говорит о причинах изменения, а не о числе строк.

      Тот же критерий применим к методу: если внутри читается «сначала одно,
      потом совсем другое», это обычно два метода.
    common_mistakes:
      - Понимать принцип как «класс должен быть маленьким».
      - Заводить Utils и складывать туда всё подряд.
      - Дробить на классы по одному методу ради формы.
    follow_ups:
      - Почему имя Manager — признак проблемы?
      - Чем плохо дробление на классы по одному методу?

  - slug: cs_cache_basics
    specializations: [backend_csharp]
    topic: system_design
    subtopic: caching
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое кеш и какую проблему он создаёт вместе с той, что решает?"
    answer_short: >-
      Хранилище готового результата, чтобы не считать его заново. Решает
      проблему скорости и нагрузки, создаёт проблему устаревших данных: где-то
      лежит копия, и она может разойтись с источником.
    answer_detailed: |
      Кеш уместен, когда данные читают часто, а меняют редко, и небольшое
      отставание допустимо: справочники, настройки, профили. Он не подходит там,
      где нужна точность прямо сейчас, — остаток на счёте, число свободных мест.

      Главный вопрос при добавлении — не «как положить», а «когда убрать». Два
      подхода: время жизни (проще, данные устаревают предсказуемо) и удаление при
      изменении (точнее, но нужно не забыть ни одного места записи).

      Важная деталь для .NET: `IMemoryCache` живёт в памяти процесса. При
      нескольких экземплярах у каждого будет своя версия данных, и пользователь
      начнёт видеть разное в зависимости от того, куда попал запрос. Для
      нескольких экземпляров берут распределённый кеш.

      И кеш не лечит плохой запрос: сначала чинят запрос и индексы, потом думают
      про кеш. Иначе под кешем остаётся мина, которая сработает при его сбросе.
    common_mistakes:
      - Кешировать данные, требующие точности прямо сейчас.
      - Использовать кеш в памяти при нескольких экземплярах сервиса.
      - Прятать под кешем медленный запрос вместо его исправления.
    follow_ups:
      - Что произойдёт при сбросе кеша, если под ним медленный запрос?
      - Чем время жизни отличается от удаления по событию?

  - slug: cs_scaling_stateless_basics
    specializations: [backend_csharp]
    topic: system_design
    subtopic: scaling
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что значит «сервис без состояния» и почему это условие масштабирования?"
    answer_short: >-
      Экземпляр не хранит между запросами ничего, что понадобится следующему
      запросу. Тогда запросы можно раздавать любому экземпляру, а сами
      экземпляры добавлять и убирать. Состояние выносят в базу или общий кеш.
    answer_detailed: |
      Что ломается при состоянии в памяти: сессия в статическом словаре, счётчик
      в поле синглтона, файл, записанный на локальный диск. Запустили второй
      экземпляр — половина запросов не находит своих данных.

      Отсюда правило: между запросами в памяти экземпляра ничего не хранят.

      Различают два способа роста: вертикальный — увеличить машину, просто и
      упирается в потолок; горизонтальный — добавить экземпляры, требует
      отсутствия состояния и даёт заодно устойчивость к падению одного из них.

      Отдельная ловушка в .NET — фоновые службы. Код, который в одном экземпляре
      выполнялся раз в минуту, в трёх экземплярах начнёт выполняться трижды.
      Нужна распределённая блокировка или выделенный исполнитель.

      И порядок действий: прежде чем добавлять экземпляры, смотрят, где
      действительно уходит время. Три копии медленного запроса дают три
      медленных запроса.
    common_mistakes:
      - Хранить сессию или счётчик в памяти экземпляра.
      - Запускать фоновые службы на всех экземплярах без блокировки.
      - Масштабировать вширь, не разобравшись, где узкое место.
    follow_ups:
      - Что произойдёт с фоновой службой при трёх экземплярах?
      - Куда переезжает узкое место после горизонтального масштабирования?

  - slug: cs_unit_test_basics
    specializations: [backend_csharp]
    topic: testing
    subtopic: unit
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как выглядит юнит-тест и что в нём стоит проверять?"
    answer_short: >-
      Метод с атрибутом теста: подготовили данные, выполнили действие, проверили
      результат. Проверяют поведение, а не реализацию: расчёты, границы,
      обработку ошибок, а не то, какие методы внутри вызвались.
    answer_detailed: |
      ```csharp
      [Fact]
      public void AppliesDiscountToTotal()
      {
          var order = new Order([100m, 200m]);

          var total = order.TotalWithDiscount(10);

          Assert.Equal(270m, total);
      }
      ```

      Структура «подготовили — выполнили — проверили» видна по пустым строкам,
      комментарии здесь не нужны.

      Имя теста описывает поведение, а не метод: `AppliesDiscountToTotal`
      понятнее, чем `TestTotal1`. По списку упавших тестов сразу видно, что
      именно сломалось.

      Что проверять в первую очередь — не то, что легко, а то, что легко
      сломать: расчёты, граничные значения, поведение при пустых данных и
      ошибках. Тест на свойство-обёртку не даёт ничего.

      Для набора однотипных случаев берут параметризованный тест: одна логика,
      разные входные данные, вместо десяти похожих методов.

      И привычка: получив ошибку от пользователя, сначала пишут тест, который её
      воспроизводит, и только потом чинят.
    common_mistakes:
      - Называть тесты Test1, Test2.
      - Проверять свойства-обёртки вместо расчётов и границ.
      - Копировать один и тот же тест вместо параметризованного.
    follow_ups:
      - Почему тест на ошибку пишут до исправления?
      - Когда берут параметризованный тест?

  - slug: cs_soft_asking_for_help
    specializations: [backend_csharp]
    topic: soft
    subtopic: teamwork
    min_grade: intern
    peak_grade: junior
    max_grade: middle
    frequency: 4
    type: open_answer
    title: "Вы застряли на задаче. Через сколько времени и как правильно просить помощи?"
    answer_short: >-
      Обычная договорённость — от получаса до часа самостоятельных попыток,
      дальше спрашивать. Просьба содержит задачу, что уже пробовали и что
      получилось, а не «у меня не работает».
    answer_detailed: |
      ### Junior
      Молчать полдня хуже, чем спросить через час: команда теряет день, а не вы
      сохраняете лицо.

      Форма вопроса решает многое:

      > Поднимаю приложение, падает на разрешении зависимости с сообщением про
      > время жизни. Проверил регистрацию, она есть; пробовал сменить на
      > transient — заработало, но не понимаю почему. Вот регистрация и стек.
      > Куда смотреть?

      Это отвечается за минуту. «Помогите, не работает» требует пяти уточняющих
      вопросов, и каждый — отдельное переключение для того, кто помогает.

      ### Middle
      Ждут, что вы сами оцениваете цену молчания: задача на день и задача на
      спринт допускают разное время самостоятельных попыток. Полезная привычка —
      записывать, что уже проверено: половина проблем решается по дороге, пока
      формулируешь.

      ### Senior
      Ждут обратной стороны: умения принимать такие вопросы и не отбивать охоту
      их задавать. Ответ «сам разберись» экономит десять минут и стоит команде
      дня.

      Сильная версия включает системный вывод: если люди регулярно застревают в
      одном месте, дело не в людях, а в отсутствии документации или в запутанном
      коде.
    common_mistakes:
      - Молчать полдня, боясь показаться некомпетентным.
      - Спрашивать без описания того, что уже пробовали.
      - Отвечать новичкам так, что спрашивать перестают.
    follow_ups:
      - Что должно быть в хорошо сформулированном вопросе?
      - Что делать, если люди регулярно застревают на одном месте?
  # Вопросы, которые задают и джуну, и сеньору — разница в глубине ответа.

  - slug: cs_async_pitfalls_practice
    specializations: [backend_csharp]
    topic: async
    subtopic: deadlocks
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Какие ошибки чаще всего допускают с async/await и к чему они приводят?"
    answer_short: >-
      Синхронное ожидание асинхронного кода, обрыв асинхронности посередине
      цепочки, `async void`, отсутствие токена отмены. Итог — исчерпанный пул
      потоков, зависшие запросы и падения, которые нечем перехватить.
    answer_detailed: |
      ### Junior
      Главное — не смешивать синхронное и асинхронное. `.Result` и `.Wait()`
      блокируют поток, который в этот момент нужен для продолжения работы: под
      нагрузкой пул исчерпывается, и приложение перестаёт отвечать целиком.

      `async void` перехватить нечем: исключение из такого метода не попадает в
      вызывающий код и роняет процесс. Допустим он только в обработчиках
      событий.

      ### Middle
      Ждут понимания цепочки: асинхронность проводят от контроллера до драйвера
      базы. Один синхронный вызов посередине сводит на нет весь выигрыш.

      Здесь же — токен отмены. Клиент закрыл соединение, а сервис продолжает
      считать и держать соединение с базой. Токен передают сквозь все слои и
      действительно проверяют, а не принимают параметром для вида.

      И про `Task.Run` в веб-приложении: он не добавляет мощности, а забирает
      поток из того же пула. Оборачивать в него обращение к базе бессмысленно.

      ### Senior
      Ждут разговора о наблюдаемых последствиях: как исчерпание пула выглядит на
      графиках — время ответа растёт ступенькой, загрузка процессора при этом
      низкая. Это характерная картина, по которой такую проблему узнают.

      Сильный ответ включает `ConfigureAwait(false)` в библиотечном коде и
      понимание, почему в ASP.NET Core он уже не так критичен, как в старом
      фреймворке. И запуск фоновой работы: «выстрелил и забыл» без учёта
      исключений и остановки приложения теряет задачи при выкладке.
    common_mistakes:
      - Блокировать поток через .Result или .Wait().
      - Принимать токен отмены и не проверять его.
      - Запускать фоновую работу без обработки исключений и остановки.
    follow_ups:
      - Как выглядит исчерпание пула потоков на графиках?
      - Зачем передавать токен отмены сквозь все слои?

  - slug: cs_memory_allocations_practice
    specializations: [backend_csharp]
    topic: dotnet
    subtopic: memory
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Откуда в сервисе берутся лишние выделения памяти и когда это стоит чинить?"
    answer_short: >-
      Из склейки строк в циклах, промежуточных коллекций в цепочках LINQ,
      упаковки значимых типов, копирования буферов. Чинить стоит там, где это
      видно в измерениях, а не там, где кажется.
    answer_detailed: |
      ### Junior
      Базовые источники: `+=` для строк в цикле вместо `StringBuilder`,
      `ToList()` посреди цепочки, когда результат тут же обходится один раз,
      создание нового списка на каждой итерации.

      Правило на этом уровне простое: сначала понятный код, потом измерения.
      Оптимизация по догадке обычно попадает не туда.

      ### Middle
      Ждут понимания цены сборки мусора: частые выделения в нулевом поколении
      сами по себе дёшевы, проблема начинается, когда объекты доживают до
      старших поколений или попадают в кучу больших объектов.

      Здесь же — упаковка: значимый тип, положенный в `object` или в
      нетипизированную коллекцию, выделяется в куче. Дженерики этого избегают, и
      это одна из причин, зачем они появились.

      И измерения вместо ощущений: замер выделений в тестах производительности,
      счётчики сборок, снимок памяти под нагрузкой.

      ### Senior
      Ждут понимания, где эта работа окупается. В обычном веб-сервисе время
      уходит в базу и сеть, а не в выделения; экономия на них не даст ничего.
      В горячем пути обработки данных или в библиотеке — даст.

      Сильный ответ упоминает `Span<T>` и пулы буферов как инструменты именно
      для горячего пути и признаёт их цену: код становится сложнее и требует
      аккуратности со временем жизни данных. Применять их повсеместно — плохой
      обмен.
    common_mistakes:
      - Оптимизировать выделения без измерений.
      - Ставить ToList посреди цепочки без необходимости.
      - Тащить Span и пулы буферов в обычный код приложения.
    follow_ups:
      - Что такое упаковка и чем она дорога?
      - Где экономия на выделениях действительно окупается?

  - slug: cs_middleware_pipeline_practice
    specializations: [backend_csharp]
    topic: aspnet
    subtopic: middleware
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что такое конвейер обработки запроса и что в нём размещают?"
    answer_short: >-
      Цепочка компонентов, через которую проходит каждый запрос и ответ на
      обратном пути. В неё выносят сквозные задачи: журналирование,
      идентификатор запроса, обработку исключений, аутентификацию, сжатие.
    answer_detailed: |
      ### Junior
      Порядок регистрации и есть порядок выполнения. Компонент может обработать
      запрос, передать дальше и что-то сделать с ответом на обратном пути.

      Что обычно ставят первым: обработку исключений и идентификатор запроса —
      иначе ошибки, случившиеся ниже, останутся без единого формата и без следа
      в журнале.

      ### Middle
      Ждут понимания зависимостей в порядке: аутентификация должна идти до
      авторизации, а обе — до маршрутизации к конечной точке. Перестановка не
      вызывает ошибки, она просто тихо отключает проверку — и это находят
      далеко не сразу.

      Здесь же — что в конвейер не кладут. Бизнес-правила там прячутся от
      тестов и от чтения: найти, почему запрос ведёт себя странно, можно только
      обойдя всю цепочку.

      И время жизни: компонент конвейера создаётся один раз на приложение,
      поэтому зависимости уровня запроса в него внедряют через параметр метода,
      а не через конструктор.

      ### Senior
      Ждут взгляда на конвейер как на место, где решается наблюдаемость всего
      сервиса: сквозной идентификатор, отметка времени, единый формат ошибки —
      всё, что нужно для разбора инцидента, задаётся здесь один раз.

      Сильный ответ включает границу ответственности: часть сквозных задач
      дешевле решать до приложения — на обратном прокси или шлюзе. Сжатие,
      ограничение скорости и завершение TLS часто там и живут.
    common_mistakes:
      - Регистрировать аутентификацию после авторизации.
      - Прятать бизнес-правила в компонентах конвейера.
      - Внедрять зависимости уровня запроса через конструктор компонента.
    follow_ups:
      - Что случится, если поменять местами аутентификацию и авторизацию?
      - Какие сквозные задачи дешевле решать до приложения?

  - slug: cs_transactions_practice
    specializations: [backend_csharp]
    topic: db
    subtopic: transactions_isolation
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Где проходит граница транзакции и что нельзя делать внутри неё?"
    answer_short: >-
      Граница — бизнес-операция, обычно метод сервиса. Внутри транзакции не
      ходят в сеть и не ждут внешних ответов: соединение с базой удерживается
      всё время ожидания, и пул заканчивается.
    answer_detailed: |
      ### Junior
      Транзакция — набор операций, который выполняется целиком или не
      выполняется вовсе. В EF Core `SaveChangesAsync` уже оборачивает все
      накопленные изменения в одну транзакцию; явная нужна, когда операций
      несколько.

      Классический пример — списание и зачисление: они должны случиться вместе.

      ### Middle
      Ждут понимания, почему граница именно на сервисе: репозиторий не знает,
      частью какой операции он является.

      Здесь же — длина транзакции. Вызов чужого сервиса внутри открытой
      транзакции держит соединение всё время ожидания. Под нагрузкой пул
      соединений заканчивается, и встаёт весь сервис, а не только эта операция.

      И уровни изоляции: чем строже, тем меньше аномалий и больше блокировок.
      Нужно понимать, какие аномалии возможны на уровне по умолчанию — потерянные
      обновления при чтении, изменении и записи обратно.

      ### Senior
      Ждут разговора о конкурентном изменении. Два запроса читают одну строку,
      меняют и сохраняют — второй затирает первого. Решение — оптимистичная
      блокировка по версии строки: конфликт обнаруживается и обрабатывается, а
      не теряется молча.

      Сильный ответ включает распределённый случай: транзакция базы не покрывает
      вызов другого сервиса, и согласованность обеспечивают исходящим журналом,
      компенсацией или идемпотентным повтором. И что откат в базе не отменяет
      уже отправленное письмо.
    common_mistakes:
      - Обращаться к внешнему сервису внутри открытой транзакции.
      - Читать, менять и записывать без проверки версии.
      - Считать, что откат отменяет уже совершённые внешние действия.
    follow_ups:
      - Как обнаружить конкурентное изменение строки?
      - Почему длинная транзакция роняет сервис целиком?

  - slug: cs_api_versioning_contract
    specializations: [backend_csharp]
    topic: web
    subtopic: rest_design
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что считается ломающим изменением API и как выпускают новую версию?"
    answer_short: >-
      Ломает всё, на что клиент мог рассчитывать: удаление или переименование
      поля, сужение допустимых значений, изменение смысла кода ошибки. Добавление
      необязательного поля — не ломает. Версию выделяют, когда иначе нельзя.
    answer_detailed: |
      ### Junior
      Разделять добавление и изменение — первое, что проверяют. Новое поле в
      ответе безопасно: старый клиент его не заметит. Удаление поля, смена типа
      или обязательности — сломает.

      Версию обычно указывают в адресе (`/api/v1/...`) — это видно в журналах и
      просто отлаживается.

      ### Middle
      Ждут понимания, что версия — не бесплатно. Каждая живая версия требует
      поддержки, тестов и исправлений в двух местах. Поэтому сначала ищут
      способ обойтись без неё: необязательное поле, новый ресурс рядом,
      постепенный перевод клиентов.

      Здесь же — про порядок выкладки. Сервер должен уметь принимать и старый, и
      новый формат в момент перехода: клиенты обновляются не одновременно, а
      мобильные — вообще неделями.

      ### Senior
      Ждут разговора о жизненном цикле: как объявляют устаревание, сколько живёт
      старая версия, как узнают, что ею перестали пользоваться. Без измерений
      старую версию не выключают никогда — просто боятся.

      Сильный ответ включает, что контракт — это обязательство и за его пределами
      тоже: коды ошибок, формат идентификаторов, гарантии порядка. И что
      совместимость дешевле поддерживать, чем ломать, когда клиентов больше
      одного.
    common_mistakes:
      - Считать переименование поля безобидным изменением.
      - Заводить новую версию там, где хватило бы необязательного поля.
      - Выключать старую версию без измерения её использования.
    follow_ups:
      - Как понять, что старой версией больше не пользуются?
      - Почему сервер должен принимать оба формата в момент перехода?

  - slug: cs_dependency_direction_practice
    specializations: [backend_csharp]
    topic: architecture
    subtopic: patterns
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Почему бизнес-логика не должна зависеть от базы данных и как этого добиться?"
    answer_short: >-
      Чтобы правила можно было менять и проверять независимо от хранилища.
      Достигается тем, что интерфейс хранилища объявлен на стороне логики, а
      реализация лежит снаружи и подставляется контейнером.
    answer_detailed: |
      ### Junior
      Практически это выглядит так: проект с бизнес-логикой объявляет
      `IOrderRepository`, а проект с EF Core его реализует и ссылается на первый,
      а не наоборот.

      Проверить легко: если из проекта с логикой убрать ссылку на пакет базы, и
      он перестанет собираться — зависимость направлена не туда.

      ### Middle
      Ждут понимания выгоды: правила проверяются обычными тестами без базы, и
      смена хранилища не задевает логику. И понимания цены — появляется слой
      абстракции, который нужно поддерживать.

      Здесь же честность: для приложения, которое в основном читает и пишет
      таблицы, такая развязка часто оказывается лишней церемонией. Она окупается
      там, где правил действительно много.

      Отдельно про «репозиторий поверх EF»: сам `DbSet` уже репозиторий, и
      обёртка, повторяющая его методы, не даёт ничего, кроме лишнего файла.

      ### Senior
      Ждут разговора об утечке абстракции. Репозиторий, возвращающий
      `IQueryable`, не развязывает ничего: вызывающий код по-прежнему пишет
      запросы к базе, просто в другом файле. Настоящая граница возвращает
      готовые объекты предметной области.

      Сильный ответ включает выбор по контексту: где команда небольшая, а
      предметная область простая, прямой доступ к контексту из сервиса —
      осознанное и нормальное решение. Проблема начинается, когда его называют
      архитектурой, которой нет.
    common_mistakes:
      - Ссылаться из проекта с логикой на проект с базой.
      - Заворачивать DbSet в репозиторий, повторяющий его методы.
      - Возвращать IQueryable наружу и считать это развязкой.
    follow_ups:
      - Почему возврат IQueryable не развязывает слои?
      - Когда развязка с базой не окупается?

  - slug: cs_patterns_in_practice
    specializations: [backend_csharp]
    topic: architecture
    subtopic: patterns
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Какие паттерны вы применяли и где пожалели, что применили?"
    answer_short: >-
      Ценится не список из книги, а два-три примера из своего кода с задачей и
      результатом. Вторая часть вопроса важнее: понимание цены косвенности
      отличает опыт от начитанности.
    answer_detailed: |
      ### Junior
      Достаточно назвать несколько и объяснить своими словами. Полезно
      понимать, что часть паттернов уже встроена: внедрение зависимостей —
      в контейнере, единица работы — в `DbContext`, декоратор — в конвейере
      обработки запроса.

      Слабый ответ — перечисление без единого примера.

      ### Middle
      Ждут связки «задача — решение». Например: ветвление по типу платежа на
      восемь веток, каждый новый способ требовал правки этого метода; заменили
      на интерфейс с реализацией под способ и выбор по ключу — теперь новый
      способ добавляется отдельным классом.

      Здесь же — понимание, что паттерн не цель. Стратегия с единственной
      стратегией и фабрика для одного типа объектов добавляют файлы и не
      добавляют ничего больше.

      ### Senior
      Ждут разговора о цене косвенности: каждый паттерн — новое имя, новый файл
      и прыжок при чтении кода. Он окупается, когда изменения действительно
      приходят с ожидаемой стороны.

      Сильный ответ включает обратный пример из своей практики и вывод из него.
      И замечание, что в современном C# часть классических паттернов
      выражается делегатом или записью, и отдельная иерархия классов им уже не
      нужна.
    common_mistakes:
      - Перечислять паттерны без примеров из работы.
      - Вводить паттерн до появления изменчивости, ради которой он нужен.
      - Не замечать, что паттерн уже встроен во фреймворк.
    follow_ups:
      - Какой паттерн вы ввели и потом убрали?
      - Какие паттерны в .NET уже встроены?

  - slug: cs_queues_and_background_work
    specializations: [backend_csharp]
    topic: system_design
    subtopic: queues
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Когда работу выносят в фон или в очередь и что это усложняет?"
    answer_short: >-
      Когда результат не нужен в ответе и ожидание портит время отклика:
      письма, отчёты, выгрузки. Взамен появляются асинхронность для
      пользователя, повторная доставка и необходимость идемпотентности.
    answer_detailed: |
      ### Junior
      Простой пример: при оформлении заказа не нужно ждать отправки письма.
      Заказ сохраняется, задача уходит в фон, ответ приходит быстрее, а
      недоступность почтового сервиса не роняет оформление.

      Важно понимать разницу между фоновой службой внутри процесса и внешней
      очередью: первая теряет задачи при перезапуске, вторая — нет.

      ### Middle
      Ждут понимания, что доставка «ровно один раз» на практике недостижима, и
      обработчик делают идемпотентным: повторная обработка того же сообщения не
      должна создать второй заказ или второе списание.

      Здесь же — обработка неудач: сообщение, которое не удаётся обработать,
      уходит в отдельную очередь. Без этого оно либо крутится бесконечно, либо
      блокирует остальные.

      И видимость для пользователя: результат появляется не сразу, интерфейс
      должен это отражать, а не притворяться синхронным.

      ### Senior
      Ждут разговора о согласованности: запись в базу и отправка сообщения — две
      операции без общей транзакции. Упало между ними — данные разошлись.
      Решение — исходящий журнал, из которого сообщения досылаются отдельно.

      Сильный ответ включает, чего очередь не решает: она не ускоряет работу, а
      переносит её во времени. Если получатель стабильно медленнее отправителя,
      очередь просто растёт, и вместо честного отказа получается растущая
      задержка.
    common_mistakes:
      - Считать доставку «ровно один раз» гарантированной.
      - Хранить фоновые задачи только в памяти процесса.
      - Не предусматривать очередь для необработанных сообщений.
    follow_ups:
      - Как согласовать запись в базу с отправкой сообщения?
      - Чем фоновая служба в процессе хуже внешней очереди?

  - slug: cs_mocking_boundaries
    specializations: [backend_csharp]
    topic: testing
    subtopic: mocking
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что стоит подменять заглушкой в тесте, а что нет?"
    answer_short: >-
      Подменяют то, что выходит за границу вашего кода и мешает тесту: чужие
      сервисы, время, случайность, отправку писем. Не подменяют собственную
      логику и простые объекты — тест начинает проверять реализацию, а не
      поведение.
    answer_detailed: |
      ### Junior
      Заглушка нужна там, где настоящая зависимость делает тест медленным или
      неустойчивым. Простые объекты не подменяют: собрать настоящий `Order`
      дешевле, чем описывать поведение его заглушки.

      Отдельный частый случай — время. `DateTime.UtcNow` внутри логики делает
      тест зависимым от календаря; время получают через абстракцию и в тесте
      задают.

      ### Middle
      Ждут понимания, чем плох переподменённый тест: если он проверяет порядок и
      число вызовов, то ломается при любом изменении реализации, хотя поведение
      прежнее. Такие тесты не защищают, а требуют механической правки вместе с
      кодом.

      Правило: проверять результат, а не список вызовов. Проверка вызова уместна,
      когда сам вызов и есть результат — письмо отправлено, сообщение
      опубликовано.

      ### Senior
      Ждут разговора о границах: заглушку ставят на границе системы, и правильная
      граница — интерфейс, объявленный под ваши нужды, а не чужой класс из
      библиотеки.

      Сильный ответ включает компромисс: заглушка отражает ваше представление о
      поведении внешнего сервиса, и если представление неверно, тест зелёный, а
      в бою всё сломано. Поэтому вокруг важных интеграций держат небольшой набор
      тестов с настоящим окружением.

      И про базу: её почти никогда не подменяют — слишком много логики живёт в
      самом SQL и в отображении.
    common_mistakes:
      - Проверять число и порядок вызовов вместо результата.
      - Брать текущее время прямо из DateTime.UtcNow внутри логики.
      - Подменять базу заглушкой вместо настоящей в контейнере.
    follow_ups:
      - Когда проверка вызова уместна?
      - Почему тест на заглушках может быть зелёным при сломанной интеграции?

  - slug: cs_test_pyramid_practice
    specializations: [backend_csharp]
    topic: testing
    subtopic: integration
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как вы распределяете тесты между юнит- и интеграционными?"
    answer_short: >-
      Основная масса — быстрые тесты бизнес-правил без приложения и базы.
      Поверх — интеграционные на стыки: запросы к настоящей базе, контракт HTTP,
      конфигурация. Их меньше, они медленнее и ловят то, что юнит не увидит.
    answer_detailed: |
      ### Junior
      Юнит-тест проверяет один класс с подставленными зависимостями и
      выполняется за миллисекунды. Интеграционный поднимает приложение или базу
      и проверяет, что части работают вместе.

      Практический признак: если тест поднимает хост приложения, он уже не юнит.

      ### Middle
      Ждут понимания, что именно нельзя проверить юнит-тестом: сгенерированный EF
      запрос, работу транзакций, миграции, сериализацию, конфигурацию, порядок
      компонентов конвейера. Все случаи «на моей машине работает» живут здесь.

      Отсюда — база в контейнере той же версии, что и в бою, вместо базы в
      памяти. База в памяти ведёт себя иначе: часть ошибок пропускает, часть
      выдумывает.

      Пропорция диктуется скоростью: набор, который идёт десять минут, локально
      запускать перестают.

      ### Senior
      Ждут вывода, что распределение — следствие архитектуры. Если правила
      перемешаны с обращениями к базе, юнит-тестировать нечего, и команда
      обречена на медленный набор.

      Сильный ответ включает вопрос доверия: тест, падающий через раз, хуже
      отсутствующего — на него перестают смотреть, а вместе с ним перестают
      замечать настоящие падения.

      И про конвейер: быстрые тесты на каждый коммит, медленные — на слияние,
      чтобы обратная связь приходила за минуты.
    common_mistakes:
      - Проверять всё через поднятие приложения.
      - Брать базу в памяти вместо настоящей в контейнере.
      - Терпеть нестабильные тесты.
    follow_ups:
      - Что нельзя проверить юнит-тестом в ASP.NET Core?
      - Почему нестабильный тест хуже отсутствующего?

  - slug: cs_soft_review_disagreement
    specializations: [backend_csharp]
    topic: soft
    subtopic: conflict
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "На ревью коллега настаивает на решении, которое вы считаете неверным. Ваши действия?"
    answer_short: >-
      Разделить факты и предпочтения. Вкусовое — уступить и не тратить время
      команды. Существенное — привести измеримое последствие и предложить
      проверку. Не сходится — быстро привлечь третьего, а не спорить кругами.
    answer_detailed: |
      ### Junior
      Главное — обсуждать код, а не человека. Вопрос «почему здесь так?»
      работает лучше утверждения «так неправильно»: половина споров кончается на
      объяснении контекста, которого вы не знали.

      О своём варианте полезно уметь сказать в величинах: числом запросов,
      временем ответа, простотой изменения.

      ### Middle
      Ждут умения отделять существенное от вкусового. Форматирование, имена и
      порядок методов — не повод для спора, для этого есть анализаторы и общий
      стиль. Существенно то, что дорого менять потом: контракт API, схема
      данных, границы модулей.

      Полезный приём — выписать оба варианта с последствиями и позвать
      третьего. Спор о вкусах при этом обычно исчезает сам.

      ### Senior
      Ждут ответственности за исход, а не за свою правоту. Иногда верное решение
      — принять худший вариант, потому что цена спора выше разницы между
      вариантами.

      Сильный ответ включает системный взгляд: повторяющиеся споры об одном и том
      же означают отсутствие договорённости. Её и стоит зафиксировать —
      коротким соглашением команды, а не повторным обсуждением в каждом ревью.

      И про тон: от него зависит, будут ли присылать изменения маленькими
      кусками или копить до огромных, которые никто толком не прочитает.
    common_mistakes:
      - Спорить о форматировании вместо настройки анализаторов.
      - Переходить с обсуждения кода на обсуждение автора.
      - Тянуть спор кругами вместо привлечения третьего.
    follow_ups:
      - Что стоит зафиксировать соглашением команды?
      - Как тон замечаний влияет на размер присылаемых изменений?
  # Вопросы уровня senior и выше: решения, за которые отвечают перед командой
  # и перед бизнесом, а не только перед компилятором.

  - slug: cs_lead_monolith_or_services
    specializations: [backend_csharp]
    topic: architecture
    subtopic: microservices
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как вы принимаете решение делить монолит на сервисы?"
    answer_short: >-
      По причине, а не по моде. Деление оправдано, когда части системы
      действительно требуют разной скорости выпуска, разного масштабирования или
      разных владельцев. В остальных случаях сначала наводят порядок внутри.
    answer_detailed: |
      ### Senior
      Первый вопрос — какую проблему решаем. «Долгая выкладка», «одна команда
      блокирует другую», «одна часть требует в десять раз больше ресурсов» —
      это причины. «Микросервисы современнее» — не причина.

      Что деление приносит бесплатно: независимую выкладку, изоляцию отказов,
      возможность масштабировать части по отдельности.

      Что оно приносит вместе с этим: сетевые отказы, задержки, отсутствие общей
      транзакции, распределённую отладку, потребность в развитой эксплуатации.
      Команда, у которой нет наблюдаемости и автоматической выкладки, получит
      только вторую часть.

      Порядок действий: сначала выделить границу внутри кода — отдельный модуль
      с явным контрактом — и убедиться, что она держится месяц-другой. Граница,
      проведённая неверно, внутри процесса переносится за день, а по сети —
      за квартал.

      ### Lead
      Ждут разговора о людях и владении. Сервис без явного владельца становится
      ничьим. Границы, которые работают, обычно повторяют границы команд, а не
      слои технологий: «оплата» и «каталог», а не «API» и «база».

      Сюда же — цена в календаре. Деление отвлекает команду от продуктовой
      работы на месяцы, и это переговоры с бизнесом, а не техническое решение.

      Сильный ответ включает обратный ход: где вы объединяли сервисы обратно и
      почему. Два сервиса, которые всегда выкладываются вместе и всегда вместе
      ломаются, — это один сервис с сетью посередине.

      И промежуточный вариант, который часто оказывается верным: модульный
      монолит. Границы соблюдаются, выкладка одна, распределённые отказы не
      появляются.
    common_mistakes:
      - Делить по слоям, а не по областям ответственности.
      - Начинать деление без наблюдаемости и автоматической выкладки.
      - Проводить границу по сети раньше, чем она проверена внутри кода.
    follow_ups:
      - Как понять, что два сервиса на самом деле один?
      - Чем модульный монолит отличается от набора сервисов?

  - slug: cs_lead_tech_debt_negotiation
    specializations: [backend_csharp]
    topic: architecture
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как вы объясняете бизнесу необходимость технической работы, у которой нет видимого результата?"
    answer_short: >-
      Переводом в величины, которые бизнес и так считает: время выпуска
      изменений, доля инцидентов, стоимость поддержки, риск простоя. Разговор о
      «плохом коде» не работает — работает разговор о скорости и рисках.
    answer_detailed: |
      ### Senior
      Что звучит убедительно: «на этот модуль приходится половина инцидентов
      квартала», «каждая правка здесь занимает три дня вместо одного», «версия
      снята с поддержки, уязвимости не закрываются».

      Что не звучит: «код плохой», «хочется переписать», «так не делают».

      Полезно предлагать варианты с разной ценой, а не один ультиматум:
      минимальное вмешательство сейчас, полноценное — в следующем квартале, и
      что будет, если не делать ничего.

      ### Lead
      Ждут постоянного механизма вместо разовых переговоров. Обычно это
      согласованная доля мощности команды на техническую работу — тогда её не
      нужно каждый раз выторговывать, и она не копится до состояния, когда
      требуется остановка разработки.

      Сюда же — честность в обе стороны. Иногда правильный ответ «не чиним»:
      модуль будет заменён через полгода, и вкладываться в него бессмысленно.
      Инженер, который это признаёт, вызывает больше доверия, чем требующий
      исправить всё.

      Сильный ответ включает измеримость: если работу нельзя связать ни с одним
      наблюдаемым показателем, скорее всего, её обоснование действительно
      слабое.

      И про язык: обсуждать риск в терминах вероятности и последствий, а не
      «может рвануть».
    common_mistakes:
      - Обосновывать переписывание качеством кода, а не издержками.
      - Приходить с одним вариантом вместо нескольких.
      - Копить техническую работу до требования остановить разработку.
    follow_ups:
      - Какую долю мощности команды вы бы отвели на техническую работу?
      - Когда правильный ответ — не чинить вовсе?

  - slug: cs_lead_incident_response
    specializations: [backend_csharp]
    topic: system_design
    subtopic: observability
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Сервис лежит в бою. Опишите ваши действия по шагам."
    answer_short: >-
      Сначала восстановить работу, потом искать причину. Откат или отключение
      сомнительной функции, оповещение заинтересованных, фиксация времени и
      действий. Разбор — после, письменно и без поиска виноватого.
    answer_detailed: |
      ### Senior
      Порядок действий:

      1. **Оценить масштаб.** Что именно сломано, для скольких пользователей,
         есть ли обход. Без этого невозможно решить, будить ли остальных.
      2. **Восстановить.** Откат последней выкладки, отключение функции
         переключателем, перевод трафика. Поиск причины — потом: пока сервис
         лежит, каждая минута расследования стоит денег.
      3. **Сообщить.** Короткое сообщение в общий канал: что сломано, что
         делаем, когда следующее обновление. Молчание порождает десяток людей,
         отвлекающих вас вопросами.
      4. **Зафиксировать.** Время, действия, гипотезы. Через два часа никто не
         вспомнит порядок событий, а он нужен для разбора.

      Что не делать: править прямо в бою вслепую, менять несколько вещей
      одновременно, чинить без возможности откатиться.

      ### Lead
      Ждут разговора о ролях. В затяжном инциденте нужен человек, который
      координирует и общается, отдельно от того, кто копается в системе:
      совмещать это невозможно.

      Сюда же — разбор без поиска виноватого. У человека, нажавшего кнопку, была
      та информация, которую дала ему система. Меняют систему: проверки,
      предупреждения, возможность отката. Разбор с наказанием даёт один
      результат — про инциденты перестают сообщать.

      Сильный ответ включает работу с повторяемостью: одна и та же причина
      второй раз означает, что первый разбор закончился словами, а не
      изменениями. Поэтому у каждого пункта разбора есть исполнитель и срок.

      И готовность заранее: возможность отката одной командой, переключатели
      функций, отрепетированные действия — это делают до инцидента, а не во
      время.
    common_mistakes:
      - Искать причину, пока сервис лежит, вместо восстановления.
      - Менять несколько вещей одновременно.
      - Заканчивать разбор словами без исполнителей и сроков.
    follow_ups:
      - Почему координатора отделяют от того, кто чинит?
      - Что готовят до инцидента, а не во время?

  - slug: cs_lead_capacity_and_load
    specializations: [backend_csharp]
    topic: system_design
    subtopic: scaling
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Ожидается рост нагрузки в десять раз. Как вы к нему готовитесь?"
    answer_short: >-
      Не догадками, а измерением: где сейчас узкое место, как система ведёт себя
      под нагрузочным тестом, что откажет первым. Затем — устранение первого
      ограничения, а не одновременное улучшение всего.
    answer_detailed: |
      ### Senior
      Порядок работы:

      1. **Измерить текущее.** Профиль нагрузки, время ответа по процентилям,
         использование пулов соединений и потоков.
      2. **Найти первое ограничение.** Обычно это база: соединения, блокировки,
         отсутствующие индексы. Приложение упирается в неё раньше, чем в
         процессор.
      3. **Проверить гипотезу нагрузочным тестом** на среде, похожей на боевую.
         Тест на машине разработчика не значит ничего.
      4. **Устранить ограничение и повторить.** После снятия первого узкого
         места появляется второе — заранее его не угадать.

      Что даёт результат чаще всего: индексы и переписанные запросы, кеш на
      горячие чтения, реплики на чтение, вынос тяжёлой работы в фон.

      ### Lead
      Ждут разговора о деградации вместо отказа. При десятикратном всплеске
      система должна ухудшаться постепенно: ограничение скорости, очередь,
      отключение необязательных функций. Отказ всего сервиса — худший исход, чем
      медленная работа части.

      Сюда же — стоимость. Десятикратный рост инфраструктуры может оказаться
      дороже, чем переработка одного запроса. Это решение принимают с цифрами, а
      не по привычке добавлять машины.

      Сильный ответ включает организационную часть: кто дежурит, какие пороги
      оповещений, до какого предела автоматическое масштабирование и что
      происходит при достижении потолка.

      И честное «мы не знаем»: без нагрузочного теста любые обещания о
      десятикратном росте — предположения.
    common_mistakes:
      - Добавлять экземпляры, не найдя узкое место.
      - Проверять нагрузку на среде, не похожей на боевую.
      - Проектировать на отказ вместо постепенной деградации.
    follow_ups:
      - Что обычно оказывается первым узким местом?
      - Как система должна вести себя при превышении расчётной нагрузки?

  - slug: cs_lead_api_as_product
    specializations: [backend_csharp]
    topic: web
    subtopic: auth
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Ваш API используют внешние клиенты. Что меняется в подходе к разработке?"
    answer_short: >-
      Контракт перестаёт быть внутренним делом: его нельзя менять по желанию,
      нужны версии, документация, предсказуемые ограничения и понятные ошибки.
      Плюс защита от того, что клиент будет использовать API не так, как задумано.
    answer_detailed: |
      ### Senior
      Что появляется сверх обычной разработки:

      - **Совместимость как обязательство.** Внутренний контракт можно
        поправить вместе с потребителем за один выпуск, внешний — нет;
      - **Ограничение скорости и квоты.** Без них один клиент с ошибкой в цикле
        уронит сервис для всех;
      - **Аутентификация клиентов и разграничение прав** — не только «кто
        пользователь», но и «какое приложение и что ему разрешено»;
      - **Идемпотентность операций записи.** Клиент повторит запрос при
        сетевой ошибке, и повтор не должен создавать второй платёж;
      - **Документация как часть выпуска.** Расхождение описания и поведения
        стоит поддержке дороже, чем сама разработка.

      ### Lead
      Ждут понимания, что у API появляются пользователи со своим циклом
      обновления. Мобильное приложение обновляется неделями, интеграция
      партнёра — кварталами. Значит, старые версии живут долго, и это надо
      закладывать в план.

      Сюда же — измерения: кто какими конечными точками пользуется, какие
      версии живы, где растёт доля ошибок конкретного клиента. Без этого нельзя
      ни выключить старое, ни помочь тому, у кого не получается.

      Сильный ответ включает поддержку как часть работы: канал для вопросов,
      понятные сообщения об ошибках, песочница. И признание, что публичный API
      — продукт со своей стоимостью владения, а не побочный эффект разработки.
    common_mistakes:
      - Менять внешний контракт так же свободно, как внутренний.
      - Не ограничивать скорость обращений внешних клиентов.
      - Считать документацию необязательной частью выпуска.
    follow_ups:
      - Зачем внешнему API идемпотентность операций записи?
      - Как понять, что старую версию можно выключить?

  - slug: cs_lead_upgrade_strategy
    specializations: [backend_csharp]
    topic: dotnet
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как вы ведёте обновление платформы и зависимостей в большом проекте?"
    answer_short: >-
      Регулярно и небольшими шагами, а не раз в три года героическим рывком.
      Обновление версий поддерживается автоматикой, покрыто тестами и имеет
      понятный порядок отката.
    answer_detailed: |
      Что отличает работающий подход.

      **Регулярность вместо накопления.** Проект, который обновляют раз в три
      года, обновить уже почти невозможно: изменений слишком много, и упавший
      после обновления код невозможно связать с конкретной причиной. Небольшие
      обновления по расписанию дешевле в сумме.

      **Автоматика на рутине.** Обновления зависимостей приходят
      предложениями изменений автоматически, набор тестов решает, безопасны ли
      они. Ручной обход списка пакетов не делает никто.

      **Разделение видов обновлений.** Исправления безопасности — вне очереди.
      Мелкие версии — потоком. Мажорные версии платформы — отдельной задачей с
      планом.

      **План для мажорной версии:** сначала собрать на новой версии, не меняя
      поведение; затем прогнать тесты и нагрузочный тест; затем выложить на
      часть трафика; и только потом убрать старую сборку. На каждом шаге есть
      откат.

      **Сроки поддержки как аргумент.** У версий платформы объявленный срок
      поддержки, и выход за него означает отсутствие исправлений безопасности —
      это разговор о риске, а не о вкусах.

      Отдельно — про зависимости, которые нельзя обновить: заброшенная
      библиотека без сопровождения. Такие вещи нужно замечать до того, как они
      заблокируют обновление платформы, и планировать замену заранее.
    common_mistakes:
      - Копить обновления до состояния, когда обновиться невозможно.
      - Обновлять платформу одновременно с изменением поведения.
      - Не замечать заброшенные зависимости до момента блокировки.
    follow_ups:
      - Как вы поступаете с заброшенной библиотекой?
      - Почему обновление платформы не совмещают с изменением поведения?

  - slug: cs_lead_hiring_and_bar
    specializations: [backend_csharp]
    topic: soft
    subtopic: teamwork
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как вы участвуете в найме и что считаете сигналом «берём»?"
    answer_short: >-
      Проверяют способность решать задачи в незнакомом контексте и работать с
      людьми, а не знание фактов. Сигнал «берём» — человек рассуждает вслух,
      признаёт неизвестное и приходит к работающему решению с уточняющими
      вопросами.
    answer_detailed: |
      Что стоит сказать.

      **Задачи ближе к работе, чем к олимпиаде.** Разбор существующего кода,
      обсуждение проектирования, вопрос «как бы вы это отладили» дают больше
      сигнала, чем алгоритм на доске, если работа не про алгоритмы.

      **Одинаковые условия.** Разные вопросы разным кандидатам делают
      сравнение невозможным. Отсюда общая структура собеседования и записанные
      критерии, а не общее ощущение.

      **Сигналы «берём»:** уточняет условия до решения; проговаривает
      компромиссы; говорит «не знаю» и показывает, как выяснил бы; исправляет
      свой ответ, получив новую информацию.

      **Сигналы «не берём»:** не задаёт ни одного вопроса; спорит с фактами;
      называет любое чужое решение неправильным без разбора причин; не может
      объяснить решение из собственного резюме.

      **Про уровень.** Разница между middle и senior обычно не в знаниях, а в
      самостоятельности: senior сам находит задачу, разбивает её и доводит,
      согласовав с другими. Проверяют это разговором о прошлой работе, а не
      вопросами на эрудицию.

      И про честность обратной связи: отказ без объяснения — потерянная
      репутация команды. Кандидатов на рынке меньше, чем кажется, и они
      разговаривают между собой.
    common_mistakes:
      - Задавать разным кандидатам разные вопросы и сравнивать ощущения.
      - Проверять эрудицию вместо способности решать задачи.
      - Отказывать без внятной обратной связи.
    follow_ups:
      - Чем на собеседовании отличается middle от senior?
      - Как вы уменьшаете влияние личных симпатий на решение?

  - slug: cs_lead_ownership_of_decision
    specializations: [backend_csharp]
    topic: soft
    subtopic: motivation
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Расскажите про техническое решение, которое вы приняли и которое оказалось неверным."
    answer_short: >-
      Ждут не покаяния, а механизма: как решение принималось, какие сигналы вы
      пропустили, когда стало понятно, что оно неверно, и как вы его отменяли.
      Умение отменить своё решение ценится выше умения его защищать.
    answer_detailed: |
      Что должно прозвучать в сильном ответе.

      **Как решение принималось.** Какие варианты рассматривались, по каким
      критериям выбирали, что было известно на тот момент. Решение, принятое
      разумно при имеющейся информации, и оказавшееся неверным — нормальная
      ситуация. Решение, принятое по привычке, — другой разговор.

      **Какой сигнал вы пропустили.** Обычно он был: возражение коллеги, которое
      отмели; неудобство, которое списали на привыкание; растущее время
      выкладки.

      **Когда признали.** Здесь и проверяется зрелость. Чем дольше решение
      защищают, тем дороже отмена, и тем сильнее оно обрастает кодом.

      **Как отменяли.** Резкий откат редко возможен. Обычно это сосуществование
      старого и нового, перевод по частям, измеримый прогресс.

      **Что изменили в способе принимать решения.** Например: фиксировать
      контекст решения письменно — через год никто не помнит, почему выбрали
      так, и обсуждение начинается заново. Или назначать срок пересмотра:
      «вернуться к этому через квартал с данными».

      Слабый ответ — история, где виноваты обстоятельства и другие люди, или
      «неверных решений не было». Второе означает либо отсутствие решений, либо
      отсутствие обратной связи о результате.
    common_mistakes:
      - Рассказывать историю, где виноваты обстоятельства.
      - Утверждать, что неверных решений не принимали.
      - Защищать решение до момента, когда отмена становится непосильной.
    follow_ups:
      - Как вы фиксируете контекст принятого решения?
      - Что заставило вас признать решение неверным?
