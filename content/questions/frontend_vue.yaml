  - slug: vue_let_const_var_basics
    specializations: [frontend_vue]
    topic: javascript
    subtopic: closures
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Чем let и const отличаются от var?"
    answer_short: >-
      `let` и `const` ограничены блоком, `var` — функцией. `const` запрещает
      переприсваивание переменной, но не запрещает менять объект, на который
      она указывает.
    answer_detailed: |
      ```js
      if (true) {
        var a = 1;
        let b = 2;
      }
      a;  // 1
      b;  // ReferenceError

      const user = { name: 'Аня' };
      user.name = 'Оля';   // можно
      user = {};           // TypeError
      ```

      Правило по умолчанию: `const`, `let` — когда значение действительно
      переприсваивается, `var` — никогда.

      Во Vue это встречается сразу: `const count = ref(0)` объявляется через
      `const`, потому что меняется не переменная, а поле `.value` внутри
      объекта-ссылки. Попытка написать `count = 5` сломает реактивность и
      выдаст ошибку — и это как раз то, от чего `const` защищает.

      Классическая ловушка с циклом и `var`: одна переменная на весь цикл, и все
      отложенные обработчики видят её конечное значение. С `let` на каждой
      итерации своя.
    common_mistakes:
      - Считать, что const делает объект неизменяемым.
      - Переприсваивать ref вместо изменения .value.
      - Использовать var и получать одно значение во всех обработчиках цикла.
    follow_ups:
      - Почему ref объявляют через const?
      - Что напечатает цикл с var и setTimeout?

  - slug: vue_equality_basics
    specializations: [frontend_vue]
    topic: javascript
    subtopic: prototypes
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: single_choice
    title: "Чем `===` отличается от `==`?"
    options:
      - code: a
        text: "Ничем, === просто современнее"
      - code: b
        text: "`==` приводит типы перед сравнением, `===` сравнивает значение и тип без приведения"
        is_correct: true
      - code: c
        text: "`===` работает только с числами"
      - code: d
        text: "`==` сравнивает ссылки, `===` — содержимое"
    answer_short: >-
      `==` приводит операнды к общему типу по неочевидным правилам, `===` — нет.
      По умолчанию используют `===`; общепринятое исключение — `== null`, что
      ловит и null, и undefined.
    answer_detailed: |
      ```js
      0 == '';       // true
      0 == '0';      // true
      '' == '0';     // false
      null == undefined;   // true
      null === undefined;  // false
      ```

      Три первых примера показывают, что равенство через `==` даже не
      транзитивно: запоминать эти правила бессмысленно, проще не пользоваться.

      Для объектов `===` сравнивает ссылки, а не содержимое. Это важно во Vue:
      наблюдатель за объектом по умолчанию сравнивает ссылку, и подмена поля
      внутри него срабатывания не вызовет — для этого есть глубокое наблюдение.

      И `NaN === NaN` — ложь. Проверяют такие значения отдельной функцией, а не
      сравнением.
    common_mistakes:
      - Полагаться на правила приведения типов.
      - Ожидать реакции watch на изменение поля внутри объекта.
      - Сравнивать NaN через равенство.
    follow_ups:
      - Почему watch не сработал при изменении поля объекта?
      - Как проверить, что значение — NaN?

  - slug: vue_array_methods_basics
    specializations: [frontend_vue]
    topic: javascript
    subtopic: closures
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 4
    type: open_answer
    title: "Какие методы массива нужны каждый день и какие из них меняют исходный массив?"
    answer_short: >-
      `map`, `filter`, `find`, `reduce`, `some`, `every` возвращают новое и
      исходный массив не трогают. `push`, `splice`, `sort`, `reverse` меняют его
      на месте — последние два часто портят данные незаметно.
    answer_detailed: |
      ```js
      const active = users.filter((u) => u.isActive);
      const names = active.map((u) => u.name);
      ```

      Ловушка с сортировкой: `sort` меняет исходный массив и по умолчанию
      сравнивает как строки, поэтому `[10, 9, 1].sort()` даёт `[1, 10, 9]`. Для
      чисел передают компаратор, а чтобы не портить исходник — копию.

      ```js
      const sorted = [...items].sort((a, b) => a.price - b.price);
      ```

      Во Vue изменение массива на месте работает: реактивность отслеживает
      методы-мутаторы. Но в вычисляемом свойстве сортировать исходный массив
      нельзя — вычисляемое не должно менять то, от чего зависит, иначе получится
      бесконечный цикл обновлений.

      Про ключи в списке: `v-for` требует `key`, и индекс в качестве ключа
      ломается при вставке и удалении в середине. Берут идентификатор из данных.
    common_mistakes:
      - Сортировать массив прямо в вычисляемом свойстве.
      - Забывать компаратор у sort для чисел.
      - Использовать индекс как key в изменяемом списке.
    follow_ups:
      - Почему нельзя менять данные внутри computed?
      - Чем плох индекс в качестве key?

  - slug: vue_ref_vs_reactive_basics
    specializations: [frontend_vue]
    topic: reactivity
    subtopic: ref_reactive
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Чем ref отличается от reactive и что выбрать?"
    answer_short: >-
      `ref` оборачивает любое значение и требует `.value` в скрипте, `reactive`
      работает только с объектами и обращения к `.value` не требует. На практике
      берут `ref` почти везде — он не теряет реактивность при переприсваивании.
    answer_detailed: |
      ```js
      const count = ref(0);
      const state = reactive({ count: 0 });

      count.value++;     // в скрипте нужен .value
      state.count++;
      ```

      В шаблоне `.value` не пишут — Vue разворачивает ссылки сам.

      Почему `ref` обычно удобнее: `reactive` теряет реактивность при
      переприсваивании и при деструктуризации.

      ```js
      let state = reactive({ count: 0 });
      state = { count: 5 };            // связь потеряна
      const { count } = reactive({ count: 0 });   // count больше не реактивен
      ```

      С `ref` таких сюрпризов нет: значение всегда лежит внутри одной и той же
      обёртки.

      Правило простое: примитивы — всегда `ref`; объекты — тоже `ref`, если их
      целиком заменяют (например, данные с сервера).
    common_mistakes:
      - Забывать .value в скрипте.
      - Деструктурировать reactive и терять реактивность.
      - Переприсваивать объект, объявленный через reactive.
    follow_ups:
      - Почему деструктуризация reactive ломает реактивность?
      - Где .value писать не нужно?

  - slug: vue_computed_vs_method_basics
    specializations: [frontend_vue]
    topic: reactivity
    subtopic: computed_watch
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: single_choice
    title: "Чем computed отличается от обычного метода в шаблоне?"
    options:
      - code: a
        text: "Ничем, computed просто короче записывается"
      - code: b
        text: "computed кеширует результат и пересчитывается только при изменении зависимостей, метод выполняется на каждый рендер"
        is_correct: true
      - code: c
        text: "computed работает асинхронно"
      - code: d
        text: "Метод нельзя использовать в шаблоне"
    answer_short: >-
      `computed` кеширует значение и пересчитывает его, только когда изменились
      зависимости. Метод вызывается заново при каждой перерисовке, даже если
      данные те же.
    answer_detailed: |
      ```js
      const total = computed(() => items.value.reduce((sum, i) => sum + i.price, 0));
      ```

      Для дешёвых выражений разница незаметна, для фильтрации и сортировки
      большого списка — принципиальна.

      Что важно помнить:

      - вычисляемое свойство должно быть чистым: считать значение и ничего не
        менять. Запрос к серверу или изменение состояния внутри него —
        источник трудноуловимых ошибок;
      - зависимости определяются автоматически по тому, что прочитано во время
        вычисления. Читаете `items.value` — зависимость появилась;
      - для реакции на изменение с побочным эффектом есть `watch`, и путать эти
        два инструмента не стоит: `computed` отвечает на вопрос «чему равно»,
        `watch` — «что сделать, когда изменилось».
    common_mistakes:
      - Делать запрос или менять состояние внутри computed.
      - Использовать метод там, где нужен кеш вычисляемого свойства.
      - Брать watch вместо computed для производного значения.
    follow_ups:
      - Как Vue понимает, от чего зависит computed?
      - Когда нужен watch, а когда computed?

  - slug: vue_props_events_basics
    specializations: [frontend_vue]
    topic: components
    subtopic: props_events
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Как компоненты обмениваются данными: пропсы и события?"
    answer_short: >-
      Данные идут вниз через пропсы, сообщения наверх — через события. Пропсы
      только для чтения: менять их внутри компонента нельзя, вместо этого
      сообщают родителю, а тот меняет свои данные.
    answer_detailed: |
      ```vue
      <script setup>
      const props = defineProps({ modelValue: String });
      const emit = defineEmits(['update:modelValue']);
      </script>

      <template>
        <input :value="modelValue" @input="emit('update:modelValue', $event.target.value)">
      </template>
      ```

      Этот же приём даёт `v-model` на своём компоненте: он разворачивается в
      пропс `modelValue` и событие `update:modelValue`.

      Почему пропс нельзя менять напрямую: у данных должен быть один владелец.
      Иначе родитель перерисуется, перезапишет значение, и изменения потеряются
      непредсказуемо. Vue предупреждает об этом в консоли.

      Что делают, если значение нужно изменить локально: копируют в собственное
      состояние — но осознанно, понимая, что копия перестанет обновляться при
      изменении пропса.
    common_mistakes:
      - Менять пропс внутри дочернего компонента.
      - Копировать пропс в состояние без необходимости.
      - Передавать данные наверх через общую переменную вместо события.
    follow_ups:
      - Во что разворачивается v-model на своём компоненте?
      - Что произойдёт, если поменять пропс напрямую?

  - slug: vue_directives_basics
    specializations: [frontend_vue]
    topic: components
    subtopic: props_events
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Чем v-if отличается от v-show и почему их не ставят вместе с v-for?"
    answer_short: >-
      `v-if` не создаёт элемент вовсе, `v-show` создаёт и прячет стилем. Первое
      дешевле при редком показе, второе — при частом переключении. Вместе с
      `v-for` их не пишут: условие вычисляется для каждого элемента.
    answer_detailed: |
      ```vue
      <div v-if="isAdmin">…</div>     <!-- элемента нет в DOM -->
      <div v-show="isOpen">…</div>    <!-- display: none -->
      ```

      Выбор простой: если условие меняется часто (вкладка, выпадающее меню) —
      `v-show`, элемент уже создан и переключение бесплатно. Если блок тяжёлый и
      показывается редко — `v-if`, чтобы не создавать его зря.

      Про сочетание с `v-for`: раньше это работало с неочевидным приоритетом, а
      сейчас считается ошибкой. Правильно — отфильтровать список в вычисляемом
      свойстве:

      ```js
      const visible = computed(() => items.value.filter((i) => i.isActive));
      ```

      Это ещё и быстрее: фильтрация выполняется один раз, а не на каждый
      элемент при каждом рендере.

      И про `key` в `v-for`: он нужен, чтобы Vue понимал, какой элемент какой
      при перестановке, — иначе состояние полей ввода в списке «переезжает» не
      туда.
    common_mistakes:
      - Ставить v-if и v-for на один элемент.
      - Использовать v-if для часто переключаемого блока.
      - Опускать key в списках с изменяемым порядком.
    follow_ups:
      - Почему фильтрация в computed быстрее, чем v-if внутри v-for?
      - Что сломается без key при перестановке элементов?

  - slug: vue_lifecycle_basics
    specializations: [frontend_vue]
    topic: components
    subtopic: lifecycle
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Какие есть хуки жизненного цикла и где загружать данные?"
    answer_short: >-
      Основные — `onMounted` после появления в DOM, `onUnmounted` перед
      удалением, `onUpdated` после перерисовки. Данные загружают в `onMounted`
      или сразу в `setup`, а в `onUnmounted` убирают подписки и таймеры.
    answer_detailed: |
      ```js
      onMounted(async () => {
        const response = await fetch('/api/v1/orders');
        orders.value = await response.json();
      });

      onUnmounted(() => clearInterval(timerId));
      ```

      Что важно: в `setup` DOM ещё не существует, поэтому обращаться к элементам
      через `ref` можно только начиная с `onMounted`.

      Уборка обязательна. Подписка на событие окна, интервал, соединение —
      всё, что создано компонентом, он же и закрывает. Иначе после ухода со
      страницы таймер продолжает работать и обращаться к данным, которых уже
      нет.

      Отдельно про запросы: если компонент успели закрыть, ответ всё равно
      придёт. Поэтому либо отменяют запрос, либо проверяют актуальность перед
      записью результата.

      В приложениях со сложной загрузкой это обычно берёт на себя библиотека
      работы с данными — она же даёт кеш и повтор при ошибке.
    common_mistakes:
      - Обращаться к DOM до onMounted.
      - Не убирать таймеры и подписки при размонтировании.
      - Записывать результат запроса в закрытый компонент.
    follow_ups:
      - Почему нельзя работать с DOM в setup?
      - Что делать с запросом, если компонент закрыли?

  - slug: vue_slots_basics
    specializations: [frontend_vue]
    topic: components
    subtopic: slots
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что такое слоты и когда они лучше пропсов?"
    answer_short: >-
      Слот — место, куда родитель вставляет свою разметку. Он лучше пропсов,
      когда настраивать нужно не значение, а содержимое: заголовок с иконкой,
      произвольные кнопки, строку таблицы.
    answer_detailed: |
      ```vue
      <!-- Card.vue -->
      <template>
        <div class="card">
          <header><slot name="header">Без заголовка</slot></header>
          <slot />
        </div>
      </template>

      <!-- использование -->
      <Card>
        <template #header><Icon name="user" /> Профиль</template>
        <p>Содержимое</p>
      </Card>
      ```

      Признак, что нужны слоты: компонент обрастает пропсами вроде
      `headerIcon`, `headerTitle`, `headerAction`. Это попытка описать разметку
      набором настроек — слот решает задачу проще и гибче.

      Значение по умолчанию внутри `<slot>` показывается, когда родитель ничего
      не передал: компонент остаётся полезным без настройки.

      Есть и слоты с данными: компонент передаёт наружу свои значения, а
      родитель решает, как их нарисовать. Так делают списки и таблицы —
      логика внутри, внешний вид снаружи.
    common_mistakes:
      - Настраивать разметку десятком пропсов вместо слота.
      - Не задавать содержимое по умолчанию.
    follow_ups:
      - Что показывается, если слот не заполнен?
      - Зачем нужны слоты с данными?

  - slug: vue_composable_basics
    specializations: [frontend_vue]
    topic: state_management
    subtopic: composables
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Что такое composable и зачем он нужен?"
    answer_short: >-
      Обычная функция, которая пользуется реактивностью Vue и возвращает
      состояние с методами. Это основной способ переиспользовать логику: не
      разметку, а поведение — загрузку данных, работу с формой, подписку.
    answer_detailed: |
      ```js
      // useToggle.js
      export function useToggle(initial = false) {
        const value = ref(initial);
        const toggle = () => (value.value = !value.value);
        return { value, toggle };
      }
      ```

      Договорённости, по которым их узнают: имя начинается с `use`, функция
      вызывается в `setup`, возвращает объект с реактивными значениями.

      Зачем: раньше повторную логику растаскивали по примесям, и было непонятно,
      откуда взялось поле в компоненте. Composable возвращает всё явно — видно,
      что пришло и откуда.

      Важная деталь: состояние внутри composable создаётся при каждом вызове,
      то есть у каждого компонента своё. Если состояние нужно общее, его
      выносят за пределы функции — но тогда это уже маленький стор, и стоит
      понимать, что оно живёт всё время работы приложения.

      И уборка: если composable подписывается или заводит таймер, он же должен
      отписаться в `onUnmounted` — иначе утечка размножается по всем местам, где
      его использовали.
    common_mistakes:
      - Не убирать подписки внутри composable.
      - Выносить состояние наружу, не понимая, что оно стало общим.
      - Вызывать composable вне setup.
    follow_ups:
      - У каждого компонента своё состояние composable или общее?
      - Чем composable лучше примесей?

  - slug: vue_store_basics
    specializations: [frontend_vue]
    topic: state_management
    subtopic: store
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Когда нужен стор, а когда хватает состояния компонента?"
    answer_short: >-
      Состояние живёт как можно ближе к месту использования. Нужно двум соседям —
      поднимают к общему родителю. Стор берут, когда значение нужно в разных
      ветках дерева и передавать его пропсами стало неудобно.
    answer_detailed: |
      Порядок, который работает почти всегда:

      1. локальное состояние компонента;
      2. поднятое к общему родителю;
      3. `provide` и `inject` для передачи вниз по ветке без промежуточных
         пропсов;
      4. стор — общее состояние приложения.

      Частая ошибка — начинать сразу со стора. Для значения, которым пользуется
      один экран, он добавляет файлы и усложняет чтение, ничего не решая.

      Что уместно в сторе: текущий пользователь, настройки интерфейса, корзина,
      состояние сложного мастера.

      Что в сторе не место: данные с сервера как есть. Это кеш, у него своя
      жизнь — устаревание, повторная загрузка, ошибка. Для него берут библиотеку
      работы с запросами, иначе всё это приходится писать руками поверх стора.

      И производные значения не хранят: их считают вычисляемыми свойствами,
      иначе две правды рано или поздно разойдутся.
    common_mistakes:
      - Заводить стор ради состояния одного экрана.
      - Хранить в сторе ответы сервера как обычное состояние.
      - Складывать в стор производные значения.
    follow_ups:
      - Чем данные сервера отличаются от состояния приложения?
      - Когда достаточно provide и inject?
  - slug: vue_router_basics
    specializations: [frontend_vue]
    topic: routing
    subtopic: params
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 5
    type: open_answer
    title: "Как устроена маршрутизация и как получить параметр из адреса?"
    answer_short: >-
      Маршруты описывают соответствие адреса и компонента, `router-view`
      показывает текущий. Параметр читают из объекта текущего маршрута; переход
      делают `router-link` или программно.
    answer_detailed: |
      ```js
      const routes = [
        { path: '/orders', component: OrderList },
        { path: '/orders/:id', component: OrderDetails },
      ];
      ```

      ```js
      const route = useRoute();
      const id = computed(() => route.params.id);
      ```

      Главная ловушка новичка: при переходе с `/orders/1` на `/orders/2`
      компонент не пересоздаётся — меняются только параметры. Загрузка данных в
      `onMounted` в этом случае не сработает второй раз, и на экране останутся
      старые данные. Нужен наблюдатель за параметром или ключ на
      `router-view`.

      Про переходы: `router-link` рисует обычную ссылку, и это важно —
      её можно открыть в новой вкладке, скопировать, увидит поисковый робот.
      Кнопка с программным переходом всего этого лишена.

      И параметры запроса: фильтры и страницу списка стоит держать в адресе, а
      не в состоянии компонента. Тогда ссылку можно отправить коллеге, а кнопка
      «назад» работает как ожидается.
    common_mistakes:
      - Загружать данные только в onMounted и не реагировать на смену параметра.
      - Делать переходы кнопкой вместо ссылки.
      - Хранить фильтры списка в состоянии вместо адреса.
    follow_ups:
      - Почему при смене id данные не обновились?
      - Что выигрывает состояние, вынесенное в адрес?

  - slug: vue_route_guards_basics
    specializations: [frontend_vue]
    topic: routing
    subtopic: guards
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Зачем нужны навигационные хуки и защищают ли они данные?"
    answer_short: >-
      Они решают, пускать ли на маршрут: проверить вход, подтвердить уход с
      незаполненной формы, дозагрузить данные. Данные они не защищают — это
      удобство интерфейса, а настоящая проверка прав живёт на сервере.
    answer_detailed: |
      ```js
      router.beforeEach((to) => {
        if (to.meta.requiresAuth && !auth.isLoggedIn) {
          return { path: '/login', query: { redirect: to.fullPath } };
        }
      });
      ```

      Два частых применения: перенаправление неавторизованного на вход и
      предупреждение при уходе с формы, где есть несохранённые изменения.

      Что важно понимать: весь код маршрутизатора выполняется в браузере
      пользователя. Открыть страницу в обход хука — вопрос пары минут в
      инструментах разработчика. Поэтому скрытая кнопка и закрытый маршрут не
      защищают ничего: если сервер отдаёт данные без проверки, они утекут.

      Правильное разделение: маршрутизатор отвечает за то, чтобы человек не
      попал на бесполезный экран, сервер — за то, чтобы он не получил чужие
      данные.

      Ещё частая ошибка — бесконечное перенаправление: хук отправляет на
      страницу входа, а она тоже требует авторизации. Условие выхода из проверки
      должно быть явным.
    common_mistakes:
      - Считать закрытый маршрут защитой данных.
      - Создавать бесконечное перенаправление на страницу входа.
      - Забывать вернуть человека туда, куда он шёл, после входа.
    follow_ups:
      - Что произойдёт, если пользователь откроет закрытый маршрут напрямую?
      - Кто отвечает за проверку прав?

  - slug: vue_http_request_basics
    specializations: [frontend_vue]
    topic: browser
    subtopic: cors
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 5
    type: open_answer
    title: "Как отправить запрос к API и что за ошибка CORS?"
    answer_short: >-
      Через `fetch` или клиент вроде axios. CORS — ограничение браузера: он не
      отдаёт странице ответ с чужого источника, пока сервер не разрешит это
      заголовками. Чинится на сервере, в коде страницы обойти нельзя.
    answer_detailed: |
      ```js
      const response = await fetch('/api/v1/orders');
      if (!response.ok) throw new Error(`Ошибка ${response.status}`);
      const data = await response.json();
      ```

      Деталь, о которой спрашивают: `fetch` не бросает исключение на 404 или
      500 — промис успешно разрешается, статус нужно проверять руками. Клиенты
      вроде axios делают это за вас, поэтому переход между ними ломает
      обработку ошибок, если про это не помнить.

      Про CORS: запрос уходит и сервер его обрабатывает — браузер лишь не
      показывает ответ странице. Отсюда следует, что «обойти CORS на фронте»
      нельзя: советы отключить проверку в браузере прячут проблему до боя.

      Что делают на практике: в разработке — прокси в дев-сервере, в бою —
      заголовки на стороне API или общий домен.

      И три состояния у любого запроса: идёт, получилось, не получилось. Их
      проектируют заранее, иначе интерфейс молча замирает.
    common_mistakes:
      - Не проверять ok и считать любой ответ успешным.
      - Пытаться починить CORS в коде страницы.
      - Забывать про состояние ошибки.
    follow_ups:
      - Почему fetch не падает на 500?
      - Где чинится CORS?

  - slug: vue_storage_basics
    specializations: [frontend_vue]
    topic: browser
    subtopic: web_security
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Где хранить данные на клиенте и почему токен в localStorage — плохая идея?"
    answer_short: >-
      localStorage — для несекретных настроек: тема, черновик, последний фильтр.
      Токен в нём читает любой скрипт на странице, поэтому при XSS он утекает
      мгновенно. Безопаснее держать его в куке с флагом httpOnly.
    answer_detailed: |
      Что чем отличается: `localStorage` переживает перезагрузку и доступен
      скриптам; `sessionStorage` живёт до закрытия вкладки; кука уходит на
      сервер с каждым запросом и с `httpOnly` скриптам недоступна; `IndexedDB`
      нужна для больших объёмов и офлайна.

      Про токен: любой сторонний скрипт — реклама, аналитика,
      скомпрометированный пакет — читает `localStorage` без ограничений. Кука с
      `httpOnly` ему недоступна, а `SameSite` защищает и от запросов с чужих
      сайтов.

      Ещё две вещи: `localStorage` синхронный, и запись большого объёма
      подвешивает интерфейс; хранит он только строки, поэтому объекты
      сериализуют, а при чтении разбирают в `try/catch` — там может лежать что
      угодно от прошлых версий приложения.

      Во Vue сохранение настроек обычно вешают на наблюдатель за состоянием, и
      тогда стоит помнить про частоту записи: сохранять на каждое нажатие
      клавиши не нужно.
    common_mistakes:
      - Хранить токен доступа в localStorage.
      - Разбирать JSON из хранилища без обработки ошибки.
      - Писать в хранилище на каждое изменение состояния.
    follow_ups:
      - Чем httpOnly-кука безопаснее localStorage?
      - Почему чтение из хранилища оборачивают в try/catch?

  - slug: vue_rendering_pipeline_basics
    specializations: [frontend_vue]
    topic: browser
    subtopic: rendering_pipeline
    min_grade: intern
    peak_grade: intern
    max_grade: junior
    frequency: 4
    type: open_answer
    title: "Что происходит от изменения данных до появления изменений на экране?"
    answer_short: >-
      Vue замечает изменение реактивного значения, ставит компонент в очередь
      обновления, пересобирает виртуальное дерево и правит DOM. Дальше браузер
      пересчитывает стили и геометрию и перерисовывает страницу.
    answer_detailed: |
      Важная деталь: обновление DOM не мгновенное. Несколько изменений в одном
      обработчике сливаются в одно обновление, поэтому сразу после присваивания
      в DOM ещё старое значение. Чтобы дождаться, используют `nextTick`.

      ```js
      count.value++;
      await nextTick();
      // теперь DOM обновлён
      ```

      Со стороны браузера дальше идут три шага: пересчёт стилей, компоновка
      (геометрия) и отрисовка. Изменение размеров и положения запускает
      компоновку — самую дорогую часть; изменение цвета или прозрачности — нет.

      Отсюда правило анимаций: `transform` и `opacity` анимировать дёшево,
      `top`, `left` и `width` — дорого, потому что каждый кадр пересчитывается
      геометрия всей страницы.

      И про чтение размеров: обращение к ширине элемента сразу после изменения
      стилей заставляет браузер посчитать геометрию немедленно. В цикле это
      превращается в заметный тормоз.
    common_mistakes:
      - Читать DOM сразу после изменения данных, не дождавшись nextTick.
      - Анимировать свойства, вызывающие пересчёт геометрии.
      - Чередовать запись стилей и чтение размеров в цикле.
    follow_ups:
      - Зачем нужен nextTick?
      - Почему анимируют transform, а не left?

  - slug: vue_rerender_basics
    specializations: [frontend_vue]
    topic: performance
    subtopic: rerender_cost
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Когда компонент перерисовывается и почему это не всегда проблема?"
    answer_short: >-
      Когда изменилось реактивное значение, которое он читает. Vue отслеживает
      зависимости точечно, поэтому перерисовывается тот компонент, который
      действительно зависит от изменения, а не всё дерево.
    answer_detailed: |
      Этим Vue отличается от подхода, где перерисовка идёт сверху вниз: здесь
      система реактивности знает, какой компонент прочитал какое значение, и
      будит только его.

      Из этого следуют практические выводы:

      - вычисляемые свойства кешируются, и лишний пересчёт обычно не проблема;
      - проблема начинается на больших списках: тысяча строк, каждая с
        обработчиками, — это тысяча компонентов;
      - тяжёлое выражение прямо в шаблоне выполняется на каждый рендер —
        его выносят в `computed`.

      Что делать по порядку: сначала убрать лишние вычисления и вынести их в
      вычисляемые свойства, потом ограничить объём — виртуализация длинных
      списков и разбиение на страницы, и только потом тонкие приёмы.

      Мерить нужно инструментами, а не на глаз: расширение для Vue показывает,
      какие компоненты перерисовались и сколько это заняло.
    common_mistakes:
      - Вычислять тяжёлое выражение прямо в шаблоне.
      - Рисовать тысячу строк без виртуализации.
      - Оптимизировать без измерений.
    follow_ups:
      - Почему Vue не перерисовывает всё дерево?
      - Что делать с очень длинным списком?

  - slug: vue_bundle_basics
    specializations: [frontend_vue]
    topic: performance
    subtopic: bundle_size
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Почему размер бандла важен и как его уменьшают?"
    answer_short: >-
      Пока код не скачался и не выполнился, страница не отвечает на действия.
      Уменьшают ленивой загрузкой маршрутов, вынесением тяжёлых компонентов и
      отказом от лишних зависимостей.
    answer_detailed: |
      ```js
      const routes = [
        { path: '/admin', component: () => import('./AdminPage.vue') },
      ];
      ```

      Такая запись — самый дешёвый выигрыш: код админки не поедет тому, кто
      открыл каталог.

      Дальше по эффективности:

      - **тяжёлые компоненты** — редактор, графики, карта — грузят по
        требованию;
      - **зависимости** — библиотека дат на триста килобайт ради одной строки
        встречается регулярно. Анализатор бандла показывает, кто занимает место;
      - **точечные импорты** вместо импорта пакета целиком — иначе сборщик не
        может выкинуть неиспользуемое.

      Измеряют объём после сжатия и время до интерактивности на медленном
      устройстве. На быстром ноутбуке с проводным интернетом проблемы не видно
      вообще.

      И про картинки: они обычно весят больше кода, но вспоминают о них
      последними.
    common_mistakes:
      - Грузить весь код приложения одним куском.
      - Импортировать пакет целиком ради одной функции.
      - Измерять размер до сжатия и на быстром интернете.
    follow_ups:
      - Как разделить код по маршрутам?
      - Что показывает анализатор бандла?

  - slug: vue_component_structure_basics
    specializations: [frontend_vue]
    topic: architecture
    subtopic: component_design
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Когда компонент пора разделить на несколько?"
    answer_short: >-
      Когда он делает несколько разных вещей: получает данные, решает правила и
      рисует разметку. Признаки — файл не помещается на экран, состояний больше
      трёх-четырёх, и половина кода не про отображение.
    answer_detailed: |
      Полезное разделение: компонент, который знает, откуда данные, и компонент,
      который просто рисует переданное. Второй легко переиспользовать и
      проверить, потому что он ничего не знает про сеть.

      Признаки, что пора делить:

      - несколько независимых кусков состояния, не связанных между собой;
      - разметка вложена на пять уровней;
      - одна и та же часть повторяется в трёх местах с мелкими отличиями;
      - при чтении нужно держать в голове две несвязанные задачи.

      Обратная крайность реальна: компонент на десять строк, используемый в
      одном месте и принимающий восемь пропсов, добавляет файл и усложняет
      чтение. Делят по смыслу, а не по количеству строк.

      Повторяющуюся логику (не разметку) выносят в composable — это основной
      способ переиспользования во Vue. Повторяющуюся разметку — в компонент со
      слотами.
    common_mistakes:
      - Держать загрузку данных и разметку в одном большом компоненте.
      - Дробить по числу строк вместо смысла.
      - Копировать логику вместо composable.
    follow_ups:
      - Что выносят в composable, а что в компонент?
      - Почему компонент без знания о сети проще проверить?

  - slug: vue_folder_structure_basics
    specializations: [frontend_vue]
    topic: architecture
    subtopic: module_boundaries
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 3
    type: open_answer
    title: "Как разложить файлы во Vue-проекте?"
    answer_short: >-
      По областям продукта, а не по типам файлов. Папка «заказы» со своими
      компонентами, composable и запросами понятнее, чем папки «компоненты» и
      «composables», где всё перемешано.
    answer_detailed: |
      ```
      src/
        features/orders/     компоненты, composable и запросы одной области
        features/auth/
        shared/ui/           кнопки, поля, модалки
        shared/lib/
        pages/               экраны, собираемые из областей
      ```

      Почему так: задача звучит «поправить оформление заказа», а не «поправить
      все composable». При раскладке по типам одна задача заставляет прыгать по
      четырём папкам.

      Правило импортов, которое стоит завести сразу: области не лезут друг другу
      внутрь. Понадобилось «заказам» что-то из «профиля» — либо это общее и
      переезжает в `shared`, либо связь стоит пересмотреть.

      Что кладут в `shared`: то, что не знает о предметной области. Кнопка — да,
      «карточка заказа» — нет.

      Для проекта из трёх экранов такая структура избыточна: она нужна, когда
      растут и команда, и число областей.
    common_mistakes:
      - Раскладывать по типам и прыгать по папкам ради одной задачи.
      - Класть в общую папку то, что знает о предметной области.
      - Тащить сложную структуру в маленький проект.
    follow_ups:
      - Что попадает в shared, а что нет?
      - Как понять, что области слишком связаны?

  - slug: vue_component_test_basics
    specializations: [frontend_vue]
    topic: testing
    subtopic: component_tests
    min_grade: intern
    peak_grade: junior
    max_grade: junior_plus
    frequency: 4
    type: open_answer
    title: "Что проверяют в тесте Vue-компонента?"
    answer_short: >-
      Поведение с точки зрения пользователя: что видно на экране и что
      происходит после клика или ввода. Не внутренние поля и не имена методов —
      они меняются при любой переработке, а поведение остаётся.
    answer_detailed: |
      ```js
      test('показывает ошибку при пустом email', async () => {
        render(LoginForm);

        await userEvent.click(screen.getByRole('button', { name: 'Войти' }));

        expect(screen.getByText('Укажите email')).toBeInTheDocument();
      });
      ```

      Элементы ищут так, как их находит пользователь — по роли и подписи, а не
      по классу. Побочный эффект приятный: такой тест заодно проверяет
      доступность. Если кнопку нельзя найти по роли, её и программа чтения не
      найдёт.

      Чего не проверяют: что вызвался внутренний метод, что поле приняло
      определённое значение, что компонент отрендерился ровно дважды. Это детали
      реализации.

      Запросы к сети подменяют на уровне сети, а не подсовывают заглушку вместо
      модуля запросов. Тогда тест продолжает проверять настоящий путь данных,
      включая обработку кода ответа.

      И асинхронность: после действия ждут появления результата, а не
      фиксированной задержки, иначе тест начнёт падать через раз.
    common_mistakes:
      - Искать элементы по классам вместо роли и подписи.
      - Проверять внутреннее состояние компонента.
      - Ждать фиксированное время вместо появления элемента.
    follow_ups:
      - Почему поиск по роли заодно проверяет доступность?
      - Что считается деталью реализации?

  - slug: vue_soft_asking_for_help
    specializations: [frontend_vue]
    topic: soft
    subtopic: teamwork
    min_grade: intern
    peak_grade: junior
    max_grade: middle
    frequency: 4
    type: open_answer
    title: "Вы застряли на задаче. Через сколько времени и как правильно просить помощи?"
    answer_short: >-
      Обычная договорённость — от получаса до часа самостоятельных попыток,
      дальше спрашивать. Просьба содержит задачу, что уже пробовали и что
      получилось, а не «у меня не работает».
    answer_detailed: |
      ### Junior
      Молчать полдня хуже, чем спросить через час: команда теряет день, а не вы
      сохраняете лицо.

      Форма вопроса решает многое:

      > Список не обновляется после ответа сервера. Проверил, что данные
      > приходят; вижу, что присваиваю в деструктурированное поле reactive —
      > подозреваю потерю реактивности. Вот код. Туда смотрю?

      Это отвечается за минуту. «Помогите, не работает» требует пяти уточняющих
      вопросов, и каждый — отдельное переключение для того, кто помогает.

      ### Middle
      Ждут, что вы сами оцениваете цену молчания: задача на день и задача на
      спринт допускают разное время попыток. Полезная привычка — записывать, что
      уже проверено: половина проблем решается по дороге, пока формулируешь.

      ### Senior
      Ждут обратной стороны: умения принимать такие вопросы и не отбивать охоту
      их задавать. Ответ «сам разберись» экономит десять минут и стоит команде
      дня.

      Сильная версия включает системный вывод: если люди регулярно застревают в
      одном месте, дело не в людях, а в отсутствии документации или в запутанном
      коде.
    common_mistakes:
      - Молчать полдня, боясь показаться некомпетентным.
      - Спрашивать без описания того, что уже пробовали.
      - Отвечать новичкам так, что спрашивать перестают.
    follow_ups:
      - Что должно быть в хорошо сформулированном вопросе?
      - Что делать, если люди регулярно застревают на одном месте?
  # Вопросы, которые задают и джуну, и сеньору — разница в глубине ответа.

  - slug: vue_reactivity_internals
    specializations: [frontend_vue]
    topic: javascript
    subtopic: proxy_reflect
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Как устроена реактивность Vue и где она перестаёт работать?"
    answer_short: >-
      Реактивный объект — прокси: обращение к полю запоминается как
      зависимость, запись оповещает подписчиков. Ломается там, где прокси
      теряется: деструктуризация, переприсваивание, работа с исходным объектом
      напрямую.
    answer_detailed: |
      ### Junior
      Достаточно знать механику и её следствия:

      ```js
      const state = reactive({ count: 0 });
      const { count } = state;   // обычное число, связь потеряна
      state.count++;             // count не изменится
      ```

      Отсюда правило: не деструктурировать реактивные объекты. Для этого есть
      функция, превращающая поля в ссылки.

      ### Middle
      Ждут понимания, что отслеживается именно чтение во время выполнения. Если
      значение не было прочитано при вычислении, зависимости не возникнет — так
      появляются вычисляемые свойства, которые «не обновляются».

      Здесь же — про глубину: `reactive` оборачивает вложенные объекты
      рекурсивно, и для больших структур это стоит денег. Когда нужна
      реактивность только на верхнем уровне, есть поверхностные варианты.

      И про коллекции: `Map` и `Set` поддерживаются, но замена их обычными
      объектами ради «простоты» лишает точечного отслеживания.

      ### Senior
      Ждут разговора о цене и границах. Прокси перехватывает операции, и на
      горячем пути — тысячи объектов, частые обновления — это заметно. Для
      больших неизменяемых наборов данных реактивность отключают намеренно.

      Сильный ответ включает сравнение с подходом, где перерисовка идёт сверху
      вниз: точечное отслеживание даёт меньше лишней работы, но платит за это
      скрытыми зависимостями — цепочку «что от чего зависит» не видно в коде, и
      её приходится держать в голове или смотреть инструментами.
    common_mistakes:
      - Деструктурировать reactive и терять связь.
      - Оборачивать в reactive большие массивы данных, которые не меняются.
      - Считать, что зависимость появится без чтения значения.
    follow_ups:
      - Почему computed не обновляется?
      - Когда реактивность стоит отключить намеренно?

  - slug: vue_watch_vs_computed_practice
    specializations: [frontend_vue]
    topic: state_management
    subtopic: server_state
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Когда брать watch, а когда computed, и как не устроить гонку запросов?"
    answer_short: >-
      `computed` отвечает на вопрос «чему равно», `watch` — «что сделать, когда
      изменилось». Запросы делают в наблюдателе, и там же следят за порядком:
      ответ на старый запрос не должен перезаписать свежие данные.
    answer_detailed: |
      ### Junior
      Производное значение — всегда `computed`. Наблюдатель, который вычисляет
      одно поле из другого, — почти всегда лишний: он создаёт вторую правду,
      которая может разойтись.

      Наблюдатель нужен для побочных эффектов: запрос, сохранение в хранилище,
      обращение к внешней библиотеке.

      ### Middle
      Ждут понимания гонки. Пользователь быстро меняет фильтр: уходит три
      запроса, а возвращаются они в произвольном порядке. Если писать результат
      как приходит, на экране может оказаться ответ на предпоследний фильтр.

      Решения: отменять предыдущий запрос, либо запоминать номер последнего и
      игнорировать устаревшие ответы.

      Здесь же — про частоту: наблюдатель за полем ввода без ограничения шлёт
      запрос на каждую букву. Помогает задержка перед отправкой.

      ### Senior
      Ждут вывода, что это признак задачи, которую не стоит решать руками:
      кеш запросов, дедупликация, отмена, повтор и устаревание — готовая
      библиотека делает это надёжнее, чем набор наблюдателей в компонентах.

      Сильный ответ включает границу: наблюдатели остаются для интеграции с
      внешним миром — картами, редакторами, аналитикой, — а данные сервера
      живут в специализированном слое.

      Уместно и про немедленный запуск и глубокое наблюдение: оба удобны и оба
      легко превращаются в лишнюю работу, если поставлены «на всякий случай».
    common_mistakes:
      - Вычислять производное значение наблюдателем вместо computed.
      - Не отменять устаревшие запросы и получать чужой результат на экране.
      - Слать запрос на каждое нажатие клавиши.
    follow_ups:
      - Как защититься от гонки ответов?
      - Что заменяет набор наблюдателей для данных сервера?

  - slug: vue_lazy_routes_practice
    specializations: [frontend_vue]
    topic: routing
    subtopic: lazy_routes
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как организовать загрузку данных и кода при переходах между страницами?"
    answer_short: >-
      Код маршрута грузят лениво, данные — параллельно с ним, а не после.
      Пользователю показывают либо предыдущий экран с индикатором, либо скелет —
      но не пустоту, и переход не должен «прыгать» после подгрузки.
    answer_detailed: |
      ### Junior
      Базовое: маршруты объявляют через динамический импорт, тогда код каждой
      страницы едет отдельно.

      Данные грузят в компоненте после появления. Этого достаточно, пока
      страниц мало и данные лёгкие.

      ### Middle
      Ждут понимания последовательности. Наивный вариант — сначала скачать код,
      потом отрисовать компонент, потом отправить запрос — даёт две
      последовательные задержки. Лучше начинать запрос одновременно с загрузкой
      кода.

      Здесь же — предзагрузка: код страницы, на которую человек скорее всего
      перейдёт, можно подтянуть заранее, когда браузер свободен.

      И про смещение раскладки: если сначала показать пустой блок, а потом
      подставить данные, страница прыгает. Скелет нужного размера решает это.

      ### Senior
      Ждут разговора о том, что делать при отказе. Загрузка куска кода может не
      удаться — сеть пропала, выкатили новую версию и старый файл исчез. Без
      обработки это белый экран.

      Сильный ответ включает стратегию версий: у пользователя с открытой
      вкладкой после выкладки ссылки на старые файлы становятся мёртвыми, и
      приложение должно предложить перезагрузку, а не молча ломаться.

      Уместно и про измерение: сколько времени проходит от нажатия до готового
      экрана на медленном устройстве — это и есть настоящая метрика перехода.
    common_mistakes:
      - Начинать запрос данных только после отрисовки компонента.
      - Показывать пустоту вместо скелета и получать прыжок раскладки.
      - Не обрабатывать сбой загрузки куска кода.
    follow_ups:
      - Что произойдёт со старой вкладкой после выкладки новой версии?
      - Зачем предзагружать код следующего маршрута?

  - slug: vue_virtualization_practice
    specializations: [frontend_vue]
    topic: performance
    subtopic: lists_virtualization
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Список из десяти тысяч строк тормозит. Что делать?"
    answer_short: >-
      Не рисовать то, чего не видно: виртуализация оставляет в DOM только
      видимые строки. Это убирает саму работу, тогда как мемоизация и подобные
      приёмы лишь ускоряют существующую.
    answer_detailed: |
      ### Junior
      Первое, что проверяют: сколько элементов реально в DOM и что происходит в
      каждой строке. Тяжёлое выражение в шаблоне строки умножается на число
      строк.

      Простые шаги: вынести вычисления в `computed`, убрать лишние обёртки,
      поставить осмысленный `key`.

      ### Middle
      Ждут виртуализации как основного решения: в DOM держат тридцать видимых
      строк вместо десяти тысяч, остальное — пустое пространство нужной высоты.

      Здесь же альтернативы, которые часто уместнее: разбиение на страницы,
      подгрузка по мере прокрутки, поиск вместо листания. Иногда пользователю
      вообще не нужен список из десяти тысяч — ему нужен один элемент, и
      правильный ответ продуктовый.

      И честная оговорка: виртуализация усложняет доступность и поиск по
      странице браузером — это плата, о которой стоит знать заранее.

      ### Senior
      Ждут понимания, где на самом деле тормоз. Часто дело не в рендере, а в
      разборе большого JSON, в фильтрации на каждом нажатии клавиши или в
      реактивности, включённой для десяти тысяч объектов.

      Сильный ответ включает измерение до и после и мысль, что фильтрацию и
      сортировку больших наборов лучше отдать серверу: клиент не обязан держать
      их целиком.

      Уместно и про пиковую нагрузку: список редко бывает один — если на
      странице их три, экономия умножается.
    common_mistakes:
      - Начинать с мемоизации вместо сокращения числа элементов.
      - Фильтровать десять тысяч записей на каждое нажатие клавиши.
      - Игнорировать цену виртуализации для доступности.
    follow_ups:
      - Когда список лучше заменить поиском?
      - Что ещё, кроме рендера, может тормозить на больших данных?

  - slug: vue_component_api_design
    specializations: [frontend_vue]
    topic: architecture
    subtopic: component_design
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как проектировать интерфейс переиспользуемого компонента?"
    answer_short: >-
      От сценариев, а не от текущего макета. Признак хорошего интерфейса: число
      булевых флагов не растёт с каждым новым случаем, а варианты выражаются
      одним свойством с понятными значениями.
    answer_detailed: |
      ### Junior
      Тревожный признак — набор флагов: `primary`, `secondary`, `danger`,
      `small`, `large`. Комбинации бессмысленны, и компонент вынужден решать,
      что делать с `primary` и `secondary` одновременно.

      Лучше одно свойство с вариантами: `variant="danger" size="s"`.

      ### Middle
      Ждут понимания композиции. Когда компонент обрастает пропсами вроде
      `headerIcon`, `headerTitle`, `headerAction`, это признак, что вместо
      настроек нужны слоты.

      Здесь же — про значения по умолчанию: компонент должен быть полезен без
      настройки, а пропсы менять поведение, а не включать его.

      И про события: наружу отдают осмысленные имена предметной области
      (`submit`, `remove`), а не пробрасывают сырые события DOM — иначе
      внутренняя структура становится частью контракта.

      ### Senior
      Ждут разговора о совместимости. Компонент общей библиотеки — это
      обязательство: переименование пропса ломает всех, и цена ошибки растёт с
      числом использований.

      Сильный ответ включает принцип «настраиваемость по требованию»: сначала
      простой закрытый компонент, точки расширения добавляются по реальным
      запросам, а не заранее.

      Уместно и про утечку деталей: пропс со стилями внутреннего элемента
      превращает вёрстку в контракт, и переработать компонент потом невозможно.
    common_mistakes:
      - Набор булевых флагов вместо свойства с вариантами.
      - Настраивать пропсами то, что решается слотами.
      - Отдавать наружу стили и структуру внутренних элементов.
    follow_ups:
      - Почему пропс со стилями мешает переработке?
      - Когда пропсы стоит заменить слотами?

  - slug: vue_ssr_tradeoffs
    specializations: [frontend_vue]
    topic: architecture
    subtopic: rendering_strategies
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Чем серверный рендеринг отличается от клиентского и когда он нужен?"
    answer_short: >-
      При клиентском браузер получает пустую страницу и собирает её сам, при
      серверном разметка приходит готовой и оживает после загрузки скриптов.
      Серверный нужен там, где важны первый показ и индексация.
    answer_detailed: |
      ### Junior
      Что видно пользователю: клиентский рендеринг показывает белый экран или
      скелет, пока не скачается и не выполнится код; серверный отдаёт готовую
      разметку сразу.

      Отсюда критерий: публичные страницы, которые должны быстро показываться и
      попадать в поиск, лучше рендерить на сервере. Личный кабинет за логином —
      не обязательно.

      ### Middle
      Ждут понимания, что это не бесплатно. Сервер выполняет рендер на каждый
      запрос, а браузер потом всё равно оживляет разметку: до этого момента
      страница выглядит готовой, но не отвечает на клики.

      Здесь же — про статическую генерацию: страницы собираются заранее и
      раздаются как файлы, но данные фиксируются на момент сборки. Решается
      перегенерацией по расписанию или по событию.

      И про то, что стратегия выбирается на страницу, а не на приложение.

      ### Senior
      Ждут разговора о цене эксплуатации: серверный рендеринг требует
      работающего сервера, кеширования и плана на отказ; статика раздаётся с
      сети доставки и почти не ломается.

      Сильный ответ включает подводные камни: несовпадение разметки сервера и
      клиента, обращения к объектам браузера в коде, который выполняется на
      сервере, и утечки состояния между запросами, если стор создаётся один раз
      на процесс.

      И честное замечание: большинство проблем со скоростью решается не сменой
      стратегии, а размером бандла и числом запросов.
    common_mistakes:
      - Считать серверный рендеринг бесплатным ускорением.
      - Обращаться к window в коде, выполняемом на сервере.
      - Создавать стор один раз на процесс и делить его между запросами.
    follow_ups:
      - Почему страница выглядит готовой, но не отвечает?
      - Чем опасен общий стор при серверном рендеринге?

  - slug: vue_testing_strategy
    specializations: [frontend_vue]
    topic: testing
    subtopic: mocking_network
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Что покрывать тестами во фронтенде, а что нет?"
    answer_short: >-
      Логику, где легко ошибиться: расчёты, преобразование данных, ветвления
      состояний, формы. Разметку саму по себе — нет. Поверх — несколько сквозных
      сценариев на пути, которые нельзя ломать.
    answer_detailed: |
      ### Junior
      Ориентир: тест должен ломаться, когда ломается поведение, и не ломаться от
      перестановки разметки.

      Поэтому проверяют «после отправки формы с пустым email видно сообщение об
      ошибке», а не «вызвался внутренний метод».

      ### Middle
      Ждут понимания уровней: юнит-тесты для функций и composable; тесты
      компонентов для поведения экрана с подменённой сетью; сквозные — для
      нескольких критичных путей.

      Сквозных делают немного: они медленные и нестабильные. Набор, падающий
      через раз, перестают смотреть, и вместе с ним перестают замечать
      настоящие поломки.

      Подмена сети — на уровне протокола, а не подсовыванием заглушки вместо
      модуля запросов: тогда проверяется настоящий путь данных, включая коды
      ответа и ошибки.

      ### Senior
      Ждут связи с архитектурой: если логика размазана по компонентам, дешёвых
      тестов не получится, и команда обречена на медленный сквозной набор.

      Сильный ответ включает мысль, что покрытие — не цель: девяносто процентов
      строк, покрытых тестами без осмысленных проверок, дают ложное
      спокойствие.

      Уместно и про регрессии внешнего вида: их ловят сравнением снимков, и это
      отдельный инструмент со своей ценой и своим шумом.
    common_mistakes:
      - Гнаться за процентом покрытия.
      - Держать большой набор нестабильных сквозных тестов.
      - Подменять модуль запросов вместо самой сети.
    follow_ups:
      - Почему сквозных тестов делают мало?
      - Чем ловят регрессии внешнего вида?

  - slug: vue_error_states_practice
    specializations: [frontend_vue]
    topic: testing
    subtopic: e2e
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как показывать состояния загрузки, пустоты и ошибки, чтобы интерфейс не врал?"
    answer_short: >-
      У каждого асинхронного участка четыре состояния: идёт загрузка,
      получилось, пусто, не получилось. Все четыре проектируют. Ошибку
      показывают с действием — повтором, а не абзацем извинений.
    answer_detailed: |
      ### Junior
      Чаще всего забывают пустоту: список без элементов и список, который не
      загрузился, должны выглядеть по-разному. Первый — нормальная ситуация со
      своим текстом, второй — сбой.

      Ошибка сопровождается кнопкой «Повторить»: она полезнее любых объяснений.

      ### Middle
      Ждут понимания мерцания: если данные приходят за сто миллисекунд, спиннер
      успевает мигнуть и раздражает. Индикатор показывают с задержкой, а скелет
      делают похожим на будущий контент, чтобы страница не прыгала.

      Здесь же — про сообщения: техническая ошибка сети человеку ничего не
      говорит. Он должен узнать, что произошло и что делать, а подробности идут
      в журнал.

      И про частичный отказ: один из трёх запросов не удался — экран показывает
      то, что есть, и честно отмечает, чего не хватает.

      ### Senior
      Ждут наблюдаемости на клиенте: без сбора ошибок с устройств команда
      узнаёт о поломке от пользователей, и то не сразу.

      Сильный ответ включает обработчик верхнего уровня: одна упавшая карточка
      не должна ронять весь экран, а необработанная ошибка — оставлять белую
      страницу.

      Уместно и про повторы: автоматический повтор помогает при сетевых сбоях,
      но на неидемпотентных действиях создаёт дубли, и это решается на стороне
      API ключом идемпотентности.
    common_mistakes:
      - Показывать пустой список и ошибку одинаково.
      - Показывать пользователю техническое сообщение.
      - Повторять неидемпотентный запрос автоматически.
    follow_ups:
      - Зачем задерживать показ индикатора?
      - Чем опасен автоматический повтор?

  - slug: vue_soft_deadline_pressure
    specializations: [frontend_vue]
    topic: soft
    subtopic: conflict
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Дизайнер просит анимацию, менеджер торопит со сроком, а экран тормозит. Что делаете?"
    answer_short: >-
      Переводите разговор из «кто прав» в измеримое: что именно тормозит, на
      каких устройствах, сколько стоит починка и что теряется при отказе от
      анимации. Решение принимается по цифрам, а не по громкости.
    answer_detailed: |
      ### Junior
      Первое — не спорить вслепую. Замер на среднем устройстве превращает
      «кажется, тормозит» в факт: столько-то миллисекунд, столько-то
      пропущенных кадров.

      Дальше показать варианты: анимация дешевле на прозрачности и
      трансформации; список можно виртуализировать; часть работы вынести.

      ### Middle
      Ждут умения предложить компромисс с условием возврата: «сделаем проще
      сейчас, вернёмся через месяц» — с записанной задачей, а не устно.

      Здесь же — про принадлежность решения: инженер отвечает за честную оценку
      последствий, приоритет — ответственность продукта.

      ### Senior
      Ждут системного взгляда: если такие столкновения повторяются, дело в
      отсутствии договорённостей о качестве. Бюджет на скорость, проверка в
      конвейере, критерий готовности превращают спор в правило.

      Сильный ответ включает работу с ожиданиями заранее: показать стоимость
      анимации на этапе макета дешевле, чем спорить после разработки.

      И честность в обе стороны: иногда правильный ответ — сделать как просят,
      потому что цена спора выше разницы между вариантами.
    common_mistakes:
      - Спорить об ощущениях без измерений.
      - Соглашаться на «починим потом» без записи.
      - Считать выбор приоритета своей зоной ответственности.
    follow_ups:
      - Как договориться о бюджете производительности?
      - Когда стоит согласиться на худший вариант?
