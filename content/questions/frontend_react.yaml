  - slug: react_design_system_ownership
    specializations: [frontend_react]
    topic: architecture
    subtopic: design_system
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как вы вводили дизайн-систему и как она не превратилась в мёртвую библиотеку?"
    answer_short: >-
      Ждут не списка компонентов, а процесса: кто владеет, как принимаются
      изменения, как выпускаются версии и как продуктовые команды получают
      нужное, не форкая всё подряд.
    answer_detailed: |
      Что отличает работающую систему от папки с кнопками.

      **Она растёт из продукта, а не из макета.** Компонент попадает в
      библиотеку, когда его просят второй-третий раз, а не когда дизайнер
      нарисовал ещё одну карточку.

      **У неё есть владелец и правила приёма.** Иначе получается набор
      компонентов с тремя разными кнопками, каждая из которых кому-то удобна.

      **Она версионируется как публичная библиотека.** Ломающее изменение
      нельзя выкатить молча: у потребителей должен быть путь миграции и время.

      **У неё есть точки расширения.** Полностью закрытый компонент вынуждает
      команды форкать; полностью открытый превращает внутреннюю структуру в
      контракт. Обычно помогает композиция вместо настроек и явно объявленные
      места для вставки.

      **Токены важнее компонентов.** Цвета, отступы, типографика, радиусы —
      именно они дают единообразие. Продукт, где токены общие, а компоненты
      частично свои, выглядит цельно; обратное — нет.

      Как измеряют пользу: доля экранов на компонентах системы, время на новый
      экран, число форков. Без этого разговор скатывается в оценку красоты.

      И признак провала, который стоит назвать честно: если команды обходят
      библиотеку, дело не в их дисциплине, а в том, что она не закрывает их
      случаи или мешает.
    common_mistakes:
      - Начинать с библиотеки компонентов до появления повторов.
      - Выкатывать ломающие изменения без пути миграции.
      - Объяснять форки недисциплинированностью команд.
    follow_ups:
      - Как понять, что дизайн-система не работает?
      - Почему токены важнее набора компонентов?

  - slug: react_migration_strategy
    specializations: [frontend_react]
    topic: architecture
    subtopic: module_boundaries
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как вы проводили крупную миграцию во фронтенде — версии React, сборщика или фреймворка?"
    answer_short: >-
      Ждут плана с работающим приложением на каждом шаге: обоснование в
      издержках, постепенный переход вместо долгоживущей ветки, измеримый
      прогресс и возможность отката.
    answer_detailed: |
      **Обоснование в величинах.** «Версия снята с поддержки», «сборка занимает
      двенадцать минут и съедает день команды в неделю», «библиотеки перестали
      выходить под нашу версию» — это разговор с бизнесом. «Хочется на свежее» —
      нет.

      **Постепенность вместо большого переключения.** Долгоживущая ветка
      миграции конфликтует со всем, что пишут остальные, и не доезжает.
      Работает обратное: сосуществование старого и нового, перевод по маршрутам
      или по областям, флаг для переключения.

      **Измеримый прогресс.** Доля страниц на новом стеке, число оставшихся
      использований старого API — то, что видно на панели и не зависит от
      ощущений.

      **Откат.** Возможность вернуть трафик на старую версию переключателем, а
      не выкладкой.

      **Автоматизация рутины.** Кодмоды переписывают механические изменения
      надёжнее людей и не устают на пятисотом файле.

      Отдельно про честность цены: такая работа не даёт пользователю новых
      возможностей. Её ведут долей мощности команды постоянно, а не отдельным
      «проектом миграции», который первым попадает под сокращение при
      изменении приоритетов.

      И признание, когда мигрировать не надо: если старое решение работает, а
      новое даёт только моду, миграция — это трата, замаскированная под
      развитие.
    common_mistakes:
      - Вести миграцию в долгоживущей ветке.
      - Обосновывать миграцию модой, а не издержками.
      - Переписывать механические изменения руками вместо кодмодов.
    follow_ups:
      - Как обеспечить возможность отката?
      - Когда от миграции стоит отказаться?

  - slug: react_performance_budget
    specializations: [frontend_react]
    topic: performance
    subtopic: core_web_vitals
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как вы держите скорость приложения под контролем, а не чините её раз в полгода?"
    answer_short: >-
      Через измеримые цели и проверку в конвейере: бюджет на размер бандла и
      на ключевые метрики, замер на настоящих пользователях, а не на своём
      ноутбуке, и блокировка изменений, которые бюджет превышают.
    answer_detailed: |
      **Метрики со стороны пользователя.** Время до отрисовки основного
      содержимого, задержка отклика на действие, смещение раскладки. Не «сколько
      весит бандл» само по себе, а что человек чувствует.

      **Данные с настоящих устройств.** Лабораторные замеры показывают, что
      сломалось; полевые — кому и насколько плохо. Разработчик с быстрым
      ноутбуком и проводным интернетом не увидит проблему вообще.

      **Бюджет и проверка в конвейере.** Изменение, которое добавляет к бандлу
      сто килобайт, должно потребовать явного решения, а не проехать незаметно.
      Иначе приложение тяжелеет по чуть-чуть и однажды становится медленным без
      единой виноватой правки.

      **Работа с причинами, а не симптомами.** Разделение по маршрутам, ленивая
      загрузка, отказ от лишних зависимостей, виртуализация списков — всё это
      убирает работу. Мемоизация лишь ускоряет уже существующую.

      **Приоритет по деньгам и людям.** Ускорять стоит то, что чаще всего
      открывают, и там, где связь со скоростью и конверсией доказана
      измерением, а не верой.

      Что стоит сказать отдельно: скорость — не разовый проект. Как только
      проверка исчезает из конвейера, всё возвращается за пару кварталов.
    common_mistakes:
      - Мерить скорость только на своей машине.
      - Оптимизировать без бюджета и проверки в конвейере.
      - Начинать с мемоизации вместо сокращения работы.
    follow_ups:
      - Чем полевые измерения отличаются от лабораторных?
      - Что происходит, когда проверка исчезает из конвейера?

  - slug: react_frontend_scaling_team
    specializations: [frontend_react]
    topic: architecture
    subtopic: module_boundaries
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как организовать фронтенд, когда над ним работает несколько команд?"
    answer_short: >-
      Через явные границы владения и контракты между областями. Технические
      варианты — монорепозиторий с границами импортов, отдельные пакеты,
      микрофронтенды — выбираются по цене независимого выпуска, а не по моде.
    answer_detailed: |
      **Границы по областям продукта, а не по слоям.** Команда владеет
      «оформлением заказа» целиком, а не «всеми формами». Иначе любая задача
      требует согласования трёх команд.

      **Правила импортов, проверяемые автоматически.** Договорённость, которую
      не проверяет линтер, живёт до первого дедлайна.

      **Общее — минимально и сознательно.** Дизайн-система, утилиты, клиент
      сети. Всё остальное — внутри области. Разросшийся общий слой связывает
      команды сильнее, чем прямые импорты.

      **Микрофронтенды — не архитектура по умолчанию.** Они дают независимый
      выпуск и разные версии стека — и приносят разъезжающиеся зависимости,
      тяжёлые страницы и сложную отладку. Брать их стоит, когда независимость
      выпуска действительно нужна и её нельзя получить проще.

      **Монорепозиторий с хорошим сборщиком** решает большинство задач: общий
      код без публикации пакетов, атомарные изменения через границы, единая
      проверка. Цена — общий конвейер и дисциплина владения.

      Что стоит сказать про людей: архитектура повторяет структуру команд.
      Пытаться сделать модульный продукт при размытом владении бесполезно —
      сначала владение, потом границы в коде.
    common_mistakes:
      - Делить фронтенд по слоям вместо областей продукта.
      - Держать правила импортов договорённостью без проверки.
      - Брать микрофронтенды без потребности в независимом выпуске.
    follow_ups:
      - Когда микрофронтенды оправданы?
      - Почему общий слой связывает команды?

  - slug: react_state_architecture_choice
    specializations: [frontend_react]
    topic: state_management
    subtopic: derived_state
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Как выбрать подход к состоянию для нового большого приложения?"
    answer_short: >-
      От характера данных, а не от популярности библиотеки. Кеш сервера,
      клиентское состояние экрана, глобальные настройки и состояние в адресной
      строке — четыре разные задачи, и решать их одним инструментом не нужно.
    answer_detailed: |
      **Разделение по природе данных.**

      - данные сервера — библиотека кеша запросов;
      - состояние экрана — локальное состояние компонентов;
      - настройки уровня приложения — контекст;
      - фильтры, вкладки, страница списка — адресная строка.

      Последнее упускают чаще всего, а оно решает сразу несколько задач:
      ссылку можно отправить коллеге, кнопка «назад» работает как ожидается,
      перезагрузка не сбрасывает выбор.

      **Производное состояние не хранят.** Значение, выводимое из других, при
      хранении рано или поздно рассинхронизируется. Его вычисляют.

      **Глобальный стор — не отправная точка.** Он уместен для сложного
      клиентского состояния, которое меняется часто и нужно многим: редактор,
      корзина, сложная форма мастера. Для остального он добавляет файлы и
      усложняет чтение.

      **Цена выбора.** Библиотеку состояния меняют не за спринт: она пронизывает
      код. Поэтому решение принимается по характеру приложения, а не по тому,
      что обсуждали на конференции.

      Что стоит сказать про команду: важнее единообразие. Три подхода к
      состоянию в одном проекте дороже, чем неидеальный, но общий.
    common_mistakes:
      - Хранить фильтры списка в сторе вместо адресной строки.
      - Держать производные значения в состоянии.
      - Заводить глобальный стор с первого дня.
    follow_ups:
      - Что выигрывает состояние, вынесенное в адресную строку?
      - Почему единообразие важнее идеального выбора?

  - slug: react_concurrent_features
    specializations: [frontend_react]
    topic: react
    subtopic: reconciliation
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Что дают конкурентные возможности React и когда они действительно нужны?"
    answer_short: >-
      Возможность прервать и отложить рендер: срочное обновление (ввод текста)
      обрабатывается сразу, несрочное (тяжёлый список) — когда есть время.
      Нужны там, где тяжёлый рендер конкурирует с вводом пользователя.
    answer_detailed: |
      **Что изменилось.** Раньше рендер был неделимым: начавшись, он занимал
      главный поток до конца, и ввод замирал. Конкурентный рендер можно
      прервать и продолжить, отдав приоритет реакции на действие.

      **Где это заметно.** Поиск по большому списку: пользователь печатает,
      поле обновляется мгновенно, а результаты пересчитываются с отставанием и
      не блокируют ввод. Это разметка приоритетов, а не ускорение — суммарной
      работы меньше не становится.

      **Границы ожидания.** Механизм приостановки позволяет показать запасной
      вариант, пока часть дерева не готова, и не превращать экран в мозаику из
      спиннеров.

      **Когда не нужны.** Если экран лёгкий, а данные приходят быстро, всё это
      не даст ничего, кроме усложнения. Как и любые приоритеты, они полезны
      только при нехватке ресурса.

      **Что стоит понимать про переход.** Значительная часть выигрыша достаётся
      бесплатно при обновлении версии, а тонкая настройка приоритетов нужна
      единицам мест в приложении. Расставлять её везде — та же ошибка, что и
      мемоизировать всё подряд.

      Честная оговорка: до конкурентных возможностей стоит дойти после того,
      как решены размер бандла и количество запросов. Они дают больше и стоят
      дешевле.
    common_mistakes:
      - Считать конкурентный рендер ускорением, а не расстановкой приоритетов.
      - Размечать приоритеты по всему приложению.
      - Браться за них раньше базовых вещей вроде размера бандла.
    follow_ups:
      - Почему суммарная работа не уменьшается?
      - Что решают раньше конкурентных возможностей?

  - slug: react_web_security_practice
    specializations: [frontend_react]
    topic: browser
    subtopic: web_security
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "От каких атак защищается фронтенд и что здесь на стороне клиента, а что нет?"
    answer_short: >-
      Клиент отвечает за то, чтобы не создавать дыр: не вставлять чужой HTML,
      не хранить секреты, не доверять данным. Проверка прав и валидация — на
      сервере: любой запрет в браузере обходится через инструменты разработчика.
    answer_detailed: |
      ### Middle
      Три вещи, которые обязан назвать любой, кто писал боевой фронтенд.

      **XSS.** Чужой скрипт выполняется в контексте страницы и получает всё, до
      чего дотягивается: токены, куки без защиты, действия от имени
      пользователя. React экранирует текст по умолчанию — дыру обычно
      открывают вручную вставкой готовой разметки или ссылками вида
      `javascript:`.

      **Секреты.** Всё, что попало в бандл, публично. Ключ стороннего сервиса в
      переменной окружения фронтенда — это ключ, опубликованный в интернете.

      **Граница ответственности.** Скрытая кнопка не защищает действие; проверка
      формы не заменяет проверку на сервере; «только для авторизованных» в
      маршрутизаторе — удобство, а не безопасность. Всё это обходится через
      инструменты разработчика за минуту.

      ### Senior
      Ждут понимания механизмов, а не списка страшных слов.

      **CSRF.** Чужой сайт заставляет браузер выполнить запрос с вашими куками.
      Лечится на сервере — токенами и правильным `SameSite`, а не в React-коде.
      Отсюда же выбор хранения токена: кука с `httpOnly` против localStorage —
      это выбор между защитой от XSS и защитой от CSRF, и он делается
      осознанно.

      **Политика безопасности содержимого.** Ограничивает, откуда вообще можно
      исполнять код, и превращает найденную XSS из катастрофы в неприятность.
      Внедряется постепенно: сначала режим отчётов, потом запрет.

      **Цепочка поставки.** Пакет с миллионом установок может получить
      вредоносное обновление. Фиксация версий, проверка уязвимостей в конвейере
      и осторожность с транзитивными зависимостями — часть работы, а не
      паранойя.

      Сильный ответ формулирует границу прямо: клиент отвечает за удобство и за
      то, чтобы не создать дыру; за запреты отвечает сервер.
    common_mistakes:
      - Вставлять готовую разметку из внешнего источника.
      - Считать скрытые в интерфейсе действия защищёнными.
      - Держать ключи сторонних сервисов в переменных сборки фронтенда.
    follow_ups:
      - Где по-настоящему проверяются права?
      - Что даёт политика безопасности содержимого?

  - slug: react_soft_leading_frontend
    specializations: [frontend_react]
    topic: soft
    subtopic: teamwork
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как вы поднимаете качество фронтенда в команде, где сроки всегда горят?"
    answer_short: >-
      Через встроенные в процесс проверки, а не призывы: линтер, проверка
      доступности и бюджета в конвейере, шаблоны и общие компоненты. Качество,
      которое зависит от дисциплины людей под давлением, не держится.
    answer_detailed: |
      **Автоматика вместо напоминаний.** Форматирование, линтер, типы, бюджет
      размера, проверка доступности — то, что делает машина, не обсуждается в
      ревью и не забывается в спешке.

      **Правильный путь — самый простой.** Если общий компонент есть и он
      удобен, его возьмут. Если проще скопировать чужую вёрстку, скопируют.
      Задача ведущего — сделать удобным то, что правильно.

      **Ревью про содержание.** Когда стиль проверяет машина, у людей остаётся
      время на настоящие вопросы: границы модулей, состояния ошибок, названия.

      **Долг под контролем, а не под запретом.** Сознательное решение
      «упростим сейчас, вернёмся через месяц» с записью и сроком — нормальная
      инженерная практика. Плохо, когда таких решений никто не фиксирует.

      **Измеримость.** Доля экранов на общих компонентах, число нестабильных
      тестов, время сборки, размер бандла — то, что показывает движение и
      позволяет говорить с бизнесом.

      И про людей: качество растёт, когда разбор ошибок идёт без поиска
      виноватых. В команде, где за поломку наказывают, о проблемах узнают
      последними.
    common_mistakes:
      - Держать качество на дисциплине вместо проверок в конвейере.
      - Копить долг без фиксации и сроков.
      - Обсуждать в ревью то, что должна проверять машина.
    follow_ups:
      - Что должно проверяться автоматически?
      - Как фиксируют осознанный технический долг?

  - slug: react_soft_working_with_design
    specializations: [frontend_react]
    topic: soft
    subtopic: teamwork
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как вы выстраиваете работу с дизайнерами, чтобы макеты не расходились с реальностью?"
    answer_short: >-
      Через общий язык токенов и раннее обсуждение. Инженер приходит до
      отрисовки всех экранов — с вопросами про состояния, пустые данные,
      ошибки, длинный текст и узкие экраны, а не после сдачи макета.
    answer_detailed: |
      **Общие токены.** Когда цвета, отступы и типографика в макете и в коде —
      одни и те же именованные значения, расхождение перестаёт быть темой для
      спора. Без этого «отступ 18 или 20» обсуждается вечно.

      **Состояния, которых нет в макете.** Пустой список, ошибка загрузки,
      очень длинное имя, отсутствующая картинка, узкий экран. Их почти всегда
      забывают, и они всплывают в конце, когда времени нет. Спросить про них
      стоит на этапе макета.

      **Раннее участие.** Пять минут на этапе идеи экономят день переделки:
      инженер видит, что этот блок потребует отдельного запроса, а этот
      компонент уже есть в системе почти таким же.

      **Общий словарь компонентов.** Когда в макете и в коде одинаковые имена,
      передача перестаёт быть переводом с языка на язык.

      **Что делать с расхождениями.** Не молча «поправить как удобно» и не
      воспроизводить пиксель в пиксель ценой недели. Показать цену и предложить
      вариант: обычно дизайнеру важна суть, а не конкретное значение.

      И про уважение к чужой работе: «так нельзя сделать» почти всегда означает
      «дорого». Разница между этими фразами определяет, будут ли с вами
      обсуждать что-то заранее.
    common_mistakes:
      - Приходить к дизайнеру после сдачи макетов.
      - Обсуждать отступы вместо введения общих токенов.
      - Говорить «невозможно» там, где речь о цене.
    follow_ups:
      - Какие состояния обычно забывают в макетах?
      - Что даёт общий словарь компонентов?

  - slug: react_incident_frontend
    specializations: [frontend_react]
    topic: testing
    subtopic: e2e
    min_grade: senior
    peak_grade: lead
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Выкатили релиз, у части пользователей белый экран. Ваши действия?"
    answer_short: >-
      Сначала вернуть работоспособность — откатом или отключением флага, потом
      разбираться. Дальше понять охват по данным, а не по жалобам, и закрыть
      дыру, из-за которой поломка доехала до людей.
    answer_detailed: |
      **Порядок действий.** Восстановление раньше диагностики. Откат выкладки
      или выключение флага возвращает людям работающий продукт, а расследование
      никуда не убежит.

      **Охват по данным.** Сбор ошибок с клиентов отвечает, у скольких людей и
      на каких браузерах проблема. Без него команда ориентируется на жалобы, а
      жалуется малая доля.

      **Типичные причины белого экрана.** Ошибка в рендере без границы ошибок;
      несовместимый синтаксис для старых браузеров; сломанная загрузка кусков
      бандла после выкладки, когда у пользователя открыта старая вкладка;
      неожиданная форма ответа сервера.

      **Что чинят после.** Не только конкретную ошибку. Граница ошибок, чтобы
      падало поддерево, а не приложение; постепенная выкладка, чтобы поломка
      доставалась одному проценту; проверка на настоящих браузерах в конвейере.

      **Разбор без виноватых.** Вопрос не «кто выкатил», а «почему это дошло до
      пользователей»: чего не хватило в проверках, в тестах, в выкладке.

      Сильный ответ включает мысль, что нулевого числа инцидентов не бывает, и
      цель — сократить время до восстановления, а не обещать безошибочность.
    common_mistakes:
      - Начинать с поиска причины вместо восстановления.
      - Оценивать охват по числу жалоб.
      - Чинить конкретную ошибку, не закрывая путь её попадания в бой.
    follow_ups:
      - Почему у пользователя со старой вкладкой ломается загрузка кусков?
      - Что меняют после инцидента, кроме самой ошибки?
  - slug: react_contrast_and_visual_a11y
    specializations: [frontend_react]
    topic: accessibility
    subtopic: contrast
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Что проверяют в оформлении, кроме контраста текста?"
    answer_short: >-
      Что смысл не передаётся одним цветом, что интерфейс переживает увеличение
      шрифта и масштаба, что состояния различимы не только оттенком и что
      анимация отключается, если человек её отключил в системе.
    answer_detailed: |
      ### Junior
      Контраст — минимум, а не всё. Обязательная пара правил: текст читаем на
      своём фоне, и статус не передаётся одним цветом. Красная и зелёная точки
      без подписи и формы неразличимы для части людей.

      То же с ошибками полей: красная рамка без текста ошибки ничего не
      сообщает.

      ### Middle
      Ждут понимания, что интерфейс должен переживать изменение размеров.
      Пользователь увеличил шрифт в системе или масштаб страницы до двухсот
      процентов — вёрстка на фиксированных высотах ломается, текст обрезается.
      Отсюда предпочтение относительных единиц и отказ от жёстких высот у
      блоков с текстом.

      Здесь же — уважение к системным настройкам: если человек попросил
      уменьшить движение, параллаксы и большие анимации нужно выключить.
      Проверяется это одним медиавыражением.

      И контраст не только у текста: границы полей, иконки, состояния фокуса
      тоже должны быть различимы.

      ### Senior
      Ждут встроенности в процесс: контраст задаётся токенами, а не подбирается
      на глаз в каждом макете. Тогда правило соблюдается по умолчанию, а не
      проверяется постфактум.

      Сильный ответ включает границы автоматики: она поймает контраст и
      отсутствие подписи, но не скажет, понятен ли текст ошибки и логичен ли
      порядок обхода. Часть проверок остаётся ручной, и её планируют, а не
      надеются на неё.
    common_mistakes:
      - Передавать статус одним цветом без подписи или формы.
      - Верстать текстовые блоки фиксированной высотой.
      - Игнорировать системную настройку уменьшенного движения.
    follow_ups:
      - Что произойдёт с вёрсткой при масштабе 200%?
      - Почему контраст стоит задавать токенами?

  - slug: react_test_flakiness
    specializations: [frontend_react]
    topic: testing
    subtopic: e2e
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Тест падает через раз. Что вы с этим делаете?"
    answer_short: >-
      Разбираются в причине, а не добавляют ожидание на всякий случай.
      Нестабильность почти всегда означает гонку: тест проверяет результат
      раньше, чем он появился, или зависит от порядка и общего состояния.
    answer_detailed: |
      ### Junior
      Типичные причины: ожидание фиксированного времени вместо ожидания
      появления элемента; неубранное состояние от предыдущего теста; запрос,
      который иногда успевает, а иногда нет.

      Правильный инструмент — ожидание условия: «дождись, пока появится текст»,
      а не «подожди триста миллисекунд». Второе на медленной машине конвейера
      всё равно сломается.

      ### Middle
      Ждут понимания, что нестабильный тест хуже отсутствующего: на него
      перестают смотреть, а вместе с ним перестают замечать настоящие падения.

      Отсюда рабочее правило: тест, падающий через раз, чинят или удаляют, но
      не оставляют. Повторный прогон как способ «починки» прячет проблему,
      которая обычно есть и в самом приложении — та же гонка, просто у
      пользователя она случается реже.

      Здесь же — изоляция: каждый тест сам готовит своё состояние и не зависит
      от порядка выполнения. Общая база или общий стор между тестами — источник
      плавающих падений.

      ### Senior
      Ждут работы с этим как с процессом: нестабильные тесты помечаются,
      считаются и разбираются, а не терпятся годами. Метрика доли падений по
      тесту показывает, где проблема, лучше любых ощущений.

      Сильный ответ включает мысль, что стабильность набора — вопрос доверия к
      конвейеру. Как только команда начинает перезапускать сборку по привычке,
      конвейер перестаёт быть защитой и становится ритуалом.
    common_mistakes:
      - Добавлять фиксированные задержки вместо ожидания условия.
      - Чинить нестабильность повторным прогоном.
      - Оставлять общее состояние между тестами.
    follow_ups:
      - Почему повторный прогон прячет проблему приложения?
      - Как измерять нестабильность набора?
