# Банк вопросов для analysis_system.
#
# Это данные, а не код. Все вопросы загружаются сидом с is_verified=false:
# проверенным вопрос становится только после ревью человеком (CLAUDE.md §8.1).
#
# Специфика раздела: системного аналитика проверяют не на знание нотаций,
# а на способность довести размытое желание до однозначной постановки и
# спроектировать обмен между системами так, чтобы он пережил сбои. Поэтому
# большинство вопросов сформулировано как рабочая ситуация, а не как термин.

version: 1

questions:
  # --- Требования -------------------------------------------------------------

  - slug: sa_requirements_ambiguity
    specializations: [analysis_system]
    topic: requirements
    subtopic: functional
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: open_answer
    title: "Заказчик говорит: «нужно, чтобы отчёт формировался быстро». Что вы сделаете с этой формулировкой?"
    answer_short: >-
      Переведу в проверяемое: какой отчёт, при каком объёме данных, за сколько
      секунд, в каком проценте случаев. «Быстро» невозможно ни разработать, ни
      протестировать, ни принять — это не требование, а пожелание.
    answer_detailed: |
      ### Junior
      Вопросы для уточнения: какой именно отчёт, сколько строк в нём обычно и в
      пиковом случае, что считается приемлемым временем, что происходит при
      превышении.

      Результат должен звучать проверяемо: «отчёт по продажам за месяц
      (до 200 тысяч строк) формируется не дольше 10 секунд в 95% случаев».

      ### Middle
      Признак хорошего требования — его можно однозначно проверить, и два
      человека поймут одинаково. Слова-маркеры размытости: быстро, удобно,
      надёжно, интуитивно, оптимально, при необходимости.

      Отдельно фиксируют поведение при нарушении: показать индикатор, отправить
      отчёт на почту, отказать с понятным сообщением. Без этого разработчик
      придумает поведение сам.

      ### Senior
      Ждут понимания, что за просьбой обычно стоит боль, а не техническое
      требование. «Быстро» может означать «я не могу оторваться от экрана на
      минуту» — и тогда решением будет не оптимизация, а формирование в фоне с
      уведомлением.

      Поэтому уточнение начинается не с цифр, а с вопроса, что человек делает
      с отчётом и что мешает сейчас. Цифры появляются потом и уже осмысленные.
    common_mistakes:
      - Записывать пожелание заказчика дословно как требование.
      - Придумывать числа самостоятельно, не согласовав.
      - Не описывать поведение при нарушении требования.
    follow_ups:
      - Как отличить проверяемое требование от пожелания?
      - Почему уточнение начинается не с цифр?

  - slug: sa_non_functional
    specializations: [analysis_system]
    topic: requirements
    subtopic: non_functional
    min_grade: junior_plus
    peak_grade: middle_plus
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Какие нефункциональные требования важно зафиксировать для нового сервиса и почему их часто забывают?"
    answer_short: >-
      Нагрузка и время отклика, доступность, объём и рост данных, безопасность и
      разграничение прав, локализация, требования к логам и восстановлению.
      Забывают потому, что заказчик о них не думает — они очевидны для него и
      неочевидны для разработчика.
    answer_detailed: |
      ### Junior
      Функциональное требование отвечает на вопрос «что система делает»,
      нефункциональное — «насколько хорошо». Второе редко звучит в разговоре, но
      определяет архитектуру.

      ### Middle
      Минимальный список для нового сервиса:

      - ожидаемая нагрузка сейчас и через год;
      - допустимое время отклика и доля запросов, которая должна в него
        укладываться;
      - допустимое время недоступности;
      - объём данных и срок их хранения;
      - кто и что вправе видеть и менять;
      - требования регуляторов, если данные персональные.

      Нефункциональные требования влияют на решения сильнее функциональных:
      требование доступности 99.99% меняет архитектуру целиком, а новое поле в
      форме — нет.

      ### Senior
      Ждут понимания, что их нужно не спрашивать, а предлагать. Вопрос «какая
      вам нужна доступность» даёт ответ «стопроцентная». Продуктивнее показать
      варианты с последствиями: «99.9% означает до восьми часов простоя в год и
      такую-то стоимость; 99.99% — сорок минут и вдвое дороже».

      Второй сюжет — проверяемость. Требование доступности без описания способа
      измерения бессмысленно: считаем по минутам или по доле неуспешных
      запросов, учитываем ли плановые работы. Эти детали и определяют, будет ли
      требование выполнено формально или по существу.
    common_mistakes:
      - Ждать, что заказчик сам назовёт нефункциональные требования.
      - Записывать доступность без способа её измерения.
      - Не показывать стоимость повышенных требований.
    follow_ups:
      - Как измеряется доступность и что в неё входит?
      - Почему нефункциональные требования влияют на архитектуру сильнее?

  - slug: sa_acceptance_criteria
    specializations: [analysis_system]
    topic: requirements
    subtopic: acceptance
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 5
    type: single_choice
    title: "Какой критерий приёмки сформулирован корректно?"
    options:
      - code: a
        text: "Форма должна работать корректно"
      - code: b
        text: "При вводе email без символа @ и нажатии «Сохранить» форма не отправляется, поле подсвечивается, под ним появляется текст «Проверьте адрес почты»"
        is_correct: true
      - code: c
        text: "Пользователь должен быть доволен процессом регистрации"
      - code: d
        text: "Валидация реализована согласно лучшим практикам"
    answer_short: >-
      Критерий должен описывать наблюдаемое поведение в конкретной ситуации:
      что сделал пользователь и что произошло. Формулировки вроде «работает
      корректно» невозможно ни проверить, ни оспорить.
    answer_detailed: |
      ### Junior
      Структура критерия: исходное состояние, действие, ожидаемый результат.
      Проверяющий должен уметь выполнить его без дополнительных вопросов.

      ### Middle
      Хороший набор критериев покрывает не только успешный путь: пустое поле,
      слишком длинное значение, повторная отправка, отсутствие сети, отказ
      сервера. Именно эти случаи чаще всего оказываются нереализованными,
      потому что не были описаны.

      Критерии пишутся до разработки, а не после: они одновременно постановка
      задачи и основа тестов. Написанные после — просто пересказ того, что
      получилось.

      ### Senior
      Ждут понимания, что критерии — это граница ответственности. Спор
      «сделано или нет» после релиза почти всегда означает, что критериев не
      было или они были размытыми.

      Полезно отметить, что чрезмерная детализация тоже вредна: критерий,
      описывающий цвет подсветки в шестнадцатеричном коде, связывает руки
      дизайнеру и устаревает при первой правке стилей. Описывают наблюдаемое
      поведение, а не реализацию.
    common_mistakes:
      - Писать критерии после разработки.
      - Покрывать только успешный сценарий.
      - Описывать реализацию вместо наблюдаемого поведения.
    follow_ups:
      - Какие негативные сценарии стоит покрывать всегда?
      - Где граница между достаточной и избыточной детализацией?

  - slug: sa_conflicting_requirements
    specializations: [analysis_system]
    topic: requirements
    subtopic: elicitation
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Два подразделения выдвигают противоречащие требования к одному процессу. Ваши действия?"
    answer_short: >-
      Не выбирать самому и не искать компромисс в вакууме: сначала выяснить,
      какую задачу решает каждая сторона, потом показать противоречие явно с
      последствиями каждого варианта и вывести решение на того, кто вправе его
      принять.
    answer_detailed: |
      ### Junior
      Первая ошибка — попытаться угодить обоим и получить систему с двумя
      режимами, которую никто не может объяснить. Вторая — решить самому и
      получить недовольную сторону на приёмке.

      ### Middle
      Порядок работы:

      1. Разобраться, зачем каждой стороне её вариант — часто противоречие
         только на уровне формулировок, а цели совместимы.
      2. Если противоречие реальное, описать оба варианта с последствиями:
         что получит и потеряет каждая сторона, во что это обойдётся.
      3. Вынести решение на уровень, где есть полномочия, и зафиксировать его
         письменно.

      Пункт третий важнее, чем кажется: устная договорённость всплывает заново
      через месяц.

      ### Senior
      Ждут понимания роли аналитика: он не арбитр и не судья, но обязан сделать
      конфликт видимым и решаемым. Замолчать противоречие в надежде, что
      разойдётся, — худший исход: оно проявится на приёмке, когда переделывать
      дорого.

      Полезно упомянуть, что иногда правильный ответ — оба варианта, но
      разделённые по ролям или этапам процесса. Это выясняется только после
      разбора целей, а не при попытке усреднить формулировки.
    common_mistakes:
      - Решать противоречие самостоятельно без полномочий.
      - Искать компромисс, не разобравшись в целях сторон.
      - Оставлять договорённость незафиксированной.
    follow_ups:
      - Как понять, что противоречие только в формулировках?
      - Почему договорённость нужно фиксировать письменно?

  # --- Моделирование ----------------------------------------------------------

  - slug: sa_use_case_vs_user_story
    specializations: [analysis_system]
    topic: modeling
    subtopic: use_cases
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Чем сценарий использования отличается от пользовательской истории и когда что применять?"
    answer_short: >-
      История — короткая формулировка ценности, повод для разговора.
      Сценарий использования — подробное описание взаимодействия с основным
      потоком и альтернативами. Историю берут для гибкой разработки, сценарий —
      когда логика сложная и цена недопонимания высока.
    answer_detailed: |
      ### Junior
      История: «как менеджер, я хочу видеть остаток на складе, чтобы не обещать
      клиенту недоступный товар». Она не описывает, как именно это работает.

      Сценарий использования: действующее лицо, предусловия, основной поток по
      шагам, альтернативные потоки, исключения, постусловия.

      ### Middle
      Выбор зависит от контекста. В команде, где аналитик рядом и вопросы
      решаются за минуту, истории достаточно. В интеграционном проекте с
      подрядчиком и приёмкой по документу нужен сценарий: там недопонимание
      стоит недель.

      Частая ошибка — писать историю ради формы: «как пользователь, я хочу
      кнопку, чтобы была кнопка». Такая формулировка не несёт ценности и
      только удлиняет текст.

      ### Senior
      Ждут понимания, что ценность истории в разговоре, а не в тексте. Она
      напоминание обсудить, а не спецификация. Если команда общается только
      через задачи в трекере, истории вырождаются в короткие технические
      задания, и лучше честно писать сценарии.

      Полезно отметить, что альтернативные потоки — самая полезная часть
      сценария: основной поток обычно очевиден, а «что если товар закончился
      между проверкой и оформлением» — нет.
    common_mistakes:
      - Писать истории формально, без ценности.
      - Описывать только основной поток.
      - Выбирать формат по моде, а не по контексту проекта.
    follow_ups:
      - Почему альтернативные потоки важнее основного?
      - Когда история вырождается в техническое задание?

  - slug: sa_sequence_diagram
    specializations: [analysis_system]
    topic: modeling
    subtopic: uml
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: single_choice
    title: "Какая диаграмма лучше всего показывает порядок обмена сообщениями между тремя системами при оформлении заказа?"
    options:
      - code: a
        text: "Диаграмма классов"
      - code: b
        text: "Диаграмма последовательности: она показывает участников и порядок вызовов во времени"
        is_correct: true
      - code: c
        text: "Диаграмма развёртывания"
      - code: d
        text: "Диаграмма вариантов использования"
    answer_short: >-
      Диаграмма последовательности показывает участников по горизонтали и время
      по вертикали, поэтому на ней видно, кто кому что отправляет и в каком
      порядке. Именно она нужна при проектировании интеграций.
    answer_detailed: |
      ### Junior
      Соответствие задачи и диаграммы:

      - последовательность вызовов — диаграмма последовательности;
      - структура данных и связи — диаграмма классов или модель данных;
      - шаги бизнес-процесса с ролями — модель процесса;
      - размещение по узлам — диаграмма развёртывания.

      ### Middle
      На диаграмме последовательности важно показывать не только успешный путь:
      таймаут, отказ внешней системы, повторную отправку. Эти ветки и есть
      самая полезная часть — по ним разработчик поймёт, что делать при сбое.

      Синхронные и асинхронные вызовы обозначаются по-разному, и это не
      формальность: от этого зависит, ждёт ли отправитель ответа.

      ### Senior
      Ждут трезвого отношения к нотации. Строгое соблюдение стандарта менее
      важно, чем понятность: диаграмма нужна, чтобы команда одинаково поняла
      обмен, а не чтобы пройти проверку на соответствие.

      Полезно упомянуть диаграммы как текст: описание в текстовом формате
      хранится рядом с кодом, версионируется и правится в запросе на изменение.
      Картинка в презентации устаревает через месяц и никем не обновляется.
    common_mistakes:
      - Рисовать только успешный сценарий обмена.
      - Не различать синхронные и асинхронные вызовы.
      - Хранить диаграммы в виде картинок вне репозитория.
    follow_ups:
      - Какие ветки обязательно показывать на диаграмме обмена?
      - Почему диаграммы удобнее хранить как текст?

  - slug: sa_data_model_relations
    specializations: [analysis_system]
    topic: modeling
    subtopic: data_model
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как описать связь «заказ — товары» в модели данных и какие детали важно уточнить?"
    answer_short: >-
      Это связь многие-ко-многим через таблицу позиций заказа, где хранятся
      количество и цена на момент покупки. Уточнить нужно, фиксируется ли цена,
      допустим ли один товар дважды в заказе и что происходит при удалении
      товара из каталога.
    answer_detailed: |
      ### Junior
      Заказ содержит много товаров, товар встречается во многих заказах.
      Прямая связь невозможна — нужна промежуточная сущность «позиция заказа».

      В ней хранятся не только ссылки, но и атрибуты самой позиции: количество,
      цена, скидка.

      ### Middle
      Ключевое уточнение — фиксация цены. Если хранить только ссылку на товар,
      то при изменении цены в каталоге изменится и сумма прошлого заказа. Для
      бухгалтерии это недопустимо, поэтому цену копируют в позицию.

      Тот же вопрос про наименование товара: в документах должно остаться то,
      что видел покупатель, а не текущее название.

      ### Senior
      Ждут понимания различия между справочными и историческими данными.
      Заказ — это документ о факте: он не должен меняться задним числом при
      правках справочника. Отсюда правило — в документах хранят снимок значимых
      атрибутов, а не только ссылку.

      Второй сюжет — удаление. Товар, на который есть заказы, нельзя удалять
      физически: пометка «архивный» сохраняет историю и убирает его из выбора.
      Это вопрос к аналитику, а не к разработчику, и задать его нужно на этапе
      постановки.
    common_mistakes:
      - Не фиксировать цену на момент покупки.
      - Допускать физическое удаление сущностей, на которые ссылаются документы.
      - Не уточнять, возможен ли один товар дважды в заказе.
    follow_ups:
      - Почему в документе хранят снимок атрибутов, а не только ссылку?
      - Как правильно удалять записи, на которые есть ссылки?

  # --- Интеграции -------------------------------------------------------------

  - slug: sa_rest_design_basics
    specializations: [analysis_system]
    topic: integrations
    subtopic: rest_design
    min_grade: junior_plus
    peak_grade: middle_plus
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Как спроектировать API для отмены заказа? Опишите метод, адрес, тело и коды ответа."
    answer_short: >-
      Отмена — это изменение состояния заказа, поэтому уместен POST на
      подресурс вида `/orders/{id}/cancel` с указанием причины. Ответы:
      200 при успехе, 404 если заказа нет, 409 если заказ уже отменён или
      доставлен, 403 при отсутствии прав.
    answer_detailed: |
      ### Junior
      ```
      POST /orders/{id}/cancel
      { "reason": "Передумал" }

      200 — отменён, в ответе новое состояние
      404 — заказ не найден
      409 — отмена невозможна в текущем состоянии
      403 — нет прав на отмену этого заказа
      ```

      ### Middle
      Почему не `DELETE /orders/{id}`: отмена не удаляет заказ, он остаётся в
      системе с новым состоянием. Удаление и отмена — разные операции, и путать
      их вредно для понимания.

      Почему отдельный подресурс, а не `PATCH` со статусом: смена состояния
      обычно имеет бизнес-правила и побочные эффекты — возврат денег,
      уведомление склада. Явный вызов действия делает это очевидным и позволяет
      описать права отдельно.

      Код 409 важен: он говорит клиенту, что запрос корректен, но конфликтует с
      текущим состоянием, и повторять его бессмысленно.

      ### Senior
      Ждут внимания к деталям контракта: тело ответа при ошибке должно
      содержать машиночитаемый код, а не только текст, иначе клиент вынужден
      разбирать сообщения строкой.

      И к идемпотентности: повторный вызов отмены уже отменённого заказа должен
      вести себя предсказуемо — либо 200 с текущим состоянием, либо 409, но это
      нужно зафиксировать в контракте, а не оставить на усмотрение реализации.
    common_mistakes:
      - Использовать DELETE для операций, не удаляющих сущность.
      - Возвращать 200 при отказе в отмене.
      - Не описывать поведение при повторном вызове.
    follow_ups:
      - Чем 409 отличается от 400 по смыслу?
      - Как описать поведение при повторной отмене?

  - slug: sa_api_versioning
    specializations: [analysis_system]
    topic: integrations
    subtopic: contracts
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "В API нужно переименовать поле. Как это сделать, не сломав клиентов?"
    answer_short: >-
      Не ломать: добавить новое поле, некоторое время отдавать оба,
      объявить старое устаревшим со сроком, дождаться перехода клиентов и
      только потом убрать. Одномоментное переименование ломает всех, кто не
      обновится в тот же день.
    answer_detailed: |
      ### Junior
      Изменения делятся на совместимые и ломающие. Добавление необязательного
      поля — совместимо. Переименование, удаление, изменение типа или смысла —
      ломает.

      ### Middle
      Порядок безопасного перехода:

      1. Добавить новое поле, заполнять оба.
      2. Сообщить потребителям и указать срок отказа от старого.
      3. Отслеживать, кто ещё использует старое поле.
      4. Убрать после того, как использование прекратилось.

      Пункт третий требует технической возможности: без учёта обращений по
      полям срок отказа назначается вслепую.

      ### Senior
      Ждут понимания, что версионирование через путь вида `/v2` — тяжёлый
      инструмент: он означает поддержку двух реализаций и удваивает работу.
      Его берут для действительно крупных изменений, а мелкие проводят
      совместимо.

      Второй сюжет — мобильные клиенты. Их нельзя обновить принудительно, старые
      версии живут годами, и удаление поля ломает пользователей, которые давно
      не заходили в магазин приложений. Это меняет сроки поддержки старых
      контрактов с недель на месяцы.
    common_mistakes:
      - Переименовывать поля одномоментно.
      - Назначать срок отказа без данных об использовании.
      - Не учитывать невозможность принудительного обновления мобильных клиентов.
    follow_ups:
      - Какие изменения считаются совместимыми?
      - Когда оправдано вводить новую версию API?

  - slug: sa_sync_vs_async_integration
    specializations: [analysis_system]
    topic: integrations
    subtopic: async_messaging
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Когда для интеграции выбирать синхронный вызов, а когда очередь сообщений?"
    answer_short: >-
      Синхронный вызов нужен, когда ответ требуется немедленно и от него
      зависит дальнейшее поведение. Очередь — когда получателю можно ответить
      позже, когда важно пережить его недоступность и когда нагрузка
      неравномерна.
    answer_detailed: |
      ### Junior
      Синхронно: проверка остатка перед оформлением, авторизация платежа —
      без ответа продолжать нельзя.

      Асинхронно: отправка чека, уведомление склада, обновление аналитики —
      результат не нужен прямо сейчас.

      ### Middle
      Главный аргумент за очередь — устойчивость. При синхронном вызове
      недоступность получателя означает отказ всей операции. Сообщение в
      очереди дождётся восстановления.

      Плата за это — согласованность становится отложенной: какое-то время
      системы видят разное состояние. Это нужно явно проговорить с бизнесом,
      потому что «данные появятся через минуту» иногда неприемлемо.

      ### Senior
      Ждут понимания гарантий доставки. Очереди обычно обещают доставку хотя бы
      один раз, значит получатель обязан быть идемпотентным — повтор не должен
      создавать второй чек.

      Второй сюжет — порядок. Он гарантирован не всегда, и события по одной
      сущности могут прийти в обратной последовательности. Отсюда требование к
      контракту: сообщение должно нести версию или время, чтобы получатель
      отбросил устаревшее.

      Хороший ответ добавляет: синхронный вызов проще, и начинать стоит с него,
      переходя к очереди при появлении конкретной причины.
    common_mistakes:
      - Выбирать очередь по умолчанию, усложняя простую интеграцию.
      - Не оговаривать отложенную согласованность с бизнесом.
      - Проектировать получателя без идемпотентности.
    follow_ups:
      - Почему получатель обязан быть идемпотентным?
      - Как защититься от нарушения порядка сообщений?

  - slug: sa_idempotency_contract
    specializations: [analysis_system]
    topic: integrations
    subtopic: idempotency
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Смежная система дважды прислала запрос на создание платежа из-за таймаута. Как это предусмотреть в контракте?"
    answer_short: >-
      Обязать отправителя передавать ключ идемпотентности, а получателя —
      возвращать по нему прежний результат вместо создания второго платежа.
      Ключ, срок его хранения и поведение при повторе с другим телом
      фиксируются в контракте.
    answer_detailed: |
      ### Junior
      Проблема в том, что отправитель не знает, дошёл ли запрос: ответ мог
      потеряться уже после обработки. Единственный выход — сделать повтор
      безопасным.

      ### Middle
      Что должно быть в контракте:

      - имя и формат ключа (обычно заголовок с уникальным идентификатором);
      - обязательность ключа для операций с побочными эффектами;
      - поведение при повторе с тем же ключом — вернуть прежний результат;
      - поведение при повторе с тем же ключом, но другим телом — отказ, потому
        что это ошибка отправителя;
      - срок хранения ключей.

      Последний пункт часто забывают, а он определяет, сколько времени повтор
      будет безопасным.

      ### Senior
      Ждут понимания, что идемпотентность — свойство операции, а не только
      технический механизм. Начисление бонусов «прибавить 100» не идемпотентно
      по природе; «установить баланс в 500» — идемпотентно. Иногда правильнее
      переформулировать операцию, чем городить защиту.

      Полезно упомянуть, что ключ должен генерировать отправитель, а не
      получатель: только отправитель знает, что это повтор той же операции, а
      не новая.
    common_mistakes:
      - Полагаться на то, что смежная система не будет повторять запросы.
      - Не описывать срок хранения ключей идемпотентности.
      - Не задавать поведение при повторе с другим телом.
    follow_ups:
      - Почему ключ генерирует отправитель?
      - Как переформулировать операцию, чтобы она стала идемпотентной?

  - slug: sa_error_contract
    specializations: [analysis_system]
    topic: integrations
    subtopic: error_contracts
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: single_choice
    title: "Что обязательно должно быть в описании ошибок API?"
    options:
      - code: a
        text: "Достаточно кода HTTP — остальное разработчики поймут"
      - code: b
        text: "Машиночитаемый код ошибки, человекочитаемое описание и, для валидации, указание проблемных полей"
        is_correct: true
      - code: c
        text: "Только текстовое сообщение на русском языке"
      - code: d
        text: "Стектрейс для быстрой диагностики"
    answer_short: >-
      Клиенту нужен стабильный код, по которому он программно выберет
      поведение, описание для человека и, при ошибках валидации, список полей.
      Один код HTTP не различает «нет прав» и «недостаточно средств», а
      стектрейс наружу отдавать нельзя.
    answer_detailed: |
      ### Junior
      Код HTTP задаёт категорию, но внутри одной категории причин много.
      400 может означать неверный формат, нарушение бизнес-правила или
      отсутствие обязательного поля — реакция клиента будет разной.

      ### Middle
      Практичная структура ответа: код ошибки строкой, сообщение, при валидации —
      массив с указанием поля и причины. Коды становятся частью контракта, и их
      нельзя менять свободно: клиент на них завязан так же, как на имена полей.

      Текст сообщения предназначен людям и может меняться, поэтому клиент не
      должен разбирать его строкой.

      ### Senior
      Ждут понимания, что наружу нельзя отдавать внутренние подробности: имена
      таблиц, тексты ошибок драйвера, стектрейсы. Это и утечка устройства
      системы, и подсказка для атакующего.

      Полезно упомянуть идентификатор запроса в ответе об ошибке: по нему
      поддержка находит конкретный случай в логах, не выспрашивая у клиента
      время и обстоятельства. Это дешёвая деталь, сильно ускоряющая разбор
      обращений.
    common_mistakes:
      - Различать ошибки только кодом HTTP.
      - Заставлять клиента разбирать текст сообщения.
      - Отдавать наружу внутренние подробности ошибки.
    follow_ups:
      - Почему коды ошибок — часть контракта?
      - Зачем возвращать идентификатор запроса при ошибке?

  # --- Базы данных ------------------------------------------------------------

  - slug: sa_normalization
    specializations: [analysis_system]
    topic: databases
    subtopic: normalization
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Зачем нужна нормализация и когда от неё сознательно отходят?"
    answer_short: >-
      Нормализация убирает дублирование, из-за которого одни и те же данные
      расходятся между строками. Отходят от неё ради скорости чтения: в
      аналитических витринах и в документах, где нужен снимок на момент
      события.
    answer_detailed: |
      ### Junior
      Если адрес клиента хранится в каждом заказе, то при переезде придётся
      обновить сотни строк, и часть наверняка останется старой. Нормализация
      выносит его в отдельную таблицу со ссылкой.

      ### Middle
      Практическая польза первых трёх нормальных форм: каждое значение хранится
      в одном месте, обновление затрагивает одну строку, противоречивые данные
      становятся невозможными.

      Осознанное отступление — денормализация. Она оправдана, когда чтение
      многократно чаще записи и соединения становятся узким местом: витрины для
      отчётов, кеши, поисковые индексы.

      ### Senior
      Ждут различения денормализации и снимка данных. Копия адреса в документе —
      это не нарушение нормализации, а фиксация факта: в накладной должен
      остаться адрес на момент отгрузки, а не текущий.

      Это принципиально разные вещи, и путаница между ними приводит к спорам
      на ревью модели данных. Аналитик обязан объяснить, почему поле
      продублировано, — иначе разработчик уберёт его как «нарушение».
    common_mistakes:
      - Денормализовать без измеренной причины.
      - Путать снимок данных в документе с нарушением нормализации.
      - Хранить изменяемые справочные данные копией в каждой строке.
    follow_ups:
      - Чем снимок данных отличается от денормализации?
      - Когда денормализация оправдана?

  - slug: sa_sql_for_analyst
    specializations: [analysis_system]
    topic: databases
    subtopic: sql_basics
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Зачем системному аналитику SQL, если запросы пишут разработчики?"
    answer_short: >-
      Чтобы проверять гипотезы самому: посмотреть, какие данные реально есть,
      сколько строк подпадает под правило, встречаются ли пропуски и дубли.
      Постановка, написанная без проверки данных, регулярно оказывается
      невыполнимой.
    answer_detailed: |
      ### Junior
      Практические задачи: посчитать, сколько записей затронет новое правило,
      найти примеры для критериев приёмки, проверить, заполнено ли поле, на
      которое опирается требование.

      ### Middle
      Типичный сюжет: требование «уведомлять клиентов по электронной почте»
      выглядит простым, пока запрос не покажет, что адрес заполнен у трети
      базы, а у части он невалиден. Это меняет постановку целиком.

      Второй сюжет — проверка предположений о связях: аналитик считает, что у
      заказа один платёж, а данные показывают заказы с тремя. Такая находка на
      этапе постановки экономит переделку.

      ### Senior
      Ждут понимания границы: аналитику не нужно оптимизировать запросы и
      строить сложные конструкции. Нужен уверенный уровень выборки, соединений,
      группировки и понимания NULL — этого достаточно для проверки гипотез.

      Полезно упомянуть про доступ: работа на боевой базе опасна, а на копии
      данные могут быть обезличены и не отражать реальную картину. Уточнить,
      где именно проверяется гипотеза, — часть корректной работы.
    common_mistakes:
      - Писать постановку, не посмотрев на реальные данные.
      - Считать проверку данных задачей разработчика.
      - Проверять гипотезы на боевой базе без ограничений.
    follow_ups:
      - Какие проверки данных стоит делать до написания постановки?
      - Чем опасна проверка гипотез на обезличенной копии?

  # --- Архитектура систем -----------------------------------------------------

  - slug: sa_failure_scenarios
    specializations: [analysis_system]
    topic: architecture
    subtopic: reliability
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 5
    type: open_answer
    title: "Оформление заказа обращается к системе оплаты. Какие сценарии сбоя нужно описать в постановке?"
    answer_short: >-
      Недоступность системы оплаты, таймаут без ответа, отказ в оплате,
      успешную оплату с потерянным ответом и расхождение состояний между
      системами. Для каждого нужно указать, что видит пользователь и что
      происходит с заказом.
    answer_detailed: |
      ### Junior
      Самый опасный сценарий — не отказ, а таймаут: неизвестно, прошла оплата
      или нет. Именно он порождает и двойные списания, и потерянные платежи.

      ### Middle
      Что описывают:

      - **Система недоступна**: показать понятное сообщение, сохранить заказ в
        состоянии ожидания оплаты, дать повторить.
      - **Таймаут**: не считать оплату неуспешной, запросить статус позже,
        не давать пользователю оплатить второй раз до выяснения.
      - **Отказ**: показать причину, если она известна, оставить возможность
        сменить способ оплаты.
      - **Оплата прошла, ответ потерян**: сверка по идентификатору операции.

      Отдельно — кто и как разбирает расхождения: регулярная сверка или ручной
      разбор.

      ### Senior
      Ждут понимания, что описание сбоев — работа аналитика, а не
      «непредвиденные обстоятельства для разработчика». Оставленный без
      описания сценарий будет реализован как придётся, и обычно неудачно.

      Второй сюжет — деньги требуют особой осторожности: при неопределённости
      правильнее не завершать заказ, чем завершить ошибочно. Правило «в
      сомнении — не действовать» проговаривается явно, потому что интуиция
      разработчика может быть обратной.
    common_mistakes:
      - Описывать только успешный сценарий и явный отказ.
      - Трактовать таймаут как неуспешную операцию.
      - Не назначать ответственного за разбор расхождений.
    follow_ups:
      - Почему таймаут опаснее явного отказа?
      - Как организовать сверку между системами?

  - slug: sa_access_control
    specializations: [analysis_system]
    topic: architecture
    subtopic: security_basics
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Как описать разграничение прав доступа в постановке?"
    answer_short: >-
      Через матрицу «роль — объект — действие»: кто какие операции может
      выполнять и над чьими данными. Отдельно фиксируют, что происходит при
      отсутствии прав и видно ли пользователю само существование объекта.
    answer_detailed: |
      ### Junior
      Недостаточно написать «доступно администратору». Нужно перечислить роли и
      действия: просмотр, создание, изменение, удаление, экспорт — и указать
      это для каждой сущности.

      ### Middle
      Ключевое уточнение — доступ к чужим данным. Менеджер видит свои заказы или
      все? Может ли редактировать чужие? Это не техническая деталь, а бизнес-
      правило, и его нужно получить от заказчика.

      Второй момент — реакция на отсутствие прав. Скрывать элемент интерфейса
      или показывать неактивным, отвечать «нет доступа» или «не найдено».
      Последнее важно там, где сам факт существования записи конфиденциален.

      ### Senior
      Ждут понимания, что скрытие кнопки в интерфейсе — не разграничение прав.
      Проверка обязана быть на сервере, иначе прямой запрос обойдёт защиту.
      В постановке это фиксируют явно, чтобы не осталось на усмотрение.

      Полезно упомянуть аудит: для чувствительных действий записывают, кто и
      когда их выполнил. Требование обычно приходит от службы безопасности
      поздно, и заложить его заранее дешевле, чем добавлять потом.
    common_mistakes:
      - Описывать права общими словами вроде «доступно администратору».
      - Считать скрытие элемента интерфейса достаточной защитой.
      - Не уточнять доступ к чужим данным внутри одной роли.
    follow_ups:
      - Когда правильнее отвечать «не найдено» вместо «нет доступа»?
      - Зачем нужен аудит действий и что в него записывать?

  # --- Документация -----------------------------------------------------------

  - slug: sa_documentation_actual
    specializations: [analysis_system]
    topic: documentation
    subtopic: change_management
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Документация устаревает через месяц после написания. Что с этим делать?"
    answer_short: >-
      Сократить объём до того, что действительно используется, и привязать
      обновление к процессу изменений: правка контракта или логики не считается
      завершённой без обновления документа. Документ, который никто не читает,
      проще удалить, чем поддерживать.
    answer_detailed: |
      ### Junior
      Причина устаревания обычно не в лени, а в объёме: сто страниц невозможно
      поддерживать в актуальном состоянии при еженедельных изменениях.

      ### Middle
      Что работает:

      - держать рядом с кодом то, что меняется вместе с кодом — описание
        интерфейсов генерировать из контракта, а не писать вручную;
      - разделять долгоживущее (зачем система устроена так) и изменчивое
        (какие поля в запросе);
      - включать обновление документа в определение готовности задачи.

      Описание API, сгенерированное из спецификации, не может разойтись с
      реализацией — это самый надёжный вид документации.

      ### Senior
      Ждут понимания, что часть документации не нужна вовсе. Пересказ того, что
      видно из кода, устаревает и вводит в заблуждение. Ценность имеет
      контекст: почему принято такое решение, какие варианты отвергли и почему,
      какие ограничения учтены.

      Такие записи не устаревают, потому что описывают прошлое, и именно их
      ищут через год, когда никого из принимавших решение уже нет.
    common_mistakes:
      - Писать документацию, пересказывающую код.
      - Поддерживать описание API вручную вместо генерации.
      - Не включать обновление документа в определение готовности.
    follow_ups:
      - Какая документация не устаревает по природе?
      - Почему описание API лучше генерировать?

  # --- Процесс и команда ------------------------------------------------------

  - slug: sa_decomposition
    specializations: [analysis_system]
    topic: process
    subtopic: estimation
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Задача оценивается в два месяца. Как её декомпозировать?"
    answer_short: >-
      По ценности, а не по слоям: каждая часть должна давать работающий
      результат, пусть узкий. Разбиение на «сделать базу», «сделать API»,
      «сделать интерфейс» не даёт ничего проверяемого до самого конца.
    answer_detailed: |
      ### Junior
      Плохое разбиение — по техническим слоям: до готовности последнего куска
      нечего показать и не на чем получить обратную связь.

      ### Middle
      Хорошее разбиение вертикальное: узкий сценарий целиком через все слои.
      Например, вместо «личный кабинет» — «просмотр списка заказов без
      фильтров», затем «фильтры», затем «экспорт».

      Каждая часть должна быть проверяемой и, желательно, полезной сама по себе.
      Тогда при исчерпании времени останется работающая часть, а не половина
      всего.

      ### Senior
      Ждут понимания, что декомпозиция — способ управления риском. Крупная
      задача скрывает неизвестное; первый маленький кусок вскрывает
      неожиданности рано, когда план ещё можно изменить.

      Отсюда правило: первым делают не самое простое, а самое неопределённое —
      интеграцию с внешней системой, непроверенное предположение о данных.
      Это противоречит интуиции «начнём с лёгкого», но экономит недели.
    common_mistakes:
      - Разбивать задачу по техническим слоям.
      - Начинать с самой простой части вместо самой рискованной.
      - Делать части, не проверяемые по отдельности.
    follow_ups:
      - Почему начинать стоит с самой неопределённой части?
      - Как понять, что часть достаточно мала?

  - slug: sa_testing_support
    specializations: [analysis_system]
    topic: process
    subtopic: testing_support
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Как аналитик участвует в тестировании и почему это его задача?"
    answer_short: >-
      Он владелец ожидаемого поведения: помогает построить тестовые данные,
      отвечает на вопросы о крайних случаях и подтверждает, что найденное
      расхождение — дефект, а не непонятое требование. Часть вопросов
      тестировщика вскрывает пробелы в постановке.
    answer_detailed: |
      ### Junior
      Аналитик не пишет тесты за тестировщика, но отвечает на вопрос «а как
      должно быть» — и делает это письменно, дополняя постановку.

      ### Middle
      Самая ценная часть — вопросы, на которые в постановке нет ответа.
      Тестировщик регулярно находит их первым: что при пустом списке, что при
      повторном нажатии, что при отмене на середине. Каждый такой вопрос —
      пробел, который нужно закрыть в требованиях, а не только устно.

      Второй вклад — тестовые данные: аналитик знает, какие сочетания реальны, а
      какие невозможны, и это экономит время на проверке несуществующих
      случаев.

      ### Senior
      Ждут понимания разницы между дефектом и изменением требований. Если
      поведение соответствует постановке, но неудобно, это не дефект, а новая
      задача. Смешение этих категорий приводит к бесконечной доработке под
      видом исправления ошибок.

      Полезно отметить: если тестировщик находит много расхождений в
      трактовке, проблема в постановке, а не в разработке. Это сигнал
      пересмотреть уровень детализации требований.
    common_mistakes:
      - Отвечать на вопросы тестировщика устно, не обновляя постановку.
      - Смешивать дефект и изменение требований.
      - Не участвовать в подготовке тестовых данных.
    follow_ups:
      - Как отличить дефект от изменения требований?
      - О чём говорит большое число расхождений в трактовке?

  # --- Поведенческая секция ---------------------------------------------------

  - slug: sa_soft_pushback_on_scope
    specializations: [analysis_system]
    topic: soft
    subtopic: conflict
    min_grade: middle
    peak_grade: senior
    max_grade: lead
    frequency: 4
    type: open_answer
    title: "Заказчик посреди разработки просит добавить крупную функцию, срок при этом не меняется. Как поступите?"
    answer_short: >-
      Не отказывать и не соглашаться молча, а показать последствия: что именно
      придётся убрать или на сколько сдвинется срок. Решение о приоритете
      принимает заказчик, но с полной картиной, а не с обещанием «постараемся».
    answer_detailed: |
      ### Junior
      Худшие варианты: согласиться и не успеть, либо отказать со ссылкой на
      процесс. Первое разрушает доверие, второе делает вас препятствием.

      ### Middle
      Рабочий разговор:

      1. Понять, зачем функция нужна сейчас — иногда за срочностью стоит
         событие, о котором вы не знали.
      2. Оценить объём вместе с командой.
      3. Показать варианты: сдвинуть срок, убрать другое, сделать упрощённую
         версию.
      4. Зафиксировать выбранный вариант письменно.

      Третий пункт — ключевой: разговор из «нет» превращается в выбор, а выбор
      делает заказчик.

      ### Senior
      Ждут понимания, что упрощённая версия — часто лучший исход. Крупная
      функция обычно содержит небольшую часть, дающую основную ценность;
      выделить её — работа аналитика, и это то, чего заказчик сам не сделает.

      Сильный ответ включает и профилактику: если запросы на расширение
      приходят постоянно, проблема в процессе — не проговорены границы
      этапа или нет регулярной точки для пересмотра приоритетов. Обсуждать
      стоит и это, а не только конкретный случай.
    common_mistakes:
      - Соглашаться на расширение без пересмотра срока или объёма.
      - Отказывать со ссылкой на процесс вместо показа последствий.
      - Не искать упрощённый вариант, дающий основную ценность.
    follow_ups:
      - Как выделить минимальную ценную часть крупной функции?
      - Что делать, если запросы на расширение приходят постоянно?

  # --- Дополнительные вопросы -------------------------------------------------

  - slug: sa_elicitation_techniques
    specializations: [analysis_system]
    topic: requirements
    subtopic: elicitation
    min_grade: junior
    peak_grade: middle
    max_grade: senior
    frequency: 4
    type: open_answer
    title: "Заказчик не может внятно объяснить, что ему нужно. Какими способами вы будете выявлять требования?"
    answer_short: >-
      Смотреть, как человек работает сейчас, а не только спрашивать. Наблюдение
      за процессом, разбор реальных документов и обращений, прототип для
      обсуждения — всё это даёт больше, чем вопрос «что вам нужно», на который
      мало кто отвечает точно.
    answer_detailed: |
      ### Junior
      Способы: интервью, наблюдение за работой, изучение текущих документов и
      таблиц, разбор обращений в поддержку, прототип, анализ похожих систем.

      ### Middle
      Наблюдение почти всегда информативнее интервью. Люди описывают процесс
      идеализированно и забывают исключения, которые обрабатывают на автомате.
      Час рядом с сотрудником даёт больше, чем три встречи.

      Таблицы, которые ведут вручную, — золотая жила: они показывают, чего не
      хватает в текущих системах, и обычно содержат готовую структуру данных.

      Прототип полезен тем, что переводит разговор из абстракции в конкретику:
      на макет реагируют содержательно, на описание — общими словами.

      ### Senior
      Ждут понимания, что вопрос «что вам нужно» провоцирует ответ в терминах
      решения, а не задачи. Человек скажет «нужна кнопка выгрузки», хотя
      настоящая задача — сверить остатки с поставщиком, и решается она иначе.

      Отсюда приём: спрашивать про последний конкретный случай. «Расскажите, как
      вы делали это в прошлый раз» даёт факты вместо обобщений, а факты можно
      проверить.
    common_mistakes:
      - Ограничиваться интервью и записывать ответы дословно.
      - Принимать предложенное решение за требование.
      - Не изучать документы и таблицы, которые ведут вручную.
    follow_ups:
      - Почему наблюдение информативнее интервью?
      - Как отличить задачу от предложенного решения?

  - slug: sa_traceability
    specializations: [analysis_system]
    topic: requirements
    subtopic: traceability
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Зачем нужна прослеживаемость требований и как её обеспечить без бюрократии?"
    answer_short: >-
      Чтобы отвечать на два вопроса: откуда взялось это требование и что
      сломается, если его изменить. Достаточно связей между источником,
      требованием, задачей и тестом — отдельная матрица в таблице обычно
      избыточна.
    answer_detailed: |
      ### Junior
      Прослеживаемость — это возможность пройти цепочку: бизнес-цель →
      требование → задача → реализация → тест.

      ### Middle
      Практическая польза видна в двух ситуациях. Первая: при изменении
      требования нужно понять, что затронуто. Вторая: при виде странного
      поведения нужно понять, требование это или дефект.

      Обеспечивается ссылками в инструментах, которыми команда уже пользуется:
      задача ссылается на требование, тест на задачу. Отдельная таблица связей,
      поддерживаемая вручную, устаревает первой.

      ### Senior
      Ждут понимания, что глубина прослеживаемости зависит от цены ошибки.
      В регулируемых областях — медицина, финансы, авиация — она обязательна и
      проверяется аудитом. В продуктовой разработке избыточная формальность
      съедает время без отдачи.

      Полезно отметить главный практический эффект: возможность ответить
      «зачем мы это сделали» через год. Требования без источника со временем
      превращаются в набор правил, которые никто не решается изменить, потому
      что непонятно, кому они нужны.
    common_mistakes:
      - Вести матрицу прослеживаемости вручную в отдельной таблице.
      - Применять одинаковую глубину независимо от цены ошибки.
      - Фиксировать требование без источника и обоснования.
    follow_ups:
      - Чем опасны требования без указания источника?
      - Как связать требования и тесты без лишней работы?

  - slug: sa_bpmn_process
    specializations: [analysis_system]
    topic: modeling
    subtopic: bpmn
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Когда полезна модель бизнес-процесса и какие ошибки в ней встречаются чаще всего?"
    answer_short: >-
      Полезна, когда в процессе несколько ролей и ветвлений: схема показывает
      передачи ответственности лучше текста. Частые ошибки — рисовать только
      успешный путь, смешивать бизнес-шаги с техническими и делать схему,
      которую невозможно прочитать без автора.
    answer_detailed: |
      ### Junior
      Модель процесса отвечает на вопросы: кто что делает, в каком порядке, где
      принимаются решения и куда уходит процесс при каждом исходе.

      ### Middle
      Типичные ошибки:

      - только успешный путь, без отказов и возвратов на доработку;
      - смешение уровней: рядом с «менеджер согласует заявку» стоит «система
        отправляет POST-запрос»;
      - развилка без указания условий переходов;
      - схема на три экрана, которую никто не читает.

      Если процесс не помещается на страницу, его декомпозируют: верхний
      уровень показывает основные этапы, детали выносятся в отдельные схемы.

      ### Senior
      Ждут понимания цели: схема нужна для согласования понимания между людьми,
      а не для соответствия нотации. Если участники встречи спорят, глядя на
      схему, — она уже сработала.

      Полезно упомянуть частую находку: при рисовании процесса выясняется, что
      разные подразделения выполняют его по-разному и никто об этом не знал.
      Это ценнее самой схемы и часто меняет постановку задачи.
    common_mistakes:
      - Рисовать только успешный сценарий процесса.
      - Смешивать бизнес-шаги и технические вызовы на одной схеме.
      - Делать одну огромную схему вместо уровней.
    follow_ups:
      - Как декомпозировать сложный процесс на уровни?
      - Что обычно выясняется при рисовании процесса?

  - slug: sa_batch_vs_realtime
    specializations: [analysis_system]
    topic: integrations
    subtopic: async_messaging
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 3
    type: single_choice
    title: "Смежная система готова отдавать данные либо файлом раз в сутки, либо по событию. Что выбрать для остатков товара?"
    options:
      - code: a
        text: "Файл раз в сутки: проще в реализации"
      - code: b
        text: "По событию: остатки меняются постоянно, суточная задержка приведёт к продаже отсутствующего товара"
        is_correct: true
      - code: c
        text: "Оба варианта равнозначны"
      - code: d
        text: "Файл, но выгружать его каждые пять минут"
    answer_short: >-
      Выбор определяется допустимой задержкой данных. Для остатков она
      измеряется минутами, значит нужна передача по событию. Суточная выгрузка
      подходит для справочников и отчётности, где данные меняются редко.
    answer_detailed: |
      ### Junior
      Вопрос, который нужно задать: насколько устаревшие данные допустимы.
      Ответ определяет способ обмена, а не наоборот.

      ### Middle
      Файловый обмен проще, но у него есть скрытые сложности: что делать при
      неполной выгрузке, как понять, что файл не пришёл, как обрабатывать
      удаления — их в файле обычно не видно, есть только текущий состав.

      Обмен по событию требует надёжной доставки и идемпотентности, зато даёт
      актуальность и передаёт факт изменения явно.

      Комбинация тоже встречается: события для оперативности плюс суточная
      сверка полным составом для устранения расхождений.

      ### Senior
      Ждут понимания, что «просто в реализации» — плохой критерий выбора
      способа обмена: сложность переносится в бизнес-последствия. Продажа
      отсутствующего товара обходится дороже, чем разработка обмена по событию.

      Полезно упомянуть, что комбинированный подход — обычная практика в
      зрелых системах: события расходятся из-за сбоев, и периодическая сверка
      возвращает их к согласованности. Это надо предусматривать сразу, а не
      после первого расхождения.
    common_mistakes:
      - Выбирать способ обмена по простоте реализации.
      - Не продумывать передачу удалений при файловом обмене.
      - Полагаться только на события без периодической сверки.
    follow_ups:
      - Как передавать удаления при файловом обмене?
      - Зачем нужна сверка при обмене событиями?

  - slug: sa_transactions_business
    specializations: [analysis_system]
    topic: databases
    subtopic: transactions
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Операция затрагивает три системы: списать со склада, провести оплату, отправить уведомление. Что делать, если оплата прошла, а списание не удалось?"
    answer_short: >-
      Транзакции в привычном смысле между системами нет: откатить чужую
      операцию нельзя. Нужна компенсация — возврат платежа — и явное описание,
      кто её инициирует, за какое время и что видит пользователь в промежутке.
    answer_detailed: |
      ### Junior
      Внутри одной базы транзакция откатывает всё сразу. Между системами так не
      получится: платёж уже проведён во внешнем сервисе.

      ### Middle
      Практическая схема — последовательность шагов с компенсацией для каждого:
      если шаг не удался, выполняются обратные действия для уже завершённых.

      Что фиксируют в постановке:

      - порядок шагов и какой из них считается точкой невозврата;
      - компенсирующее действие для каждого шага;
      - что видит пользователь, пока идёт компенсация;
      - что делать, если компенсация тоже не удалась.

      Последний пункт обычно означает ручной разбор, и это нормально — важно
      назначить ответственного и способ обнаружения.

      ### Senior
      Ждут понимания, что порядок шагов выбирается осознанно: сначала выполняют
      то, что легко компенсировать, а необратимое — последним. Резервирование
      товара до оплаты, а не после, снимает большую часть проблем.

      Уведомление вообще не должно быть внутри цепочки: письмо нельзя отозвать,
      поэтому его отправляют после успешного завершения всей операции. Это
      частая ошибка в постановках — уведомление ставят рядом с остальными
      шагами.
    common_mistakes:
      - Ожидать транзакции между независимыми системами.
      - Ставить необратимые действия в начало цепочки.
      - Не описывать поведение при неудачной компенсации.
    follow_ups:
      - Почему уведомление отправляют последним?
      - Кто разбирает случаи, когда компенсация не удалась?

  - slug: sa_component_boundaries
    specializations: [analysis_system]
    topic: architecture
    subtopic: components
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Как определить, что новая функциональность должна стать отдельным сервисом, а не частью существующего?"
    answer_short: >-
      По границам данных и ответственности: если функциональность работает со
      своими данными, имеет отдельный цикл изменений и свои требования к
      нагрузке — она кандидат на выделение. Если постоянно ходит в чужие
      данные, выделение создаст болтливую интеграцию.
    answer_detailed: |
      ### Junior
      Признак неудачного разделения — необходимость запрашивать данные другого
      сервиса при каждой операции. Это означает, что граница проведена не там.

      ### Middle
      Аргументы за выделение:

      - собственная область данных, которой не пользуются другие;
      - отдельный цикл изменений: меняется чаще или реже остальных;
      - другой профиль нагрузки — например, тяжёлые расчёты рядом с быстрым
        интерфейсом;
      - отдельная команда, которой нужна независимость релизов.

      Аргументы против: сильная связанность данных, потребность в общей
      транзакции, малый размер команды.

      ### Senior
      Ждут понимания, что решение принимается не аналитиком единолично, но
      именно он приносит данные для него: какие сущности используются вместе,
      какие сценарии пересекают границу, сколько будет вызовов.

      Полезно упомянуть, что цена разделения — отложенная согласованность и
      сложность отладки. Если бизнес не готов к тому, что данные в двух местах
      расходятся на секунды, разделение по этой границе делать нельзя, и это
      именно вопрос к заказчику.
    common_mistakes:
      - Выделять сервис по техническому слою вместо области данных.
      - Не оценивать число межсервисных вызовов заранее.
      - Не согласовывать отложенную согласованность с бизнесом.
    follow_ups:
      - Как понять, что граница проведена неверно?
      - Какие данные аналитик собирает для решения о выделении?

  - slug: sa_spec_review
    specializations: [analysis_system]
    topic: documentation
    subtopic: specifications
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Как понять, что постановка готова к разработке?"
    answer_short: >-
      Разработчик и тестировщик прочитали её и не задают уточняющих вопросов о
      поведении; описаны негативные сценарии и границы; есть критерии приёмки;
      понятно, что не входит в объём. Отсутствие вопросов после чтения —
      главный практический признак.
    answer_detailed: |
      ### Junior
      Проверочный список: цель понятна, сценарии описаны включая отказы,
      критерии приёмки есть, данные и их источники определены, права доступа
      описаны.

      ### Middle
      Самый надёжный способ — обсуждение с командой до старта. Вопросы, которые
      задают разработчик и тестировщик, показывают пробелы точнее любого
      формального списка.

      Отдельно фиксируют, что **не** входит: без этого объём расползается, а
      на приёмке возникает спор об ожиданиях.

      ### Senior
      Ждут понимания, что готовность не означает полноту. Часть неизвестного
      выясняется только в разработке, и требовать стопроцентной проработки
      заранее — способ затянуть старт.

      Практичный критерий: команда может начать и не заблокируется в первые
      дни. Остальное уточняется по ходу — при условии, что аналитик доступен и
      отвечает быстро.

      Сильный ответ добавляет: если вопросы возникают уже в середине
      разработки постоянно, дело не в конкретной постановке, а в уровне
      детализации, принятом в команде, — и это стоит обсудить отдельно.
    common_mistakes:
      - Считать готовностью объём документа.
      - Не описывать, что не входит в объём задачи.
      - Требовать полной проработки до начала разработки.
    follow_ups:
      - Почему важно описывать, что не входит в объём?
      - Что делать, если вопросы возникают постоянно уже в разработке?

  - slug: sa_backlog_priority
    specializations: [analysis_system]
    topic: process
    subtopic: backlog
    min_grade: middle
    peak_grade: middle_plus
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "В бэклоге сто задач, все «важные». Как расставить приоритеты?"
    answer_short: >-
      Через сопоставимые критерии: ценность, стоимость, риск, срочность.
      Важно сделать выбор явным — не «что важнее», а «что сделаем первым, если
      успеем только одно». Пока приоритет не выражен порядком, его нет.
    answer_detailed: |
      ### Junior
      Если всё важно, приоритетов не существует. Первый шаг — заставить
      сравнивать попарно: что делаем раньше, а не что важнее в принципе.

      ### Middle
      Практические подходы: оценка по соотношению ценности и трудозатрат,
      разделение на обязательное, желательное и возможное, отдельная категория
      для того, что убирает риск.

      Важно, что приоритет расставляет заказчик, а аналитик обеспечивает
      сопоставимость: приводит задачи к одному масштабу, добавляет оценку
      трудозатрат от команды, показывает зависимости.

      ### Senior
      Ждут упоминания стоимости задержки: задача, ценность которой падает со
      временем — например, привязанная к сезону, — должна идти раньше более
      ценной, но не срочной. Это меняет порядок сильнее, чем оценка ценности
      сама по себе.

      Полезно отметить обязательные работы: устранение технического долга и
      требования безопасности редко выигрывают в сравнении по ценности, но их
      откладывание накапливает риск. Для них обычно резервируют долю мощности,
      а не соревнуются с продуктовыми задачами.
    common_mistakes:
      - Сравнивать задачи по важности вместо порядка выполнения.
      - Не учитывать, как ценность меняется со временем.
      - Ставить технический долг в общую очередь по ценности.
    follow_ups:
      - Что такое стоимость задержки?
      - Как выделять мощность на технический долг?

  - slug: sa_legacy_system_analysis
    specializations: [analysis_system]
    topic: process
    subtopic: stakeholders
    min_grade: middle_plus
    peak_grade: senior
    max_grade: lead
    frequency: 3
    type: open_answer
    title: "Нужно описать требования к замене системы, которой пятнадцать лет и по которой нет документации. С чего начнёте?"
    answer_short: >-
      С фактического поведения: наблюдение за пользователями, разбор данных в
      базе, изучение интеграций и обращений в поддержку. Спрашивать «как должно
      работать» бесполезно — за годы поведение системы само стало требованием.
    answer_detailed: |
      ### Junior
      Первое заблуждение — считать, что можно просто спросить. Люди знают свои
      участки и не знают систему целиком, а исходное задание, если и
      сохранилось, давно не отражает реальность.

      ### Middle
      Источники информации:

      - наблюдение за работой пользователей разных ролей;
      - структура базы данных: она показывает, какие сущности реально есть;
      - журналы и обращения в поддержку — по ним видно частые сценарии и
        болевые точки;
      - интеграции: кто и что получает от системы, это внешние обязательства;
      - сам код в спорных местах, если он доступен.

      ### Senior
      Ждут понимания, что не всё поведение нужно переносить. За годы
      накапливаются обходные пути, компенсирующие давние дефекты. Перенос их в
      новую систему воспроизводит проблему.

      Отсюда важный вопрос по каждому найденному правилу: это осознанное
      требование или наследие давнего бага. Ответ дают пользователи, но задать
      его должен аналитик.

      Второй сюжет — стратегия перехода. Одномоментная замена системы, от
      которой зависят интеграции и люди, редко проходит гладко; чаще выделяют
      части и переводят постепенно, оставляя старую систему работать. Это
      влияет на требования: нужен период сосуществования и синхронизация данных.
    common_mistakes:
      - Опираться только на опрос пользователей.
      - Переносить всё существующее поведение без разбора.
      - Планировать одномоментную замену без периода сосуществования.
    follow_ups:
      - Как отличить осознанное правило от наследия старого дефекта?
      - Что требуется для периода сосуществования двух систем?

  - slug: sa_soft_no_answer
    specializations: [analysis_system]
    topic: soft
    subtopic: teamwork
    min_grade: junior_plus
    peak_grade: middle
    max_grade: senior
    frequency: 3
    type: open_answer
    title: "Разработчик задаёт вопрос по поведению системы, а вы не знаете ответа. Что делаете?"
    answer_short: >-
      Признаю, что не знаю, называю срок, когда выясню, и предлагаю, чем
      заняться пока. Придумывать ответ на ходу — худший вариант: он попадёт в
      реализацию и всплывёт на приёмке.
    answer_detailed: |
      ### Junior
      Ждут, что вы не станете выдумывать. Фраза «сейчас уточню и вернусь через
      час» полностью нормальна и вызывает больше доверия, чем уверенный
      неверный ответ.

      ### Middle
      Полезно не просто уйти выяснять, а разгрузить разработчика: сказать, что
      можно делать без ответа, а что зависит от него. Часто оказывается, что
      неизвестное касается небольшой части, и работа не блокируется.

      Если ответ нужен срочно, а заказчик недоступен — предложить временное
      решение с явной пометкой, что оно требует подтверждения, и записать это,
      чтобы не забыть.

      ### Senior
      Ждут понимания системного эффекта: если такие вопросы возникают часто,
      проблема не в конкретном пробеле, а в глубине проработки или в
      доступности заказчика. Это стоит поднять отдельно, с примерами и оценкой
      потерянного времени.

      Сильный ответ добавляет: ответы, полученные устно, нужно возвращать в
      постановку. Иначе через месяц никто не вспомнит договорённость, а
      тестировщик найдёт «дефект» в корректно работающей функции.
    common_mistakes:
      - Придумывать ответ, чтобы не выглядеть некомпетентным.
      - Уходить выяснять, не сказав, что можно делать пока.
      - Не возвращать устные ответы в постановку.
    follow_ups:
      - Что делать, если ответ нужен срочно, а заказчик недоступен?
      - О чём говорит большое число подобных вопросов?
