name: interview_trainer
description: Тренажёр для подготовки к техническим собеседованиям.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Управление состоянием — зафиксирован в CLAUDE.md §4.
  flutter_riverpod: ^2.5.1
  # Навигация — зафиксирован в CLAUDE.md §4.
  go_router: ^14.6.1
  # Локальная база: весь прогресс живёт на устройстве.
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Убраны вместе с переходом на работу без сервера: dio и
  # flutter_secure_storage обслуживали запросы и токены, connectivity_plus —
  # ожидание сети для отправки ответов. Ничего из этого больше нет, а лишние
  # зависимости — это лишний вес пакета и лишние разрешения.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    # Банк вопросов и таксономия едут внутри установочного пакета: сервера у
    # приложения нет. Файл собирается из /content командой
    # `python -m app.seed.export_bundle` и коммитится — сборка не должна
    # зависеть от установленного Python.
    - assets/content/bank.json
