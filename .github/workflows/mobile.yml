name: mobile

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

env:
  # Совпадает с версией, на которой проект проверялся локально.
  FLUTTER_VERSION: "3.44.9"

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Схема Drift лежит в git сгенерированной, иначе сборка требовала бы
      # кодогенерации на каждой машине. Проверяем, что файл не отстал от таблиц:
      # молча протухший .g.dart анализатор не поймает.
      - name: Сгенерированный код соответствует схеме
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/local/app_database.g.dart
      - run: flutter analyze
      - run: flutter test

  android:
    needs: analyze
    runs-on: ubuntu-latest
    env:
      # Контекст secrets в `if` шага недоступен, поэтому наличие ключа
      # превращаем в обычную переменную здесь, на уровне задания.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Ключ подписи лежит в секретах репозитория в виде base64. Пока его нет,
      # сборка продолжается с отладочной подписью: проверять, что релизная
      # конфигурация вообще собирается, нужно и до появления ключа.
      #
      # Условие смотрит на переменную, а не на секрет напрямую: контекст
      # secrets в `if` шага недоступен, и проверка молча считалась бы ложной.
      - name: Ключ подписи
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      # В магазин загружается App Bundle: Google собирает из него сборку под
      # конкретное устройство, и скачиваемый размер получается меньше, чем у
      # универсального APK.
      #
      # API_BASE_URL — переменная репозитория, а не секрет: адрес сервера не
      # тайна. Пока она не задана, артефакт соберётся, но при запуске честно
      # упадёт с объяснением — это лучше, чем сборка, молча ходящая в никуда.
      - name: Сборка App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: mobile/build/app/outputs/bundle/release/app-release.aab

  # Mac у команды нет, поэтому iOS собирается только здесь (CLAUDE.md §4).
  # Без подписи: сертификаты добавляются в шаг signing, когда появится
  # аккаунт Apple Developer и секреты в репозитории.
  ios:
    needs: analyze
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Сборка без подписи
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: mobile/build/ios/iphoneos/Runner.app
