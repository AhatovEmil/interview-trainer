name: mobile

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

env:
  # Совпадает с версией, на которой проект проверялся локально.
  FLUTTER_VERSION: "3.44.9"

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Схема Drift лежит в git сгенерированной, иначе сборка требовала бы
      # кодогенерации на каждой машине. Проверяем, что файл не отстал от таблиц:
      # молча протухший .g.dart анализатор не поймает.
      - name: Сгенерированный код соответствует схеме
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/data/local/app_database.g.dart
      - run: flutter analyze
      - run: flutter test

  android:
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  # Mac у команды нет, поэтому iOS собирается только здесь (CLAUDE.md §4).
  # Без подписи: сертификаты добавляются в шаг signing, когда появится
  # аккаунт Apple Developer и секреты в репозитории.
  ios:
    needs: analyze
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Сборка без подписи
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: mobile/build/ios/iphoneos/Runner.app
