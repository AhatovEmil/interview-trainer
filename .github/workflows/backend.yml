name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "content/**", "docker/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "content/**", "docker/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer
          POSTGRES_DB: trainer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trainer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://trainer:trainer@localhost:5432/trainer
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION_TESTS: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -e ".[dev]"

      - name: Линтер
        run: |
          ruff check .
          ruff format --check .

      - name: Типы
        run: mypy app

      - name: Миграции
        run: alembic upgrade head

      - name: Тесты
        run: pytest -q
